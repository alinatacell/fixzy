<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY Stok - KARYAWAN FIX</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{background:#f5f7fb;font-family:Arial;padding:14px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.btn{border:0;border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer}
.primary{background:#f59e0b}
.dark{background:#111827;color:#fff}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px;border-bottom:1px solid #eee}
#log{background:#111827;color:#4ade80;padding:10px;border-radius:8px;font-size:11px;white-space:pre-wrap;max-height:250px;overflow:auto}
.badge{padding:3px 8px;border-radius:99px;font-size:10px;font-weight:800}
.ready{background:#dcfce7;color:#15803d}
</style>
</head>
<body>
<div class="card">
<h3>FIXZY STOK - MODE KARYAWAN</h3>
<div id="authInfo" style="font-size:12px;color:#64748b">Menunggu login...</div>
<div id="roleInfo" style="font-size:12px;margin-top:6px"></div>
<pre id="log">Log:
</pre>
</div>

<div class="card">
<div style="display:flex;gap:8px">
<input id="search" placeholder="Cari..." style="flex:1;padding:10px;border:1px solid #ddd;border-radius:10px">
<button class="btn dark" onclick="loadAll()">↻ Refresh</button>
</div>
<div id="counts" style="margin-top:10px;font-weight:800"></div>
<div style="overflow:auto;margin-top:10px">
<table><thead><tr><th>Kode</th><th>Nama</th><th>Kategori</th><th>Modal</th><th>Jual</th><th>Sisa</th><th>Owner UID</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,getDoc,query,where} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

let uid="", ownerUid="", role="";
const $=id=>document.getElementById(id);
function log(t){ console.log(t); $("log").textContent+="\n"+t; }
function money(n){ return "Rp "+Number(n||0).toLocaleString("id-ID"); }

async function loadAll(){
  $("counts").textContent="Memuat...";
  try{
    log(`=== LOAD KARYAWAN === uid login=${uid} ownerUid=${ownerUid} role=${role}`);
    
    // AMBIL SEMUA DOKUMEN TANPA FILTER - biar karyawan pasti lihat
    const snapAll = await getDocs(collection(db,"stok"));
    log(`Total dokumen di koleksi stok (tanpa filter): ${snapAll.size}`);
    
    let all=[];
    snapAll.forEach(d=>{ all.push({id:d.id, ...d.data()}); });
    
    // Untuk karyawan, filter client-side: tampilkan yang punya owner = ownerUid
    let filtered = all;
    if(role!=="owner" && role!=="superadmin"){
      // Karyawan: tampilkan yang uid/ownerUid/ownerId == ownerUid
      filtered = all.filter(p=>{
        const docOwner = p.ownerUid || p.uid || p.ownerId || "";
        return docOwner===ownerUid || docOwner===uid || docOwner==="" || !p.ownerUid;
      });
      log(`Filter karyawan: ownerUid=${ownerUid} -> ${filtered.length} dari ${all.length} dokumen`);
    }
    
    // Normalisasi
    filtered = filtered.map(p=>{
      if(p.hargaModal==null && p.hargaBeli!=null) p.hargaModal=p.hargaBeli;
      if(p.sisa==null && p.stok!=null) p.sisa=p.stok;
      if(!p.kode && p.sku) p.kode=p.sku;
      return p;
    });
    
    $("counts").textContent=`Tampil ${filtered.length} produk dari total ${snapAll.size} dokumen di Firebase | Akun: ${role} | Owner: ${ownerUid.substring(0,8)}`;
    
    const q=$("search").value.toLowerCase();
    const toShow = filtered.filter(p=> !q || String(p.kode+" "+p.nama).toLowerCase().includes(q) ).sort((a,b)=>String(a.nama).localeCompare(String(b.nama)));
    
    $("tbody").innerHTML = toShow.map(p=>{
      return `<tr>
        <td><b>${p.kode||'(kosong)'}</b></td>
        <td>${p.nama||'-'}</td>
        <td>${p.kategori||'-'}</td>
        <td>${money(p.hargaModal||0)}</td>
        <td>${money(p.hargaJual||0)}</td>
        <td>${p.sisa||0}</td>
        <td style="font-size:9px">${(p.ownerUid||p.uid||'').substring(0,12)}</td>
      </tr>`;
    }).join("") || `<tr><td colspan=7 style="text-align:center;padding:20px">Tidak ada stok untuk ownerUid ${ownerUid}. Cek log: mungkin ownerUid di dokumen users karyawan salah.</td></tr>`;
    
    if(filtered.length===0 && snapAll.size>0){
      log("⚠️ ADA DATA TAPI TIDAK TAMPIL KARENA ownerUid TIDAK COCOK!");
      log("Solusi: di Firebase Console > users > dokumen karyawan > field ownerUid harus diisi dengan UID owner: "+ownerUid);
      log("Dokumen stok yang ada uid-nya:");
      all.slice(0,5).forEach(p=>{ log(` - ${p.nama} uid=${p.uid} ownerUid=${p.ownerUid}`); });
    }
    
  }catch(e){
    log("❌ ERROR: "+e.message);
    $("counts").textContent="Gagal: "+e.message;
  }
}
window.loadAll=loadAll;
$("search").addEventListener("input", loadAll);

onAuthStateChanged(auth, async u=>{
  if(!u){ $("authInfo").textContent="Belum login"; return; }
  uid=u.uid;
  $("authInfo").textContent=`UID: ${uid} | Email: ${u.email||'-'}`;
  try{
    const snap=await getDoc(doc(db,"users",u.uid));
    if(!snap.exists()){
      log("❌ Dokumen users TIDAK ADA untuk UID ini");
      $("roleInfo").innerHTML=`<span style="color:red">Dokumen users tidak ada! Buat dokumen di users dengan ID ${u.uid}</span>`;
      ownerUid=u.uid;
      role="owner";
    }else{
      const p=snap.data();
      role=p.role||"karyawan";
      ownerUid = role==="owner" || role==="superadmin" ? u.uid : (p.ownerUid||"");
      if(!ownerUid && role!=="owner"){
        log("❌ ownerUid di dokumen karyawan KOSONG! Ini penyebab stok tidak tampil");
        $("roleInfo").innerHTML=`<span style="color:red">ownerUid KOSONG! Di Firebase > users > ${u.uid} > tambahkan field ownerUid = UID owner kamu</span>`;
        ownerUid=u.uid; // fallback biar tetap coba load
      }else{
        $("roleInfo").innerHTML=`Role: <b>${role}</b> | ownerUid: <b>${ownerUid}</b> | izin: ${(p.izin||p.permissions||[]).join(',')||'-'}`;
        log(`Role=${role} ownerUid=${ownerUid} izin=${p.izin}`);
      }
    }
    loadAll();
  }catch(e){ log("Error baca users: "+e.message); }
});
</script>
</body>
</html>
