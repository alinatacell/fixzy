<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#FFC107">
<title>FIXZY</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827}
body{overflow:hidden}

.header{
  height:62px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  position:fixed;
  top:0;
  left:0;
  right:0;

  box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.menu-btn{
  width:44px;
  height:44px;
  margin-left:9px;
  border:0;
  border-radius:11px;
  background:#111827;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
}
.menu-btn span{width:21px;height:2px;background:#fff;border-radius:4px}

.logo{
  width:115px;
  max-height:48px;
  object-fit:contain;
  margin-left:9px;
}

.header-account{
  margin-left:auto;
  margin-right:13px;
  text-align:right;
  line-height:1.15;
}
.account-name{font-size:12px;font-weight:900}
.account-exp{font-size:9px;color:#6b7280;margin-top:3px}

.content{
  position:fixed;
  top:62px;
  left:0;
  right:0;
  bottom:0;
  background:#f3f4f6;
}
.content iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#fff;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.28);
  opacity:0;
  visibility:hidden;
  transition:.2s;

}
.overlay.show{opacity:1;visibility:visible}

.menu{
  position:fixed;
  top:0;
  left:0;
  height:100dvh;
  width:min(310px,86vw);
  background:#fff;

  transform:translateX(-105%);
  transition:.25s ease;
  box-shadow:8px 0 30px rgba(0,0,0,.15);
  overflow:auto;
}
.menu.show{transform:translateX(0)}

.menu-head{
  min-height:62px;
  padding:10px 13px;
  background:#111827;
  color:#fff;
  display:flex;
  align-items:center;
  gap:10px;
}
.menu-head img{
  width:78px;
  max-height:40px;
  object-fit:contain;
  background:#fff;
  border-radius:7px;
}
.menu-title{font-weight:900;font-size:15px}
.menu-sub{font-size:9px;color:#d1d5db;margin-top:3px}

.close{
  margin-left:auto;
  border:0;
  background:rgba(255,255,255,.12);
  color:#fff;
  width:34px;
  height:34px;
  border-radius:9px;
  font-size:20px;
}

.menu-list{padding:9px}
.menu-link{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  background:transparent;
  text-decoration:none;
  color:#111827;
  padding:12px 11px;
  border-radius:10px;
  font-size:13px;
  font-weight:800;
  text-align:left;
}
.menu-link:hover,.menu-link.active{background:#f3f4f6}
.menu-link .ico{width:25px;text-align:center;font-size:16px}
.menu-divider{height:1px;background:#e5e7eb;margin:7px 5px}


@media(max-width:480px){
  .logo{width:98px}
  .header-account{margin-right:9px}
  .account-name{font-size:11px}
}
</style>
</head>
<body>




<header class="header">
  <button class="menu-btn" onclick="bukaMenu()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <img src="logo.png" class="logo" alt="FIXZY">

  <div class="header-account">
    <div class="account-name" id="accountName">Akun</div>
    <div class="account-exp">Exp: <span id="accountExp">-</span></div>
  </div>
</header>

<div class="content">
  <iframe id="pageFrame" src="about:blank" title="Halaman FIXZY"></iframe>
</div>

<div class="overlay" id="overlay" onclick="tutupMenu()"></div>

<aside class="menu" id="menu">
  <div class="menu-head">
    <img src="logo.png" alt="FIXZY">
    <div>
      <div class="menu-title">Menu FIXZY</div>
      <div class="menu-sub">Pilih halaman</div>
    </div>
    <button class="close" onclick="tutupMenu()">×</button>
  </div>

  <nav class="menu-list">
    <button class="menu-link" data-page="dashboard-admin.html" onclick="bukaHalaman(this)"><span class="ico">📊</span>Dashboard Admin</button>
    <button class="menu-link" data-page="data-servis.html" onclick="bukaHalaman(this)"><span class="ico">🔧</span>Data Servis</button>
    <button class="menu-link" data-page="data-penjualan.html" onclick="bukaHalaman(this)"><span class="ico">🛒</span>Data Penjualan</button>
    <button class="menu-link" data-page="stock.html" onclick="bukaHalaman(this)"><span class="ico">📦</span>Stock</button>
    <button class="menu-link" data-page="nota.html" onclick="bukaHalaman(this)"><span class="ico">🧾</span>Nota</button>

    <div class="menu-divider"></div>
    <button class="menu-link" data-page="register.html" onclick="bukaHalaman(this)"><span class="ico">📝</span>Register</button>
    <button class="menu-link" data-page="login.html" onclick="bukaHalaman(this)"><span class="ico">🔐</span>Login</button>
  </nav>
</aside>

<script>
function bukaMenu(){
  document.getElementById("menu").classList.add("show");
  document.getElementById("overlay").classList.add("show");
}
function tutupMenu(){
  document.getElementById("menu").classList.remove("show");
  document.getElementById("overlay").classList.remove("show");
}

function bukaHalaman(btn){
  const page=btn.dataset.page;
  document.getElementById("pageFrame").src=page;

  document.querySelectorAll(".menu-link").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");

  tutupMenu();
}


function bukaHalamanTanpaGate(page){
  document.getElementById("pageFrame").src=page;
  document.querySelectorAll(".menu-link").forEach(x=>x.classList.remove("active"));
  const target=document.querySelector(`[data-page="${page}"]`);
  if(target)target.classList.add("active");
}

window.addEventListener("message",function(e){
  const d=e.data||{};
  if(d.type==="FIXZY_LOGIN_SUCCESS"){
    sessionStorage.setItem("fixzy_logged_in","1");
    localStorage.setItem("fixzy_user_profile",JSON.stringify({
      nama:d.nama||"Akun",
      exp:d.exp||"-",
      role:d.role||"user"
    }));
        
    bacaProfil();
  }

  if(d.type==="FIXZY_REGISTER_SUCCESS"){
    // After registration, show the real supplied login page.
    document.getElementById("pageFrame").src="login.html";
      }
});

function bacaProfil(){
  let p={};
  try{p=JSON.parse(localStorage.getItem("fixzy_user_profile")||"{}")}catch(e){}

  const nama=p.nama||p.namaToko||p.namaUsaha||p.toko||p.email||"Akun";
  const exp=p.exp||p.expired||p.expiry||p.masaAktif||p.tanggalExp||p.tanggalExpired||"-";

  document.getElementById("accountName").textContent=nama;
  document.getElementById("accountExp").textContent=exp;
}

if(sessionStorage.getItem("fixzy_logged_in")==="1"){
    
}else{
  }

bacaProfil();


</script>
</body>
</html>
