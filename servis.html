<meta charset="UTF-8">

<title>Fixzy | Data Servis</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#0d0d0d;background-image:radial-gradient(circle at top, rgba(255,193,7,.18), transparent 60%);color:#fff;min-height:100vh;overflow-x:hidden;}
.container{width:100%;max-width:500px;margin:auto;padding:15px 15px 110px;}
.header{display:flex;justify-content:space-between;align-items:center;background:#1b1b1b;border:1px solid rgba(255,193,7,.15);border-radius:20px;padding:14px 16px;margin-bottom:14px;}
.header-left{display:flex;align-items:center;gap:12px;}
.header-left .back{width:38px;height:38px;background:#252525;border:none;color:#FFC107;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;}
.header h2{font-size:16px;font-weight:700;}
.header p{font-size:11px;color:#888;}
.btn-primary{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(90deg,#FFC107,#FF9800);color:#111;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(255,193,7,.25);transition:.2s;}
.btn-primary:active{transform:scale(.97);}
.btn-secondary{background:#252525;color:#fff;border:1px solid #333;padding:12px;border-radius:12px;cursor:pointer;font-weight:600;}
.search-box{display:flex;gap:8px;margin-bottom:12px;}
.search-box input{flex:1;padding:12px 14px;background:#1b1b1b;border:1px solid #333;border-radius:12px;color:#fff;outline:none;}
.search-box input:focus{border-color:#FFC107;}
.filter-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:none;}
.filter-chips::-webkit-scrollbar{display:none;}
.chip{padding:8px 16px;background:#1b1b1b;border:1px solid #333;border-radius:20px;font-size:12px;font-weight:600;color:#aaa;cursor:pointer;white-space:nowrap;transition:.2s;}
.chip.active{background:#FFC107;color:#111;border-color:#FFC107;}
.card{background:#1b1b1b;border-radius:18px;padding:16px;border:1px solid rgba(255,255,255,.06);margin-bottom:12px;transition:.2s;}
.card:hover{border-color:rgba(255,193,7,.2);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.card-top h3{font-size:14px;font-weight:700;line-height:1.3;}
.card-top span{font-size:10px;padding:5px 10px;border-radius:12px;font-weight:700;}
.status-masuk{background:rgba(255,193,7,.15);color:#FFC107;border:1px solid rgba(255,193,7,.3);}
.status-proses{background:rgba(33,150,243,.15);color:#64B5F6;border:1px solid rgba(33,150,243,.3);}
.status-selesai{background:rgba(76,175,80,.15);color:#81C784;border:1px solid rgba(76,175,80,.3);}
.status-diambil{background:rgba(158,158,158,.15);color:#aaa;border:1px solid rgba(158,158,158,.3);}
.status-batal{background:rgba(244,67,54,.15);color:#ef9a9a;border:1px solid rgba(244,67,54,.3);}
.card-info{font-size:12px;color:#aaa;line-height:1.6;margin-bottom:10px;}
.card-info b{color:#fff;}
.card-actions{display:flex;gap:8px;}
.card-actions button{flex:1;padding:9px;border:none;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;transition:.2s;}
.btn-wa{background:#25D366;color:#fff;}
.btn-edit{background:#252525;color:#FFC107;border:1px solid #333;}
.btn-hapus{background:rgba(255,0,0,.1);color:#ff8a80;border:1px solid rgba(255,0,0,.2);}
.btn-selesai{background:#FFC107;color:#111;}
/* MODAL */
#formModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);display:none;justify-content:center;align-items:flex-start;z-index:9999;overflow-y:auto;padding:15px;}
.modal-card{width:100%;max-width:440px;background:#1b1b1b;border-radius:22px;padding:20px;border:1px solid rgba(255,193,7,.2);margin:20px auto;animation:pop .3s ease;}
@keyframes pop{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-header h3{color:#FFC107;font-size:18px;font-weight:700;}
.modal-header button{background:#252525;border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;}
.input-box{margin-bottom:14px;}
.input-box label{font-size:12px;font-weight:600;color:#FFC107;margin-bottom:6px;display:block;}
.input-box input, .input-box textarea, .input-box select{width:100%;padding:12px;background:#252525;border:1px solid #333;border-radius:12px;color:#fff;outline:none;font-size:13px;}
.input-box textarea{resize:none;min-height:70px;}
.input-box input:focus, .input-box textarea:focus, .input-box select:focus{border-color:#FFC107;}
.row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.kelengkapan{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.kelengkapan label{font-size:11px;background:#252525;border:1px solid #333;padding:6px 10px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:5px;color:#aaa;}
.kelengkapan input{accent-color:#FFC107;}
#loadingScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0d0d0d;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9998;}
.spinner{width:44px;height:44px;border:3px solid #222;border-top-color:#FFC107;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.bottom-nav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:calc(100% - 30px);max-width:430px;background:#1f1f1f;border:1px solid rgba(255,193,7,.15);border-radius:20px;display:flex;justify-content:space-around;padding:10px 5px;z-index:90;}
.bottom-nav a{flex:1;text-align:center;text-decoration:none;color:#777;font-size:11px;font-weight:600;padding:6px;}
.bottom-nav a.active{color:#FFC107;}
.bottom-nav a span{display:block;font-size:20px;margin-bottom:2px;}
.empty{text-align:center;padding:40px 20px;color:#666;}
.empty .icon{font-size:48px;margin-bottom:12px;}
#popupMsg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:10000;}
#popupMsg .box{width:90%;max-width:320px;background:#1b1b1b;padding:22px;border-radius:18px;text-align:center;border:1px solid #FFC107;}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <p style="color:#FFC107;font-weight:600;font-size:14px;">Memuat Data Servis...</p>
</div>

<div class="container" id="mainContent" style="display:none;">
  <div class="header">
    <div class="header-left">
      <button class="back" onclick="history.back()">‹</button>
      <div>
        <h2>Data Servis</h2>
        <p id="totalInfo">0 data</p>
      </div>
    </div>
    <button class="back" onclick="openAddModal()" style="background:#FFC107;color:#111;font-weight:800;">+</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Cari nama, HP, tipe HP...">
    <button class="btn-secondary" onclick="loadServis()">↻</button>
  </div>

  <div class="filter-chips" id="filterChips">
    <div class="chip active" data-filter="semua">Semua</div>
    <div class="chip" data-filter="masuk">Masuk</div>
    <div class="chip" data-filter="proses">Proses</div>
    <div class="chip" data-filter="selesai">Selesai</div>
    <div class="chip" data-filter="diambil">Diambil</div>
  </div>

  <button class="btn-primary" onclick="openAddModal()" style="margin-bottom:16px;">+ TAMBAH SERVIS BARU</button>

  <div id="listServis"></div>

  <div id="emptyState" class="empty" style="display:none;">
    <div class="icon">📱</div>
    <h4 style="color:#fff;margin-bottom:6px;">Belum ada data servis</h4>
    <p style="font-size:12px;">Klik Tambah Servis Baru untuk input HP masuk</p>
  </div>
</div>

<!-- MODAL FORM -->
<div id="formModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="modalTitle">Servis Baru</h3>
      <button onclick="closeModal()">✕</button>
    </div>

    <form id="servisForm">
      <input type="hidden" id="editId">
      <div class="input-box">
        <label>Nama Pelanggan *</label>
        <input type="text" id="namaPelanggan" placeholder="Budi Santoso" required>
      </div>
      <div class="row">
        <div class="input-box">
          <label>No WhatsApp *</label>
          <input type="tel" id="noHp" placeholder="08xxxxxxxxxx" required>
        </div>
        <div class="input-box">
          <label>Tipe HP *</label>
          <input type="text" id="tipeHp" placeholder="Redmi Note 12 / iPhone 13" required>
        </div>
      </div>
      <div class="row">
        <div class="input-box">
          <label>IMEI / SN (opsional)</label>
          <input type="text" id="imei" placeholder="Opsional">
        </div>
        <div class="input-box">
          <label>Status</label>
          <select id="status">
            <option value="masuk">Masuk</option>
            <option value="proses">Proses / Dikerjakan</option>
            <option value="selesai">Selesai</option>
            <option value="diambil">Sudah Diambil</option>
            <option value="batal">Batal</option>
          </select>
        </div>
      </div>
      <div class="input-box">
        <label>Kerusakan / Keluhan *</label>
        <textarea id="kerusakan" placeholder="Contoh: Mati total, LCD pecah, tidak bisa dicas..." required></textarea>
      </div>
      <div class="input-box">
        <label>Kelengkapan</label>
        <div class="kelengkapan">
          <label><input type="checkbox" value="HP Saja" class="kel"> HP Saja</label>
          <label><input type="checkbox" value="Charger" class="kel"> Charger</label>
          <label><input type="checkbox" value="Dus" class="kel"> Dus</label>
          <label><input type="checkbox" value="Kabel" class="kel"> Kabel</label>
          <label><input type="checkbox" value="Kartu" class="kel"> Kartu</label>
        </div>
        <input type="text" id="kelengkapan" placeholder="Otomatis terisi dari checklist / isi manual" style="margin-top:8px;">
      </div>
      <div class="row">
        <div class="input-box">
          <label>Estimasi Biaya (Rp)</label>
          <input type="number" id="biaya" placeholder="150000" inputmode="numeric">
        </div>
        <div class="input-box">
          <label>DP (Rp)</label>
          <input type="number" id="dp" placeholder="0" inputmode="numeric">
        </div>
      </div>
      <div class="input-box">
        <label>Catatan Teknisi</label>
        <textarea id="catatan" placeholder="Catatan internal teknisi..."></textarea>
      </div>
      <div class="input-box">
        <label>Nama Teknisi</label>
        <input type="text" id="teknisi" placeholder="Nama teknisi yang kerjakan">
      </div>

      <div style="display:flex;gap:10px;margin-top:18px;">
        <button type="button" class="btn-secondary" style="flex:1;" onclick="closeModal()">Batal</button>
        <button type="submit" class="btn-primary" style="flex:1.5;" id="btnSimpan">SIMPAN</button>
      </div>
      <div id="formLoading" style="display:none;text-align:center;color:#FFC107;margin-top:12px;font-size:13px;">Menyimpan...</div>
    </form>
  </div>
</div>

<div id="popupMsg"><div class="box"><h3 style="color:#FFC107;">Fixzy</h3><p id="popupPesan" style="margin:15px 0;color:#fff;white-space:pre-line;font-size:13px;"></p><button onclick="document.getElementById('popupMsg').style.display='none'" style="padding:10px 24px;border:none;border-radius:10px;background:#FFC107;color:#111;font-weight:bold;cursor:pointer;">OK</button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, getDocs, updateDoc, deleteDoc, query, where, orderBy, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",
  authDomain: "fixzy-f056f.firebaseapp.com",
  projectId: "fixzy-f056f",
  storageBucket: "fixzy-f056f.firebasestorage.app",
  messagingSenderId: "838081521031",
  appId: "1:838081521031:web:50fdee909b56460b055f22"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUid = null;
let allData = [];
let activeFilter = new URLSearchParams(window.location.search).get('filter') || 'semua';

const loadingScreen = document.getElementById("loadingScreen");
const mainContent = document.getElementById("mainContent");
const listEl = document.getElementById("listServis");
const emptyEl = document.getElementById("emptyState");
const searchInput = document.getElementById("searchInput");

function showMsg(pesan){ document.getElementById("popupPesan").innerText=pesan; document.getElementById("popupMsg").style.display="flex"; }

// Auth
onAuthStateChanged(auth, async(user)=>{
  if(user){
    currentUid = user.uid;
    loadingScreen.style.display="none";
    mainContent.style.display="block";
    setupFilter();
    await loadServis();
  } else {
    const uid = localStorage.getItem("fixzy_uid");
    if(uid){
      currentUid = uid;
      loadingScreen.style.display="none";
      mainContent.style.display="block";
      setupFilter();
      await loadServis();
    } else {
      window.location.href="login.html";
    }
  }
});

function setupFilter(){
  if(activeFilter !== 'semua'){
    document.querySelectorAll('.chip').forEach(c=>{
      c.classList.remove('active');
      if(c.dataset.filter===activeFilter) c.classList.add('active');
    });
  }
  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.dataset.filter;
      renderList();
    });
  });
  searchInput.addEventListener('input', renderList);
}

async function loadServis(){
  if(!currentUid) return;
  try{
    loadingScreen.style.display="flex";
    const q = query(collection(db,"servis"), where("uid","==",currentUid));
    const snap = await getDocs(q);
    allData = [];
    snap.forEach(d=>{
      const data = d.data();
      data.docId = d.id;
      // handle timestamp
      data._tanggalMasuk = data.tanggalMasuk?.toDate ? data.tanggalMasuk.toDate() : (data.createdAt?.toDate ? data.createdAt.toDate() : new Date());
      allData.push(data);
    });
    // sort terbaru dulu
    allData.sort((a,b)=> b._tanggalMasuk - a._tanggalMasuk);
    loadingScreen.style.display="none";
    mainContent.style.display="block";
    document.getElementById("totalInfo").innerText = `${allData.length} data servis`;
    renderList();
  }catch(err){
    console.error(err);
    loadingScreen.style.display="none";
    mainContent.style.display="block";
    showMsg("Gagal load: "+err.message);
  }
}
window.loadServis = loadServis;

function renderList(){
  const search = searchInput.value.toLowerCase();
  let filtered = allData.filter(item=>{
    const matchFilter = activeFilter==='semua' || item.status===activeFilter;
    const text = `${item.namaPelanggan} ${item.noHp} ${item.tipeHp} ${item.kerusakan}`.toLowerCase();
    const matchSearch = !search || text.includes(search);
    return matchFilter && matchSearch;
  });

  listEl.innerHTML="";
  if(filtered.length===0){
    emptyEl.style.display="block";
    return;
  }
  emptyEl.style.display="none";

  filtered.forEach(item=>{
    const sisa = (parseInt(item.biaya)||0) - (parseInt(item.dp)||0);
    const tgl = item._tanggalMasuk.toLocaleDateString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    const statusClass = `status-${item.status}`;
    const div = document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <div class="card-top">
        <div>
          <h3>${item.namaPelanggan}</h3>
          <div style="font-size:11px;color:#888;margin-top:2px;">${item.tipeHp} • ${tgl}</div>
        </div>
        <span class="${statusClass}">${item.status.toUpperCase()}</span>
      </div>
      <div class="card-info">
        <div>📞 <b>${item.noHp}</b> ${item.imei?`• IMEI: ${item.imei}`:''}</div>
        <div>🔧 <b>${item.kerusakan}</b></div>
        ${item.kelengkapan?`<div>📦 Kelengkapan: ${item.kelengkapan}</div>`:''}
        <div>💰 Biaya: <b>Rp ${(parseInt(item.biaya)||0).toLocaleString("id-ID")}</b> ${item.dp?`• DP Rp ${(parseInt(item.dp)||0).toLocaleString("id-ID")} • Sisa Rp ${sisa.toLocaleString("id-ID")}`:''}</div>
        ${item.teknisi?`<div>👨‍🔧 Teknisi: ${item.teknisi}</div>`:''}
        ${item.catatan?`<div style="margin-top:6px;background:#252525;padding:8px;border-radius:8px;font-size:11px;">${item.catatan}</div>`:''}
      </div>
      <div class="card-actions">
        <button class="btn-wa" onclick="waPelanggan('${item.noHp}','${item.namaPelanggan}','${item.tipeHp}','${item.status}')">WA</button>
        <button class="btn-edit" onclick="editServis('${item.docId}')">Edit</button>
        ${item.status!=='selesai' && item.status!=='diambil' ? `<button class="btn-selesai" onclick="ubahStatus('${item.docId}','selesai')">Selesai</button>` : ''}
        ${item.status==='selesai' ? `<button class="btn-selesai" onclick="ubahStatus('${item.docId}','diambil')">Diambil</button>` : ''}
        <button class="btn-hapus" onclick="hapusServis('${item.docId}')">Hapus</button>
      </div>
    `;
    listEl.appendChild(div);
  });
}

window.waPelanggan = (no,nama,tipe,status)=>{
  let hp = no.replace(/[^0-9]/g,"");
  if(hp.startsWith("0")) hp = "62"+hp.substring(1);
  const pesan = `Halo ${nama}, HP ${tipe} status servis di Fixzy: ${status.toUpperCase()}. Info lebih lanjut hubungi kami.`;
  window.open(`https://wa.me/${hp}?text=${encodeURIComponent(pesan)}`,"_blank");
};

window.openAddModal = ()=>{
  document.getElementById("modalTitle").innerText="Servis Baru";
  document.getElementById("servisForm").reset();
  document.getElementById("editId").value="";
  document.getElementById("status").value="masuk";
  document.getElementById("kelengkapan").value="";
  document.querySelectorAll(".kel").forEach(c=>c.checked=false);
  document.getElementById("formModal").style.display="flex";
};
window.closeModal = ()=> document.getElementById("formModal").style.display="none";

document.querySelectorAll(".kel").forEach(cb=>{
  cb.addEventListener("change",()=>{
    const vals = Array.from(document.querySelectorAll(".kel:checked")).map(c=>c.value);
    document.getElementById("kelengkapan").value = vals.join(", ");
  });
});

document.getElementById("servisForm").addEventListener("submit", async(e)=>{
  e.preventDefault();
  const btn=document.getElementById("btnSimpan");
  const load=document.getElementById("formLoading");
  btn.disabled=true; load.style.display="block";

  const editId = document.getElementById("editId").value;
  const payload = {
    uid: currentUid,
    idServis: "FX-"+Date.now(),
    namaPelanggan: document.getElementById("namaPelanggan").value.trim(),
    noHp: document.getElementById("noHp").value.trim(),
    tipeHp: document.getElementById("tipeHp").value.trim(),
    imei: document.getElementById("imei").value.trim(),
    kerusakan: document.getElementById("kerusakan").value.trim(),
    kelengkapan: document.getElementById("kelengkapan").value.trim(),
    biaya: parseInt(document.getElementById("biaya").value)||0,
    dp: parseInt(document.getElementById("dp").value)||0,
    status: document.getElementById("status").value,
    catatan: document.getElementById("catatan").value.trim(),
    teknisi: document.getElementById("teknisi").value.trim(),
    updatedAt: serverTimestamp()
  };
  if(payload.status==='selesai' || payload.status==='diambil'){
    payload.tanggalSelesai = serverTimestamp();
  }

  try{
    if(editId){
      await updateDoc(doc(db,"servis",editId), payload);
      showMsg("Data servis berhasil diupdate!");
    }else{
      payload.tanggalMasuk = serverTimestamp();
      payload.createdAt = serverTimestamp();
      await addDoc(collection(db,"servis"), payload);
      showMsg("Servis baru berhasil ditambahkan!");
    }
    closeModal();
    await loadServis();
  }catch(err){
    showMsg("Gagal simpan: "+err.message);
  }finally{
    btn.disabled=false; load.style.display="none";
  }
});

window.editServis = async(id)=>{
  const item = allData.find(d=>d.docId===id);
  if(!item) return;
  document.getElementById("modalTitle").innerText="Edit Servis";
  document.getElementById("editId").value=id;
  document.getElementById("namaPelanggan").value=item.namaPelanggan||"";
  document.getElementById("noHp").value=item.noHp||"";
  document.getElementById("tipeHp").value=item.tipeHp||"";
  document.getElementById("imei").value=item.imei||"";
  document.getElementById("kerusakan").value=item.kerusakan||"";
  document.getElementById("kelengkapan").value=item.kelengkapan||"";
  document.getElementById("biaya").value=item.biaya||"";
  document.getElementById("dp").value=item.dp||"";
  document.getElementById("status").value=item.status||"masuk";
  document.getElementById("catatan").value=item.catatan||"";
  document.getElementById("teknisi").value=item.teknisi||"";
  // set checklist
  const kels = (item.kelengkapan||"").split(",").map(s=>s.trim());
  document.querySelectorAll(".kel").forEach(c=>{ c.checked = kels.includes(c.value); });
  document.getElementById("formModal").style.display="flex";
};

window.hapusServis = async(id)=>{
  if(!confirm("Yakin hapus data servis ini?")) return;
  try{
    await deleteDoc(doc(db,"servis",id));
    showMsg("Data dihapus");
    await loadServis();
  }catch(err){ showMsg("Gagal hapus: "+err.message); }
};

window.ubahStatus = async(id,newStatus)=>{
  try{
    const update = { status:newStatus, updatedAt:serverTimestamp() };
    if(newStatus==='selesai' || newStatus==='diambil'){
      update.tanggalSelesai = serverTimestamp();
    }
    await updateDoc(doc(db,"servis",id), update);
    await loadServis();
  }catch(err){ showMsg("Gagal update status: "+err.message); }
};

</script>
