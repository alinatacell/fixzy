  }

  document.querySelectorAll('#filterChips .chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      document.querySelectorAll('#filterChips .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.dataset.filter;
      renderList();
    });
  });

  searchInput.addEventListener('input', renderList);
}

function setupSalesFilter(){
  document.querySelectorAll('#filterPenjualan .chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      document.querySelectorAll('#filterPenjualan .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeSalesFilter = chip.dataset.salesFilter;
      renderPenjualan();
    });
  });

  document.getElementById("searchPenjualan").addEventListener("input", renderPenjualan);
}

window.setMode = function(mode){
  activeMode = mode;
  const isServis = mode === 'servis';

  document.getElementById("modeServis").classList.toggle("active",isServis);
  document.getElementById("modePenjualan").classList.toggle("active",!isServis);
  document.getElementById("servisSection").classList.toggle("section-hidden",!isServis);
  document.getElementById("penjualanSection").classList.toggle("section-hidden",isServis);

  document.getElementById("pageTitle").innerText = isServis ? "Data Servis" : "Data Penjualan";
  document.getElementById("quickAddBtn").onclick = isServis ? openAddModal : openPenjualanModal;
  document.getElementById("totalInfo").innerText = isServis
    ? `${allData.length} data servis`
    : `${allSales.length} transaksi penjualan`;
};

async function loadServis(){
  if(!currentUid) return;

  try{
    const q = query(collection(db,"servis"),where("uid","==",currentUid));
    const snap = await getDocs(q);

    allData=[];
    snap.forEach(d=>{
      const data=d.data();
      data.docId=d.id;
      data._tanggalMasuk=tanggalTransaksi(data.tanggalMasuk||data.tanggal||data.createdAt);
      allData.push(data);
    });

    allData.sort((a,b)=>b._tanggalMasuk-a._tanggalMasuk);
    renderList();
    if(activeMode==='servis'){
      document.getElementById("totalInfo").innerText=`${allData.length} data servis`;
    }
  }catch(err){
    console.error("Gagal load servis:",err);
    if(err.code==='permission-denied'){
      showMsg("Data servis tidak bisa dibaca. Cek Firebase Rules.");
    }
    emptyEl.style.display="block";
  }
}
window.loadServis=loadServis;

function renderList(){
  const search=(searchInput.value||"").toLowerCase();

  const filtered=allData.filter(item=>{
    const matchFilter=activeFilter==='semua'||item.status===activeFilter;
    const text=`${item.namaPelanggan||''} ${item.noHp||''} ${item.tipeHp||''} ${item.kerusakan||''}`.toLowerCase();
    return matchFilter && (!search||text.includes(search));
  });

  listEl.innerHTML="";

  if(filtered.length===0){
    emptyEl.style.display="block";
    if(allData.length===0){
      document.getElementById("debugInfo").innerText=`Tidak ada data servis untuk UID:\n${currentUid}`;
    }
    return;
  }

  emptyEl.style.display="none";

  filtered.forEach(item=>{
    const biaya=parseInt(item.biaya)||0;
    const dp=parseInt(item.dp)||0;
    const sisa=biaya-dp;
    const tgl=item._tanggalMasuk.toLocaleDateString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    const statusClass=`status-${item.status}`;

    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <div class="card-top">
        <div>
          <h3>${item.namaPelanggan||'-'}</h3>
          <div style="font-size:11px;color:#888;margin-top:2px;">${item.tipeHp||'-'} • ${tgl}</div>
        </div>
        <span class="${statusClass}">${(item.status||'').toUpperCase()}</span>
      </div>
      <div class="card-info">
        <div>📞 <b>${item.noHp||'-'}</b> ${item.imei?`• IMEI: ${item.imei}`:''}</div>
        <div>🔧 <b>${item.kerusakan||'-'}</b></div>
        ${item.kelengkapan?`<div>📦 Kelengkapan: ${item.kelengkapan}</div>`:''}
        <div>💰 Biaya: <b>Rp ${money(biaya)}</b> ${dp?`• DP Rp ${money(dp)} • Sisa Rp ${money(sisa)}`:''}</div>
        ${item.teknisi?`<div>👨‍🔧 Teknisi: ${item.teknisi}</div>`:''}
        ${item.catatan?`<div style="margin-top:6px;background:#252525;padding:8px;border-radius:8px;font-size:11px;">${item.catatan}</div>`:''}
      </div>
      <div class="card-actions">
        <button class="btn-wa" onclick="waPelanggan('${item.noHp||''}','${item.namaPelanggan||''}','${item.tipeHp||''}','${item.status||''}')">WA</button>
        <button class="btn-edit" onclick="editServis('${item.docId}')">Edit</button>
        ${item.status!=='selesai'&&item.status!=='diambil'&&item.status!=='batal'
          ?`<button class="btn-selesai" onclick="ubahStatus('${item.docId}','selesai')">Selesai</button>`:''}
        ${item.status==='selesai'
          ?`<button class="btn-selesai" onclick="ubahStatus('${item.docId}','diambil')">Diambil</button>`:''}
        ${item.status!=='batal'&&item.status!=='diambil'
          ?`<button class="btn-hapus" onclick="ubahStatus('${item.docId}','batal')">Batal</button>`:''}
        <button class="btn-hapus" onclick="hapusServis('${item.docId}')">Hapus</button>
      </div>
    `;
    listEl.appendChild(div);
  });
}

window.waPelanggan=(no,nama,tipe,status)=>{
  let hp=(no||"").replace(/[^0-9]/g,"");
  if(hp.startsWith("0")) hp="62"+hp.substring(1);
  if(!hp) return;
  const pesan=`Halo ${nama}, HP ${tipe} status servis di Fixzy: ${String(status).toUpperCase()}. Info lebih lanjut hubungi kami.`;
  window.open(`https://wa.me/${hp}?text=${encodeURIComponent(pesan)}`,"_blank");
};

window.openAddModal=()=>{
  document.getElementById("modalTitle").innerText="Servis Baru";
  document.getElementById("servisForm").reset();
  document.getElementById("editId").value="";
  document.getElementById("status").value="masuk";
  document.getElementById("kelengkapan").value="";
  document.querySelectorAll(".kel").forEach(c=>c.checked=false);
  document.getElementById("formModal").style.display="flex";
};

window.closeModal=()=>document.getElementById("formModal").style.display="none";

document.querySelectorAll(".kel").forEach(cb=>{
  cb.addEventListener("change",()=>{
    const vals=Array.from(document.querySelectorAll(".kel:checked")).map(c=>c.value);
    document.getElementById("kelengkapan").value=vals.join(", ");
  });
});

document.getElementById("servisForm").addEventListener("submit",async(e)=>{
  e.preventDefault();
  if(!currentUid){showMsg("Sesi habis, login ulang");return;}

  const btn=document.getElementById("btnSimpan");
  const load=document.getElementById("formLoading");
  btn.disabled=true;load.style.display="block";

  const editId=document.getElementById("editId").value;
  const payload={
    uid:currentUid,
    idServis:editId ? undefined : "FX-"+Date.now(),
    namaPelanggan:document.getElementById("namaPelanggan").value.trim(),
    noHp:document.getElementById("noHp").value.trim(),
    tipeHp:document.getElementById("tipeHp").value.trim(),
    imei:document.getElementById("imei").value.trim(),
    kerusakan:document.getElementById("kerusakan").value.trim(),
    kelengkapan:document.getElementById("kelengkapan").value.trim(),
    biaya:parseInt(document.getElementById("biaya").value)||0,
    dp:parseInt(document.getElementById("dp").value)||0,
    status:document.getElementById("status").value,
    catatan:document.getElementById("catatan").value.trim(),
    teknisi:document.getElementById("teknisi").value.trim(),
    updatedAt:serverTimestamp()
  };
  if(payload.idServis===undefined) delete payload.idServis;
  if(payload.status==='selesai'||payload.status==='diambil') payload.tanggalSelesai=serverTimestamp();

  try{
    if(editId){
      await updateDoc(doc(db,"servis",editId),payload);
      showMsg("Data servis berhasil diupdate!");
    }else{
      payload.idServis="FX-"+Date.now();
      payload.tanggalMasuk=serverTimestamp();
      payload.createdAt=serverTimestamp();
      await addDoc(collection(db,"servis"),payload);
      showMsg("Servis baru berhasil ditambahkan!");
    }
    closeModal();
    await loadServis();
  }catch(err){
    console.error(err);
    showMsg(err.code==='permission-denied'
      ?"Gagal simpan servis: Permission denied. Cek Firebase Rules."
      :"Gagal simpan: "+err.message);
  }finally{
    btn.disabled=false;load.style.display="none";
  }
});

window.editServis=async(id)=>{
  const item=allData.find(d=>d.docId===id);
  if(!item)return;

  document.getElementById("modalTitle").innerText="Edit Servis";
  document.getElementById("editId").value=id;
  document.getElementById("namaPelanggan").value=item.namaPelanggan||"";
  document.getElementById("noHp").value=item.noHp||"";
  document.getElementById("tipeHp").value=item.tipeHp||"";
  document.getElementById("imei").value=item.imei||"";
  document.getElementById("kerusakan").value=item.kerusakan||"";
  document.getElementById("kelengkapan").value=item.kelengkapan||"";
  document.getElementById("biaya").value=item.biaya||"";
  document.getElementById("dp").value=item.dp||"";
  document.getElementById("status").value=item.status||"masuk";
  document.getElementById("catatan").value=item.catatan||"";
  document.getElementById("teknisi").value=item.teknisi||"";

  const kels=(item.kelengkapan||"").split(",").map(s=>s.trim());
  document.querySelectorAll(".kel").forEach(c=>c.checked=kels.includes(c.value));
  document.getElementById("formModal").style.display="flex";
};

window.hapusServis=async(id)=>{
  if(!confirm("Yakin hapus data servis ini?"))return;
  try{
    await deleteDoc(doc(db,"servis",id));
    showMsg("Data servis dihapus");
    await loadServis();
  }catch(err){showMsg("Gagal hapus: "+err.message);}
};

window.ubahStatus=async(id,newStatus)=>{
  try{
    const update={status:newStatus,updatedAt:serverTimestamp()};
    if(newStatus==='selesai'||newStatus==='diambil') update.tanggalSelesai=serverTimestamp();
    if(newStatus==='batal') update.tanggalBatal=serverTimestamp();

    await updateDoc(doc(db,"servis",id),update);
    await loadServis();
  }catch(err){showMsg("Gagal update status: "+err.message);}
};

/* =========================
   PENJUALAN
   ========================= */

async function loadPenjualan(){
  if(!currentUid)return;

  try{
    const q=query(collection(db,"penjualan"),where("uid","==",currentUid));
    const snap=await getDocs(q);

    allSales=[];
    snap.forEach(d=>{
      const data=d.data();
      data.docId=d.id;
      data._tanggal=tanggalTransaksi(data.tanggal||data.createdAt);
      allSales.push(data);
    });

    allSales.sort((a,b)=>b._tanggal-a._tanggal);
    renderPenjualan();

    if(activeMode==='penjualan'){
      document.getElementById("totalInfo").innerText=`${allSales.length} transaksi penjualan`;
    }
  }catch(err){
    console.error("Gagal load penjualan:",err);
    if(err.code==='permission-denied'){
      showMsg("Data penjualan belum bisa dibaca. Tambahkan izin collection 'penjualan' pada Firebase Rules.");
    }
    renderPenjualan();
  }
}
window.loadPenjualan=loadPenjualan;

function renderPenjualan(){
  const search=(document.getElementById("searchPenjualan").value||"").toLowerCase();

  const filtered=allSales.filter(item=>{
    const matchFilter=activeSalesFilter==='semua'||item.status===activeSalesFilter;
    const text=`${item.namaPelanggan||''} ${item.noHp||''} ${item.produk||''} ${item.pembayaran||''}`.toLowerCase();
    return matchFilter && (!search||text.includes(search));
  });

  const el=document.getElementById("listPenjualan");
  const empty=document.getElementById("emptyPenjualan");
  el.innerHTML="";

  if(filtered.length===0){
    empty.style.display="block";
    return;
  }
  empty.style.display="none";

  filtered.forEach(item=>{
    const tgl=item._tanggal.toLocaleDateString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    const total=parseInt(item.total)||0;
    const statusClass=`status-jual-${item.status||'selesai'}`;

    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <div class="card-top">
        <div>
          <h3>${item.produk||'-'}</h3>
          <div style="font-size:11px;color:#888;margin-top:2px;">${item.namaPelanggan||'Pelanggan umum'} • ${tgl}</div>
        </div>
        <span class="${statusClass}">${(item.status||'selesai').toUpperCase()}</span>
      </div>
      <div class="card-info">
        ${item.noHp?`<div>📞 <b>${item.noHp}</b></div>`:''}
        <div>📦 Qty: <b>${item.qty||1}</b> × Rp ${money(item.harga)}</div>
        <div>💰 Total: <b>Rp ${money(total)}</b></div>
        <div>💳 Pembayaran: <b>${item.pembayaran||'-'}</b></div>
        ${item.diskon?`<div>🏷️ Diskon: Rp ${money(item.diskon)}</div>`:''}
        ${item.catatan?`<div style="margin-top:6px;background:#252525;padding:8px;border-radius:8px;font-size:11px;">${item.catatan}</div>`:''}
      </div>
      <div class="card-actions">
        ${item.noHp?`<button class="btn-wa" onclick="waPenjualan('${item.noHp||''}','${item.namaPelanggan||''}','${item.produk||''}',${total})">WA</button>`:''}
        <button class="btn-edit" onclick="editPenjualan('${item.docId}')">Edit</button>
        ${item.status!=='batal'?`<button class="btn-selesai" onclick="ubahStatusPenjualan('${item.docId}','selesai')">Selesai</button>`:''}
        ${item.status!=='batal'?`<button class="btn-hapus" onclick="ubahStatusPenjualan('${item.docId}','batal')">Batal</button>`:''}
        <button class="btn-hapus" onclick="hapusPenjualan('${item.docId}')">Hapus</button>
      </div>
    `;
    el.appendChild(div);
  });
}

function updateSalesTotal(){
  const qty=parseInt(document.getElementById("salesQty").value)||0;
  const harga=parseInt(document.getElementById("salesHarga").value)||0;
  const diskon=parseInt(document.getElementById("salesDiskon").value)||0;
  const total=Math.max(0,(qty*harga)-diskon);
  document.getElementById("salesTotal").innerText=`Rp ${money(total)}`;
  return total;
}

["salesQty","salesHarga","salesDiskon"].forEach(id=>{
  document.getElementById(id).addEventListener("input",updateSalesTotal);
});

document.getElementById("salesBayar").addEventListener("change",()=>{
  const bayar=document.getElementById("salesBayar").value;
  if(bayar==="Piutang") document.getElementById("salesStatus").value="piutang";
});

window.openPenjualanModal=()=>{
  document.getElementById("salesModalTitle").innerText="Penjualan Baru";
  document.getElementById("penjualanForm").reset();
  document.getElementById("salesEditId").value="";
  document.getElementById("salesQty").value=1;
  document.getElementById("salesDiskon").value=0;
  document.getElementById("salesBayar").value="Cash";
  document.getElementById("salesStatus").value="selesai";
  updateSalesTotal();
  document.getElementById("formPenjualanModal").style.display="flex";
};

window.closePenjualanModal=()=>{
  document.getElementById("formPenjualanModal").style.display="none";
};

document.getElementById("penjualanForm").addEventListener("submit",async(e)=>{
  e.preventDefault();
  if(!currentUid){showMsg("Sesi habis, login ulang");return;}

  const btn=document.getElementById("btnSimpanPenjualan");
  const load=document.getElementById("salesFormLoading");
  btn.disabled=true;load.style.display="block";

  const editId=document.getElementById("salesEditId").value;
  const qty=parseInt(document.getElementById("salesQty").value)||0;
  const harga=parseInt(document.getElementById("salesHarga").value)||0;
  const diskon=parseInt(document.getElementById("salesDiskon").value)||0;
  const total=Math.max(0,(qty*harga)-diskon);
  const status=document.getElementById("salesStatus").value;

  const payload={
    uid:currentUid,
    idPenjualan:editId ? undefined : "PJ-"+Date.now(),
    namaPelanggan:document.getElementById("salesNama").value.trim(),
    noHp:document.getElementById("salesNoHp").value.trim(),
    produk:document.getElementById("salesProduk").value.trim(),
    qty,
    harga,
    diskon,
    total,
    pembayaran:document.getElementById("salesBayar").value,
    status,
    catatan:document.getElementById("salesCatatan").value.trim(),
    updatedAt:serverTimestamp()
  };
  if(payload.idPenjualan===undefined)delete payload.idPenjualan;

  try{
    if(editId){
      await updateDoc(doc(db,"penjualan",editId),payload);
      showMsg("Data penjualan berhasil diupdate!");
    }else{
      payload.idPenjualan="PJ-"+Date.now();
      payload.tanggal=serverTimestamp();
      payload.createdAt=serverTimestamp();
      await addDoc(collection(db,"penjualan"),payload);
      showMsg("Penjualan berhasil ditambahkan!");
    }

    closePenjualanModal();
    await loadPenjualan();
  }catch(err){
    console.error(err);
    showMsg(err.code==='permission-denied'
      ?"Gagal simpan penjualan: Permission denied. Tambahkan izin collection 'penjualan' pada Firebase Rules."
      :"Gagal simpan penjualan: "+err.message);
  }finally{
    btn.disabled=false;load.style.display="none";
  }
});

window.editPenjualan=async(id)=>{
  const item=allSales.find(d=>d.docId===id);
  if(!item)return;

  document.getElementById("salesModalTitle").innerText="Edit Penjualan";
  document.getElementById("salesEditId").value=id;
  document.getElementById("salesNama").value=item.namaPelanggan||"";
  document.getElementById("salesNoHp").value=item.noHp||"";
  document.getElementById("salesProduk").value=item.produk||"";
  document.getElementById("salesQty").value=item.qty||1;
  document.getElementById("salesHarga").value=item.harga||0;
  document.getElementById("salesDiskon").value=item.diskon||0;
  document.getElementById("salesBayar").value=item.pembayaran||"Cash";
  document.getElementById("salesStatus").value=item.status||"selesai";
  document.getElementById("salesCatatan").value=item.catatan||"";
  updateSalesTotal();
  document.getElementById("formPenjualanModal").style.display="flex";
};

window.ubahStatusPenjualan=async(id,newStatus)=>{
  try{
    await updateDoc(doc(db,"penjualan",id),{
      status:newStatus,
      updatedAt:serverTimestamp(),
      ...(newStatus==="batal"?{tanggalBatal:serverTimestamp()}:{})
    });
    await loadPenjualan();
  }catch(err){showMsg("Gagal update penjualan: "+err.message);}
};

window.hapusPenjualan=async(id)=>{
  if(!confirm("Yakin hapus transaksi penjualan ini?"))return;
  try{
    await deleteDoc(doc(db,"penjualan",id));
    showMsg("Transaksi penjualan dihapus");
    await loadPenjualan();
  }catch(err){showMsg("Gagal hapus penjualan: "+err.message);}
};

window.waPenjualan=(no,nama,produk,total)=>{
  let hp=(no||"").replace(/[^0-9]/g,"");
  if(hp.startsWith("0"))hp="62"+hp.substring(1);
  if(!hp)return;
  const pesan=`Halo ${nama||'Kak'}, terima kasih sudah belanja di Fixzy.\nProduk: ${produk}\nTotal: Rp ${money(total)}`;
  window.open(`https://wa.me/${hp}?text=${encodeURIComponent(pesan)}`,"_blank");
};


</script>
