<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A YUDI THEA | Data Penjualan v3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;color:#111827;font-family:Arial,sans-serif}
header{background:#111827;color:#fff;padding:13px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
h1{font-size:17px;margin:0}.grow{flex:1}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}
.refresh{background:#ffc107;color:#111827}
.close{background:#fff;color:#111827}
main{max-width:1050px;margin:auto;padding:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#111827}
.search{flex:1;min-width:180px}
.stats{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:11px;margin-bottom:12px;font-size:12px;color:#475569}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
.card{background:#fff;border:1px solid #dbe1e8;border-radius:15px;padding:14px;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-weight:900;font-size:16px;color:#0f172a}
.small{font-size:12px;color:#475569;margin-top:4px}
.badge{padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#e2e8f0;color:#0f172a;height:max-content}
.info{font-size:13px;line-height:1.7;margin-top:11px;color:#334155}
.actions{display:flex;gap:8px;margin-top:12px}
.actionWrap{position:relative;flex:1}
.actionMain{width:100%;background:#111827;color:#fff;display:flex;justify-content:space-between;align-items:center}
.actionMenu{display:none;position:absolute;right:0;left:0;top:calc(100% + 6px);z-index:50;background:#fff;border:1px solid #dbe1e8;border-radius:12px;padding:6px;box-shadow:0 14px 30px rgba(15,23,42,.22)}
.actionWrap.open .actionMenu{display:block}
.actionMenu button{display:block;width:100%;text-align:left;background:#fff;color:#111827;margin:2px 0}
.actionMenu button:hover{background:#f1f5f9}
.actionMenu .edit{color:#1d4ed8}.actionMenu .delete{color:#dc2626}
.actionMenu .bill{color:#b45309}.actionMenu .cash{color:#15803d}
.empty{background:#fff;border-radius:12px;padding:30px;text-align:center;color:#64748b}
.err{color:#b91c1c;white-space:pre-wrap}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modalBox{width:min(520px,100%);background:#fff;border-radius:18px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modalBox h2{margin:0 0 14px;font-size:20px}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formGrid label{font-size:12px;font-weight:800;color:#475569}
.formGrid input{width:100%;margin-top:5px}
.full{grid-column:1/-1}
.modalActions{display:flex;gap:8px;margin-top:15px}
.modalActions button{flex:1}
.save{background:#111827;color:#fff}.cancel{background:#e5e7eb;color:#111827}
@media(max-width:600px){
 header{padding:11px 12px}h1{font-size:16px}
 main{padding:10px}.card{padding:13px}
 .formGrid{grid-template-columns:1fr}
 .full{grid-column:auto}
}

/* DATA PENJUALAN - baris tabel mengikuti DATA SERVIS */
.tableWrap{background:#fff;border:1px solid #e4e8ef;border-radius:16px;box-shadow:0 3px 12px rgba(15,23,42,.05);overflow:auto}
.salesTable{width:100%;border-collapse:collapse;min-width:1050px}
.salesTable th{background:#f8fafc;color:#475569;font-size:12px;font-weight:900;text-align:left;padding:12px 10px;border-bottom:1px solid #e5e7eb;white-space:nowrap}
.salesTable td{padding:12px 10px;border-bottom:1px solid #eef1f5;font-size:12px;color:#334155;vertical-align:middle}
.salesTable tbody tr:hover{background:#fafafa}.salesTable tbody tr:last-child td{border-bottom:0}
.salesTable .customer{font-weight:900;color:#111827}.salesTable .nota{font-weight:800;color:#334155;white-space:nowrap}.salesTable .money{font-weight:900;color:#111827;white-space:nowrap}
.salesTable .actionCell{min-width:170px;text-align:right}.salesTable .badge{display:inline-flex}

/* ===== POPUP FIXZY PENJUALAN ===== */
.fixzyOverlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.68);z-index:1000;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px)}
.fixzyOverlay.show{display:flex}
.fixzyBox{width:min(470px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.fixzyHead{display:flex;align-items:center;gap:9px;margin-bottom:13px}.fixzyHead h2{margin:0;font-size:18px;color:#111827}
.fixzyClose{margin-left:auto;background:#eef2f7;color:#111827;width:36px;height:36px;padding:0}
.fixzyInfo{background:#f8fafc;border:1px solid #e5e7eb;border-radius:13px;padding:11px 12px;font-size:12px;line-height:1.55;margin-bottom:11px}
.fixzyGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fixzyField label{display:block;font-size:10px;font-weight:900;color:#64748b;margin-bottom:5px}
.fixzyField input{width:100%;padding:11px;border:1px solid #d7dce5;border-radius:11px;font-weight:800}.fixzyField input[readonly]{background:#f8fafc}
.fixzyField.full{grid-column:1/-1}.fixzyResult{margin-top:11px;background:#111827;color:#fff;border-radius:14px;padding:13px}
.fixzyLine{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin:5px 0}.fixzyLine.total{border-top:1px solid rgba(255,255,255,.18);padding-top:9px;margin-top:9px;font-size:16px;font-weight:900}
.fixzyActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.fixzyActions button{padding:12px}
.fixzyCancel{background:#e5e7eb;color:#111827}.fixzySave{background:#ffc107;color:#111827}
.salesTable .income{font-weight:900;color:#15803d;white-space:nowrap}
@media(max-width:480px){.fixzyGrid{grid-template-columns:1fr}.fixzyField.full{grid-column:auto}}
</style></head><body>

<header>
  <h1>🛒 Data Penjualan</h1>
  <div class="grow"></div>
  <button class="refresh" onclick="load()">↻ Refresh</button>
  <button class="close" onclick="tutupHalaman()">✕ Tutup</button>
</header>

<main>
  <div class="bar">
    <input id="search" class="search" placeholder="Cari pelanggan, produk, nota...">
    <select id="filter">
      <option value="semua">Semua Status</option>
      <option value="masuk">Masuk</option>
      <option value="tagihan">Masuk Tagihan</option>
      <option value="tunai">Tunai</option>
      <option value="dibayar">Dibayar</option>
      <option value="piutang">Piutang</option>
      <option value="batal">Batal</option>
    </select>
  </div>

  <div class="stats">☁️ Data <b>/penjualan</b> • Total: <b id="total">0</b> • <span id="akun">memeriksa akun...</span></div>
  <div id="list" class="list"><div class="empty">Memuat Firebase...</div></div>
</main>

<!-- POPUP FIXZY KONFIRMASI -->
<div id="fixzyConfirm" class="fixzyOverlay" aria-hidden="true">
 <div class="fixzyBox">
  <div class="fixzyHead"><span style="font-size:24px">⚡</span><h2 id="fixzyConfirmTitle">FIXZY</h2></div>
  <div id="fixzyConfirmMsg" class="fixzyInfo"></div>
  <div class="fixzyActions">
   <button class="fixzyCancel" onclick="fixzyNo()">Batal</button>
   <button class="fixzySave" onclick="fixzyYes()">OK</button>
  </div>
 </div>
</div>

<!-- POPUP PENDAPATAN TUNAI -->
<div id="incomeModal" class="fixzyOverlay" aria-hidden="true">
 <div class="fixzyBox">
  <div class="fixzyHead"><span style="font-size:24px">💰</span><h2>Konfirmasi Pendapatan Penjualan</h2><button class="fixzyClose" onclick="closeIncome()">✕</button></div>
  <div id="incomeInfo" class="fixzyInfo"></div>
  <div class="fixzyGrid">
   <div class="fixzyField"><label>TOTAL PENJUALAN</label><input id="incomeTotal" readonly></div>
   <div class="fixzyField"><label>DP / DIBAYAR</label><input id="incomeDp" inputmode="numeric"></div>
   <div class="fixzyField full"><label>DISKON / POTONGAN</label><input id="incomeDiskon" inputmode="numeric" value="0"></div>
   <div class="fixzyField full"><label>PENDAPATAN — HASIL AKHIR</label><input id="incomePendapatan" readonly></div>
  </div>
  <div class="fixzyResult">
   <div class="fixzyLine"><span>Total</span><b id="incomeTotalPrev">Rp 0</b></div>
   <div class="fixzyLine"><span>DP / Dibayar</span><b id="incomeDpPrev">Rp 0</b></div>
   <div class="fixzyLine"><span>Diskon</span><b id="incomeDiskonPrev">Rp 0</b></div>
   <div class="fixzyLine"><span>Sisa</span><b id="incomeSisaPrev">Rp 0</b></div>
   <div class="fixzyLine total"><span>PENDAPATAN</span><b id="incomeFinalPrev">Rp 0</b></div>
  </div>
  <div class="fixzyActions"><button class="fixzyCancel" onclick="closeIncome()">Batal</button><button class="fixzySave" onclick="saveIncome()">Simpan</button></div>
 </div>
</div>

<!-- POPUP WHATSAPP -->
<div id="waModal" class="fixzyOverlay" aria-hidden="true">
 <div class="fixzyBox">
  <div class="fixzyHead"><span style="font-size:24px">📲</span><h2>Pesan WhatsApp</h2><button class="fixzyClose" onclick="closeWA()">✕</button></div>
  <div id="waInfo" class="fixzyInfo"></div>
  <div id="waPreview" style="white-space:pre-line;background:#f8fafc;border:1px solid #e5e7eb;border-radius:13px;padding:12px;font-size:12px;line-height:1.6"></div>
  <div class="fixzyActions"><button class="fixzyCancel" onclick="closeWA()">Tutup</button><button id="waSend" class="fixzySave" onclick="sendWA()">📲 Kirim WhatsApp</button></div>
 </div>
</div>

<div id="editModal" class="modal">
  <div class="modalBox">
    <h2>✏️ Edit Penjualan</h2>
    <div class="formGrid">
      <label>Pelanggan<input id="eNama"></label>
      <label>No. WhatsApp<input id="eHp"></label>
      <label>Produk<input id="eProduk"></label>
      <label>Qty<input id="eQty" type="number" min="1"></label>
      <label>Harga<input id="eHarga" type="number" min="0"></label>
      <label>Total<input id="eTotal" type="number" min="0"></label>
      <label class="full">Catatan<input id="eCatatan"></label>
    </div>
    <div class="modalActions">
      <button class="cancel" onclick="closeEdit()">Batal</button>
      <button class="save" onclick="saveEdit()">💾 Simpan</button>
    </div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,updateDoc,doc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",
 authDomain:"fixzy-f056f.firebaseapp.com",
 projectId:"fixzy-f056f",
 storageBucket:"fixzy-f056f.firebasestorage.app",
 messagingSenderId:"838081521031",
 appId:"1:838081521031:web:50fdee909b56460b055f22"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let uid="",rows=[],editId="";

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=v=>"Rp "+Number(v||0).toLocaleString("id-ID");
const NAMA_KONTER="A YUDI THEA";

function statusLabel(x){
  const s=String(x.status||"").toLowerCase();
  const p=String(x.pembayaran||"").toLowerCase();
  if(s==="batal")return "Batal";
  if(p==="tagihan"||s==="piutang"||s==="tempo")return "Masuk Tagihan";
  if(p==="tunai"||s==="dibayar"||s==="selesai")return "Tunai";
  return "Masuk";
}

function render(){
  const q=$("search").value.toLowerCase().trim(),f=$("filter").value;
  const a=rows.filter(x=>{
    const label=statusLabel(x).toLowerCase();
    const hay=JSON.stringify(x).toLowerCase();
    return (f==="semua" || label===f) && (!q||hay.includes(q));
  });
  $("total").textContent=a.length;
  $("list").innerHTML=a.length?`<div class="tableWrap"><table class="salesTable">
    <thead><tr>
      <th>Pelanggan</th><th>No. Nota</th><th>Tanggal</th><th>Produk</th>
      <th>Qty</th><th>Status</th><th>Total</th><th>Dibayar</th><th>Sisa</th><th>Pendapatan</th><th>Aksi</th>
    </tr></thead><tbody>${a.map(x=>{
      const id=esc(x.id), status=statusLabel(x);
      return `<tr>
        <td><div class="customer">${esc(x.pelanggan?.nama||x.namaPelanggan||"Pelanggan umum")}</div><div class="small">${esc(x.noHp||x.pelanggan?.wa||"-")}</div></td>
        <td class="nota">${esc(x.nomorNota||x.idPenjualan||"-")}</td>
        <td>${esc(x.tanggal||"-")}</td>
        <td><b>${esc(x.produk||x.items?.[0]?.nama||"Penjualan")}</b></td>
        <td>${Number(x.qty||x.items?.[0]?.qty||1)}</td>
        <td><span class="badge">${esc(status)}</span></td>
        <td class="money">${money(x.total)}</td>
        <td class="money">${money(x.dibayar)}</td>
        <td class="money">${money(x.sisa)}</td>
        <td class="money income">${money(x.pendapatan||0)}</td>
        <td class="actionCell">
          <div class="actionWrap" id="aw-${id}">
            <button class="actionMain" onclick="toggleAction('${id}')"><span>⚙️ Aksi</span><span>⌄</span></button>
            <div class="actionMenu">
              <button class="edit" onclick="editPenjualan('${id}')">✏️ Edit</button>
              <button class="delete" onclick="hapus('${id}')">🗑️ Hapus</button>
              <button class="bill" onclick="ubahPembayaran('${id}','tagihan')">🧾 Masuk Tagihan</button>
              <button class="cash" onclick="ubahPembayaran('${id}','tunai')">💵 Tunai</button>               <button class="cancel" onclick="ubahPembayaran(\'${id}\',\'batal\')">✖️ Batal</button>
            </div>
          </div>
        </td>
      </tr>`;
    }).join("")}</tbody></table></div>`:`<div class="empty">Tidak ada data penjualan.</div>`;
}


let fixzyConfirmResolve=null;
window.fixzyConfirm=function(message,title="FIXZY"){
 return new Promise(resolve=>{
  fixzyConfirmResolve=resolve;
  $("fixzyConfirmTitle").textContent=title;
  $("fixzyConfirmMsg").textContent=String(message??"");
  const m=$("fixzyConfirm");m.classList.add("show");m.style.display="flex";m.setAttribute("aria-hidden","false");
 });
};
window.fixzyYes=function(){const r=fixzyConfirmResolve;fixzyConfirmResolve=null;closeFixzyConfirm();if(r)r(true)};
window.fixzyNo=function(){const r=fixzyConfirmResolve;fixzyConfirmResolve=null;closeFixzyConfirm();if(r)r(false)};
window.closeFixzyConfirm=function(){const m=$("fixzyConfirm");m.classList.remove("show");m.style.display="none";m.setAttribute("aria-hidden","true")};

let incomePending=null;
function cleanMoney(v){return Number(String(v??"").replace(/[^\d-]/g,""))||0}
function updateIncomePreview(){
 const total=cleanMoney($("incomeTotal").value);
 const dp=Math.min(total,Math.max(0,cleanMoney($("incomeDp").value)));
 const diskon=Math.min(total,Math.max(0,cleanMoney($("incomeDiskon").value)));
 const pendapatan=Math.max(0,total-diskon);
 const sisa=Math.max(0,total-dp);
 $("incomeTotalPrev").textContent=money(total);$("incomeDpPrev").textContent=money(dp);
 $("incomeDiskonPrev").textContent=money(diskon);$("incomeSisaPrev").textContent=money(sisa);
 $("incomeFinalPrev").textContent=money(pendapatan);$("incomePendapatan").value=pendapatan;
 return {total,dp,diskon,pendapatan,sisa};
}
window.openIncome=function(item){
 incomePending=item;
 $("incomeInfo").innerHTML=`<b>${esc(item.pelanggan?.nama||item.namaPelanggan||"Pelanggan umum")}</b><br>No. Nota: ${esc(item.nomorNota||item.idPenjualan||item.id||"-")}`;
 $("incomeTotal").value=cleanMoney(item.total);
 $("incomeDp").value=cleanMoney(item.dibayar??item.dp??item.total);
 $("incomeDiskon").value=cleanMoney(item.diskon??item.discount??0);
 updateIncomePreview();
 const m=$("incomeModal");m.classList.add("show");m.style.display="flex";m.setAttribute("aria-hidden","false");
};
window.closeIncome=function(){incomePending=null;const m=$("incomeModal");m.classList.remove("show");m.style.display="none";m.setAttribute("aria-hidden","true")};
$("incomeDp").addEventListener("input",updateIncomePreview);$("incomeDiskon").addEventListener("input",updateIncomePreview);

let incomeSaving=false;
window.saveIncome=async function(){
 const item=incomePending;if(!item||incomeSaving)return;
 incomeSaving=true;
 const v=updateIncomePreview();
 try{
  await updateDoc(doc(db,"penjualan",item.id),{
   pembayaran:"Tunai",status:"dibayar",dibayar:v.dp,sisa:v.sisa,
   diskon:v.diskon,discount:v.diskon,pendapatan:v.pendapatan,jumlahTotal:v.pendapatan,
   updatedAt:serverTimestamp()
  });
  closeIncome();await load();
 }catch(e){fixzyConfirm("Gagal menyimpan pendapatan: "+e.message,"Gagal Menyimpan")}
};

let waPending=null;
function normalizeWA(v){let n=String(v||"").replace(/\D/g,"");if(n.startsWith("0"))n="62"+n.slice(1);if(!n.startsWith("62"))n="62"+n;return n}
window.openWA=function(item,text){
 const n=normalizeWA(item.noHp||item.pelanggan?.wa||item.whatsapp||"");
 waPending=n?{number:n,text}:null;$("waInfo").textContent=n?"Nomor WhatsApp tersedia.":"Nomor WhatsApp belum tersedia.";
 $("waPreview").textContent=text;$("waSend").style.display=n?"block":"none";
 const m=$("waModal");m.classList.add("show");m.style.display="flex";m.setAttribute("aria-hidden","false");
};
window.closeWA=function(){waPending=null;const m=$("waModal");m.classList.remove("show");m.style.display="none";m.setAttribute("aria-hidden","true")};
window.sendWA=function(){if(!waPending){closeWA();return}const {number,text}=waPending,encoded=encodeURIComponent(text);const desktop=!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);const url=desktop?"https://web.whatsapp.com/send?phone="+number+"&text="+encoded:"https://wa.me/"+number+"?text="+encoded;closeWA();window.open(url,"_blank")};
function makeTagihanWA(item){
 const nama=item.pelanggan?.nama||item.namaPelanggan||"Pelanggan";
 const total=Number(item.total||0),dp=Number(item.dibayar??item.dp??0),sisa=Math.max(0,total-dp);
 const nota=item.nomorNota||item.idPenjualan||item.id||"-";
 return `Halo ${nama},

📍 *${NAMA_KONTER}*

Informasi penjualan Anda:

🧾 No. Nota: ${nota}
📌 Status: *Masuk Tagihan*

💰 Total tagihan: *${money(total)}*
💵 DP: *${money(dp)}*
📌 Sisa pembayaran: *${money(sisa)}*

Terima kasih 🙏`;
}

function makeBatalWA(item){
 const nama=item.pelanggan?.nama||item.namaPelanggan||"Pelanggan";
 const nota=item.nomorNota||item.idPenjualan||item.id||"-";
 const total=Number(item.total||0);
 return `Halo ${nama},

📍 *${NAMA_KONTER}*

Informasi penjualan Anda:

🧾 No. Nota: ${nota}
📌 Status: *BATAL*

💰 Total transaksi: *${money(total)}*

Transaksi penjualan tersebut telah dibatalkan.

Terima kasih 🙏`;
}

window.toggleAction=id=>{
  document.querySelectorAll(".actionWrap.open").forEach(e=>{if(e.id!=="aw-"+id)e.classList.remove("open")});
  const el=$("aw-"+id);if(el)el.classList.toggle("open");
};

document.addEventListener("click",e=>{
  if(!e.target.closest(".actionWrap"))
    document.querySelectorAll(".actionWrap.open").forEach(x=>x.classList.remove("open"));
});

window.ubahPembayaran=async(id,mode)=>{
 document.querySelectorAll(".actionWrap.open").forEach(x=>x.classList.remove("open"));
 const item=rows.find(x=>x.id===id);if(!item)return;
 if(mode==="tunai"){openIncome(item);return}
 if(mode==="batal"){
  if(!(await fixzyConfirm("Batalkan transaksi penjualan ini?\n\nPendapatan akan menjadi Rp 0.","Konfirmasi Batal")))return;
  try{
   await updateDoc(doc(db,"penjualan",id),{
    status:"batal",pembayaran:"Batal",pendapatan:0,jumlahTotal:0,sisa:0,
    updatedAt:serverTimestamp()
   });
   await load();
   openWA({...item,status:"batal",pembayaran:"Batal",pendapatan:0,jumlahTotal:0,sisa:0},makeBatalWA({...item,status:"batal"}));
  }catch(e){fixzyConfirm("Gagal membatalkan transaksi: "+e.message,"Gagal Membatalkan")}
  return;
 }
 if(mode==="tagihan"){
  if(!(await fixzyConfirm(`Ubah transaksi menjadi MASUK TAGIHAN?\n\nTotal tagihan: ${money(Number(item.total)||0)}\nDP saat ini: ${money(Number(item.dibayar??item.dp??0))}`,"Konfirmasi Tagihan")))return;
  try{
   const dp=Number(item.dibayar??item.dp??0)||0,total=Number(item.total)||0;
   await updateDoc(doc(db,"penjualan",id),{pembayaran:"Tagihan",status:"piutang",dibayar:dp,sisa:Math.max(0,total-dp),updatedAt:serverTimestamp()});
   await load();openWA({...item,dibayar:dp,total},makeTagihanWA({...item,dibayar:dp,total}));
  }catch(e){fixzyConfirm("Gagal mengubah pembayaran: "+e.message,"Gagal Mengubah")}
 }
};

window.editPenjualan=id=>{
  document.querySelectorAll(".actionWrap.open").forEach(x=>x.classList.remove("open"));
  const x=rows.find(r=>r.id===id);if(!x)return;
  editId=id;
  $("eNama").value=x.namaPelanggan||x.pelanggan?.nama||"";
  $("eHp").value=x.noHp||x.pelanggan?.wa||"";
  $("eProduk").value=x.produk||x.items?.[0]?.nama||"";
  $("eQty").value=Number(x.qty||x.items?.[0]?.qty||1);
  $("eHarga").value=Number(x.harga||x.items?.[0]?.harga||0);
  $("eTotal").value=Number(x.total||0);
  $("eCatatan").value=x.catatan||"";
  $("editModal").classList.add("show");
};

window.closeEdit=()=>{$("editModal").classList.remove("show");editId="";};

window.saveEdit=async()=>{
  if(!editId)return;
  const total=Number($("eTotal").value)||0;
  try{
    await updateDoc(doc(db,"penjualan",editId),{
      namaPelanggan:$("eNama").value.trim(),
      noHp:$("eHp").value.trim(),
      produk:$("eProduk").value.trim(),
      qty:Number($("eQty").value)||1,
      harga:Number($("eHarga").value)||0,
      total,
      catatan:$("eCatatan").value.trim(),
      updatedAt:serverTimestamp()
    });
    closeEdit();await load();
  }catch(e){fixzyConfirm("Gagal menyimpan perubahan: "+e.message,"Gagal Menyimpan")}
};

window.hapus=async id=>{
  if(!(await fixzyConfirm("Hapus transaksi penjualan ini dari Firebase?","Konfirmasi Hapus")))return;
  try{await deleteDoc(doc(db,"penjualan",id));await load();}
  catch(e){fixzyConfirm("Gagal hapus penjualan: "+e.message,"Gagal Hapus")}
};

async function load(){
  if(!uid)return;
  $("list").innerHTML='<div class="empty">Membaca Firebase...</div>';
  try{
    const snap=await getDocs(query(collection(db,"penjualan"),where("uid","==",uid)));
    rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    rows.sort((a,b)=>String(b.tanggal||"").localeCompare(String(a.tanggal||"")));
    render();
  }catch(e){
    $("list").innerHTML=`<div class="empty err">Gagal membaca Firebase:\n${e.message}</div>`;
  }
}
window.load=load;



$("search").oninput=render;
$("filter").onchange=render;

onAuthStateChanged(auth,async u=>{
  if(!u){location.href="login.html";return;}
  uid=u.uid;
  $("akun").textContent=u.email||"Akun login";
  await load();
});
</script><script>
function tutupHalaman(){
  try{if(window.frameElement){window.frameElement.remove();return}}catch(e){}
  try{if(window.parent!==window){
    window.parent.postMessage({type:"FIXZY_CLOSE_PAGE"},"*");
    return;
  }}catch(e){}
  try{window.close()}catch(e){}
}
window.tutupHalaman=tutupHalaman;
</script>
</body></html>
