<!doctype html>
<html lang="id">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixzy Olive - Data Penjualan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#e2e8f0;font-family:Inter,system-ui,sans-serif;min-height:100vh}
header{background:#111827;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;border-bottom:1px solid #ffffff10;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.logo{width:42px;height:42px;background:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;border:1px solid #ffffff15;overflow:hidden}
.logo img{width:34px;height:34px;object-fit:contain}
.brand{line-height:1.1}
.brand b{color:#a3e635;font-weight:900;letter-spacing:0.5px}
.brand span{color:#64748b;font-size:11px}
.user-box{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;background:#1e293b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#a3e635}
.btn{padding:10px 16px;border-radius:12px;font-weight:800;font-size:12px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#a3e635;color:#000;border-color:#a3e635}
.btn:hover{filter:brightness(1.1)}
main{max-width:1400px;margin:auto;padding:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:260px;background:#111b2e;border:1px solid #1e293b;padding:12px 14px;border-radius:12px;color:#e2e8f0}
.search::placeholder{color:#475569}
select.filter{background:#111b2e;border:1px solid #1e293b;padding:12px 14px;border-radius:12px;color:#e2e8f0;min-width:160px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1200px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:linear-gradient(135deg,#111b2e,#0f172a);border:1px solid #1e293b;border-radius:16px;padding:16px;position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;background:radial-gradient(circle,rgba(163,230,53,0.15),transparent);border-radius:50%}
.stat .icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;font-size:16px}
.stat.omset .icon{background:#ffffff15;color:#fff}.stat.diterima .icon{background:#22c55e20;color:#22c55e}.stat.tagihan .icon{background:#f59e0b20;color:#f59e0b}.stat.modal .icon{background:#64748b20;color:#94a3b8}.stat.laba .icon{background:#a3e63520;color:#a3e635}
.stat b{font-size:10px;color:#64748b;letter-spacing:0.8px;text-transform:uppercase}
.stat .value{font-size:18px;font-weight:900;margin-top:6px;letter-spacing:-0.3px}
.stat .sub{font-size:11px;color:#475569;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:#111b2e;border:1px solid #1e293b;border-radius:18px;overflow:hidden;transition:all .2s}
.card:hover{border-color:#334155;transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.card-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b;background:#0f172a}
.card-head-left{display:flex;align-items:center;gap:10px}
.num{width:32px;height:32px;background:#a3e635;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.nota{font-weight:800;font-size:13px;letter-spacing:0.3px}
.date{font-size:11px;color:#64748b;margin-top:2px}
.badge{padding:6px 12px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:0.5px;border:1px solid}
.badge.masuk{background:#1e293b;color:#94a3b8;border-color:#334155}
.badge.tagihan{background:#2a1f0a;color:#f59e0b;border-color:#f59e0b30}
.badge.tunai{background:#0a1f12;color:#22c55e;border-color:#22c55e30}
.badge.diambil{background:#0a1f12;color:#a3e635;border-color:#a3e63530}
.badge.batal{background:#2a0a0a;color:#ef4444;border-color:#ef444430}
.card-body{padding:16px}
.section{margin-bottom:14px}
.section-title{font-size:10px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info{background:#0b1220;border:1px solid #1e293b;border-radius:10px;padding:10px}
.info .k{font-size:9px;color:#475569;text-transform:uppercase;font-weight:700}
.info .v{font-size:13px;font-weight:700;margin-top:3px;color:#e2e8f0}
.info .v.b{font-weight:900;font-size:14px}
.product-list{display:flex;flex-direction:column;gap:8px}
.product{background:#0b1220;border:1px solid #1e293b;border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.product-left{display:flex;align-items:center;gap:10px}
.product-icon{width:36px;height:36px;background:#1e293b;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#a3e635}
.product-name{font-weight:800;font-size:13px}
.product-meta{font-size:11px;color:#64748b}
.product-price{font-weight:900;font-size:13px;color:#a3e635}
.price-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.price-box{background:#0b1220;border:1px solid #1e293b;border-radius:10px;padding:10px;text-align:center}
.price-box .k{font-size:9px;color:#475569}
.price-box .v{font-size:13px;font-weight:900;margin-top:4px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid #1e293b}
.summary{background:#0b1220;border-radius:12px;padding:12px;border:1px solid #1e293b}
.summary.green{border-color:#22c55e30;background:linear-gradient(135deg,#0a1f12,#0b1220)}
.summary.cyan{border-color:#06b6d430;background:linear-gradient(135deg,#061a1f,#0b1220)}
.summary .k{font-size:9px;color:#64748b;text-transform:uppercase}
.summary .v{font-size:15px;font-weight:900;margin-top:4px}
.actions{display:flex;gap:8px;margin-top:14px}
.btn-sm{flex:1;padding:12px;border-radius:12px;font-weight:800;font-size:12px;border:1px solid #1e293b;background:#1e293b;color:#e2e8f0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-sm.edit{background:#111827;color:#fff}
.btn-sm.delete{background:#1e1212;color:#f87171;border-color:#3f1a1a}
.btn-sm.tunai{background:#a3e635;color:#000;border-color:#a3e635}
.empty{padding:40px;text-align:center;background:#111b2e;border:1px dashed #334155;border-radius:18px;color:#64748b}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, deleteDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI", authDomain: "fixzy-update.firebaseapp.com", projectId: "fixzy-update", storageBucket: "fixzy-update.appspot.com", messagingSenderId: "431404655232", appId: "1:431404655232:web:5f7d9c9a1b2c3d4e5f6a7" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser=null, allRows=[], filteredRows=[];

onAuthStateChanged(auth, async u=>{
  if(!u){ location.href="login.html"; return; }
  currentUser=u;
  document.getElementById('userEmail').textContent=u.email;
  document.getElementById('userInitial').textContent=u.email[0].toUpperCase();
  await load();
});

async function load(){
  try{
    const snap=await getDocs(collection(db,"penjualan"));
    let rows=snap.docs.map(d=>({id:d.id, ...d.data()}));
    // Tampilkan semua hasil inputan penjualan - tidak filter owner ketat
    allRows=rows.sort((a,b)=>new Date(b.tanggal||b.createdAt?.seconds*1000||0)-new Date(a.tanggal||a.createdAt?.seconds*1000||0));
    render();
  }catch(e){
    console.error(e);
    document.getElementById('info').textContent="Error: "+e.message;
  }
}

function getTanggal(d){ return d.tanggal|| (d.createdAt?.seconds? new Date(d.createdAt.seconds*1000).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-'); }
function getNota(d){ return d.nomorNota||d.nota||'-'; }
function getTeknisi(d){ return d.teknisiNama||d.teknisi||d.namaKaryawan||d.createdBy||'-'; }
function getNamaPel(d){ return d.pelanggan?.nama||d.nama||d.namaPelanggan||'-'; }
function getWa(d){ return d.pelanggan?.wa||d.noHp||d.wa||'-'; }
function getAlamat(d){ return d.pelanggan?.alamat||d.alamat||'-'; }
function getItems(d){ return d.items||[]; }
function getTotal(d){ return Number(d.total||d.jumlahTotal||0); }
function getDiskon(d){ return Number(d.diskon||0); }
function getDp(d){ return Number(d.dp||0); }
function getSisa(d){ return Number(d.sisa ?? (getTotal(d)-getDiskon(d)-getDp(d))); }
function getModal(d){ const it=getItems(d); if(it.length>0) return it.reduce((s,x)=>s+Number(x.modal||x.hargaBeli||0)*Number(x.qty||1),0); return Number(d.modal||0); }
function getPendapatan(d){ return getTotal(d)-getDiskon(d); }
function getLaba(d){ return getPendapatan(d)-getModal(d); }
function getStatus(d){ return (d.status||'masuk').toLowerCase(); }

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const f=document.getElementById('f').value;
  filteredRows=allRows.filter(d=>{
    const st=getStatus(d);
    if(f!=='semua'&&st!==f) return false;
    if(!q) return true;
    const hay=`${getTanggal(d)} ${getNota(d)} ${getTeknisi(d)} ${getNamaPel(d)} ${getWa(d)} ${getAlamat(d)} ${getItems(d).map(i=>i.nama).join(' ')}`.toLowerCase();
    return hay.includes(q);
  });
  let omset=0,diterima=0,tagihan=0,modal=0,laba=0;
  filteredRows.forEach(d=>{ const t=getTotal(d),dp=getDp(d),s=getSisa(d),m=getModal(d),l=getLaba(d),st=getStatus(d); omset+=t; modal+=m; laba+=l; if(st==='tunai'||st==='diambil') diterima+=dp>0?dp:t-getDiskon(d); else {diterima+=dp; tagihan+=s;} });
  document.getElementById('s1').innerHTML=`<div class="icon"><i class="ri-shopping-bag-line"></i></div><b>Omset</b><div class="value">Rp ${omset.toLocaleString('id-ID')}</div><div class="sub">${filteredRows.length} transaksi</div>`;
  document.getElementById('s2').innerHTML=`<div class="icon"><i class="ri-hand-coin-line"></i></div><b>Uang Diterima</b><div class="value">Rp ${diterima.toLocaleString('id-ID')}</div>`;
  document.getElementById('s3').innerHTML=`<div class="icon"><i class="ri-bill-line"></i></div><b>Tagihan</b><div class="value">Rp ${tagihan.toLocaleString('id-ID')}</div>`;
  document.getElementById('s4').innerHTML=`<div class="icon"><i class="ri-shopping-cart-line"></i></div><b>Modal Belanja</b><div class="value">Rp ${modal.toLocaleString('id-ID')}</div>`;
  document.getElementById('s5').innerHTML=`<div class="icon"><i class="ri-line-chart-line"></i></div><b>Laba Bersih</b><div class="value">Rp ${laba.toLocaleString('id-ID')}</div>`;
  document.getElementById('info').textContent=`Menampilkan ${filteredRows.length} dari ${allRows.length} hasil inputan penjualan`;
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  if(filteredRows.length===0){
    grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><i class="ri-inbox-line" style="font-size:32px"></i><br><br>Belum ada data penjualan<br><small style="color:#475569">Data inputan akan muncul disini otomatis</small><br><br><a href="input-penjualan.html" class="btn btn-primary"><i class="ri-add-line"></i> Input Penjualan</a></div>`;
    return;
  }
  filteredRows.forEach((d,idx)=>{
    const st=getStatus(d),items=getItems(d),total=getTotal(d),diskon=getDiskon(d),dp=getDp(d),sisa=getSisa(d),modalVal=getModal(d),pendVal=getPendapatan(d),labaVal=getLaba(d);
    const el=document.createElement('div'); el.className='card';
    el.innerHTML=`
      <div class="card-head">
        <div class="card-head-left">
          <div class="num">${idx+1}</div>
          <div>
            <div class="nota">${getNota(d)}</div>
            <div class="date"><i class="ri-calendar-line"></i> ${getTanggal(d)} • <i class="ri-user-3-line"></i> ${getTeknisi(d)}</div>
          </div>
        </div>
        <div class="badge ${st}">${st.toUpperCase()}</div>
      </div>
      <div class="card-body">
        <div class="section">
          <div class="section-title"><i class="ri-user-line"></i> PELANGGAN</div>
          <div class="info-grid">
            <div class="info"><div class="k">Nama</div><div class="v b">${getNamaPel(d)}</div></div>
            <div class="info"><div class="k">No WA</div><div class="v">${getWa(d)}</div></div>
            <div class="info" style="grid-column:1/-1"><div class="k">Alamat</div><div class="v">${getAlamat(d)}</div></div>
          </div>
        </div>
        <div class="section">
          <div class="section-title"><i class="ri-shopping-basket-line"></i> PEMBELIAN - Menampilkan seluruh hasil inputan</div>
          <div class="product-list">
            ${items.length>0?items.map(it=>`
              <div class="product">
                <div class="product-left">
                  <div class="product-icon"><i class="ri-smartphone-line"></i></div>
                  <div>
                    <div class="product-name">${it.nama||'-'} <span style="background:#1e293b;padding:2px 6px;border-radius:6px;font-size:10px;color:#a3e635;margin-left:6px">${it.type||'auto'}</span></div>
                    <div class="product-meta">${it.nama} x${it.qty||1} = Rp ${Number(it.harga||0).toLocaleString('id-ID')}</div>
                  </div>
                </div>
                <div class="product-price">Rp ${Number(it.subtotal||it.harga||0).toLocaleString('id-ID')}</div>
              </div>
            `).join(''):`<div class="product"><div class="product-left"><div class="product-icon"><i class="ri-smartphone-line"></i></div><div><div class="product-name">${d.namaProduk||'Produk'}</div><div class="product-meta">Y20 x1 = Rp ${total.toLocaleString('id-ID')}</div></div></div><div class="product-price">Rp ${total.toLocaleString('id-ID')}</div></div>`}
          </div>
          <div class="price-grid">
            <div class="price-box"><div class="k">Total Harga</div><div class="v">Rp ${total.toLocaleString('id-ID')}</div></div>
            <div class="price-box"><div class="k">Diskon</div><div class="v">Rp ${diskon.toLocaleString('id-ID')}</div></div>
            <div class="price-box"><div class="k">DP / Sisa</div><div class="v">Rp ${dp.toLocaleString('id-ID')} / Rp ${sisa.toLocaleString('id-ID')}</div></div>
          </div>
        </div>
        <div class="summary-grid">
          <div class="summary"><div class="k">Modal Belanja</div><div class="v">Rp ${modalVal.toLocaleString('id-ID')}</div></div>
          <div class="summary green"><div class="k">Pendapatan</div><div class="v">Rp ${pendVal.toLocaleString('id-ID')}</div><div style="font-size:9px;color:#64748b;margin-top:4px">Tunai Only - hasil akhir jika TUNAI</div></div>
          <div class="summary cyan"><div class="k">Laba Bersih</div><div class="v">Rp ${labaVal.toLocaleString('id-ID')}</div><div style="font-size:9px;color:#64748b;margin-top:4px">Pendapatan - Modal</div></div>
        </div>
        <div class="actions">
          <button class="btn-sm edit" onclick="editData('${d.id}')"><i class="ri-edit-line"></i> Edit</button>
          <button class="btn-sm" style="background:#1e293b;color:#94a3b8;border:1px solid #334155" onclick="setStatus('${d.id}','masuk')"><i class="ri-login-box-line"></i> Masuk</button>
          <button class="btn-sm" style="background:#fef3c7;color:#92400e;border:1px solid #f59e0b30" onclick="setStatus('${d.id}','tagihan')"><i class="ri-bill-line"></i> Tagihan</button>
          <button class="btn-sm tunai" onclick="setStatus('${d.id}','tunai')"><i class="ri-money-dollar-circle-line"></i> Tunai</button>
          <button class="btn-sm delete" onclick="setStatus('${d.id}','batal')"><i class="ri-close-circle-line"></i> Batal</button>
        </div>
      </div>
    `;
    grid.appendChild(el);
  });
}
window.editData=(id)=>{localStorage.setItem('fixzy_edit_id',id);location.href=`input-penjualan.html?edit=${id}`;}
window.hapusData=async(id)=>{if(!confirm('Hapus data penjualan ini?'))return;try{await deleteDoc(doc(db,"penjualan",id));await load();}catch(e){alert(e.message);}}
window.setStatus=async(id,st)=>{try{await updateDoc(doc(db,"penjualan",id),{status:st,updatedAt:new Date().toISOString()});await load();}catch(e){alert(e.message);}}
window.refreshData=()=>{load();}
document.getElementById('q').addEventListener('input',render);
document.getElementById('f').addEventListener('change',render);
</script>
</head>
<body>
<header>
  <div class="logo"><img src="logo.png" onerror="this.style.display='none'; this.parentElement.textContent='F'" style="width:32px;height:32px;object-fit:contain;background:#000"></div>
  <div class="brand"><b>FIXZY</b> <span>OLIVE</span><br><span style="font-size:10px;color:#94a3b8" id="userEmail">Memuat...</span></div>
  <div class="user-box">
    <div class="avatar" id="userInitial" style="background:#000;border:1px solid #ffffff15">F</div>
    <button class="btn" onclick="refreshData()" style="background:transparent;border:1px solid #ffffff30;color:#fff"><i class="ri-refresh-line"></i> Refresh</button>
    <a href="input-penjualan.html" class="btn" style="background:#fff;color:#111827;border-color:#fff;font-weight:900"><i class="ri-add-line"></i> Input</a>
  </div>
</header>
<main>
  <div class="toolbar">
    <input id="q" class="search" placeholder="🔍 Cari tanggal / nota / teknisi / pelanggan / WA / alamat / produk...">
    <select id="f" class="filter"><option value="semua">Semua Status</option><option value="masuk">Masuk</option><option value="tagihan">Tagihan</option><option value="tunai">Tunai</option><option value="batal">Batal</option></select>
  </div>
  <div class="stats">
    <div class="stat omset" id="s1"><b>OMSET</b><div class="value">Rp 0</div></div>
    <div class="stat diterima" id="s2"><b>UANG DITERIMA</b><div class="value">Rp 0</div></div>
    <div class="stat tagihan" id="s3"><b>TAGIHAN</b><div class="value">Rp 0</div></div>
    <div class="stat modal" id="s4"><b>MODAL</b><div class="value">Rp 0</div></div>
    <div class="stat laba" id="s5"><b>LABA BERSIH</b><div class="value">Rp 0</div></div>
  </div>
  <div id="info" style="font-size:12px;color:#64748b;margin-bottom:12px">Memuat seluruh hasil inputan penjualan...</div>
  <div class="grid" id="grid"></div>
