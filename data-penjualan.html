<html lang="id">
<head><style>

  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");

<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#111827;font-family:Inter,Arial,sans-serif}
header{background:#111827;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;border-bottom:2px solid #facc15;min-height:68px}
.logo{width:52px;height:52px;background:#000;border-radius:14px;display:flex;align-items:center;justify-content:center;border:2px solid #facc15;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;padding:4px}
main{max-width:1400px;margin:auto;padding:12px}
.summary{background:#fff;border:2px solid #111827;border-radius:16px;box-shadow:5px 5px 0 #111827;padding:14px 18px;margin-bottom:14px;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:260px;background:#fff;border:2px solid #111827;padding:11px 14px;border-radius:12px;box-shadow:2px 2px 0 #111827}
.filter{background:#fff;border:2px solid #111827;padding:11px 14px;border-radius:12px;font-weight:700;box-shadow:2px 2px 0 #111827}
.wrap{background:#fff;border:2px solid #111827;border-radius:16px;overflow:auto;box-shadow:4px 4px 0 #111827;max-height:75vh}
table{width:100%;border-collapse:collapse;min-width:1150px}
th{background:#111827;color:#fff;font-size:10px;font-weight:900;text-transform:uppercase;padding:12px 10px;position:sticky;top:0;text-align:left}
td{padding:10px;border-bottom:1px solid #e5e7eb;font-size:11.5px;vertical-align:top}
tr:hover td{background:#fffbeb}
.badge{padding:3px 8px;border-radius:999px;font-size:9px;font-weight:900;border:1px solid #111827;display:inline-block}
.badge.tunai{background:#facc15;color:#000}.badge.masuk{background:#fff}.badge.tagihan{background:#fef3c7}.badge.batal{background:#111827;color:#fff}
.btn-lihat{background:#facc15;color:#000;border:2px solid #111827;padding:6px 12px;border-radius:8px;font-weight:900;font-size:11px;cursor:pointer}
.prod-chip{display:inline-block;background:#fef9c3;border:1px solid #facc15;padding:3px 6px;border-radius:6px;margin:2px;font-size:10px;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:200;align-items:center;justify-content:center;padding:12px}
.modal.show{display:flex}
.modal-box{width:min(700px,100%);max-height:92vh;overflow:auto;background:#fff;border:3px solid #111827;border-radius:18px;box-shadow:8px 8px 0 #111827}
.modal-head{position:sticky;top:0;background:#111827;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;border-bottom:2px solid #facc15}
.modal-body{padding:16px}
.close-x{background:#facc15;color:#000;border:2px solid #000;width:40px;height:40px;border-radius:10px;font-weight:900;font-size:20px;cursor:pointer}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.info{background:#f8fafc;border:2px solid #111827;border-radius:10px;padding:10px}
.info .k{font-size:9px;color:#64748b;font-weight:800;text-transform:uppercase}
.info .v{font-size:13px;font-weight:800;margin-top:3px}
.product{background:#fff;border:2px solid #111827;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;box-shadow:2px 2px 0 #111827}
.price{background:#facc15;padding:5px 9px;border-radius:8px;font-weight:900;border:1px solid #111827;font-size:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.sum{border:2px solid #111827;border-radius:10px;padding:10px;box-shadow:2px 2px 0 #111827}
.sum.black{background:#111827;color:#fff}
.cards{display:none;gap:10px;margin-top:12px}
.penj-card{background:#fff;border:2px solid #111827;border-radius:14px;box-shadow:4px 4px 0 #111827;padding:12px}
.penj-card .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #e5e7eb;font-size:11px}
@media(max-width:900px){.wrap{display:none}.cards{display:grid}}
.wa-box{background:#fff;border:3px solid #111827;border-radius:16px;box-shadow:8px 8px 0 #111827;padding:16px;width:min(560px,100%)}
.wa-text{margin-top:10px;padding:11px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;white-space:pre-wrap;font-size:11.5px;max-height:220px;overflow:auto}
</style>
</head>
<body>
<header>
<div class="logo"><img src="logo.png"></div>
<div><b>FIXZY - DATA PENJUALAN</b><br><small id="konterInfo" style="color:#94a3b8;font-size:11px">Memuat...</small></div>
<div style="margin-left:auto;display:flex;gap:8px">
<button onclick="location.reload()" style="background:#1e293b;color:#fff;border:2px solid #334155;padding:9px 14px;border-radius:12px;font-weight:800">↻ Refresh</button>
</div>
</header>
<main>
<div class="summary" id="salesSummary">Memuat...</div>
<div class="toolbar">
<input id="q" class="search" placeholder="Cari nota, nama, WA, produk (ref Data Servis)...">
<select id="f" class="filter"><option value="">Semua Status</option><option value="masuk">Masuk</option><option value="tagihan">Tagihan</option><option value="tunai">Tunai</option><option value="batal">Batal</option></select>
<input id="fTanggal" type="date" class="filter">
</div>
<div id="statusMsg" style="font-size:11px;color:#64748b;margin-bottom:8px">Produk pakai referensi Data Servis</div>
<div class="wrap"><table><thead><tr><th>Tanggal</th><th>Nota & Barcode</th><th>Pelanggan</th><th>Produk (Ref Servis)</th><th>Total / Diskon / DP / Sisa</th><th>Pendapatan (Tunai)</th><th>Aksi</th></tr></thead><tbody id="tbody"><tr><td colspan="7" style="padding:20px;text-align:center;color:#94a3b8">Memuat...</td></tr></tbody></table></div>
<div class="cards" id="cards"></div>
</main>

<div class="modal" id="detailModal"><div class="modal-box"><div class="modal-head"><div><b id="detailNota">Nota</b><br><small id="detailTanggal">-</small></div><button class="close-x" onclick="closeDetail()">×</button></div><div class="modal-body" id="detailBody"></div></div></div>

<div class="modal" id="waModal"><div class="wa-box">
<div style="background:#111827;color:#fff;margin:-16px -16px 12px;padding:12px 16px;border-radius:13px 13px 0 0;font-weight:900">📲 WA - Status Berubah</div>
<div id="waInfo" style="font-size:12px"></div>
<div class="wa-text" id="waText"></div>
<div style="display:flex;gap:7px;margin-top:12px">
<a id="waLinkBtn" href="#" target="_blank" style="flex:1;text-align:center;padding:11px;background:#25D366;color:#fff;border-radius:10px;text-decoration:none;font-weight:900;border:2px solid #111827">📲 Buka WhatsApp</a>
<button onclick="tutupWA()" style="padding:10px;background:#111827;color:#fff;border-radius:10px">Tutup</button>
</div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, getDocsFromServer, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(cfg);const auth=getAuth(app);const db=getFirestore(app);
let uid="",ownerUid="",profile={},allRows=[],konterName="FIXZY",pendingWA=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>"Rp "+(Number(n)||0).toLocaleString("id-ID");
const num=v=>{const n=Number(v);return isFinite(n)?n:0;}
const dateValue=r=>String(r.tanggal||r.createdAt||"").slice(0,10);

// ===== REFERENSI DATA SERVIS UNTUK PRODUK - COPY PASTE DARI DATA SERVIS =====
function parseProduk(r){
  const candidates = [
    r.penggunaanProduk,
    r.produkDigunakan,
    r.produkYangDigunakan,
    r.sparepart,
    r.produk,
    r.items,
    r.produkList,
    r.sparepartList,
    r.namaProduk,
    r.produkTransaksi
  ];
  let found=null;
  for(let c of candidates){
    if(c && (Array.isArray(c) ? c.length>0 : String(c).trim()!=="" && String(c)!=="-")){
      found=c; break;
    }
  }
  if(!found) return {text:"-",list:[],has:false};
  if(typeof found==="string"){
    const t=found.trim();
    if(!t||t==="-") return {text:"-",list:[],has:false};
    return {text:t,list:[{nama:t,qty:1,subtotal:0}],has:true};
  }
  if(Array.isArray(found)){
    const list=found.map(item=>{
      if(typeof item==="string") return {nama:item,qty:1,subtotal:0};
      return {
        nama:item.nama||item.namaProduk||item.produk||item.kode||"-",
        qty:Number(item.qty||item.jumlah||1),
        harga:Number(item.harga||item.hargaJual||0),
        subtotal:Number(item.subtotal||item.total||0),
        barcode:item.barcode||""
      };
    }).filter(x=>x.nama && x.nama!=="-");
    if(!list.length) return {text:"-",list:[],has:false};
    const text=list.map(x=>`${x.nama}${x.qty>1?` x${x.qty}`:""}`).join(", ");
    return {text,list,has:true};
  }
  if(typeof found==="object"){
    const nama=found.nama||found.namaProduk||found.kode||"-";
    if(nama==="-") return {text:"-",list:[],has:false};
    return {text:nama,list:[{nama,qty:Number(found.qty||1),harga:Number(found.harga||0),subtotal:Number(found.totalModal||0)}],has:true};
  }
  return {text:"-",list:[],has:false};
}
function getProdukText(r){ return parseProduk(r).text; }
function getProdukChips(r){
  const p=parseProduk(r);
  if(!p.has) return '<span style="color:#94a3b8">-</span>';
  return p.list.map(x=>`<span class="prod-chip">${esc(x.nama)}${x.qty>1?` x${x.qty}`:""}${x.subtotal?` (${money(x.subtotal)})`:""}</span>`).join("");
}
function getItems(r){ return parseProduk(r).list; }
function getNamaPel(r){return r.pelanggan?.nama||r.nama||"-";}
function getWa(r){return r.pelanggan?.wa||r.noHp||"";}
function getNota(r){return r.nomorNota||"-";}
function getStatus(r){return String(r.status||"masuk").toLowerCase();}
function getTotal(r){return num(r.total||0);}
function getDiskon(r){return num(r.diskon||0);}
function getDP(r){return num(r.dp||0);}
function getSisa(r){return num(r.sisa||0);}
function getModal(r){return num(r.modal||0);}
function getPendapatan(r){
  const st=getStatus(r);
  if(!["tunai","lunas","diambil"].includes(st)) return 0;
  const total=getTotal(r);
  const modal=getModal(r);
  return modal>0 ? Math.max(0,total-modal) : total-getDiskon(r);
}
function nomorWA(v){ let s=String(v||"").replace(/[^0-9]/g,""); if(!s) return ""; if(s.startsWith("0")) s="62"+s.slice(1); else if(s.startsWith("8")) s="62"+s; else if(!s.startsWith("62")) s="62"+s; return s; }
function konterNm(){return profile.namaKonter||konterName||"FIXZY";}

async function loadProfile(user){
  const snap=await getDoc(doc(db,"users",user.uid));
  if(!snap.exists()) throw new Error("Profil tidak ditemukan");
  profile=snap.data()||{};
  ownerUid = (profile.role==="owner"||profile.isOwner) ? user.uid : (profile.ownerUid||profile.ownerId||user.uid);
  uid=user.uid;
  konterName=profile.namaKonter||"FIXZY";
  $("konterInfo").textContent=konterName+" • "+user.email;
}
async function getOwnedPenjualan(){
  const map=new Map();
  async function ambil(field,val){
    try{ const q=query(collection(db,"penjualan"), where(field,"==",val)); const snap=await getDocsFromServer(q); snap.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()})); }catch(e){}
  }
  await ambil("ownerUid",ownerUid); await ambil("ownerId",ownerUid); await ambil("uid",ownerUid);
  return [...map.values()].sort((a,b)=>String(b.tanggal||"").localeCompare(String(a.tanggal||"")));
}
async function muatSemua(){
  const rows=await getOwnedPenjualan();
  allRows=rows;
  render();
  const totalNilai=rows.reduce((s,r)=>s+getTotal(r),0);
  const totalPend=rows.reduce((s,r)=>s+getPendapatan(r),0);
  $("salesSummary").innerHTML=`<b>${rows.length}</b> transaksi • Total nilai ${money(totalNilai)} • Pendapatan Tunai <b style="color:#047857">${money(totalPend)}</b> • Konter: ${esc(konterNm())} • Ref Data Servis`;
  $("statusMsg").textContent=`✅ ${rows.length} data • Produk pakai parser Data Servis`;
}
function render(){
  const q=($("q").value||"").toLowerCase().trim();
  const f=($("f").value||"").toLowerCase().trim();
  const tg=$("fTanggal").value||"";
  const filtered=allRows.filter(r=>{
    if(q){
      const prod=getProdukText(r).toLowerCase();
      const hay=[getNota(r),getNamaPel(r),getWa(r),prod,r.barcode||""].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(f && getStatus(r)!==f) return false;
    if(tg && !String(dateValue(r)).startsWith(tg)) return false;
    return true;
  });
  if(!filtered.length){
    $("tbody").innerHTML='<tr><td colspan="7" style="padding:20px;text-align:center;color:#94a3b8">Belum ada data</td></tr>';
    $("cards").innerHTML='<div style="text-align:center;color:#94a3b8;padding:20px;background:#fff;border:2px solid #111827;border-radius:12px">Belum ada data</div>';
    return;
  }
  $("tbody").innerHTML=filtered.map(r=>{
    const st=getStatus(r);
    return `<tr>
      <td>${esc(dateValue(r))}</td>
      <td><b>${esc(getNota(r))}</b><br><small style="font-family:monospace;background:#111827;color:#facc15;padding:2px 5px;border-radius:4px">${esc(r.barcode||"")}</small></td>
      <td><b>${esc(getNamaPel(r))}</b><br><small style="color:#94a3b8">${esc(getWa(r))}</small></td>
      <td>${getProdukChips(r)}</td>
      <td>Total: ${money(getTotal(r))}<br>Diskon: ${money(getDiskon(r))}<br>DP: ${money(getDP(r))}<br>Sisa: <b style="color:${getSisa(r)>0?'#ef4444':'#16a34a'}">${money(getSisa(r))}</b></td>
      <td><b style="color:${getPendapatan(r)>0?'#047857':'#94a3b8'}">${money(getPendapatan(r))}</b><br><small>${["tunai","lunas"].includes(st)?"✅ tunai":"⏳ belum"}</small></td>
      <td><span class="badge ${st}">${esc(st)}</span><br><br><button class="btn-lihat" onclick="lihatPanel('${r.id}')">Lihat</button></td>
    </tr>`;
  }).join("");
  $("cards").innerHTML=filtered.map(r=>`<div class="penj-card"><div style="display:flex;justify-content:space-between"><b>${esc(getNota(r))}</b><span class="badge ${getStatus(r)}">${esc(getStatus(r))}</span></div><div class="row"><span>Pelanggan</span><b>${esc(getNamaPel(r))}</b></div><div class="row"><span>Produk (Ref Servis)</span><b>${esc(getProdukText(r))}</b></div><div class="row"><span>Total</span><b>${money(getTotal(r))}</b></div><div class="row"><span>Pendapatan</span><b style="color:#047857">${money(getPendapatan(r))}</b></div><button class="btn-lihat" style="width:100%;margin-top:8px" onclick="lihatPanel('${r.id}')">Lihat</button></div>`).join("");
}

function buildPesanWA(r,newStatus){
  const nama=getNamaPel(r);const nota=getNota(r);const produk=getProdukText(r);const total=getTotal(r);
  return `Halo Kak ${nama} 👋\n\nUpdate transaksi *${nota}* di *${konterNm()}*:\n\nStatus: *${newStatus.toUpperCase()}*\nProduk: ${produk}\nTotal: ${money(total)}\n\nTerima kasih 🙏\n*${konterNm()}*`;
}

window.lihatPanel=id=>{
  const r=allRows.find(x=>x.id===id);
  $("detailNota").textContent=getNota(r);
  $("detailTanggal").textContent=dateValue(r);
  const items=getItems(r);
  $("detailBody").innerHTML=`
    <div class="info-grid">
      <div class="info"><div class="k">Pelanggan</div><div class="v">${esc(getNamaPel(r))}</div></div>
      <div class="info"><div class="k">WA</div><div class="v">${esc(getWa(r))}</div></div>
      <div class="info"><div class="k">Nota</div><div class="v">${esc(getNota(r))}</div></div>
      <div class="info"><div class="k">Status</div><div class="v">${esc(getStatus(r))}</div></div>
    </div>
    <div style="font-size:10px;font-weight:900;text-transform:uppercase;background:#fff;padding:6px 10px;border-radius:8px;border:1px solid #111827;border-left:4px solid #facc15;width:fit-content;margin-bottom:8px">Produk - Ref Data Servis</div>
    ${items.map(i=>`<div class="product"><span><b>${esc(i.nama)}</b> x${i.qty||1}</span><span class="price">${money(i.subtotal||i.harga||0)}</span></div>`).join("")||`<div class="product"><span>${esc(getProdukText(r))}</span></div>`}
    <div class="grid3" style="margin-top:10px">
      <div class="sum"><div style="font-size:9px;color:#64748b">TOTAL</div><div style="font-weight:900">${money(getTotal(r))}</div></div>
      <div class="sum"><div style="font-size:9px;color:#64748b">DISKON</div><div style="font-weight:900">${money(getDiskon(r))}</div></div>
      <div class="sum black"><div style="font-size:9px;color:#facc15">PENDAPATAN (TUNAI)</div><div style="font-weight:900;color:#facc15">${money(getPendapatan(r))}</div></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
      <button onclick="setStatus('${r.id}','masuk')" style="padding:8px 12px;border-radius:8px;border:1px solid #111827;background:#fff;font-weight:800">Masuk</button>
      <button onclick="setStatus('${r.id}','tagihan')" style="padding:8px 12px;border-radius:8px;border:1px solid #111827;background:#fef3c7;font-weight:800">Tagihan</button>
      <button onclick="setStatus('${r.id}','tunai')" style="padding:8px 12px;border-radius:8px;border:1px solid #111827;background:#facc15;font-weight:900">Tunai/Lunas</button>
      <button onclick="setStatus('${r.id}','batal')" style="padding:8px 12px;border-radius:8px;border:1px solid #ef4444;background:#fff;color:#ef4444;font-weight:800">Batal</button>
    </div>
  `;
  $("detailModal").classList.add("show");
};
window.closeDetail=()=>$("detailModal").classList.remove("show");

window.setStatus=async(id,newSt)=>{
  const r=allRows.find(x=>x.id===id);
  try{
    await updateDoc(doc(db,"penjualan",id),{status:newSt,statusTerakhir:newSt,updatedAt:serverTimestamp(), ...( ["tunai","lunas"].includes(newSt) ? {pendapatan:getPendapatan({...r,status:newSt})} : {}) });
    closeDetail();
    await muatSemua();
    const pesan=buildPesanWA(r,newSt);
    const waNomor=nomorWA(getWa(r));
    if(!waNomor) return alert("Status "+newSt+" disimpan, tapi WA kosong");
    pendingWA={phone:waNomor,message:pesan};
    $("waInfo").innerHTML=`Status <b>${esc(newSt)}</b> disimpan ✅<br>WA ke <b>${esc(getNamaPel(r))}</b><br>Produk: <b>${esc(getProdukText(r))}</b>`;
    $("waText").textContent=pesan;
    $("waLinkBtn").href="https://wa.me/"+waNomor+"?text="+encodeURIComponent(pesan);
    $("waModal").classList.add("show");
  }catch(e){ alert("Gagal: "+e.message); }
};
window.tutupWA=()=>{$("waModal").classList.remove("show");};

onAuthStateChanged(auth, async user=>{
  if(!user){ location.replace("login.html"); return; }
  await loadProfile(user);
  await muatSemua();
});
$("q").addEventListener("input",render);
$("f").addEventListener("change",render);
