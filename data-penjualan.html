<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIXZY | Data Penjualan</title><style>
:root{--fx-black:#0b0f14;--fx-black2:#111827;--fx-yellow:#ffc107;--fx-yellow2:#f59e0b;--fx-bg:#eef2f6;--fx-card:#fff;--fx-text:#111827;--fx-muted:#64748b;--fx-green:#16a34a;--fx-red:#dc2626}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--fx-bg);color:var(--fx-text);font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:50;background:var(--fx-black);color:#fff;border-bottom:2px solid var(--fx-yellow);box-shadow:0 3px 0 #000}
.head{max-width:1180px;margin:auto;min-height:72px;padding:9px 12px;display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;flex:0 0 52px;border-radius:13px;background:#000;border:1px solid #334155;padding:4px;object-fit:contain}.brand{min-width:0}.brand b{display:block;font-size:17px}.brand small{display:block;margin-top:3px;font-size:10px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}.spacer{flex:1}
.head-btn{height:44px;border:1px solid #ffffff30;border-radius:9px;padding:0 12px;font-weight:900;cursor:pointer}.refresh{background:transparent;color:#fff}.back{background:#1f2937;color:#fff}
main{max-width:1180px;margin:auto;padding:14px}.card{background:var(--fx-card);border:2px solid var(--fx-black2);border-radius:14px;padding:15px;margin-bottom:15px;box-shadow:4px 4px 0 var(--fx-black2)}
.card-title{font-size:16px;font-weight:900;padding-bottom:9px;margin-bottom:12px;border-bottom:2px solid var(--fx-black2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.full{grid-column:1/-1}
label{display:block;font-size:10px;font-weight:900;color:#4b5563;margin:0 0 5px}
input,select,textarea{width:100%;min-height:43px;padding:9px 10px;border:2px solid var(--fx-black2);border-radius:9px;background:#fff;color:var(--fx-text);font:inherit;outline:none}textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--fx-yellow2);box-shadow:0 0 0 2px #ffc10733}.readonly{background:#f8fafc!important}
.actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 #111827}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #111827}.primary{background:var(--fx-yellow);color:#111}.dark{background:var(--fx-black2);color:#fff}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.small{padding:7px 9px;font-size:11px}
.info{font-size:12px;color:var(--fx-muted);line-height:1.5}.error{color:#b42318;font-weight:800}.success{color:#15803d;font-weight:800}
.info-box{background:#fffaf0;border:2px solid var(--fx-yellow2);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:12px}
.table-wrap{overflow:auto;border:2px solid var(--fx-black2);border-radius:10px;box-shadow:3px 3px 0 var(--fx-black2);margin-top:12px}table{width:100%;border-collapse:collapse;min-width:850px;font-size:12px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:middle}th{background:#f8fafc;font-size:10px;text-transform:uppercase}tr:last-child td{border-bottom:0}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:15px}.sum{background:#fff;border:2px solid var(--fx-black2);border-radius:11px;padding:10px;box-shadow:3px 3px 0 var(--fx-black2)}.sum small{display:block;font-size:9px;color:var(--fx-muted);font-weight:900}.sum b{display:block;font-size:18px;margin-top:3px}.sum.yellow{background:#fffaf0;border-color:var(--fx-yellow2)}.sum.green{background:#ecfdf5;border-color:#86efac}.sum.red{background:#fff1f2;border-color:#fecdd3}
.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900}.tunai{background:#dcfce7;color:#15803d}.tagihan{background:#fef3c7;color:#92400e}.batal{background:#fee2e2;color:#b91c1c}.masuk,.diambil{background:#dbeafe;color:#1d4ed8}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:14px;z-index:100}.modal.show{display:flex}.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border:2px solid var(--fx-black2);border-radius:14px;padding:18px;box-shadow:6px 6px 0 #000}.modal-box h3{margin:0 0 10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
.product-search{position:relative}.dropdown{position:absolute;left:0;right:0;top:calc(100% + 5px);display:none;max-height:270px;overflow:auto;background:#fff;border:2px solid var(--fx-black2);border-radius:10px;box-shadow:4px 4px 0 var(--fx-black2);z-index:30}.dropdown.show{display:block}.product{padding:10px 12px;border-bottom:1px solid #e5e7eb;cursor:pointer}.product:hover{background:#fff8df}.product b{display:block}.product span{display:block;color:var(--fx-muted);font-size:10px;margin-top:3px}
@media(max-width:850px){.grid3,.grid4{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr 1fr}}@media(max-width:560px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.full{grid-column:auto}.summary{grid-template-columns:1fr 1fr}.head{padding:9px}.logo{width:48px;height:48px;flex-basis:48px}.brand b{font-size:15px}.head-btn{padding:0 9px}.card{padding:13px}}
</style>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,collection,query,where,getDocs,doc,getDoc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),rupiah=n=>"Rp "+(Number(n)||0).toLocaleString("id-ID"),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let user=null,profile={},ownerUid="",all=[],filtered=[];
const ownerOf=(p,u)=>String(p.role||"").toLowerCase()==="owner"?u.uid:(p.ownerUid||p.ownerId||u.uid);
const pname=d=>d.pelanggan?.nama||d.nama||"-",products=d=>d.namaProduk||d.produk||(Array.isArray(d.items)?d.items.map(x=>x.nama).join(", "):"-")||"-";
const total=d=>Number(d.total??d.jumlahTotal??0)||0;
const modal=d=>Number(d.modal??0)||0;
const income=d=>d.pendapatan!==undefined?Number(d.pendapatan)||0:(d.status==="tunai"?Math.max(0,total(d)-Number(d.diskon||0)):0);
const piutang=d=>d.piutang!==undefined?Number(d.piutang)||0:(d.status==="tagihan"?Number(d.sisa||0):0);
const date=d=>typeof d.tanggal==="string"?d.tanggal.slice(0,10):(d.createdAt?.toDate?d.createdAt.toDate().toISOString().slice(0,10):"");
const fmt=s=>{if(!s)return"-";let p=String(s).slice(0,10).split("-");return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:s};
function ownerBadge(s){let x=String(s||"-").toLowerCase();return`<span class="badge ${x}">${esc(x.toUpperCase())}</span>`}
function modalUI(title,html,buttons){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modalActions").innerHTML=buttons.map((b,i)=>`<button class="btn ${b.cls||"secondary"}" data-i="${i}">${esc(b.label)}</button>`).join("");$("modal").classList.add("show");document.querySelectorAll("#modalActions button").forEach(x=>x.onclick=()=>buttons[+x.dataset.i].fn?.())}
const closeModal=()=>$("modal").classList.remove("show");

async function loadSales(){
 let rows=[];
 for(const f of ["ownerUid","ownerId","uid"]){try{let s=await getDocs(query(collection(db,"penjualan"),where(f,"==",ownerUid)));s.forEach(d=>rows.push({id:d.id,...d.data()}))}catch{}}
 let m=new Map();rows.forEach(x=>m.has(x.id)||m.set(x.id,x));all=[...m.values()].sort((a,b)=>date(b).localeCompare(date(a)));
}
function apply(){let f=$("from").value,t=$("to").value,st=$("status").value,q=$("search").value.trim().toLowerCase();filtered=all.filter(d=>{let dt=date(d);if(f&&dt<f)return false;if(t&&dt>t)return false;if(st&&String(d.status||"").toLowerCase()!==st)return false;if(q&&!([d.nomorNota,d.barcode,pname(d),products(d),d.teknisi,d.teknisiNama,d.createdBy,d.akun].join(" ").toLowerCase().includes(q)))return false;return true})}
function render(){apply();let om=filtered.filter(d=>String(d.status||"").toLowerCase()!=="batal").reduce((s,d)=>s+total(d),0),inc=filtered.reduce((s,d)=>s+income(d),0),m=filtered.filter(d=>String(d.status||"").toLowerCase()!=="batal").reduce((s,d)=>s+modal(d),0),p=filtered.reduce((s,d)=>s+piutang(d),0);$("sCount").textContent=filtered.length;$("sOmset").textContent=rupiah(om);$("sIncome").textContent=rupiah(inc);$("sModal").textContent=rupiah(m);$("sPiutang").textContent=rupiah(p);$("countLabel").textContent=`• ${filtered.length} data`;$("tbody").innerHTML=filtered.length?filtered.map(d=>`<tr><td>${esc(fmt(date(d)))}</td><td><b>${esc(d.nomorNota||"-")}</b><br><small>${esc(d.barcode||"")}</small></td><td><b>${esc(pname(d))}</b><br><small>${esc(d.noHp||d.pelanggan?.wa||"")}</small></td><td>${esc(products(d))}</td><td>${esc(d.teknisi||d.teknisiNama||d.createdByEmail||d.createdBy||"-")}</td><td><b>${rupiah(total(d))}</b></td><td>${ownerBadge(d.status)}</td><td>${rupiah(income(d))}</td><td>${rupiah(d.sisa)}</td><td><button class="btn dark small" onclick="detail('${esc(d.id)}')">Detail</button> <button class="btn secondary small" onclick="editStatus('${esc(d.id)}')">Edit</button></td></tr>`).join(""):'<tr><td colspan="10" style="text-align:center;color:#64748b;padding:25px">Tidak ada data.</td></tr>'}
function detail(id){let d=all.find(x=>x.id===id);if(!d)return;let items=Array.isArray(d.items)?d.items.map(x=>`${esc(x.nama)} × ${+x.qty||0} = ${rupiah(x.subtotal??((x.harga||0)*(x.qty||0)))}`).join("<br>"):"-";modalUI("Detail Penjualan",`<div class="detail"><div class="k">Owner UID</div><div>${esc(d.ownerUid||d.ownerId||d.uid||"-")}</div><div class="k">Nota</div><div>${esc(d.nomorNota||"-")}</div><div class="k">Tanggal</div><div>${esc(fmt(date(d)))}</div><div class="k">Pelanggan</div><div>${esc(pname(d))}</div><div class="k">WA</div><div>${esc(d.noHp||d.pelanggan?.wa||"-")}</div><div class="k">Teknisi</div><div>${esc(d.teknisi||d.teknisiNama||"-")}</div><div class="k">Produk</div><div>${items}</div><div class="k">Total</div><div>${rupiah(total(d))}</div><div class="k">Diskon</div><div>${rupiah(d.diskon)}</div><div class="k">DP</div><div>${rupiah(d.dp??d.dibayar)}</div><div class="k">Sisa</div><div>${rupiah(d.sisa)}</div><div class="k">Pendapatan</div><div>${rupiah(income(d))}</div><div class="k">Piutang</div><div>${rupiah(piutang(d))}</div><div class="k">Catatan</div><div>${esc(d.catatan||"-")}</div></div>`,[{label:"Tutup",fn:closeModal}])}
function editStatus(id){let d=all.find(x=>x.id===id);if(!d)return;modalUI("Edit Status",`<label>STATUS TRANSAKSI</label><select id="editStatus"><option value="tunai">Tunai</option><option value="tagihan">Tagihan</option><option value="masuk">Masuk</option><option value="diambil">Diambil</option><option value="batal">Batal</option></select><div class="info" style="margin-top:8px">Perubahan hanya dikirim ke dokumen penjualan yang sudah lolos filter Owner.</div>`,[{label:"Batal",fn:closeModal},{label:"Simpan",cls:"primary",fn:async()=>{try{await updateDoc(doc(db,"penjualan",id),{status:$("editStatus").value,updatedAt:serverTimestamp()});closeModal();await loadSales();render()}catch(e){modalUI("❌ Gagal",esc(e.message),[{label:"Tutup",fn:closeModal}])}}}]);$("editStatus").value=String(d.status||"tunai").toLowerCase()}
window.detail=detail;window.editStatus=editStatus;
window.loadAll=async()=>{await loadSales();render();$("accessInfo").textContent=`✓ Data hanya milik Owner: ${ownerUid}`};
window.resetFilter=()=>{$("from").value="";$("to").value="";$("status").value="";$("search").value="";render()};
onAuthStateChanged(auth,async u=>{if(!u){location.replace("login.html");return}user=u;try{let s=await getDoc(doc(db,"users",u.uid));if(!s.exists())throw Error("Profil akun tidak ditemukan.");profile=s.data()||{};let role=String(profile.role||"").toLowerCase();if(!["owner","employee","kasir","superadmin"].includes(role))throw Error("Akun tidak memiliki akses Data Penjualan.");ownerUid=ownerOf(profile,u);if(!ownerUid)throw Error("Owner akun tidak ditemukan.");$("accountLine").textContent=`${u.email||u.uid} • ${role.toUpperCase()} • Owner: ${ownerUid}`;await loadSales();$("accessInfo").textContent=`✓ Data terisolasi ke Owner: ${ownerUid}`;$("loading").style.display="none";$("page").style.display="block";render()}catch(e){$("loading").innerHTML=`<span class="error">Gagal memuat: ${esc(e.message)}</span>`}});

</script></head><body>
<header><div class="head"><img class="logo" src="logo.png" alt="FIXZY"><div class="brand"><b>🛒 Data Penjualan</b><small id="accountLine">Memuat akun...</small></div><div class="spacer"></div><button class="head-btn refresh" onclick="loadAll()">↻ Refresh</button><button class="head-btn back" onclick="history.back()">‹ Kembali</button></div></header>
<main><div id="loading" class="card">Memuat data penjualan FIXZY...</div><div id="page" style="display:none">
<section class="card"><div class="card-title">Filter Data Penjualan</div><div class="grid4"><div><label>DARI TANGGAL</label><input id="from" type="date"></div><div><label>SAMPAI TANGGAL</label><input id="to" type="date"></div><div><label>STATUS</label><select id="status"><option value="">Semua Status</option><option value="tunai">Tunai</option><option value="tagihan">Tagihan</option><option value="masuk">Masuk</option><option value="diambil">Diambil</option><option value="batal">Batal</option></select></div><div><label>PENCARIAN</label><input id="search" placeholder="Nota / pelanggan / produk / teknisi"></div></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="render()">Terapkan Filter</button><button class="btn secondary" onclick="resetFilter()">Reset</button><button class="btn dark" onclick="location.href='penjualan.html'">＋ Input Penjualan</button></div><div id="accessInfo" class="info" style="margin-top:9px"></div></section>
<section class="summary"><div class="sum"><small>TRANSAKSI</small><b id="sCount">0</b></div><div class="sum yellow"><small>OMSET</small><b id="sOmset">Rp 0</b></div><div class="sum green"><small>PENDAPATAN</small><b id="sIncome">Rp 0</b></div><div class="sum"><small>MODAL</small><b id="sModal">Rp 0</b></div><div class="sum red"><small>PIUTANG</small><b id="sPiutang">Rp 0</b></div></section>
<section class="card"><div class="card-title">Daftar Transaksi <span id="countLabel" style="font-size:10px;color:#64748b;font-weight:700"></span></div><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Nota</th><th>Pelanggan</th><th>Produk</th><th>Teknisi</th><th>Total</th><th>Status</th><th>Pendapatan</th><th>Sisa</th><th>Aksi</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
</div></main>
<div class="modal" id="modal"><div class="modal-box"><h3 id="modalTitle">FIXZY</h3><div id="modalBody" class="info"></div><div class="modal-actions" id="modalActions"></div></div></div>
</body></html>
