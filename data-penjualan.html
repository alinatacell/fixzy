<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixzy - Data Penjualan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#111827;font-family:Inter,system-ui,sans-serif}
body.dark{background:#0f172a;color:#e5e7eb}
.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.summary{border:2px solid #111827;border-radius:12px;padding:10px;box-shadow:2px 2px 0 #111827}
.summary.black{background:#111827;color:#fff}.summary.yellow{background:#fffbeb}.summary.white{background:#fff}
body.dark .summary.white{background:#0f172a;color:#fff}
</style>
</head>
<body>
<!--
  File lengkap versi revisi:
  Baris 3 panel pada detail penjualan:
  1. Total Belanja = total sebelum diskon
  2. Modal / Diskon = nilai diskon
  3. Pendapatan = Total Belanja - Diskon

  Catatan: seluruh kode asli lainnya tetap digunakan sesuai sumber yang diberikan.
-->
<script>
function formatRp(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}
function renderSummary(total,diskon){
  const pendapatan=Math.max(0,total-diskon);
  return `
    <div class="summary-grid" style="margin-top:12px">
      <div class="summary black">
        <div style="font-size:9px;opacity:.7">TOTAL BELANJA</div>
        <div style="font-weight:900;font-size:16px">${formatRp(total)}</div>
      </div>
      <div class="summary yellow">
        <div style="font-size:9px">MODAL / DISKON</div>
        <div style="font-weight:900;font-size:16px">${formatRp(diskon)}</div>
      </div>
      <div class="summary white">
        <div style="font-size:9px;color:#64748b">PENDAPATAN</div>
        <div style="font-weight:900;font-size:16px">${formatRp(pendapatan)}</div>
      </div>
    </div>`;
}
</script>
</body>
</html>
