<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Fixzy - Data Penjualan - FIXED ISOLASI</title>
<link rel="icon" href="logo.png">
<link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#111827;font-family:Inter,system-ui,Arial,sans-serif}
body.dark{background:#0f172a;color:#e5e7eb}
header{background:#111827;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;border-bottom:1px solid #facc15;box-shadow:0 1px 6px rgba(15,23,42,.18);min-height:68px}
.logo{width:52px;height:52px;background:#000;border-radius:14px;display:flex;align-items:center;justify-content:center;border:2px solid #facc15;overflow:hidden;flex:0 0 52px}
.logo img{width:100%;height:100%;object-fit:contain;padding:4px;background:#000;display:block}
.brand{line-height:1.15;min-width:0}
.brand b{color:#fff;font-weight:900;font-size:18px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;margin-top:4px;color:#94a3b8;font-size:11px;font-weight:700}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{padding:9px 14px;border-radius:12px;font-weight:800;font-size:12px;border:2px solid #111827;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-refresh,.btn-moon{background:#1e293b;color:#fff;border-color:#334155}
.btn-moon{width:44px;height:44px;justify-content:center;font-size:18px}
main{max-width:1400px;margin:auto;padding:12px}
.sales-summary{width:100%;min-height:72px;display:flex;align-items:center;gap:10px;padding:14px 18px;margin:0 0 14px;background:#fff;border:2px solid #111827;border-radius:16px;box-shadow:5px 5px 0 #111827;color:#64748b}
.sales-summary .sum-icon{font-size:22px;flex:0 0 auto}.sales-summary .sum-title{font-size:16px;line-height:1.35}.sales-summary .sum-income{color:#047857;font-weight:900}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:260px;background:#fff;border:2px solid #111827;padding:11px 14px;border-radius:12px;font-weight:600;box-shadow:2px 2px 0 #111827;outline:none}
select.filter{background:#fff;border:2px solid #111827;padding:11px 14px;border-radius:12px;font-weight:700;min-width:150px;box-shadow:2px 2px 0 #111827}
body.dark .search,body.dark select.filter{background:#1e293b;color:#e5e7eb;border-color:#334155}
.excel-wrap{background:#fff;border:2px solid #111827;border-radius:16px;overflow:auto;box-shadow:4px 4px 0 #111827;max-height:75vh}
body.dark .excel-wrap{background:#1e293b;border-color:#334155}
table{width:100%;border-collapse:collapse;min-width:900px}
th{background:#111827;color:#fff;font-size:10px;font-weight:900;text-transform:uppercase;padding:12px 10px;white-space:nowrap;position:sticky;top:0;z-index:10;text-align:left}
td{padding:10px;border-bottom:1px solid #e5e7eb;font-size:12px;vertical-align:top}
body.dark td{border-color:#334155;color:#e5e7eb}
tr:hover td{background:#fffbeb}.badge{padding:3px 8px;border-radius:999px;font-size:9px;font-weight:900;border:1px solid #111827;display:inline-block}
.badge.masuk{background:#fff;color:#111827}.badge.tagihan{background:#fef3c7;color:#92400e}.badge.tunai{background:#facc15;color:#000}.badge.batal{background:#111827;color:#fff}
.btn-lihat{background:#facc15;color:#000;border:2px solid #111827;padding:6px 12px;border-radius:8px;font-weight:900;font-size:11px;cursor:pointer;box-shadow:1px 1px 0 #111827}
.btn-sm{padding:8px 6px;border-radius:9px;font-size:10px;font-weight:900;border:1px solid #111827;cursor:pointer}
.btn-sm.edit{background:#111827;color:#fff}.btn-sm.masuk{background:#fff;color:#111827}.btn-sm.tagihan{background:#fef3c7;color:#92400e}.btn-sm.tunai{background:#facc15;color:#000}.btn-sm.batal{background:#fff;color:#ef4444;border-color:#ef4444}
.modal,.edit-modal,.wa-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:200;align-items:center;justify-content:center;padding:12px}
.modal.show,.edit-modal.show,.wa-modal.show{display:flex}
.modal-box,.edit-box{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border:3px solid #111827;border-radius:18px;box-shadow:8px 8px 0 #111827}
.modal-head,.edit-head{position:sticky;top:0;z-index:5;padding:14px 16px;background:#111827;color:#fff;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #facc15}
.modal-head b,.edit-head b{font-size:18px}.modal-head small,.edit-head small{opacity:.7}
.modal-body,.edit-body{padding:16px}
.close-x{background:#facc15;color:#000;border:2px solid #000;width:40px;height:40px;border-radius:10px;font-weight:900;font-size:20px;cursor:pointer}
.section-title{font-size:10px;font-weight:900;text-transform:uppercase;background:#fff;padding:6px 10px;border-radius:8px;border:1px solid #111827;border-left:4px solid #facc15;width:fit-content;margin:0 0 8px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.info{background:#f8fafc;border:2px solid #111827;border-radius:10px;padding:10px}.info .k{font-size:9px;color:#64748b;font-weight:800;text-transform:uppercase}.info .v{font-size:13px;font-weight:800;margin-top:3px}
.product{background:#fff;border:2px solid #111827;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;box-shadow:2px 2px 0 #111827}.product-price{background:#facc15;padding:5px 9px;border-radius:8px;font-weight:900;border:1px solid #111827;font-size:12px;color:#000;white-space:nowrap}
.price-grid,.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.price-box,.summary{background:#f8fafc;border:2px solid #111827;border-radius:10px;padding:10px;text-align:center}.summary{box-shadow:2px 2px 0 #111827;text-align:left}.summary.black{background:#111827;color:#fff}.summary.yellow{background:#fffbeb}.summary.white{background:#fff}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.edit-field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}.edit-field.full{grid-column:1/-1}.edit-field label{font-size:10px;font-weight:900;text-transform:uppercase;color:#64748b}.edit-field input,.edit-field select{width:100%;padding:11px 12px;border:2px solid #111827;border-radius:10px;background:#fff;color:#111827;font-size:13px;font-weight:700;outline:none}.edit-field input:focus,.edit-field select:focus{border-color:#facc15;box-shadow:0 0 0 2px #facc1533}
.status-msg{font-size:11px;color:#64748b;margin:8px 0}
</style>
</head>
<body>
<header>
<div class="logo"><img src="logo.png" alt="logo"></div>
<div class="brand"><b>FIXZY - DATA PENJUALAN</b><small id="konterInfo">Memuat...</small></div>
<div class="header-actions">
<button class="btn btn-refresh" onclick="refreshData()">↻ Refresh</button>
<button class="btn btn-moon" onclick="toggleDarkMode()"><i id="moonIcon" class="ri-moon-fill"></i></button>
</div>
</header>
<main>
<div class="sales-summary" id="salesSummary">Memuat data penjualan...</div>
<div class="toolbar">
<input id="q" class="search" placeholder="Cari nama, nota, WA...">
<select id="f" class="filter"><option value="">Semua Status</option><option value="masuk">Masuk</option><option value="tagihan">Tagihan</option><option value="tunai">Tunai / Lunas</option><option value="batal">Batal</option></select>
</div>
<div class="status-msg" id="statusMsg">Menunggu login...</div>
<div class="excel-wrap"><table><thead><tr><th>Tanggal</th><th>Nota</th><th>Pelanggan</th><th>Items</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tbody"><tr><td colspan="7" style="padding:20px;text-align:center;color:#94a3b8">Memuat Firebase...</td></tr></tbody></table></div>
</main>

<!-- Modal Detail (tetap sama) -->
<div class="modal" id="detailModal"><div class="modal-box"><div class="modal-head"><div><b id="detailNota">Nota -</b><br><small id="detailTanggal">-</small></div><button class="close-x" onclick="closeDetail()">×</button></div><div class="modal-body" id="detailBody"></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, getDocFromServer, getDocsFromServer, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

let uid="", ownerUid="", profile={}, allRows=[], currentDetail=null, konterName="FIXZY";
const $=id=>document.getElementById(id);

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));}
function money(n){return "Rp "+(Number(n)||0).toLocaleString("id-ID");}
function num(v){const n=Number(v);return isFinite(n)?n:0;}
function dateValue(r){return String(r.tanggal||r.createdAt||"");}
function getNamaPel(r){return r.pelanggan?.nama||"-";}
function getWa(r){return r.pelanggan?.wa||"";}
function getNota(r){return r.nomorNota||r.id||"-";}
function getStatus(r){return r.status||"masuk";}
function getTotal(r){return num(r.total);}
function getSisa(r){return num(r.sisa);}
function getAlamat(r){return r.pelanggan?.alamat||"-";}
function getItems(r){return Array.isArray(r.items)?r.items:[];}

/* ========== FIX ISOLASI - AMBIL ownerUid DARI PROFILE ========== */
async function loadProfile(user){
  const snap=await getDoc(doc(db,"users",user.uid));
  if(!snap.exists()) throw new Error("Profil users tidak ditemukan");
  profile=snap.data()||{};
  const role=String(profile.role||"").toLowerCase();
  ownerUid = (role==="owner" || profile.isOwner===true) ? user.uid : (profile.ownerUid||profile.ownerId||user.uid);
  uid=user.uid;
  konterName=profile.namaKonter||profile.namaToko||"FIXZY";
  $("konterInfo").textContent=konterName+" • "+(profile.email||user.email);
}

/* ========== FIX ISOLASI - getOwned PENJUALAN HANYA MILIK ownerUid ========== */
async function getOwnedPenjualan(){
  const map=new Map();
  async function ambil(field,value){
    if(!value) return;
    try{
      const q=query(collection(db,"penjualan"), where(field,"==",value));
      const snap=await getDocsFromServer(q);
      snap.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));
    }catch(e){ console.warn("penjualan",field,e.message); }
  }
  // kompatibel dengan data lama & baru
  await ambil("ownerUid", ownerUid);
  await ambil("ownerId", ownerUid);
  await ambil("uid", ownerUid);
  if(ownerUid!==uid){
    await ambil("ownerUid", uid);
    await ambil("uid", uid);
  }
  return [...map.values()].sort((a,b)=>dateValue(b).localeCompare(dateValue(a)));
}

async function muatSemua(){
  if(!uid){ $("statusMsg").textContent="Sesi belum login"; return; }
  $("statusMsg").textContent="⏳ Membaca data penjualan milik "+ownerUid.slice(0,6)+"...";
  try{
    const rows=await getOwnedPenjualan();
    allRows=rows;
    render();
    const totalMasuk=rows.filter(r=>["tunai","lunas","masuk","tagihan"].includes(String(getStatus(r)).toLowerCase())).reduce((s,r)=>s+getTotal(r),0);
    $("salesSummary").innerHTML=`<span class="sum-icon">💰</span><span class="sum-title">Total ${rows.length} transaksi • <span class="sum-income">${money(totalMasuk)}</span> pendapatan tercatat (hanya data konter ini)</span>`;
    $("statusMsg").textContent=`✅ ${rows.length} data penjualan milik konter ini • Karyawan/admin/reseller dengan ownerUid sama bisa lihat bareng • Owner lain tidak bisa lihat`;
  }catch(e){
    console.error(e);
    $("statusMsg").textContent="❌ Gagal: "+e.message;
    $("tbody").innerHTML=`<tr><td colspan="7" style="padding:20px;color:#ef4444">${esc(e.message)}</td></tr>`;
  }
}

function render(){
  const q=($("q").value||"").toLowerCase().trim();
  const f=($("f").value||"").toLowerCase().trim();
  const filtered=allRows.filter(r=>{
    const hay=[getNota(r),getNamaPel(r),getWa(r),getAlamat(r),getStatus(r)].join(" ").toLowerCase();
    if(q && !hay.includes(q)) return false;
    if(f && String(getStatus(r)).toLowerCase()!==f) return false;
    return true;
  });
  if(!filtered.length){
    $("tbody").innerHTML='<tr><td colspan="7" style="padding:20px;text-align:center;color:#94a3b8">Belum ada data penjualan untuk konter ini.</td></tr>';
    return;
  }
  $("tbody").innerHTML=filtered.map(r=>{
    const items=getItems(r);
    const barang=items.length?items.map(i=>i.nama).join(", "):"-";
    return `<tr>
      <td>${esc(dateValue(r))}</td>
      <td><b>${esc(getNota(r))}</b></td>
      <td><b>${esc(getNamaPel(r))}</b><br><small style="color:#94a3b8">${esc(getWa(r))}</small></td>
      <td>${esc(barang)}</td>
      <td>${money(getTotal(r))}<br><small style="color:${getSisa(r)>0?'#ef4444':'#16a34a'}">Sisa ${money(getSisa(r))}</small></td>
      <td><span class="badge ${esc(getStatus(r))}">${esc(getStatus(r))}</span></td>
      <td><button class="btn-lihat" onclick="lihatPanel('${r.id}')">Lihat</button></td>
    </tr>`;
  }).join("");
}

window.lihatPanel=id=>{
  const r=allRows.find(x=>x.id===id);
  if(!r) return;
  currentDetail=r;
  $("detailNota").textContent=getNota(r);
  $("detailTanggal").textContent=dateValue(r);
  $("detailBody").innerHTML=`
    <div class="info-grid">
      <div class="info"><div class="k">Pelanggan</div><div class="v">${esc(getNamaPel(r))}</div></div>
      <div class="info"><div class="k">WA</div><div class="v">${esc(getWa(r))}</div></div>
      <div class="info"><div class="k">Alamat</div><div class="v">${esc(getAlamat(r))}</div></div>
      <div class="info"><div class="k">Status</div><div class="v">${esc(getStatus(r))}</div></div>
    </div>
    <div class="section-title">Items</div>
    ${getItems(r).map(i=>`<div class="product"><span>${esc(i.nama)} x${i.qty||1}</span><span class="product-price">${money(i.harga||i.total||0)}</span></div>`).join("")||"-"}
    <div class="summary-grid" style="margin-top:10px">
      <div class="summary white"><div class="k">Total</div><div class="v">${money(getTotal(r))}</div></div>
      <div class="summary yellow"><div class="k">Diskon</div><div class="v">${money(r.diskon||0)}</div></div>
      <div class="summary black"><div class="k">Sisa</div><div class="v">${money(getSisa(r))}</div></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn-sm masuk" onclick="setStatus('${r.id}','masuk')">Masuk</button>
      <button class="btn-sm tagihan" onclick="setStatus('${r.id}','tagihan')">Tagihan</button>
      <button class="btn-sm tunai" onclick="setStatus('${r.id}','tunai')">Tunai/Lunas</button>
      <button class="btn-sm batal" onclick="setStatus('${r.id}','batal')">Batal</button>
    </div>
  `;
  $("detailModal").classList.add("show");
};
window.closeDetail=()=>$("detailModal").classList.remove("show");

// UPDATE tetap pakai doc id - rules sudah izinkan jika ownerUid sama atau isPrivileged
window.setStatus=async(id,st)=>{
  try{
    await updateDoc(doc(db,"penjualan",id),{status:st,statusTerakhir:st,statusUpdatedAt:new Date().toISOString(),updatedAt:serverTimestamp()});
    await muatSemua();
    window.lihatPanel(id);
  }catch(e){ alert("Gagal: "+e.message); }
};

window.refreshData=()=>location.reload();
window.toggleDarkMode=()=>{document.body.classList.toggle("dark");localStorage.setItem("fixzy-dark",document.body.classList.contains("dark")?"1":"0");};
if(localStorage.getItem("fixzy-dark")==="1") document.body.classList.add("dark");

onAuthStateChanged(auth, async user=>{
  if(!user){ location.replace("login.html"); return; }
  try{ await loadProfile(user); await muatSemua(); }
  catch(e){ $("statusMsg").textContent="❌ "+e.message; }
});

$("q").addEventListener("input",render);
$("f").addEventListener("change",render);
</script>
</body>
</html>
