<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#FFC107">
<title>Data Penjualan</title>
<style>
*{box-sizing:border-box}html,body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#1f2937}
button,input,select{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900;font-size:20px}.brand span{color:#f59e0b}.back{border:0;background:#111827;color:#fff;border-radius:10px;padding:9px 13px;font-weight:800}
.wrap{max-width:1100px;margin:14px auto;padding:0 10px 30px}.head{background:#fff;border-radius:15px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.06);margin-bottom:12px}
h1{margin:0;font-size:22px}.sub{color:#64748b;font-size:13px;margin-top:5px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-top:14px}
input,select{border:1px solid #cbd5e1;border-radius:10px;padding:10px;background:#fff}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800}.reset{background:#e5e7eb}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border-radius:12px;padding:12px;box-shadow:0 5px 20px rgba(0,0,0,.05)}.stat small{display:block;color:#64748b;font-size:11px}.stat b{font-size:18px;display:block;margin-top:3px}
.table-card{background:#fff;border-radius:15px;box-shadow:0 6px 24px rgba(0,0,0,.06);overflow:hidden}.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:10px 9px;border-bottom:1px solid #e5e7eb;font-size:12px;text-align:left}th{background:#f8fafc}.num{text-align:right}
.badge{display:inline-block;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900}.ok{background:#dcfce7;color:#166534}.cancel{background:#fee2e2;color:#991b1b}.wait{background:#fef3c7;color:#92400e}
.empty{padding:45px;text-align:center;color:#64748b}.mobile{display:none}
@media(max-width:700px){
.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.filters button{grid-column:1/-1}
.stats{grid-template-columns:1fr 1fr}.table-card{display:none}.mobile{display:grid;gap:8px}
.item{background:#fff;border-radius:13px;padding:13px;box-shadow:0 5px 18px rgba(0,0,0,.06)}.item-top{display:flex;justify-content:space-between;gap:8px}.item h3{margin:0;font-size:14px}.line{display:flex;justify-content:space-between;gap:10px;padding-top:7px;font-size:12px}.line span:first-child{color:#64748b}
}
</style>
</head>
<body>
<header class="top"><div class="brand" id="brand">Nama Toko</div><button class="back" onclick="kembali()">← Kembali</button></header>
<main class="wrap">
<section class="head">
<h1>🛒 Data Penjualan</h1><div class="sub">Semua transaksi penjualan yang disimpan dari nota penjualan.</div>
<div class="filters"><input id="q" placeholder="Cari nomor atau pelanggan..." oninput="render()"><select id="status" onchange="render()"><option value="">Semua status</option><option>Selesai</option><option>DP</option><option>Tempo</option><option>Batal</option></select><input id="tanggal" type="date" onchange="render()"><button class="btn reset" onclick="resetFilter()">Reset</button></div>
</section>
<section class="stats">
<div class="stat"><small>Jumlah Nota</small><b id="jumlah">0</b></div><div class="stat"><small>Omzet</small><b id="omzet">Rp0</b></div><div class="stat"><small>Modal</small><b id="modal">Rp0</b></div><div class="stat"><small>Laba Kotor</small><b id="laba">Rp0</b></div><div class="stat"><small>Piutang/Sisa</small><b id="sisa">Rp0</b></div>
</section>
<section class="table-card"><div class="table-wrap"><table><thead><tr><th>Nota</th><th>Tanggal</th><th>Pelanggan</th><th>Produk</th><th>Status</th><th>Pembayaran</th><th class="num">Total</th><th class="num">Dibayar</th><th class="num">Sisa</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
<section id="mobile" class="mobile"></section>
</main>
<script>
const KEY="fixzy_transaksi_penjualan_saved";let rows=[];
function rupiah(n){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function profile(){try{return JSON.parse(localStorage.getItem("fixzy_user_profile")||"{}")}catch(e){return {}}}
function load(){try{rows=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){rows=[]}document.getElementById("brand").textContent=profile().namaToko||profile().namaUsaha||profile().toko||"Nama Toko";render()}
function active(r){return r.status!=="Batal"}
function modalRow(r){return (r.items||[]).reduce((a,x)=>a+(Number(x.hargaModal)||0)*(Number(x.qty)||1),0)}
function match(r){
 const q=document.getElementById("q").value.toLowerCase().trim(),s=document.getElementById("status").value,d=document.getElementById("tanggal").value;
 const text=[r.nomorNota,r.pelanggan?.nama,r.pelanggan?.wa].join(" ").toLowerCase();
 if(q&&!text.includes(q))return false;if(s&&r.status!==s)return false;if(d&&String(r.tanggal||"").slice(0,10)!==d&&!String(r.tanggal||"").includes(d))return false;return true
}
function badge(s){let c=s==="Batal"?"cancel":(s==="Selesai"?"ok":"wait");return `<span class="badge ${c}">${esc(s||"-")}</span>`}
function render(){
 const arr=rows.filter(match);let omzet=0,modal=0,sisa=0;
 rows.forEach(r=>{if(active(r)){omzet+=Number(r.total)||0;modal+=modalRow(r);sisa+=Number(r.sisa)||0}});
 document.getElementById("jumlah").textContent=arr.length;document.getElementById("omzet").textContent=rupiah(omzet);document.getElementById("modal").textContent=rupiah(modal);document.getElementById("laba").textContent=rupiah(omzet-modal);document.getElementById("sisa").textContent=rupiah(sisa);
 document.getElementById("tbody").innerHTML=arr.map(r=>{
  const items=(r.items||[]).map(x=>`${esc(x.nama)} ×${x.qty||1}`).join("<br>")||"-";
  return `<tr><td><b>${esc(r.nomorNota)}</b></td><td>${esc(r.tanggal)}</td><td>${esc(r.pelanggan?.nama||"Umum")}</td><td>${items}</td><td>${badge(r.status)}</td><td>${esc(r.metode||"Tunai")}</td><td class="num">${rupiah(r.total)}</td><td class="num">${rupiah(r.dibayar)}</td><td class="num">${rupiah(r.sisa)}</td></tr>`
 }).join("")||'<tr><td colspan="9" class="empty">Belum ada data penjualan.</td></tr>';
 document.getElementById("mobile").innerHTML=arr.map(r=>`<article class="item"><div class="item-top"><h3>${esc(r.nomorNota)}</h3>${badge(r.status)}</div><div class="line"><span>Tanggal</span><b>${esc(r.tanggal)}</b></div><div class="line"><span>Pelanggan</span><b>${esc(r.pelanggan?.nama||"Umum")}</b></div><div class="line"><span>Total</span><b>${rupiah(r.total)}</b></div><div class="line"><span>Dibayar / Sisa</span><b>${rupiah(r.dibayar)} / ${rupiah(r.sisa)}</b></div></article>`).join("")||'<div class="empty">Belum ada data penjualan.</div>';
}
function resetFilter(){q.value="";status.value="";tanggal.value="";render()}function kembali(){if(document.referrer)history.back();else location.href="index.html"}load();
</script>
</body>
</html>
