<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081326">
<title>FIXZY | Input Absensi Karyawan</title>
<style>
*{box-sizing:border-box}
:root{--bg:#eef2f7;--card:#fff;--line:#dbe2ea;--text:#111827;--muted:#64748b;--navy:#081326;--yellow:#ffc107;--green:#16a34a;--red:#dc2626;--blue:#2563eb}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.header{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;border-bottom:3px solid var(--yellow);box-shadow:0 3px 14px #0004}
.header-in{max-width:920px;margin:auto;padding:9px 12px;display:flex;align-items:center;gap:11px;min-height:70px}
.logo{width:52px;height:52px;object-fit:contain;border-radius:12px;background:#000;flex:none}
.head-info{min-width:0;flex:1}
.title{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:#cbd5e1;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.refresh{height:42px;border:0;border-radius:12px;background:var(--yellow);color:#111827;padding:0 14px;font-weight:900;flex:none}
.wrap{max-width:920px;margin:auto;padding:14px 12px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;margin-bottom:13px;overflow:hidden;box-shadow:0 4px 16px #1720330b}
.card-head{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:900;font-size:16px}
.card-body{padding:14px 16px}
.notice{padding:11px 13px;border-radius:11px;background:#f8fafc;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700}
.notice.ok{background:#ecfdf5;border-color:#a7f3d0;color:#166534}
.notice.err{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.full{grid-column:1/-1}
.field{min-width:0}
label{display:block;font-size:11px;font-weight:900;color:#475569;margin-bottom:5px}
input,select{width:100%;height:44px;border:1px solid #cbd5e1;border-radius:10px;padding:0 11px;background:#fff;color:#111827;outline:none}
input:focus,select:focus{border-color:#f59e0b;box-shadow:0 0 0 3px #f59e0b18}
input[readonly]{background:#f8fafc;color:#475569}
.employee-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}
.info{border:1px solid var(--line);border-radius:10px;padding:10px;background:#f8fafc}
.info small{display:block;font-size:9px;color:var(--muted);font-weight:900}
.info b{display:block;margin-top:4px;font-size:13px}
.status-buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.status-btn{height:48px;border:2px solid #cbd5e1;border-radius:11px;background:#fff;font-weight:900}
.status-btn.active.hadir{background:#dcfce7;border-color:#16a34a;color:#166534}
.status-btn.active.tidak{background:#fee2e2;border-color:#dc2626;color:#b91c1c}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{height:44px;border:0;border-radius:10px;font-weight:900}
.primary{background:var(--yellow);color:#111827}
.secondary{background:#e5e7eb;color:#111827}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:13px}
.sum{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}
.sum small{display:block;font-size:9px;color:var(--muted);font-weight:900}
.sum b{display:block;font-size:20px;margin-top:4px}
.sum.green{background:#ecfdf5;border-color:#a7f3d0}.sum.green b{color:#047857}
.sum.red{background:#fef2f2;border-color:#fecaca}.sum.red b{color:#b91c1c}
.sum.blue{background:#eff6ff;border-color:#bfdbfe}.sum.blue b{color:#1d4ed8}
.sum.orange{background:#fff7ed;border-color:#fed7aa}.sum.orange b{color:#c2410c}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}
table{width:100%;min-width:720px;border-collapse:collapse}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:11px;text-align:left;vertical-align:middle}
th{background:#f8fafc;color:#475569;font-size:10px}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900}
.badge.hadir{background:#dcfce7;color:#166534}
.badge.tidak{background:#fee2e2;color:#b91c1c}
.edit{border:0;border-radius:8px;background:#fef3c7;color:#92400e;padding:7px 10px;font-size:10px;font-weight:900}
.empty{text-align:center;color:var(--muted);padding:25px}
.popup{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
.popup.show{display:flex}
.popup-box{width:min(460px,100%);background:#fff;border-radius:15px;padding:17px;box-shadow:0 12px 40px #0004}
.popup-box h3{margin:0 0 8px}
.popup-box p{font-size:12px;color:var(--muted);line-height:1.5}
.popup-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
@media(max-width:650px){
 .grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .employee-info{grid-template-columns:1fr 1fr}
 .summary{grid-template-columns:1fr 1fr}
 .title{font-size:16px}
 .refresh{padding:0 11px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-in">
    <img src="logo.png" class="logo" alt="FIXZY">
    <div class="head-info">
      <div class="title">INPUT ABSENSI KARYAWAN</div>
      <div id="headerUser" class="sub">Memuat akun...</div>
    </div>
    <button class="refresh" id="refreshBtn" type="button">↻ Refresh</button>
  </div>
</header>

<main class="wrap">

<section class="card">
  <div class="card-body">
    <div id="statusMsg" class="notice">Memeriksa login Firebase dan memulihkan sesi...</div>
  </div>
</section>

<section class="summary">
  <div class="sum"><small>KARYAWAN AKTIF</small><b id="totalKaryawan">0</b></div>
  <div class="sum green"><small>HADIR BULAN INI</small><b id="totalHadir">0</b></div>
  <div class="sum red"><small>TIDAK HADIR</small><b id="totalTidak">0</b></div>
  <div class="sum orange"><small>TOTAL UPAH</small><b id="totalUpah">Rp 0</b></div>
</section>

<section class="card">
  <div class="card-head">📝 Input / Edit Daftar Hadir</div>
  <div class="card-body">
    <div class="grid">
      <div class="field">
        <label>TANGGAL ABSENSI</label>
        <input id="tanggal" type="date">
      </div>

      <div class="field">
        <label>NAMA KARYAWAN / TEKNISI</label>
        <select id="karyawan">
          <option value="">-- Pilih Karyawan --</option>
        </select>
      </div>

      <div class="field">
        <label>NO. WHATSAPP</label>
        <input id="wa" readonly placeholder="Otomatis">
      </div>

      <div class="field">
        <label>UPAH HARIAN</label>
        <input id="upah" readonly placeholder="Otomatis">
      </div>

      <div class="field full">
        <div class="employee-info">
          <div class="info"><small>JABATAN</small><b id="jabatan">-</b></div>
          <div class="info"><small>ROLE</small><b id="role">-</b></div>
          <div class="info"><small>STATUS KARYAWAN</small><b id="statusKaryawan">-</b></div>
        </div>
      </div>

      <div class="field full">
        <label>STATUS KEHADIRAN</label>
        <div class="status-buttons">
          <button type="button" class="status-btn hadir" id="hadirBtn">✓ HADIR</button>
          <button type="button" class="status-btn tidak" id="tidakBtn">✕ TIDAK HADIR</button>
        </div>
      </div>

      <div class="field full">
        <div class="actions">
          <button class="btn secondary" id="clearBtn" type="button">Kosongkan</button>
          <button class="btn primary" id="saveBtn" type="button">Simpan Absensi</button>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="card">
  <div class="card-head">📋 Daftar Hadir Bulan Ini</div>
  <div class="card-body">
    <div class="grid">
      <div class="field">
        <label>BULAN</label>
        <input id="bulan" type="month">
      </div>
      <div class="field">
        <label>CARI KARYAWAN</label>
        <input id="cari" placeholder="Nama / jabatan...">
      </div>
    </div>

    <div class="table-wrap" style="margin-top:12px">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Nama</th>
            <th>Jabatan</th>
            <th>Status</th>
            <th>Upah</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6" class="empty">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

</main>

<div class="popup" id="popup">
  <div class="popup-box">
    <h3 id="popupTitle">FIXZY</h3>
    <p id="popupText"></p>
    <div class="popup-actions">
      <button class="btn primary" id="popupOk" type="button">OK</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getFirestore, collection, query, where, getDocs, getDoc,
  doc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={
  apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",
  authDomain:"fixzy-update.firebaseapp.com",
  projectId:"fixzy-update",
  storageBucket:"fixzy-update.firebasestorage.app",
  messagingSenderId:"995892519622",
  appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"
};

const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

let uid="";
let businessUid="";
let profile={};
let role="";
let employees=[];
let attendance=[];
let selectedEmployee=null;
let selectedStatus="";

const $=id=>document.getElementById(id);
const rupiah=n=>"Rp "+(Number(n)||0).toLocaleString("id-ID");
const today=()=>new Date().toISOString().slice(0,10);
const monthNow=()=>today().slice(0,7);

function esc(s){
  return String(s??"").replace(/[&<>"]/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"
  }[c]));
}

function showPopup(title,text){
  $("popupTitle").textContent=title;
  $("popupText").textContent=text;
  $("popup").classList.add("show");
}

function notice(text,type=""){
  $("statusMsg").className="notice "+type;
  $("statusMsg").textContent=text;
}

function resolveBusinessUid(data){
  const r=String(data.role||"").toLowerCase();
  if(r==="owner") return uid;
  return String(data.ownerUid||data.ownerId||uid);
}

function employeeName(x){
  return x.nama||x.namaKaryawan||x.displayName||x.email||x.id;
}

function employeeWa(x){
  return x.noWA||x.wa||x.noHp||x.whatsapp||"";
}

function employeeWage(x){
  return Number(x.upahHarian??x.upah??x.gajiHarian??0)||0;
}

function attendanceId(employeeId,date){
  return `${employeeId}_${date}`;
}

function resetEmployeeFields(){
  selectedEmployee=null;
  $("wa").value="";
  $("upah").value="";
  $("jabatan").textContent="-";
  $("role").textContent="-";
  $("statusKaryawan").textContent="-";
  selectedStatus="";
  $("hadirBtn").classList.remove("active");
  $("tidakBtn").classList.remove("active");
}

function selectEmployee(){
  const id=$("karyawan").value;
  selectedEmployee=employees.find(x=>x.id===id)||null;

  if(!selectedEmployee){
    resetEmployeeFields();
    return;
  }

  $("wa").value=employeeWa(selectedEmployee);
  $("upah").value=rupiah(employeeWage(selectedEmployee));
  $("jabatan").textContent=selectedEmployee.jabatan||selectedEmployee.posisi||"-";
  $("role").textContent=String(selectedEmployee.role||"-").toUpperCase();
  $("statusKaryawan").textContent=String(selectedEmployee.status||"-").toUpperCase();

  loadExistingForForm();
}

function setStatus(value){
  selectedStatus=value;
  $("hadirBtn").classList.toggle("active",value==="hadir");
  $("tidakBtn").classList.toggle("active",value==="tidak_hadir");
}

async function loadEmployees(){
  employees=[];
  const map=new Map();

  async function getEmployees(field){
    try{
      const q=query(
        collection(db,"users"),
        where(field,"==",businessUid)
      );
      const snap=await getDocs(q);

      snap.forEach(d=>{
        const x={id:d.id,...d.data()};
        const r=String(x.role||"").toLowerCase();
        const st=String(x.status||"").toLowerCase();

        if(["employee","karyawan"].includes(r) && (!st || st==="aktif")){
          map.set(d.id,x);
        }
      });
    }catch(e){
      console.warn("loadEmployees",field,e);
    }
  }

  await getEmployees("ownerUid");

  if(businessUid){
    await getEmployees("ownerId");
  }

  employees=[...map.values()].sort((a,b)=>
    employeeName(a).localeCompare(employeeName(b),"id")
  );

  $("karyawan").innerHTML=
    '<option value="">-- Pilih Karyawan --</option>'+
    employees.map(x=>
      `<option value="${esc(x.id)}">${esc(employeeName(x))}</option>`
    ).join("");

  $("totalKaryawan").textContent=employees.length;
}

async function loadAttendance(){
  attendance=[];
  const map=new Map();
  const month=$("bulan").value||monthNow();

  async function getAttendance(field){
    try{
      const q=query(
        collection(db,"absensi"),
        where(field,"==",businessUid)
      );
      const snap=await getDocs(q);
      snap.forEach(d=>{
        const x={id:d.id,...d.data()};
        if(String(x.tanggal||"").slice(0,7)===month){
          map.set(d.id,x);
        }
      });
    }catch(e){
      console.warn("loadAttendance",field,e);
    }
  }

  await getAttendance("ownerUid");
  await getAttendance("ownerId");

  attendance=[...map.values()];
  renderAttendance();
  updateSummary();
}

function employeeForAttendance(x){
  const id=x.userId||x.uid||"";
  return employees.find(e=>e.id===id)||null;
}

function renderAttendance(){
  const search=($("cari").value||"").trim().toLowerCase();

  const data=attendance.filter(x=>{
    const emp=employeeForAttendance(x);
    const name=x.nama||emp&&employeeName(emp)||"";
    const jabatan=x.jabatan||emp&&(
      emp.jabatan||emp.posisi||""
    )||"";

    return !search ||
      String(name).toLowerCase().includes(search) ||
      String(jabatan).toLowerCase().includes(search);
  }).sort((a,b)=>
    String(b.tanggal||"").localeCompare(String(a.tanggal||""))
  );

  if(!data.length){
    $("tbody").innerHTML=
      '<tr><td colspan="6" class="empty">Belum ada data absensi bulan ini.</td></tr>';
    return;
  }

  $("tbody").innerHTML=data.map(x=>{
    const emp=employeeForAttendance(x);
    const name=x.nama||emp&&employeeName(emp)||"-";
    const jabatan=x.jabatan||emp&&(emp.jabatan||emp.posisi)||"-";
    const wage=Number(x.upahHarian??emp&&employeeWage(emp)??0)||0;
    const st=String(x.status||"tidak_hadir");

    return `<tr>
      <td>${esc(x.tanggal||"-")}</td>
      <td><b>${esc(name)}</b></td>
      <td>${esc(jabatan)}</td>
      <td><span class="badge ${st==="hadir"?"hadir":"tidak"}">
        ${st==="hadir"?"HADIR":"TIDAK HADIR"}
      </span></td>
      <td><b>${st==="hadir"?rupiah(wage):"Rp 0"}</b></td>
      <td><button class="edit" data-edit="${esc(x.id)}">Edit</button></td>
    </tr>`;
  }).join("");
}

function updateSummary(){
  const hadir=attendance.filter(x=>String(x.status)==="hadir").length;
  const tidak=attendance.filter(x=>String(x.status)!=="hadir").length;

  const totalUpah=attendance.reduce((sum,x)=>{
    if(String(x.status)!=="hadir") return sum;
    return sum+Number(x.upahHarian||0);
  },0);

  $("totalHadir").textContent=hadir;
  $("totalTidak").textContent=tidak;
  $("totalUpah").textContent=rupiah(totalUpah);
}

async function loadExistingForForm(){
  if(!selectedEmployee) return;

  const date=$("tanggal").value||today();
  const id=attendanceId(selectedEmployee.id,date);

  try{
    const snap=await getDoc(doc(db,"absensi",id));

    if(snap.exists()){
      const x=snap.data()||{};
      setStatus(String(x.status||"tidak_hadir"));
    }else{
      setStatus("");
    }
  }catch(e){
    console.warn("cek absensi",e);
    setStatus("");
  }
}

async function saveAttendance(){
  if(!selectedEmployee){
    showPopup("Belum memilih karyawan","Silakan pilih nama karyawan/teknisi dari dropdown.");
    return;
  }

  if(!selectedStatus){
    showPopup("Status belum dipilih","Pilih HADIR atau TIDAK HADIR.");
    return;
  }

  const date=$("tanggal").value||today();
  const id=attendanceId(selectedEmployee.id,date);
  const wage=employeeWage(selectedEmployee);

  const data={
    ownerUid:businessUid,
    ownerId:businessUid,
    userId:selectedEmployee.id,
    uid:selectedEmployee.uid||selectedEmployee.id,
    nama:employeeName(selectedEmployee),
    namaKaryawan:selectedEmployee.namaKaryawan||selectedEmployee.nama||employeeName(selectedEmployee),
    email:selectedEmployee.email||"",
    role:selectedEmployee.role||"employee",
    jabatan:selectedEmployee.jabatan||selectedEmployee.posisi||"",
    noWA:employeeWa(selectedEmployee),
    upahHarian:wage,
    tanggal:date,
    status:selectedStatus,
    hadir:selectedStatus==="hadir",
    updatedAt:serverTimestamp(),
    updatedBy:uid
  };

  try{
    $("saveBtn").disabled=true;
    $("saveBtn").textContent="Menyimpan...";

    const old=await getDoc(doc(db,"absensi",id));

    if(!old.exists()){
      data.createdAt=serverTimestamp();
      data.createdBy=uid;
    }

    await setDoc(doc(db,"absensi",id),data,{merge:true});

    notice(
      `✓ Absensi ${employeeName(selectedEmployee)} tanggal ${date} berhasil disimpan.`,
      "ok"
    );

    await loadAttendance();
    await loadExistingForForm();

  }catch(e){
    console.error(e);
    notice("Gagal menyimpan: "+(e.message||e),"err");
    showPopup("Gagal menyimpan",e.message||"Terjadi kesalahan.");
  }finally{
    $("saveBtn").disabled=false;
    $("saveBtn").textContent="Simpan Absensi";
  }
}

function editAttendance(id){
  const x=attendance.find(a=>a.id===id);
  if(!x) return;

  const empId=x.userId||x.uid||"";
  $("tanggal").value=x.tanggal||today();
  $("karyawan").value=empId;
  selectEmployee();
  setStatus(String(x.status||"tidak_hadir"));
  window.scrollTo({top:0,behavior:"smooth"});
}

async function initializeUser(user){
  uid=user.uid;

  const me=await getDoc(doc(db,"users",uid));
  if(!me.exists()) throw new Error("Profil akun tidak ditemukan di users/{UID}.");

  profile=me.data()||{};
  role=String(profile.role||"").toLowerCase();

  if(!["owner","superadmin"].includes(role)){
    throw new Error("Halaman ini hanya dapat digunakan oleh OWNER dan SUPERADMIN.");
  }

  businessUid=resolveBusinessUid(profile);

  $("headerUser").textContent=
    `${profile.nama||profile.namaKonter||user.email||"-"} • ${role.toUpperCase()}`;

  await loadEmployees();
  await loadAttendance();

  notice(
    `✓ Akun ${role.toUpperCase()} aktif • data dibatasi ke ownerUid ${businessUid.slice(0,8)}.`,
    "ok"
  );
}

$("tanggal").value=today();
$("bulan").value=monthNow();

$("karyawan").addEventListener("change",selectEmployee);
$("tanggal").addEventListener("change",loadExistingForForm);
$("hadirBtn").addEventListener("click",()=>setStatus("hadir"));
$("tidakBtn").addEventListener("click",()=>setStatus("tidak_hadir"));
$("cari").addEventListener("input",renderAttendance);

$("bulan").addEventListener("change",async()=>{
  await loadAttendance();
  await loadExistingForForm();
});

$("refreshBtn").addEventListener("click",async()=>{
  try{
    notice("Memuat ulang data...");
    await loadEmployees();
    await loadAttendance();
    if(selectedEmployee) await loadExistingForForm();
    notice("✓ Data berhasil diperbarui.","ok");
  }catch(e){
    notice(e.message||"Gagal refresh","err");
  }
});

$("clearBtn").addEventListener("click",()=>{
  $("karyawan").value="";
  resetEmployeeFields();
  $("tanggal").value=today();
});

$("saveBtn").addEventListener("click",saveAttendance);

$("tbody").addEventListener("click",e=>{
  const btn=e.target.closest("[data-edit]");
  if(btn) editAttendance(btn.dataset.edit);
});

$("popupOk").addEventListener("click",()=>$("popup").classList.remove("show"));

async function bootAuth(){
  try{
    // Tunggu Firebase Auth selesai memulihkan sesi yang sudah login.
    // Ini lebih stabil untuk halaman yang dibuka dari index/iframe FIXZY.
    if(typeof auth.authStateReady==="function"){
      await auth.authStateReady();
    }

    let user=auth.currentUser;

    // Fallback: beri sedikit waktu jika sesi masih dipulihkan.
    if(!user){
      user=await new Promise(resolve=>{
        let done=false;
        const finish=u=>{
          if(done)return;
          done=true;
          clearTimeout(timer);
          resolve(u||null);
        };
        const timer=setTimeout(()=>finish(auth.currentUser),5000);
        const unsub=onAuthStateChanged(auth,u=>{
          unsub();
          finish(u);
        });
      });
    }

    if(!user){
      $("headerUser").textContent="Belum login";
      notice("Sesi Firebase belum ditemukan. Buka halaman utama FIXZY dan pastikan sudah login.","err");
      return;
    }

    await initializeUser(user);

  }catch(e){
    console.error("FIXZY AUTH:",e);
    $("headerUser").textContent="Gagal memuat akun";
    notice("Gagal memuat akun Firebase: "+(e.message||e),"err");
  }
}

bootAuth();
</script>
</body>
</html>
