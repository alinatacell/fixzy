<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY | Nota</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;font-family:Arial,sans-serif;color:#111827}
header{background:#111827;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:18px}.grow{flex:1}
button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}
.primary{background:#ffc107;color:#111}.light{background:#fff;color:#111827}.danger{background:#dc2626;color:#fff}
main{max-width:900px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px;margin-bottom:12px}
.title{font-size:15px;font-weight:900;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:11px;font-weight:800;color:#4b5563;margin-bottom:5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;background:#fff}
textarea{min-height:75px;resize:vertical}
.type{display:flex;gap:8px}.type button{flex:1;border:1px solid #d1d5db;background:#fff}.type button.active{background:#ffc107;border-color:#ffc107}
.checks{display:flex;flex-wrap:wrap;gap:8px}.check{border:1px solid #d1d5db;border-radius:9px;padding:8px 10px;font-size:12px}
.pattern{width:180px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:15px}
.dot{width:42px;height:42px;border-radius:50%;border:2px solid #9ca3af;background:#fff;margin:auto;display:grid;place-items:center;font-weight:800;cursor:pointer}
.dot.active{background:#ffc107;border-color:#111827}
.patternText{text-align:center;font-weight:800;font-size:12px}
.status{font-size:12px;background:#f9fafb;padding:10px;border-radius:9px;margin-bottom:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:9px;display:none;z-index:50}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.actions button{flex:1}.pattern{width:165px;gap:12px}}
@media print{header,.actions,.no-print{display:none!important}body{background:#fff}.card{border:0}}
</style>
</head>
<body>
<header><h1>🧾 Nota FIXZY</h1><div class="grow"></div><button class="light" onclick="location.reload()">↻ Refresh</button></header>

<main>
<div class="card">
 <div class="title">Jenis Nota</div>
 <div class="type">
  <button id="btnServis" class="active" onclick="setJenis('servis')">🔧 Servis</button>
  <button id="btnPenjualan" onclick="setJenis('penjualan')">🛒 Penjualan</button>
 </div>
</div>

<div class="card">
 <div class="title">Informasi Nota</div>
 <div class="status">Akun Firebase: <b id="akun">memeriksa...</b><br>UID: <span id="uidView">-</span></div>
 <div class="grid">
  <div><label>NOMOR NOTA</label><input id="nomor" readonly></div>
  <div><label>TANGGAL</label><input id="tanggal" type="date"></div>
  <div class="full"><label>TEKNISI / PETUGAS</label><select id="teknisi"><option>Memuat karyawan...</option></select></div>
  <div><label>NAMA PELANGGAN</label><input id="nama" placeholder="Nama pelanggan"></div>
  <div><label>NO. HP / WA</label><input id="wa" inputmode="tel" placeholder="08xxxxxxxxxx"></div>
 </div>
</div>

<div id="servisBox">
<div class="card">
 <div class="title">Data HP</div>
 <div class="grid">
  <div class="full"><label>MERK / TIPE / MODEL</label><input id="tipe" placeholder="Contoh: Samsung A05s"></div>
  <div><label>IMEI</label><input id="imei"></div>
  <div><label>STATUS</label><select id="status"><option value="masuk">Masuk</option><option value="proses">Proses</option><option value="selesai">Selesai</option><option value="diambil">Diambil</option><option value="batal">Batal</option></select></div>
  <div class="full"><label>KELUHAN</label><textarea id="keluhan"></textarea></div>
  <div class="full"><label>KELENGKAPAN</label>
   <div class="checks">
    <label class="check"><input type="checkbox" value="SIM Card" class="kel"> SIM Card</label>
    <label class="check"><input type="checkbox" value="Memory Card" class="kel"> Memory Card</label>
    <label class="check"><input type="checkbox" value="Case" class="kel"> Case</label>
    <label class="check"><input type="checkbox" value="Charger" class="kel"> Charger</label>
   </div>
  </div>
  <div class="full"><label>POLA SANDI — 9 DOT</label>
   <div id="pattern" class="pattern"></div>
   <div id="patternText" class="patternText">Belum ada</div>
  </div>
  <div><label>BIAYA SERVIS</label><input id="biaya" inputmode="numeric" value=""></div>
  <div><label>DP</label><input id="dp" inputmode="numeric" value=""></div>
 </div>
</div>
</div>

<div id="jualBox" style="display:none">
<div class="card">
 <div class="title">Produk Penjualan</div>
 <div class="grid">
  <div class="full"><label>PRODUK DARI FIREBASE</label><select id="produk"><option value="">Memuat stok...</option></select></div>
  <div class="full"><label>ATAU PRODUK MANUAL</label><input id="produkManual" placeholder="Isi nama produk jika tidak dari stok"></div>
  <div><label>QTY</label><input id="qty" inputmode="numeric" value="1"></div>
  <div><label>HARGA</label><input id="harga" inputmode="numeric" value=""></div>
  <div><label>TOTAL PENJUALAN</label><input id="totalJual" readonly value="Rp 0"></div>
 </div>
</div>
</div>

<div class="card">
 <div class="title">Pembayaran & Catatan</div>
 <div class="grid">
  <div><label>METODE</label><select id="metode"><option>Tunai</option><option>Transfer</option><option>QRIS</option><option>Piutang</option></select></div>
  <div><label>DIBAYAR</label><input id="dibayar" inputmode="numeric" value=""></div>
  <div class="full"><label>CATATAN</label><textarea id="catatan"></textarea></div>
 </div>
</div>

<div id="saveStatus" class="status no-print">Belum disimpan.</div>
<div class="card actions">
 <button class="danger" onclick="batal()">Batal</button>
 <button class="light" onclick="simpan(false)">Simpan</button>
 <button class="primary" onclick="simpan(true)">Simpan & Cetak</button>
</div>
</main>
<div id="toast" class="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,doc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const config={
 apiKey:"AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",
 authDomain:"fixzy-f056f.firebaseapp.com",projectId:"fixzy-f056f",
 storageBucket:"fixzy-f056f.firebasestorage.app",
 messagingSenderId:"838081521031",appId:"1:838081521031:web:50fdee909b56460b055f22"
};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
let uid=null,jenis="servis",employees=[],products=[],pattern=[];
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2600)}
function nomor(){return "FX-"+new Date().toISOString().replace(/\D/g,"").slice(0,14)}
function today(){$("tanggal").value=new Date().toISOString().slice(0,10)}
function setJenis(x){jenis=x;$("btnServis").classList.toggle("active",x==="servis");$("btnPenjualan").classList.toggle("active",x==="penjualan");$("servisBox").style.display=x==="servis"?"block":"none";$("jualBox").style.display=x==="penjualan"?"block":"none"}
function renderPattern(){
 $("pattern").innerHTML=Array.from({length:9},(_,i)=>`<div class="dot ${pattern.includes(i+1)?"active":""}" onclick="dot(${i+1})">${i+1}</div>`).join("");
 $("patternText").textContent=pattern.length?pattern.join("-"):"Belum ada";
}
window.dot=n=>{if(!pattern.includes(n))pattern.push(n);renderPattern()};
window.setJenis=setJenis;

async function loadEmployees(){
 const snap=await getDocs(query(collection(db,"karyawan"),where("uid","==",uid)));
 employees=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>String(x.status||"aktif").toLowerCase()==="aktif");
 $("teknisi").innerHTML='<option value="">-- Pilih Teknisi --</option>'+employees.map(x=>`<option value="${esc(x.id)}">${esc(x.nama||"-")}${x.jabatan?" • "+esc(x.jabatan):""}</option>`).join("");
 if(!employees.length)$("teknisi").innerHTML='<option value="">Tidak ada karyawan aktif</option>';
}
async function loadProducts(){
 const snap=await getDocs(query(collection(db,"stok"),where("uid","==",uid)));
 products=snap.docs.map(d=>({id:d.id,...d.data()}));
 $("produk").innerHTML='<option value="">-- Pilih Produk --</option>'+products.map(x=>`<option value="${esc(x.id)}">${esc(x.nama||"-")} • Stok ${Number(x.sisa??x.stok??0)}</option>`).join("");
}
$("produk").addEventListener("change",()=>{
 const p=products.find(x=>x.id===$("produk").value);
 if(p){
   $("harga").value=Number(p.hargaJual||0);
   $("produkManual").value="";
 }
 updateTotalJual();
});
$("qty").addEventListener("input",updateTotalJual);
$("harga").addEventListener("input",updateTotalJual);


function updateTotalJual(){
 const total=(num("qty")||0)*(num("harga")||0);
 $("totalJual").value="Rp "+total.toLocaleString("id-ID");
}
function num(id){return Number(String($(id).value||"").replace(/[^\d]/g,""))||0}

function collectNota(){
 const teknisiOpt=$("teknisi").selectedOptions[0];
 const d={
  uid,
  nomorNota:$("nomor").value,
  tanggal:$("tanggal").value,
  jenis,
  teknisi:$("teknisi").value,
  namaTeknisi:teknisiOpt?.textContent||"",
  teknisiId:$("teknisi").value,
  pelanggan:{
   nama:$("nama").value.trim(),
   wa:$("wa").value.trim()
  },
  metode:$("metode").value,
  dibayar:num("dibayar"),
  catatan:$("catatan").value.trim(),
  updatedAt:serverTimestamp()
 };

 if(jenis==="servis"){
  d.tipe=$("tipe").value.trim();
  d.imei=$("imei").value.trim();
  d.keluhan=$("keluhan").value.trim();
  d.kelengkapan=[...document.querySelectorAll(".kel:checked")].map(x=>x.value);
  d.pola=pattern.join("-");
  d.biaya=num("biaya");
  d.dp=num("dp");
  d.total=d.biaya;
  d.sisa=Math.max(0,d.total-d.dp);
 }else{
  const p=products.find(x=>x.id===$("produk").value);
  const manual=$("produkManual").value.trim();
  const qty=num("qty")||1;
  const harga=num("harga");

  if(!p && !manual) throw new Error("Pilih produk dari Firebase atau isi Produk Manual.");
  if(harga<=0) throw new Error("Harga produk harus diisi.");

  d.items=[{
   produkId:p?.id||null,
   nama:p?.nama||manual,
   qty,
   harga,
   sumber:p?"firebase":"manual"
  }];
  d.produk=p?.nama||manual;
  d.qty=qty;
  d.harga=harga;
  d.total=qty*harga;
  d.sisa=Math.max(0,d.total-d.dibayar);
 }
 return d;
}

async function simpan(cetak){
 if(!uid){toast("Belum login Firebase.");return}
 if(!$("teknisi").value){toast("Pilih teknisi terlebih dahulu.");return}

 let d;
 try{d=collectNota()}catch(e){toast(e.message);return}

 const col=jenis;
 const notaId=d.nomorNota;
 $("saveStatus").textContent="Menyimpan ke Firebase...";
 try{
  /*
   * Nomor nota dipakai sebagai ID dokumen.
   * Dengan setDoc, penyimpanan tidak membuat nota baru berulang
   * dan halaman tidak perlu di-reset setelah berhasil.
   */
  await setDoc(doc(db,col,notaId),{
   ...d,
   createdAt:serverTimestamp(),
   updatedAt:serverTimestamp()
  },{merge:true});

  $("saveStatus").textContent=`Tersimpan di Firebase • ${col}/${notaId}`;
  toast(cetak?"Tersimpan. Menyiapkan cetak...":"Berhasil tersimpan di Firebase.");

  // Setelah transaksi berhasil tersimpan, form selalu kembali kosong.
  if(cetak){
    window.print();
    setTimeout(()=>resetForm(),500);
  }else{
    setTimeout(()=>resetForm(),250);
  }
 }catch(e){
  console.error("Gagal menyimpan:",e);
  $("saveStatus").textContent="Gagal menyimpan ke Firebase.";
  alert("Gagal menyimpan ke Firebase:\n"+(e?.message||e));
 }
}

function resetForm(){
  // Nomor baru dan tanggal baru.
  $("nomor").value=nomor();
  today();

  // Data akun/teknisi tetap dari Firebase, hanya pilihan teknisi dikosongkan.
  $("teknisi").value="";

  $("nama").value="";
  $("wa").value="";
  $("tipe").value="";
  $("imei").value="";
  $("keluhan").value="";
  $("biaya").value="";
  $("dp").value="";
  $("dibayar").value="";
  $("catatan").value="";

  document.querySelectorAll(".kel").forEach(x=>x.checked=false);

  pattern=[];
  renderPattern();

  $("produk").value="";
  $("produkManual").value="";
  $("qty").value="1";
  $("harga").value="";
  $("totalJual").value="Rp 0";

  $("status").value="masuk";
  $("metode").value="Tunai";

  // Kembali ke mode Servis sebagai form awal.
  setJenis("servis");

  $("saveStatus").textContent="Form baru siap diisi.";
}
window.simpan=simpan;
window.batal=()=>{if(confirm("Batalkan nota?"))location.reload()};

onAuthStateChanged(auth,async user=>{
 if(!user){$("akun").textContent="BELUM LOGIN";$("teknisi").innerHTML='<option>Login terlebih dahulu</option>';return}
 uid=user.uid;$("akun").textContent=user.email||"Login";$("uidView").textContent=uid;
 $("nomor").value=nomor();today();
 try{await Promise.all([loadEmployees(),loadProducts()]);}
 catch(e){console.error(e);alert("Gagal membaca Firebase:\n"+e.message)}
});
renderPattern();
</script>
</body>
</html>
