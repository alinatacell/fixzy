<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#FFC107">
<meta name="fixzy-index-version" content="finishing-login-refresh-20260815"><title>FIXZY</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

body{overflow:hidden}

/* ================= HEADER ================= */
.header{
  height:62px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:20;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.menu-btn{
  width:44px;
  height:44px;
  margin-left:9px;
  border:0;
  border-radius:11px;
  background:#111827;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  cursor:pointer;
}

.menu-btn span{
  width:21px;
  height:2px;
  background:#fff;
  border-radius:4px;
}

/* Logo HEADER sengaja DIHAPUS */

.header-account{
  margin-left:auto;
  margin-right:13px;
  text-align:right;
  line-height:1.15;
}

.account-name{
  font-size:12px;
  font-weight:900;
  max-width:190px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.account-exp{
  font-size:9px;
  color:#6b7280;
  margin-top:3px;
}

/* ================= CONTENT ================= */
.content{
  position:fixed;
  top:62px;
  left:0;
  right:0;
  bottom:0;
  background:#f3f4f6;
  overflow:hidden;
}

.content iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#fff;
}

/* ================= HALAMAN SELAMAT DATANG ================= */
.welcome{
  width:100%;
  height:100%;
  overflow:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 18px;
  background:#f3f4f6;
}

.welcome-card{
  width:min(760px,100%);
  text-align:center;
  padding:25px 20px 32px;
}

.welcome-logo{
  display:block;
  width:min(430px,78vw);
  max-height:330px;
  object-fit:contain;
  margin:0 auto 18px;
}

.welcome-title{
  margin:0;
  font-size:clamp(25px,5vw,42px);
  font-weight:1000;
  letter-spacing:.5px;
  color:#111827;
}

.welcome-tagline{
  margin:7px 0 14px;
  font-size:clamp(17px,3vw,24px);
  font-weight:900;
  color:#f59e0b;
}

.welcome-desc{
  margin:0 auto;
  max-width:650px;
  font-size:clamp(13px,2.2vw,16px);
  line-height:1.65;
  color:#6b7280;
}

.welcome-hint{
  display:inline-block;
  margin-top:22px;
  padding:10px 16px;
  border-radius:12px;
  background:#fff;
  border:1px solid #e5e7eb;
  font-size:12px;
  font-weight:800;
  color:#374151;
}

/* ================= OVERLAY ================= */
.overlay{
  position:fixed;
  inset:0;
  z-index:40;
  background:rgba(0,0,0,.28);
  opacity:0;
  visibility:hidden;
  transition:.2s;
}

.overlay.show{
  opacity:1;
  visibility:visible;
}

/* ================= MENU ================= */
.menu{
  position:fixed;
  z-index:50;
  top:0;
  left:0;
  height:100dvh;
  width:min(310px,86vw);
  background:#fff;
  transform:translateX(-105%);
  transition:.25s ease;
  box-shadow:8px 0 30px rgba(0,0,0,.15);
  overflow:auto;
}

.menu.show{
  transform:translateX(0);
}

.menu-head{
  min-height:62px;
  padding:10px 13px;
  background:#111827;
  color:#fff;
  display:flex;
  align-items:center;
  gap:10px;
}

.menu-head img{
  width:78px;
  max-height:40px;
  object-fit:contain;
  background:#fff;
  border-radius:7px;
}

.menu-title{
  font-weight:900;
  font-size:15px;
}

.menu-sub{
  font-size:9px;
  color:#d1d5db;
  margin-top:3px;
}

.close{
  margin-left:auto;
  border:0;
  background:rgba(255,255,255,.12);
  color:#fff;
  width:34px;
  height:34px;
  border-radius:9px;
  font-size:20px;
  cursor:pointer;
}

.menu-list{
  padding:9px;
}

.menu-link{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  background:transparent;
  text-decoration:none;
  color:#111827;
  padding:12px 11px;
  border-radius:10px;
  font-size:13px;
  font-weight:800;
  text-align:left;
  cursor:pointer;
}

.menu-link:hover,
.menu-link.active{
  background:#f3f4f6;
}

.menu-link .ico{
  width:25px;
  text-align:center;
  font-size:16px;
}

.menu-divider{
  height:1px;
  background:#e5e7eb;
  margin:7px 5px;
}

/* ================= MOBILE ================= */
@media(max-width:480px){
  .header-account{
    margin-right:9px;
  }

  .account-name{
    font-size:11px;
    max-width:150px;
  }

  .welcome{
    padding:20px 12px;
  }

  .welcome-card{
    padding:18px 10px 28px;
  }

  .welcome-logo{
    width:min(330px,82vw);
    max-height:250px;
    margin-bottom:12px;
  }

  .welcome-tagline{
    margin-top:5px;
  }
}

/* LOGIN POPUP - struktur index asli dipertahankan */
.login-overlay{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.62);display:none;align-items:center;justify-content:center;padding:14px}
.login-overlay.show{display:flex}
.login-box{width:min(440px,100%);height:min(720px,92vh);background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.28);position:relative}
.login-box iframe{width:100%;height:100%;border:0;background:#fff}
.login-close{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:20px;display:none}
</style>
</head>

<body>
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <iframe id="loginFrame" title="Login FIXZY"></iframe>
  </div>
</div>


<!-- ================= HEADER ================= -->
<header class="header">
  <button class="menu-btn" onclick="bukaMenu()" aria-label="Menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Logo header DIHAPUS sesuai permintaan -->

  <div class="header-account">
    <div class="account-name" id="accountName">Akun</div>
    <div class="account-exp">
      Exp: <span id="accountExp">-</span>
    </div>
  </div>
</header>

<!-- ================= CONTENT ================= -->
<div class="content" id="contentArea"></div>

<!-- ================= OVERLAY ================= -->
<div class="overlay" id="overlay" onclick="tutupMenu()"></div>

<!-- ================= MENU ================= -->
<aside class="menu" id="menu">
  <div class="menu-head">
    <img src="logo.png?v=2" alt="FIXZY">
    <div>
      <div class="menu-title">Menu FIXZY</div>
      <div class="menu-sub">Pilih halaman</div>
    </div>
    <button class="close" onclick="tutupMenu()">×</button>
  </div>

  <nav class="menu-list">

    <button class="menu-link"
      data-page="dashboard-admin.html"
      onclick="bukaHalaman(this)">
      <span class="ico">📊</span>
      Dashboard Admin
    </button>

    <button class="menu-link"
      data-page="data-servis.html"
      onclick="bukaHalaman(this)">
      <span class="ico">🔧</span>
      Data Servis
    </button>

    <button class="menu-link"
      data-page="data-penjualan.html"
      onclick="bukaHalaman(this)">
      <span class="ico">🛒</span>
      Data Penjualan
    </button>

    <button class="menu-link"
      data-page="stock.html"
      onclick="bukaHalaman(this)">
      <span class="ico">📦</span>
      Stock
    </button>

    <button class="menu-link"
      data-page="data-karyawan.html"
      onclick="bukaHalaman(this)">
      <span class="ico">👥</span>
      Data Karyawan
    </button>

    <button class="menu-link"
      data-page="upah-kerja.html"
      onclick="bukaHalaman(this)">
      <span class="ico">💰</span>
      Upah Karyawan
    </button>

    <button class="menu-link"
      data-page="pengeluaran.html"
      onclick="bukaHalaman(this)">
      <span class="ico">💸</span>
      Pengeluaran
    </button>

    <button class="menu-link"
      data-page="ringkasan-pendapatan.html"
      onclick="bukaHalaman(this)">
      <span class="ico">📊</span>
      Ringkasan Pendapatan
    </button>

    <button class="menu-link"
      data-page="nota.html"
      onclick="bukaHalaman(this)">
      <span class="ico">🧾</span>
      Nota
    </button>

    <div class="menu-divider"></div>

    <button class="menu-link"
      data-page="aktivasi.html"
      onclick="bukaHalaman(this)">
      <span class="ico">🔐</span>
      Cek Aktivasi
    </button>

    <button class="menu-link"
      data-page="page.html"
      onclick="bukaHalaman(this)">
      <span class="ico">ℹ️</span>
      About
    </button>

    <div class="menu-divider"></div>

    <button class="menu-link"
      type="button"
      onclick="refreshIndex()">
      <span class="ico">🔄</span>
      Refresh Halaman
    </button>

  </nav>
</aside>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",
  authDomain: "fixzy-f056f.firebaseapp.com",
  projectId: "fixzy-f056f",
  storageBucket: "fixzy-f056f.firebasestorage.app",
  messagingSenderId: "838081521031",
  appId: "1:838081521031:web:50fdee909b56460b055f22"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentProfile = null;
let authReady = false;

function bukaMenu(){
  document.getElementById("menu").classList.add("show");
  document.getElementById("overlay").classList.add("show");
}

function tutupMenu(){
  document.getElementById("menu").classList.remove("show");
  document.getElementById("overlay").classList.remove("show");
}

/* ================= REFRESH INDEX =================
   Tetap menggunakan index lama: refresh hanya memuat ulang index,
   bukan menghapus sesi Firebase.
*/
function refreshIndex(){
  const url = new URL(window.location.href);
  url.searchParams.set("v", Date.now().toString());
  window.location.replace(url.toString());
}

/* ================= HALAMAN LOGIN =================
   Tampilan iframe tetap dipakai seperti versi FIXZY lama.
   Index hanya mengendalikan kapan iframe ditampilkan.
*/
function tampilkanLogin(){
  const overlay = document.getElementById("loginOverlay");
  const frame = document.getElementById("loginFrame");

  if(!frame.getAttribute("src")){
    frame.src = "login.html?v=2";
  }

  overlay.classList.add("show");
  document.querySelectorAll(".menu-link")
    .forEach(x => x.classList.remove("active"));
}

function tutupLogin(){
  document.getElementById("loginOverlay").classList.remove("show");
}

/* ================= HALAMAN SAMBUTAN ================= */
function tampilkanBeranda(){
  const area = document.getElementById("contentArea");

  area.innerHTML = `
    <section class="welcome">
      <div class="welcome-card">

        <img
          src="logo.png?v=2"
          class="welcome-logo"
          alt="FIXZY Pembukuan Servis HP"
        >

        <h1 class="welcome-title">FIXZY</h1>

        <div class="welcome-tagline">
          PEMBUKUAN SERVIS HP
        </div>

        <p class="welcome-desc">
          Sistem pembukuan khusus usaha servis HP untuk membantu
          mengelola data servis, pelanggan, penjualan, stok, nota,
          dan aktivitas usaha secara lebih rapi dalam satu aplikasi.
        </p>

        <div class="welcome-hint">
          Gunakan tombol menu ☰ untuk mulai menggunakan FIXZY
        </div>

      </div>
    </section>
  `;

  document.querySelectorAll(".menu-link")
    .forEach(x => x.classList.remove("active"));
}

/* ================= TANGGAL FIRESTORE ================= */
function dateObj(value){
  if(!value) return null;

  if(value && typeof value.toDate === "function"){
    const d = value.toDate();
    return Number.isNaN(d.getTime()) ? null : d;
  }

  if(value instanceof Date){
    return Number.isNaN(value.getTime()) ? null : value;
  }

  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? null : d;
}

/* ================= VALIDASI PROFIL RULES BARU =================
   users/{uid} hanya boleh dibaca oleh user sendiri.
   Profil registrasi baru harus owner + aktif + trial.
*/
async function bacaProfilFirebase(user){
  const snap = await getDoc(doc(db, "users", user.uid));

  if(!snap.exists()){
    throw new Error("Data akun tidak ditemukan di Firebase.");
  }

  const data = snap.data() || {};
  const role = String(data.role || "").toLowerCase();
  const status = String(data.status || "").toLowerCase();
  const paket = String(data.paket || "").toLowerCase();

  const allowedRoles = ["owner","employee","reseller","superadmin"];

  if(!allowedRoles.includes(role)){
    throw new Error("Role akun tidak dikenali.");
  }

  if(status === "blocked" || status === "rejected"){
    throw new Error("Akun diblokir atau ditolak. Hubungi Admin Fixzy.");
  }

  if(status !== "aktif" && status !== "active"){
    throw new Error("Akun belum aktif.");
  }

  /* Trial 3 bulan berlaku untuk akun owner trial.
     Role lain tidak dipaksa memiliki field trial.
  */
  if(role === "owner" && (paket === "trial" || data.trial === true)){
    const akhir = dateObj(data.tanggalBerakhir || data.trialSelesai);

    if(akhir && Date.now() > akhir.getTime()){
      throw new Error("Masa Trial 3 Bulan sudah berakhir.");
    }
  }

  currentUser = user;
  currentProfile = data;

  document.getElementById("accountName").textContent =
    data.namaKonter || data.namaPemilik || user.email || "Akun";

  const akhir = dateObj(data.tanggalBerakhir || data.trialSelesai);
  document.getElementById("accountExp").textContent =
    akhir
      ? akhir.toLocaleDateString("id-ID")
      : "-";

  return data;
}

/* ================= BUKA HALAMAN MENU ================= */
function bukaHalaman(btn){
  if(!currentUser || !currentProfile){
    tampilkanLogin();
    tutupMenu();
    return;
  }

  const page = btn.dataset.page;
  const area = document.getElementById("contentArea");

  area.innerHTML = "";

  const frame = document.createElement("iframe");
  frame.title = "Halaman FIXZY";
  frame.src = page + "?v=20260809-01";
  frame.style.cssText =
    "width:100%;height:100%;border:0;display:block;background:#fff;";

  area.appendChild(frame);

  document.querySelectorAll(".menu-link")
    .forEach(x => x.classList.remove("active"));

  btn.classList.add("active");
  tutupMenu();
}

/* ================= LOGIN MESSAGE =================
   Message lama tetap diterima untuk kompatibilitas.
   Sumber kebenaran tetap Firebase Auth + Firestore.
*/
window.addEventListener("message", function(e){
  const d = e.data || {};

  if(d.type === "FIXZY_LOGIN_SUCCESS"){
    /* Login sebenarnya diverifikasi oleh onAuthStateChanged.
       Jangan simpan UID/role ke localStorage/sessionStorage. */
    return;
  }

  if(d.type === "FIXZY_REGISTER_SUCCESS"){
    tampilkanLogin();
  }
});

/* ================= AUTH GATE =================
   Index tidak menampilkan aplikasi sebelum Firebase Auth
   dan profil users/{uid} berhasil diverifikasi.
*/
onAuthStateChanged(auth, async (user) => {
  if(!user){
    currentUser = null;
    currentProfile = null;
    authReady = true;
    tampilkanLogin();
    return;
  }

  try{
    await bacaProfilFirebase(user);
    authReady = true;
    tutupLogin();
    tampilkanBeranda();
  }catch(err){
    console.error("FIXZY auth gate:", err);
    currentUser = null;
    currentProfile = null;
    authReady = true;

    try{
      await signOut(auth);
    }catch(e){
      console.warn("Sign out gagal:", e);
    }

    tampilkanLogin();
  }
});

/* Logout dari halaman lain dapat memicu listener ini.
   Tidak ada sessionStorage/localStorage sebagai sumber login. */
window.addEventListener("beforeunload", () => {
  currentUser = null;
  currentProfile = null;
});
</script>

</body>
</html>
