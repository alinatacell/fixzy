<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#FFC107">
<title>FIXZY - INDEX FIX HEADER TIDAK KETUTUP IFRAME</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827}
body{overflow:hidden}

/* HEADER FIX - Z-INDEX TINGGI BIAR TIDAK KETUTUP IFRAME */
.header{
  height:62px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  position:fixed;
  top:0;left:0;right:0;
  z-index:9999; /* DULU 20, SEKARANG 9999 BIAR DI ATAS IFRAME */
  box-shadow:0 2px 12px rgba(0,0,0,.10);
}
.menu-btn{width:44px;height:44px;margin-left:9px;border:0;border-radius:11px;background:#111827;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;z-index:10000}
.menu-btn span{width:21px;height:2px;background:#FFC107;border-radius:4px}
.header-running{flex:1;min-width:0;height:42px;margin-left:12px;margin-right:8px;overflow:hidden;display:flex;align-items:center;position:relative;border-radius:10px;background:#fff}
.running-track{display:flex;align-items:center;width:max-content;white-space:nowrap;animation:fixzyRunning 28s linear infinite;font-size:12px;font-weight:800;color:#374151}
.running-track span{display:inline-flex;align-items:center;margin-right:42px}
@keyframes fixzyRunning{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.header-account{margin-left:auto;margin-right:13px;text-align:right;line-height:1.15;z-index:10000}
.account-name{
  font-size:12px;
  font-weight:900;
  max-width:190px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#FFC107;
  text-shadow:1px 1px 0 #111827, 2px 2px 2px rgba(0,0,0,.45);
}
.account-exp{font-size:9px;color:#6b7280;margin-top:3px}

/* CONTENT - DI BAWAH HEADER, TIDAK NUTUP HEADER */
.content{
  position:fixed;
  top:62px; /* PAS DI BAWAH HEADER */
  left:0;right:0;bottom:0;
  background:#f3f4f6;
  overflow:hidden;
  z-index:1; /* DI BAWAH HEADER */
}
.content iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#fff;
  position:relative;
  z-index:1;
}

.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.28);opacity:0;visibility:hidden;transition:.2s}
.overlay.show{opacity:1;visibility:visible}
.menu{position:fixed;z-index:10001;top:0;left:0;height:100dvh;width:min(330px,86vw);background:#fff;transform:translateX(-105%);transition:.25s ease;box-shadow:8px 0 30px rgba(0,0,0,.15);overflow:auto}
.menu.show{transform:translateX(0)}
.menu-head{min-height:62px;padding:10px 13px;background:#111827;color:#fff;display:flex;align-items:center;gap:10px}
.menu-head img{width:78px;max-height:40px;object-fit:contain;background:#000;border-radius:7px}
.menu-title{font-weight:900;font-size:15px}
.menu-sub{font-size:9px;color:#d1d5db;margin-top:3px}
.close{margin-left:auto;border:0;background:rgba(255,255,255,.12);color:#fff;width:34px;height:34px;border-radius:9px;font-size:20px;cursor:pointer}
.menu-list{padding:9px}
.menu-section{font-size:10px;font-weight:900;color:#94a3b8;margin:12px 0 4px 8px;letter-spacing:.5px}
.menu-link{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-decoration:none;color:#111827;padding:11px 11px;border-radius:10px;font-size:12.5px;font-weight:800;text-align:left;cursor:pointer}
.menu-link:hover,.menu-link.active{background:#f3f4f6}
.menu-link .ico{width:25px;text-align:center;font-size:15px}
.logout-link{color:#dc2626;font-weight:900}
</style>
</head>
<body>
<header class="header">
  <button class="menu-btn" onclick="bukaMenu()" aria-label="Menu"><span></span><span></span><span></span></button>
  <div class="header-running"><div class="running-track"><span>🌟 FIXZY - HEADER FIX TIDAK KETUTUP IFRAME</span><span>🔒 Header selalu di atas</span><span>📄 Page.html iframe di bawah header</span></div></div>
  <div class="header-account"><div class="account-name" id="accountName">Memuat...</div><div class="account-exp">Exp: <span id="accountExp">-</span></div></div>
</header>

<div class="content" id="contentArea"></div>
<div class="overlay" id="overlay" onclick="tutupMenu()"></div>

<aside class="menu" id="menu">
  <div class="menu-head"><img src="logo.png?v=2" alt="FIXZY"><div><div class="menu-title">Menu FIXZY</div><div class="menu-sub">Header tidak ketutup iframe</div></div><button class="close" onclick="tutupMenu()">×</button></div>
  <nav class="menu-list">
    <button class="menu-link" onclick="refreshIndex()"><span class="ico">🔄</span>Refresh</button>
    <div class="menu-section">INPUT</div>
    <button class="menu-link" data-page="servisan.html" data-roles="owner,employee,karyawan" onclick="bukaHalaman(this)"><span class="ico">🧾</span>Input Servisan</button>
    <button class="menu-link" data-page="penjualan.html" data-roles="owner,employee,karyawan" onclick="bukaHalaman(this)"><span class="ico">🛒</span>Input Penjualan</button>
    <button class="menu-link" data-page="pengeluaran.html" data-roles="owner,employee,karyawan" onclick="bukaHalaman(this)"><span class="ico">🛍</span>Pengeluaran</button>
    <div class="menu-section">DATA FIXED</div>
    <button class="menu-link" data-page="data-servis.html" onclick="bukaHalaman(this)"><span class="ico">💴</span>Data Servisan</button>
    <button class="menu-link" data-page="data-penjualan.html" onclick="bukaHalaman(this)"><span class="ico">💶</span>Data Penjualan</button>
    <button class="menu-link" data-page="stock.html" onclick="bukaHalaman(this)"><span class="ico">📦</span>Stock</button>
    <div class="menu-section">HALAMAN IFRAME</div>
    <button class="menu-link" data-page="page.html" data-roles="owner,employee,karyawan,superadmin,admin,reseller" onclick="bukaHalaman(this)"><span class="ico">📄</span>Page - Sambutan (iframe)</button>
    <button class="menu-link" data-page="about.html" onclick="bukaHalaman(this)"><span class="ico">ℹ️</span>About</button>
    <button class="menu-link" data-page="cek-paket.html" onclick="bukaHalaman(this)"><span class="ico">📦</span>Cek Paket</button>
    <button class="menu-link" data-page="izin-akses.html" data-roles="owner,superadmin" onclick="bukaHalaman(this)"><span class="ico">🔑</span>Izin Akses FIXED</button>
    <div class="menu-section">SUPERADMIN</div>
    <button class="menu-link" data-page="daftar-pengguna.html" data-roles="superadmin,admin" onclick="bukaHalaman(this)"><span class="ico">👥</span>Daftar Pengguna FIXED</button>
    <button class="menu-link" data-page="request-saldo.html" data-roles="superadmin,admin" onclick="bukaHalaman(this)"><span class="ico">💰</span>Request Saldo FIXED</button>
    <button class="menu-link logout-link" onclick="logoutFixzy()"><span class="ico">🚪</span>Logout</button>
  </nav>
</aside>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(cfg); const auth=getAuth(app); const db=getFirestore(app);
let authReady=false;
function formatExpFIXZY(v){if(!v) return "-"; try{let d=null; if(typeof v==="object" && typeof v.toDate==="function") d=v.toDate(); else if(typeof v==="object" && v.seconds!==undefined) d=new Date(Number(v.seconds)*1000); else d=new Date(String(v)); if(!d || isNaN(d.getTime())) return "-"; return d.toLocaleDateString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric"});}catch{return "-";}}
function bukaMenu(){document.getElementById("menu").classList.add("show");document.getElementById("overlay").classList.add("show");}
function tutupMenu(){document.getElementById("menu").classList.remove("show");document.getElementById("overlay").classList.remove("show");}
window.bukaMenu=bukaMenu; window.tutupMenu=tutupMenu;
function refreshIndex(){location.reload();} window.refreshIndex=refreshIndex;
function tampilkanBeranda(){
  const area=document.getElementById("contentArea");
  area.innerHTML=`<div style="height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:#f3f4f6">
    <div style="width:min(520px,100%);background:#fff;border:2px solid #111827;border-radius:16px;padding:22px;box-shadow:4px 4px 0 #111827">
      <div style="font-size:20px;font-weight:900">✅ HEADER FIX - TIDAK KETUTUP IFRAME</div>
      <p style="font-size:13px;color:#475569;line-height:1.6;margin-top:10px">
      Header z-index: 9999, iframe z-index: 1.<br>
      Sekarang page.html yang ada tombol 🔄 dan ✕ di kanan atas tidak akan nutupin header index.<br><br>
      Tombol page.html yang di dalam iframe sudah dipindah ke top: 74px (di bawah header index) biar tidak ketutup.
      </p>
      <div style="margin-top:12px"><button onclick="document.querySelector('[data-page=\\'page.html\\']').click()" style="border:0;background:#111827;color:#fff;padding:10px 14px;border-radius:9px;font-weight:900;cursor:pointer">📄 Buka Page.html (iframe)</button></div>
    </div>
  </div>`;
}
function bukaHalaman(btn){
  if(!authReady){location.replace("login.html");return;}
  const area=document.getElementById("contentArea");
  area.innerHTML="";
  const frame=document.createElement("iframe");
  frame.title="Halaman FIXZY";
  frame.src=btn.dataset.page;
  // PENTING: iframe tidak boleh punya z-index tinggi, biar header tetap di atas
  frame.style.cssText="width:100%;height:100%;border:0;display:block;background:#fff;position:relative;z-index:1";
  area.appendChild(frame);
  document.querySelectorAll(".menu-link").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  tutupMenu();
}
window.bukaHalaman=bukaHalaman;

// Listener pesan dari page.html untuk tutup iframe
window.addEventListener("message", e=>{
  if(!e.data) return;
  if(e.data.type==="FIXZY_CLOSE_PAGE" || e.data.type==="FIXZY_CLOSE_IZIN_AKSES"){
    tampilkanBeranda();
  }
});

function popupLogout(){
  const old=document.getElementById("fixzyLogoutPopup");
  if(old)old.remove();
  const wrap=document.createElement("div");
  wrap.id="fixzyLogoutPopup";
  wrap.style.cssText="position:fixed;inset:0;z-index:10002;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px";
  wrap.innerHTML=`<div style="width:min(420px,100%);background:#fff;border-radius:15px;padding:18px;box-shadow:0 15px 40px #0004">
    <h3 style="margin:0 0 8px">🚪 Keluar?</h3>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px">
      <button id="fixzyLogoutCancel" style="border:0;border-radius:8px;padding:10px 13px;background:#e5e7eb;font-weight:900;cursor:pointer">Batal</button>
      <button id="fixzyLogoutOk" style="border:0;border-radius:8px;padding:10px 13px;background:#dc2626;color:#fff;font-weight:900;cursor:pointer">Logout</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  document.getElementById("fixzyLogoutCancel").onclick=()=>wrap.remove();
  document.getElementById("fixzyLogoutOk").onclick=async()=>{try{await signOut(auth)}catch{} location.replace("login.html");};
}
window.logoutFixzy=popupLogout;

async function validasiDanTampilkan(user){
  if(!user){authReady=false; document.getElementById("accountName").textContent="Memuat..."; location.replace("login.html"); return;}
  try{
    const snap=await getDoc(doc(db,"users",user.uid));
    if(!snap.exists()){await signOut(auth); location.replace("login.html"); return;}
    const data=snap.data()||{};
    document.getElementById("accountName").textContent=data.namaKonter||data.nama||user.email||"Akun";
    document.getElementById("accountExp").textContent=formatExpFIXZY(data.tanggalBerakhir||data.exp||data.expAt);
    authReady=true;
    tampilkanBeranda();
  }catch(err){console.error(err); location.replace("login.html");}
}
onAuthStateChanged(auth,user=>{validasiDanTampilkan(user)});
</script>
</body>
</html>
