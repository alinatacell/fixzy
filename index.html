<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#FFC107">
<meta name="fixzy-version" content="index-firebase-session-v2">
<title>FIXZY</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827}
body{overflow:hidden}
.header{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;position:fixed;top:0;left:0;right:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.menu-btn{width:44px;height:44px;margin-left:9px;border:0;border-radius:11px;background:#111827;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;flex:none}
.menu-btn span{width:21px;height:2px;background:#fff;border-radius:4px}
.header-running{flex:1;min-width:0;height:42px;margin-left:12px;margin-right:8px;overflow:hidden;display:flex;align-items:center;position:relative;border-radius:10px;background:#fff}
.running-track{display:flex;align-items:center;width:max-content;white-space:nowrap;animation:fixzyRunning 28s linear infinite;font-size:12px;font-weight:800;color:#374151}
.running-track span{display:inline-flex;align-items:center;margin-right:42px}
@keyframes fixzyRunning{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.header-account{margin-left:auto;margin-right:13px;text-align:right;line-height:1.15;flex:none}
.account-name{font-size:12px;font-weight:900;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-exp{font-size:9px;color:#6b7280;margin-top:3px}
.content{position:fixed;top:62px;left:0;right:0;bottom:0;background:#f3f4f6;overflow:hidden}
.content iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.loading{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.loading-card{width:min(420px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
.loading-icon{font-size:42px}.loading-title{font-size:20px;font-weight:900;margin:10px 0 6px}
.loading-text{font-size:13px;color:#667085;line-height:1.6}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.28);opacity:0;visibility:hidden;transition:.2s}
.overlay.show{opacity:1;visibility:visible}
.menu{position:fixed;z-index:50;top:0;left:0;height:100dvh;width:min(330px,88vw);background:#fff;transform:translateX(-105%);transition:.25s ease;box-shadow:8px 0 30px rgba(0,0,0,.15);overflow:auto}
.menu.show{transform:translateX(0)}
.menu-head{min-height:62px;padding:10px 13px;background:#111827;color:#fff;display:flex;align-items:center;gap:10px}
.menu-head img{width:78px;height:40px;object-fit:contain;background:#000;border-radius:7px}
.menu-title{font-weight:900;font-size:15px}.menu-sub{font-size:9px;color:#d1d5db;margin-top:3px}
.close{margin-left:auto;border:0;background:rgba(255,255,255,.12);color:#fff;width:34px;height:34px;border-radius:9px;font-size:20px;cursor:pointer}
.menu-list{padding:9px}.menu-section{font-size:10px;font-weight:900;color:#9ca3af;padding:10px 11px 5px;text-transform:uppercase;letter-spacing:.5px}
.menu-link{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#111827;padding:12px 11px;border-radius:10px;font-size:13px;font-weight:800;text-align:left;cursor:pointer}
.menu-link:hover,.menu-link.active{background:#f3f4f6}.menu-link .ico{width:25px;text-align:center;font-size:16px}
.logout-link{color:#dc2626;font-weight:900}.menu-divider{height:1px;background:#e5e7eb;margin:7px 5px}
.denied{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:#f3f4f6}
.denied-card{width:min(460px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.08)}
.denied-card .ico{font-size:42px}.denied-card h2{margin:10px 0 7px;font-size:20px}.denied-card p{margin:0;color:#667085;font-size:13px;line-height:1.6}
.action{margin-top:15px;border:0;border-radius:10px;padding:11px 15px;background:#111827;color:#fff;font-weight:900;cursor:pointer}
@media(max-width:480px){.header-running{margin-left:8px;margin-right:5px;height:38px}.running-track{font-size:10px;animation-duration:24s}.header-account{margin-right:9px}.account-name{font-size:11px;max-width:150px}}
</style>
</head>
<body>
<header class="header">
  <button class="menu-btn" onclick="bukaMenu()" aria-label="Menu"><span></span><span></span><span></span></button>
  <div class="header-running"><div class="running-track">
    <span>🌟 Selamat Datang di FIXZY</span><span>🤲 Semoga usaha hari ini lancar</span>
    <span>💰 Semoga rezeki bertambah dan berkah</span><span>🙏 Semoga semua urusan dimudahkan</span>
  </div></div>
  <div class="header-account"><div class="account-name" id="accountName">Memuat...</div><div class="account-exp">Exp: <span id="accountExp">-</span></div></div>
</header>

<div class="content" id="contentArea">
  <div class="loading"><div class="loading-card">
    <div class="loading-icon">🔐</div><div class="loading-title">Memeriksa sesi FIXZY</div>
    <div class="loading-text">Index sedang membaca login dan profil dari Firebase.</div>
  </div></div>
</div>
<div class="overlay" id="overlay" onclick="tutupMenu()"></div>

<aside class="menu" id="menu">
  <div class="menu-head">
    <img src="logo.png?v=3" alt="FIXZY">
    <div><div class="menu-title">Menu FIXZY</div><div class="menu-sub">Pilih halaman</div></div>
    <button class="close" onclick="tutupMenu()">×</button>
  </div>
  <nav class="menu-list" id="menuList"></nav>
</aside>

<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=getApps().length?getApp():initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

/*
  DAFTAR MENU TERPUSAT.
  Kalau nanti membuat HTML baru, cukup tambah 1 object di sini.
  Hak akses employee/reseller tetap ditentukan oleh field izin di Firebase.
*/
const MENU=[
 {section:"Transaksi"},
 {page:"nota.html",icon:"🧾",label:"Input Servisan",permission:"servis",roles:["owner","employee","reseller"]},
 {page:"penjualan.html",icon:"🛒",label:"Input Penjualan",permission:"penjualan",roles:["owner","employee","reseller"]},

 {section:"Data"},
 {page:"data-servis.html",icon:"🔧",label:"Data Servis",permission:"dataServis",roles:["owner","employee","reseller"]},
 {page:"data-penjualan.html",icon:"🛒",label:"Data Penjualan",permission:"dataPenjualan",roles:["owner","employee","reseller"]},
 {page:"stock.html",icon:"📦",label:"Stock",permission:"stock",roles:["owner","employee","reseller"]},
 {page:"monitoring-garansi.html",icon:"🛡️",label:"Monitoring Garansi",permission:"garansi",roles:["owner","employee"]},

 {section:"Laporan"},
 {page:"ringkasan-pendapatan.html",icon:"📊",label:"Ringkasan Pendapatan",permission:"ringkasanPendapatan",roles:["owner","employee"]},
 {page:"laporan-keuangan.html",icon:"💰",label:"Laporan Keuangan",permission:"laporanKeuangan",roles:["owner","employee"]},
 {page:"rekap-teknisi.html",icon:"🧰",label:"Rekap Teknisi",permission:"rekapTeknisi",roles:["owner","employee"]},

 {section:"Administrasi"},
 {page:"upah-kerja.html",icon:"💵",label:"Upah Karyawan",permission:"ownerOnly",roles:["owner"]},
 {page:"pengeluaran.html",icon:"💸",label:"Pengeluaran",permission:"ownerOnly",roles:["owner"]},
 {page:"dashboard-admin.html",icon:"📊",label:"Dashboard Admin",permission:"ownerOnly",roles:["owner"]},
 {page:"data-karyawan.html",icon:"👤",label:"Data Karyawan",permission:"ownerOnly",roles:["owner"]},
 {page:"kelola-karyawan-reseller.html",icon:"👥",label:"Kelola Karyawan & Reseller",permission:"ownerOnly",roles:["owner"]},
 {page:"hak-akses.html",icon:"🔐",label:"Hak Akses",permission:"ownerOnly",roles:["owner"]},
 {page:"cek-aktivasi.html",icon:"🔐",label:"Cek Aktivasi",permission:"ownerOnly",roles:["owner"]},
 {page:"pengaturan.html",icon:"⚙️",label:"Pengaturan",permission:"ownerOnly",roles:["owner"]},

 {section:"Sistem"},
 {page:"page.html",icon:"ℹ️",label:"About",permission:null,roles:["owner","employee","reseller","superadmin"]}
];

let authReady=false,currentUser=null;

function formatExp(v){
 if(v===undefined||v===null||String(v).trim()==="")return "-";
 try{
  if(typeof v==="object"&&typeof v.toDate==="function")return v.toDate().toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
  if(typeof v==="object"&&v.seconds!==undefined)return new Date(Number(v.seconds)*1000).toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
  const d=new Date(String(v));if(!Number.isNaN(d.getTime()))return d.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
 }catch(e){}
 return String(v);
}

function izinAda(permission){
 const s=window.fixzySession||{};
 if(s.role==="owner"||s.role==="superadmin")return true;
 if(permission==="ownerOnly")return false;
 if(!permission)return true;
 const izin=Array.isArray(s.permissions)?s.permissions:[];
 const alias={
  servis:["servis","nota","inputServis"],
  penjualan:["penjualan","inputPenjualan"],
  dataServis:["dataServis","data-servis"],
  dataPenjualan:["dataPenjualan","data-penjualan"],
  stock:["stock","stok"],
  garansi:["garansi","monitoring-garansi"],
  ringkasanPendapatan:["ringkasanPendapatan","ringkasan-pendapatan","laporanPendapatan"],
  laporanKeuangan:["laporanKeuangan","laporan-keuangan","keuangan"],
  rekapTeknisi:["rekapTeknisi","rekap-teknisi"]
 };
 return(alias[permission]||[permission]).some(x=>izin.includes(x));
}

function boleh(item){
 const s=window.fixzySession||{};
 if(s.role==="owner"||s.role==="superadmin")return true;
 if(!item.roles.includes(s.role))return false;
 return izinAda(item.permission);
}

function renderMenu(){
 const list=document.getElementById("menuList");list.innerHTML="";
 MENU.forEach(item=>{
  if(item.section){const h=document.createElement("div");h.className="menu-section";h.textContent=item.section;list.appendChild(h);return;}
  if(!boleh(item))return;
  const b=document.createElement("button");b.className="menu-link";b.type="button";
  b.innerHTML=`<span class="ico">${item.icon}</span><span>${item.label}</span>`;
  b.onclick=()=>bukaHalaman(item,b);list.appendChild(b);
 });
 const div=document.createElement("div");div.className="menu-divider";list.appendChild(div);
 const refresh=document.createElement("button");refresh.className="menu-link";refresh.type="button";
 refresh.innerHTML='<span class="ico">🔄</span><span>Refresh Halaman</span>';refresh.onclick=refreshIndex;list.appendChild(refresh);
 const logout=document.createElement("button");logout.className="menu-link logout-link";logout.type="button";
 logout.innerHTML='<span class="ico">🚪</span><span>Logout</span>';logout.onclick=logoutFixzy;list.appendChild(logout);
}

function setStatus(title,text,icon="🔐"){
 document.getElementById("contentArea").innerHTML=`<div class="loading"><div class="loading-card">
 <div class="loading-icon">${icon}</div><div class="loading-title">${title}</div><div class="loading-text">${text}</div>
 </div></div>`;
}

function tampilkanBeranda(){
 document.getElementById("contentArea").innerHTML='<iframe src="page.html" title="FIXZY"></iframe>';
 document.querySelectorAll(".menu-link").forEach(x=>x.classList.remove("active"));
}

function tampilkanAksesDitolak(){
 document.getElementById("contentArea").innerHTML=`<div class="denied"><div class="denied-card">
 <div class="ico">🔒</div><h2>Akses Terbatas</h2>
 <p>Akun ini belum diberi izin untuk membuka halaman tersebut.</p>
 <button class="action" onclick="tampilkanBeranda()">Kembali ke Beranda</button>
 </div></div>`;
}

function bukaHalaman(item,btn){
 if(!authReady||!currentUser||!window.fixzySession){
  setStatus("Sesi Belum Siap","Index masih menyiapkan sesi Firebase. Tunggu sebentar lalu coba lagi.");
  return;
 }
 if(!boleh(item)){tampilkanAksesDitolak();tutupMenu();return;}
 const area=document.getElementById("contentArea");area.innerHTML="";
 const frame=document.createElement("iframe");frame.title=item.label;frame.src=item.page;
 frame.style.cssText="width:100%;height:100%;border:0;display:block;background:#fff";
 area.appendChild(frame);
 document.querySelectorAll(".menu-link").forEach(x=>x.classList.remove("active"));
 if(btn)btn.classList.add("active");tutupMenu();
}
window.bukaHalaman=bukaHalaman;

function bukaMenu(){document.getElementById("menu").classList.add("show");document.getElementById("overlay").classList.add("show")}
function tutupMenu(){document.getElementById("menu").classList.remove("show");document.getElementById("overlay").classList.remove("show")}
window.bukaMenu=bukaMenu;window.tutupMenu=tutupMenu;

function refreshIndex(){const u=new URL(location.href);u.searchParams.set("v",Date.now());location.replace(u.toString())}
window.refreshIndex=refreshIndex;

function logoutFixzy(){
 const old=document.getElementById("logoutPopup");if(old)old.remove();
 const wrap=document.createElement("div");wrap.id="logoutPopup";
 wrap.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px";
 wrap.innerHTML=`<div style="width:min(420px,100%);background:#fff;border-radius:16px;padding:20px;box-shadow:0 15px 40px #0004">
 <h3 style="margin:0 0 8px">🚪 Keluar dari FIXZY?</h3>
 <p style="font-size:13px;line-height:1.6;color:#667085">Sesi akun akan ditutup dan kembali ke login.</p>
 <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px">
 <button id="logoutCancel" style="border:0;border-radius:9px;padding:10px 14px;background:#e5e7eb;font-weight:900">Batal</button>
 <button id="logoutOk" style="border:0;border-radius:9px;padding:10px 14px;background:#dc2626;color:#fff;font-weight:900">Logout</button>
 </div></div>`;
 document.body.appendChild(wrap);
 document.getElementById("logoutCancel").onclick=()=>wrap.remove();
 document.getElementById("logoutOk").onclick=async()=>{try{await signOut(auth)}catch(e){console.error(e)}location.replace("login.html")};
}
window.logoutFixzy=logoutFixzy;

async function siapkanSession(user){
 if(!user){authReady=true;location.replace("login.html");return}
 setStatus("Memuat akun FIXZY","Sedang membaca profil dan hak akses dari Firebase...");
 try{
  const snap=await getDoc(doc(db,"users",user.uid));
  if(!snap.exists()){await signOut(auth).catch(()=>{});location.replace("login.html");return}
  const data=snap.data()||{};
  const role=String(data.role||"").toLowerCase();
  const status=String(data.status||"").toLowerCase();
  if(!["owner","employee","reseller","superadmin"].includes(role)){await signOut(auth).catch(()=>{});location.replace("login.html");return}
  if(status&& !["aktif","active"].includes(status)){await signOut(auth).catch(()=>{});location.replace("login.html");return}

  const exp=data.tanggalBerakhir;let expDate=null;
  try{if(exp&&typeof exp.toDate==="function")expDate=exp.toDate();else if(exp)expDate=new Date(exp)}catch(e){}
  if(expDate&&!Number.isNaN(expDate.getTime())&&new Date()>expDate){await signOut(auth).catch(()=>{});location.replace("login.html");return}

  const ownerUid=role==="owner"?user.uid:(data.ownerUid||"");
  window.fixzySession={
   uid:user.uid,role,ownerUid:ownerUid||user.uid,email:user.email||"",profile:data,
   permissions:Array.isArray(data.izin)?data.izin:(Array.isArray(data.permissions)?data.permissions:[])
  };
  currentUser=user;authReady=true;
  document.getElementById("accountName").textContent=data.namaKonter||data.namaPemilik||data.nama||user.email||"Akun";
  document.getElementById("accountExp").textContent=formatExp(exp);
  renderMenu();tampilkanBeranda();

  // Session tersedia di parent window; tidak memakai localStorage.
  window.dispatchEvent(new CustomEvent("fixzy-session-ready",{detail:window.fixzySession}));
 }catch(err){
  console.error("FIXZY Firebase/Auth:",err);
  setStatus("Firebase belum dapat dibaca","Koneksi atau Firebase sedang bermasalah. Sesi tidak dihapus dan Anda tidak dipaksa kembali ke login.","⚠️");
  authReady=false;
 }
}

onAuthStateChanged(auth,user=>{currentUser=user||null;siapkanSession(user)});
window.getFixzySession=()=>window.fixzySession||null;
</script>
</body>
</html>
