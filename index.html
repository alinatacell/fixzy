<!DOCTYPE html>
<html lang="id">
<head>

<title>FIXZY</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

body{overflow:hidden}

/* ================= HEADER ================= */
.header{
  height:62px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:20;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.menu-btn{
  width:44px;
  height:44px;
  margin-left:9px;
  border:0;
  border-radius:11px;
  background:#111827;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  cursor:pointer;
}

.menu-btn span{
  width:21px;
  height:2px;
  background:#fff;
  border-radius:4px;
}

/* RUNNING TEXT HEADER */
.header-running{
  flex:1;
  min-width:0;
  height:42px;
  margin-left:12px;
  margin-right:8px;
  overflow:hidden;
  display:flex;
  align-items:center;
  position:relative;
  border-radius:10px;
  background:#fff;
}

.running-track{
  display:flex;
  align-items:center;
  width:max-content;
  white-space:nowrap;
  animation:fixzyRunning 28s linear infinite;
  font-size:12px;
  font-weight:800;
  color:#374151;
}

.running-track span{
  display:inline-flex;
  align-items:center;
  margin-right:42px;
}

@keyframes fixzyRunning{
  from{transform:translateX(100%)}
  to{transform:translateX(-100%)}
}

.header-account{
  margin-left:auto;
  margin-right:13px;
  text-align:right;
  line-height:1.15;
}

.account-name{
  font-size:12px;
  font-weight:900;
  max-width:190px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.account-exp{
  font-size:9px;
  color:#6b7280;
  margin-top:3px;
}

/* ================= CONTENT ================= */
.content{
  position:fixed;
  top:62px;
  left:0;
  right:0;
  bottom:0;
  background:#f3f4f6;
  overflow:hidden;
}

.content iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#fff;
}

/* ================= HALAMAN SELAMAT DATANG ================= */
.welcome{
  width:100%;
  height:100%;
  overflow:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 18px;
  background:#f3f4f6;
}

.welcome-card{
  width:min(760px,100%);
  text-align:center;
  padding:25px 20px 32px;
}

.welcome-logo{
  display:block;
  width:min(430px,78vw);
  max-height:330px;
  object-fit:contain;
  margin:0 auto 18px;
}

.welcome-title{
  margin:0;
  font-size:clamp(25px,5vw,42px);
  font-weight:1000;
  letter-spacing:.5px;
  color:#111827;
}

.welcome-tagline{
  margin:7px 0 14px;
  font-size:clamp(17px,3vw,24px);
  font-weight:900;
  color:#f59e0b;
}

.welcome-desc{
  margin:0 auto;
  max-width:650px;
  font-size:clamp(13px,2.2vw,16px);
  line-height:1.65;
  color:#6b7280;
}

.welcome-hint{
  display:inline-block;
  margin-top:22px;
  padding:10px 16px;
  border-radius:12px;
  background:#fff;
  border:1px solid #e5e7eb;
  font-size:12px;
  font-weight:800;
  color:#374151;
}

/* ================= OVERLAY ================= */
.overlay{
  position:fixed;
  inset:0;
  z-index:40;
  background:rgba(0,0,0,.28);
  opacity:0;
  visibility:hidden;
  transition:.2s;
}

.overlay.show{
  opacity:1;
  visibility:visible;
}

/* ================= MENU ================= */
.menu{
  position:fixed;
  z-index:50;
  top:0;
  left:0;
  height:100dvh;
  width:min(310px,86vw);
  background:#fff;
  transform:translateX(-105%);
  transition:.25s ease;
  box-shadow:8px 0 30px rgba(0,0,0,.15);
  overflow:auto;
}

.menu.show{
  transform:translateX(0);
}

.menu-head{
  min-height:62px;
  padding:10px 13px;
  background:#111827;
  color:#fff;
  display:flex;
  align-items:center;
  gap:10px;
}

.menu-head img{
  width:78px;
  max-height:40px;
  object-fit:contain;
  background:#000;
  border-radius:7px;
}

.menu-title{
  font-weight:900;
  font-size:15px;
}

.menu-sub{
  font-size:9px;
  color:#d1d5db;
  margin-top:3px;
}

.close{
  margin-left:auto;
  border:0;
  background:rgba(255,255,255,.12);
  color:#fff;
  width:34px;
  height:34px;
  border-radius:9px;
  font-size:20px;
  cursor:pointer;
}

.menu-list{
  padding:9px;
}

.menu-link{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  background:transparent;
  text-decoration:none;
  color:#111827;
  padding:12px 11px;
  border-radius:10px;
  font-size:13px;
  font-weight:800;
  text-align:left;
  cursor:pointer;
}

.menu-link:hover,
.menu-link.active{
  background:#f3f4f6;
}

.menu-link .ico{
  width:25px;
  text-align:center;
  font-size:16px;
}

.logout-link{
  color:#dc2626;
  font-weight:900;
}

.logout-link:hover{
  background:#fef2f2;
}

.menu-divider{
  height:1px;
  background:#e5e7eb;
  margin:7px 5px;
}

/* ================= MOBILE ================= */
@media(max-width:480px){
  .header-running{
    margin-left:8px;
    margin-right:5px;
    height:38px;
  }

  .running-track{
    font-size:10px;
    animation-duration:24s;
  }

  .header-account{
    margin-right:9px;
  }

  .account-name{
    font-size:11px;
    max-width:150px;
  }

  .welcome{
    padding:20px 12px;
  }

  .welcome-card{
    padding:18px 10px 28px;
  }

  .welcome-logo{
    width:min(330px,82vw);
    max-height:250px;
    margin-bottom:12px;
  }

  .welcome-tagline{
    margin-top:5px;
  }
}

/* LOGIN POPUP - struktur index asli dipertahankan */
.login-overlay{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.62);display:none;align-items:center;justify-content:center;padding:14px}
.login-overlay.show{display:flex}
.login-box{width:min(440px,100%);height:min(720px,92vh);background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.28);position:relative}
.login-box iframe{width:100%;height:100%;border:0;background:#fff}
.login-close{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:20px;display:none}
</style>

<body>
<div class="login-overlay" id="loginOverlay">

</div>


<!-- ================= HEADER ================= -->
<header class="header">

    <span></span>
    <span></span>

<!-- ================= MENU ================= -->
<aside class="menu" id="menu">

  <nav class="menu-list">

<button class="menu-link"
      data-page="penjualan.html"
      onclick="bukaHalaman(this)">
      <span class="ico">🧾</span>
      Input nota penjualan
    </button>

    <button class="menu-link"
      data-page="data-servis.html"
      onclick="bukaHalaman(this)">

    </button>

    <button class="menu-link"
      data-page="data-penjualan.html"

    <button class="menu-link"

      onclick="bukaHalaman(this)">
      <span class="ico">👥</span>

    </button>

    <button class="menu-link"
      data-page="upah-kerja.html"
      onclick="bukaHalaman(this)">
      <span class="ico">💰</span>

      data-page="dashboard-admin.html"
      onclick="bukaHalaman(this)">
      <span class="ico">📊</span>
      Dashboard Admin
    </button>
    
    <div class="menu-divider"></div>

    <button class="menu-link"
      data-page="cek-aktivasi.html"
      onclick="bukaHalaman(this)">
      <span class="ico">🔐</span>
      Cek Aktivasi
    </button>

    <button class="menu-link"
      data-page="page.html"
      onclick="bukaHalaman(this)">
      <span class="ico">ℹ️</span>
      About
    </button>

    <div class="menu-divider"></div>

    <button class="menu-link logout-link"
      type="button"
      onclick="logoutFixzy()">
      <span class="ico">🚪</span>
      Logout
    </button>

  </nav>
</aside>

<script type="module">
/* =========================================================
   FIXZY INDEX
   - Firebase Authentication adalah sumber sesi login.
   - Tidak memakai localStorage/sessionStorage untuk login.
   - Saat belum login, login.html tampil sebagai popup.
   - Tidak ada pemeriksaan berdasarkan perangkat/laptop/HP.
   ========================================================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",
  authDomain:"fixzy-f056f.firebaseapp.com",
  projectId:"fixzy-f056f",
  storageBucket:"fixzy-f056f.firebasestorage.app",
  messagingSenderId:"838081521031",
  appId:"1:838081521031:web:50fdee909b56460b055f22"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser=null;
let currentProfile=null;
let authReady=false;
let pendingPage=null;

function sudahLogin(){
  return !!currentUser;
}

/* ================= POPUP LOGIN ================= */
function tampilkanLogin(){
  const overlay=document.getElementById("loginOverlay");
  const frame=document.getElementById("loginFrame");
  if(!overlay || !frame) return;

  frame.src="login.html";
  overlay.classList.add("show");
}

function tutupLogin(){
  const overlay=document.getElementById("loginOverlay");
  if(overlay) overlay.classList.remove("show");
}

function tampilkanBeranda(){
  const area=document.getElementById("contentArea");
  if(!area) return;

  area.innerHTML=`
    <iframe
      src="page.html"
      title="FIXZY"
      style="width:100%;height:calc(100vh - 86px);min-height:700px;border:0;display:block;background:#0b0b0c;"
    ></iframe>
  `;

  document.querySelectorAll(".menu-link")
    .forEach(x=>x.classList.remove("active"));
}

/* ================= POPUP APLIKASI ================= */
function tampilkanPopup(judul,pesan,aksi=null){
  const popup=document.getElementById("fixzyPopup");
  if(!popup) return;

  document.getElementById("fixzyPopupJudul").textContent=judul;
  document.getElementById("fixzyPopupPesan").textContent=pesan;

  const btnOk=document.getElementById("fixzyPopupOk");
  btnOk.onclick=()=>{
    popup.style.display="none";
    if(typeof aksi==="function") aksi();
  };

  popup.style.display="flex";
}

function tutupPopup(){
  const popup=document.getElementById("fixzyPopup");
  if(popup) popup.style.display="none";
}

window.tutupPopup=tutupPopup;

/* ================= LOGOUT ================= */
window.logoutFixzy = function(){
  tampilkanPopup(
    "FIXZY",
    "Yakin ingin logout dari FIXZY?",
    async ()=>{
      try{
        await signOut(auth);
        currentUser=null;
        currentProfile=null;
        document.getElementById("accountName").textContent="Akun";
        document.getElementById("accountExp").textContent="-";
        tutupMenu();
        tampilkanLogin();
      }catch(e){
        console.error("Logout Firebase:",e);
        tampilkanPopup("FIXZY","Logout gagal. Silakan coba lagi.");
      }
    }
  );
};

function bukaMenu(){
  document.getElementById("menu").classList.add("show");
  document.getElementById("overlay").classList.add("show");
}

function tutupMenu(){
  document.getElementById("menu").classList.remove("show");
  document.getElementById("overlay").classList.remove("show");
}

window.bukaMenu=bukaMenu;
window.tutupMenu=tutupMenu;

/* ================= REFRESH INDEX ================= */
function refreshIndex(){
  const url=new URL(window.location.href);
  url.searchParams.set("v",Date.now().toString());
  window.location.replace(url.toString());
}
window.refreshIndex=refreshIndex;

/* ================= BUKA HALAMAN MENU ================= */
function bukaHalaman(btn){
  if(!sudahLogin()){
    tampilkanLogin();
    tutupMenu();
    return;
  }

  const page=btn.dataset.page;
  const area=document.getElementById("contentArea");

  area.innerHTML="";

  const frame=document.createElement("iframe");
  frame.title="Halaman FIXZY";
  frame.src=page;
  frame.style.cssText=
    "width:100%;height:100%;border:0;display:block;background:#fff;";

  area.appendChild(frame);

  document.querySelectorAll(".menu-link")
    .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");
  tutupMenu();
}
window.bukaHalaman=bukaHalaman;

/* ================= FORMAT TANGGAL ================= */
function formatExpFIXZY(v){
  if(v===undefined || v===null || String(v).trim()==="") return "-";

  if(typeof v==="object" && typeof v.toDate==="function"){
    try{
      return v.toDate().toLocaleDateString("id-ID",{
        day:"2-digit",month:"long",year:"numeric"
      });
    }catch(e){}
  }

  if(typeof v==="object" && v.seconds!==undefined){
    try{
      const d=new Date(Number(v.seconds)*1000);
      if(!Number.isNaN(d.getTime())){
        return d.toLocaleDateString("id-ID",{
          day:"2-digit",month:"long",year:"numeric"
        });
      }
    }catch(e){}
  }

  const s=String(v).trim();
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s].*)?$/);

  if(m){
    const y=Number(m[1]), mo=Number(m[2]), day=Number(m[3]);
    if(y>=2000 && y<=2100 && mo>=1 && mo<=12 && day>=1 && day<=31){
      const d=new Date(y,mo-1,day);
      if(!Number.isNaN(d.getTime())){
        return d.toLocaleDateString("id-ID",{
          day:"2-digit",month:"long",year:"numeric"
        });
      }
    }
  }

  const d=new Date(s);
  if(!Number.isNaN(d.getTime())){
    return d.toLocaleDateString("id-ID",{
      day:"2-digit",month:"long",year:"numeric"
    });
  }

  return s;
}

/* ================= BACA PROFIL FIREBASE ================= */
function tampilkanProfil(data,user){
  const nama=
    data.namaKonter ||
    data.namaToko ||
    data.namaUsaha ||
    data.toko ||
    data.nama ||
    user.email ||
    "Akun";

  const rawExp=
    data.tanggalBerakhir ??
    data.tanggalExpired ??
    data.tanggalExp ??
    data.masaAktif ??
    data.expired ??
    data.expiry ??
    data.exp ??
    "-";

  document.getElementById("accountName").textContent=nama;
  document.getElementById("accountExp").textContent=formatExpFIXZY(rawExp);
}

/* ================= VALIDASI AKUN ================= */
async function prosesAuth(user){
  if(!user){
    currentUser=null;
    currentProfile=null;
    authReady=true;
    document.getElementById("accountName").textContent="Akun";
    document.getElementById("accountExp").textContent="-";
    tampilkanLogin();
    return;
  }

  try{
    const snap=await getDoc(doc(db,"users",user.uid));

    if(!snap.exists()){
      await signOut(auth);
      tampilkanPopup("FIXZY","Data akun tidak ditemukan di Firebase.");
      return;
    }

    const data=snap.data()||{};

    if(data.role!=="owner" && data.role!=="superadmin"){
      await signOut(auth);
      tampilkanPopup("FIXZY","Akun tidak memiliki akses ke FIXZY.");
      return;
    }

    if(data.status==="blocked" || data.status==="rejected"){
      await signOut(auth);
      tampilkanPopup("FIXZY","Akun diblokir / ditolak.\nHubungi Admin Fixzy.");
      return;
    }

    let expired=false;
    if(data.tanggalBerakhir){
      const d=new Date(data.tanggalBerakhir);
      expired=!Number.isNaN(d.getTime()) && new Date()>d;
    }

    if(expired){
      await signOut(auth);
      tampilkanPopup(
        "FIXZY",
        data.perpanjanganStatus==="pending"
          ? "Masa aktif habis.\nPerpanjangan sedang menunggu persetujuan Admin Fixzy."
          : "Masa Trial 3 Bulan Habis.\nSilakan ajukan perpanjangan."
      );
      return;
    }

    currentUser=user;
    currentProfile=data;
    authReady=true;

    tampilkanProfil(data,user);
    tutupLogin();

    if(pendingPage){
      const target=document.querySelector(`[data-page="${CSS.escape(pendingPage)}"]`);
      pendingPage=null;
      if(target) bukaHalaman(target);
    }else{
      tampilkanBeranda();
    }

  }catch(e){
    console.error("FIXZY validasi Firebase:",e);
    authReady=true;
    tampilkanPopup(
      "FIXZY",
      "Tidak dapat membaca data akun dari Firebase.\nPeriksa koneksi internet lalu coba lagi."
    );
  }
}

/* ================= PESAN DARI LOGIN ================= */
window.addEventListener("message",function(e){
  const d=e.data||{};

  if(d.type==="FIXZY_LOGIN_SUCCESS"){
    // Sumber sesi tetap Firebase. Pesan hanya memberi tahu index
    // agar menutup popup; profil dibaca ulang dari Firestore.
    tutupLogin();

    setTimeout(async()=>{
      if(auth.currentUser){
        await prosesAuth(auth.currentUser);
      }
    },100);
  }

  if(d.type==="FIXZY_REGISTER_SUCCESS"){
    // Registrasi selesai lalu kembali ke login di iframe.
    const frame=document.getElementById("loginFrame");
    if(frame) frame.src="login.html";
  }
});

/* ================= START ================= */
onAuthStateChanged(auth,async user=>{
  await prosesAuth(user);
});
</script>


<!-- POPUP APLIKASI FIXZY -->
<div id="fixzyPopup" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:18px;">
  <div style="width:min(380px,100%);background:#fff;border-radius:18px;padding:24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);">

    <button id="fixzyPopupOk" type="button" style="padding:11px 28px;border:0;border-radius:10px;background:#FFC107;color:#111827;font-weight:800;cursor:pointer;">OK</button>
  </div>
</div>
