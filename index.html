<script>
const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};

<body>
<div style="text-align:center">
<div class="loader" style="margin:0 auto 14px"></div>
<div style="font-weight:800;color:#6b7280">Memuat FIXZY...</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth, async (user)=>{
  if(!user){
    location.replace("login.html");
    return;
  }
  try{
    const snap=await getDoc(doc(db,"users",user.uid));
    if(!snap.exists()){
      location.replace("login.html");
      return;
    }
    const u=snap.data();
    // iprem / karyawan pakai page.html
    if(u.role==="karyawan" || u.role==="reseller" || u.role==="iprem"){
      location.replace("page.html");
    }else{
      // owner ke dashboard utama (index lama kamu sekarang jadi page.html atau dashboard)
      location.replace("page.html");
    }
  }catch(e){
    console.error(e);
    location.replace("login.html");
  }
});
// fallback kalau auth lama
setTimeout(()=>{
  if(!auth.currentUser) location.replace("login.html");
},3000);
</script>
