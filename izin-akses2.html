<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY - Kelola Izin Akses Karyawan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f7fb;font-family:Arial;color:#172033;padding:14px}
.header{background:#111827;color:#fff;padding:14px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
h2{font-size:16px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}
th{background:#f8fafc;position:sticky;top:0}
.btn{border:0;border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer}
.primary{background:#f59e0b;color:#111}
.dark{background:#111827;color:#fff}
.small{font-size:11px;color:#64748b}
.badge{padding:3px 8px;border-radius:99px;font-size:10px;font-weight:800}
.owner{background:#dcfce7;color:#15803d}
.employee{background:#dbeafe;color:#1d4ed8}
.admin{background:#fef3c7;color:#92400e}
.switch{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.switch label{display:flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid #e5e7eb;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer}
.switch input{accent-color:#f59e0b}
#log{background:#111827;color:#4ade80;padding:10px;border-radius:8px;font-size:11px;white-space:pre-wrap;max-height:200px;overflow:auto;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.7);display:none;align-items:center;justify-content:center;z-index:9999;padding:14px}
.modal.show{display:flex}
.box{background:#fff;border-radius:16px;padding:18px;width:min(500px,100%);max-height:90vh;overflow:auto}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:800;color:#64748b;margin-bottom:4px}
.field input,.field select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px}
</style>
</head>
<body>
<div class="header">
<div><b>🔐 Kelola Izin Akses</b><div class="small">Owner bisa atur izin karyawan & admin</div></div>
<div id="authInfo" class="small">Menunggu login...</div>
</div>

<div class="card">
<h2>📋 Daftar Akun (Koleksi users)</h2>
<div id="counts" class="small">Memuat...</div>
<div style="overflow:auto;margin-top:10px;max-height:70vh">
<table><thead><tr><th>Nama / Email</th><th>Role</th><th>Owner UID</th><th>Izin Akses</th><th>Aksi</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
<div id="log">Log:
</div>
</div>

<div id="editModal" class="modal">
<div class="box">
<h2 id="modalTitle">Edit Izin</h2>
<div class="field"><label>NAMA / EMAIL</label><input id="eNama" disabled></div>
<div class="field"><label>ROLE</label>
<select id="eRole">
<option value="owner">owner - Pemilik (akses semua)</option>
<option value="admin">admin - Admin Toko</option>
<option value="employee">employee / karyawan - Staff</option>
<option value="karyawan">karyawan - Staff (alias)</option>
<option value="reseller">reseller</option>
</select>
</div>
<div class="field"><label>OWNER UID (UID pemilik usaha - wajib untuk karyawan)</label><input id="eOwnerUid" placeholder="rtKBG1i1tOfPzNgQQHyg4B4R9892"></div>
<div class="field"><label>IZIN AKSES - Centang yang boleh diakses</label>
<div class="switch" id="izinChecks">
<label><input type="checkbox" value="stok"> 📦 Stok / Produk & Stok</label>
<label><input type="checkbox" value="penjualan"> 💰 Penjualan / Input Penjualan</label>
<label><input type="checkbox" value="servis"> 🔧 Servis / Input Servis</label>
<label><input type="checkbox" value="nota"> 🧾 Nota / Nota Servis</label>
<label><input type="checkbox" value="pelanggan"> 👥 Pelanggan</label>
<label><input type="checkbox" value="laporan"> 📊 Laporan</label>
<label><input type="checkbox" value="pengaturan"> ⚙️ Pengaturan</label>
<label><input type="checkbox" value="karyawan"> 👷 Kelola Karyawan</label>
</div>
<div class="small" style="margin-top:8px">Jika role owner/superadmin, otomatis dapat semua izin walau tidak dicentang.</div>
</div>
<div style="display:flex;gap:8px;margin-top:14px">
<button class="btn dark" onclick="closeModal()">Batal</button>
<button class="btn primary" onclick="saveIzin()">💾 Simpan Izin</button>
</div>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,getDoc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUid="", currentRole="", isOwner=false;
let usersList=[];
let editingId=null;

const $=id=>document.getElementById(id);
function log(t){ console.log(t); $("log").textContent+="\n"+t; }
function esc(s){ return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

async function loadUsers(){
  $("counts").textContent="Memuat users...";
  try{
    const snap=await getDocs(collection(db,"users"));
    usersList=[];
    snap.forEach(d=>{ usersList.push({id:d.id, ...d.data()}); });
    log(`Total users: ${snap.size}`);
    $("counts").textContent=`${snap.size} akun ditemukan`;
    render();
  }catch(e){
    log("Error load users: "+e.message);
    $("counts").textContent="Gagal: "+e.message;
  }
}

function render(){
  $("tbody").innerHTML=usersList.map(u=>{
    const role=String(u.role||"-").toLowerCase();
    const izin=Array.isArray(u.izin)?u.izin:(Array.isArray(u.permissions)?u.permissions:[]);
    const badge = role==="owner" ? "owner" : (role==="admin" ? "admin" : "employee");
    return `<tr>
      <td><b>${esc(u.nama||u.namaKaryawan||u.displayName||u.name||"-")}</b><br><span class="small">${esc(u.email||u.id||"")}</span></td>
      <td><span class="badge ${badge}">${esc(role)}</span></td>
      <td><span class="small" style="font-size:10px">${esc((u.ownerUid||u.ownerId||"").substring(0,12)||"-")}</span></td>
      <td><span class="small">${izin.length?izin.map(x=>`<span style="background:#f3f4f6;border:1px solid #e5e7eb;padding:2px 6px;border-radius:99px;margin:1px;display:inline-block">${esc(x)}</span>`).join("") : "<i style='color:#94a3b8'>tidak ada izin</i>"}</span></td>
      <td><button class="btn dark" onclick="editUser('${u.id}')">✏️ Edit Izin</button></td>
    </tr>`;
  }).join("");
}

window.editUser=(id)=>{
  const u=usersList.find(x=>x.id===id);
  if(!u) return;
  editingId=id;
  $("eNama").value=(u.nama||u.namaKaryawan||u.email||id);
  $("eRole").value=(u.role||"employee");
  $("eOwnerUid").value=u.ownerUid||u.ownerId||"";
  // Centang izin
  const izin=Array.isArray(u.izin)?u.izin:(Array.isArray(u.permissions)?u.permissions:[]);
  const lower=izin.map(x=>String(x).toLowerCase());
  document.querySelectorAll("#izinChecks input").forEach(inp=>{
    inp.checked = lower.includes(inp.value.toLowerCase());
  });
  $("editModal").classList.add("show");
};

window.closeModal=()=>{
  $("editModal").classList.remove("show");
  editingId=null;
};

window.saveIzin=async()=>{
  if(!editingId){ alert("ID tidak ada"); return; }
  if(!isOwner){
    alert("Hanya owner yang bisa ubah izin!");
    return;
  }
  const role=$("eRole").value.trim().toLowerCase();
  const ownerUid=$("eOwnerUid").value.trim();
  const checks=[...document.querySelectorAll("#izinChecks input:checked")].map(i=>i.value);
  
  if(role!=="owner" && role!=="superadmin" && !ownerUid){
    if(!confirm("ownerUid kosong! Karyawan tidak akan bisa lihat stok owner. Yakin simpan tanpa ownerUid?")) return;
  }
  
  try{
    const ref=doc(db,"users",editingId);
    await updateDoc(ref,{
      role: role,
      ownerUid: ownerUid || (role==="owner" ? editingId : ""),
      ownerId: ownerUid || (role==="owner" ? editingId : ""),
      izin: checks,
      permissions: checks,
      updatedAt: serverTimestamp(),
      updatedBy: currentUid
    });
    log(`✅ Berhasil update ${editingId} role=${role} izin=${checks.join(",")} ownerUid=${ownerUid}`);
    alert(`Izin berhasil disimpan untuk ${editingId}`);
    closeModal();
    loadUsers();
  }catch(e){
    log("❌ Gagal save: "+e.message);
    alert("Gagal: "+e.message);
  }
};

onAuthStateChanged(auth, async u=>{
  if(!u){ location.href="login.html"; return; }
  currentUid=u.uid;
  $("authInfo").textContent=`Login: ${u.email} (${u.uid.substring(0,8)})`;
  try{
    const snap=await getDoc(doc(db,"users",u.uid));
    if(!snap.exists()){
      log("Dokumen users tidak ada untuk login ini, anggap owner");
      isOwner=true;
      currentRole="owner";
    }else{
      const p=snap.data();
      currentRole=String(p.role||"").toLowerCase();
      isOwner=["owner","superadmin"].includes(currentRole);
      log(`Role login: ${currentRole} isOwner=${isOwner}`);
      if(!isOwner){
        $("counts").textContent="⚠️ Hanya owner/superadmin yang bisa kelola izin. Kamu login sebagai "+currentRole;
      }
    }
    loadUsers();
  }catch(e){
    log("Error auth: "+e.message);
  }
});

// Tutup modal kalau klik luar
$("editModal").addEventListener("click", e=>{
  if(e.target.id==="editModal") closeModal();
});
</script>
</body>
</html>
