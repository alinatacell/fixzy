<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY | Karyawan & Reseller</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#111827;font-family:Arial,Helvetica,sans-serif}
header{background:#111827;color:#fff;padding:10px 14px;position:sticky;top:0;z-index:50}.head{max-width:1180px;margin:auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:48px;height:48px;object-fit:contain;background:#000;border-radius:10px;padding:3px}.brand h1{font-size:18px;margin:0;white-space:nowrap}.brand small{display:block;color:#cbd5e1;font-size:11px;margin-top:3px}
.head-actions{margin-left:auto;display:flex;gap:7px}.head button{border:0;border-radius:8px;padding:9px 12px;font-weight:900;cursor:pointer}.refresh{background:#fff;color:#111827}.close{background:#374151;color:#fff}
main{max-width:1180px;margin:auto;padding:13px}.card{background:#fff;border-radius:13px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0001}.title{font-size:16px;font-weight:900;margin-bottom:12px}
.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}label{display:block;font-size:11px;font-weight:900;color:#4b5563;margin-bottom:5px}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font:inherit}.actions{display:flex;align-items:end;gap:7px}.action{border:0;border-radius:8px;padding:11px 13px;font-weight:900;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.sum{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px}.sum small{display:block;font-size:10px;color:#667085;font-weight:900}.sum b{display:block;font-size:20px;margin-top:4px}.green{background:#ecfdf5;border-color:#a7f3d0}.green b{color:#047857}.blue{background:#eff6ff;border-color:#bfdbfe}.blue b{color:#1d4ed8}
.table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:10px}.table-wrap .badge{white-space:nowrap}table{width:100%;border-collapse:collapse;min-width:850px;font-size:12px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}th{background:#f8fafc;font-size:11px}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.active{background:#dcfce7;color:#15803d;border:1px solid #86efac}.off{background:#f3f4f6;color:#6b7280;border:1px solid #d1d5db}.employee{background:#ede9fe;color:#7c3aed}.reseller{background:#dbeafe;color:#1d4ed8}
.empty{text-align:center;color:#667085;padding:25px}.info{font-size:12px;color:#667085;line-height:1.5;margin-top:8px}.ok{color:#15803d;font-weight:800}.err{color:#b91c1c;font-weight:800}
.popup{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:100}.popup.show{display:flex}.popup-box{width:min(600px,calc(100% - 24px));max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:17px}.popup-box h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{border:1px solid #e5e7eb;border-radius:8px;padding:8px;font-size:12px}.popup-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}
@media(max-width:760px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .field:first-child{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
@media(max-width:520px){.brand h1{font-size:15px}.logo{width:40px;height:40px}.brand small{font-size:9px}.head button{font-size:12px;padding:8px 9px}.toolbar{grid-template-columns:1fr}.toolbar .field:first-child{grid-column:auto}.summary{grid-template-columns:1fr 1fr}}

/* Owner only badge */
.owner-badge{display:inline-block;padding:3px 7px;background:#111827;color:#fff;border-radius:6px;font-size:10px;font-weight:900;margin-left:6px}
</style>
</head>
<body>
<header><div class="head">
<div class="brand"><img src="logo.png" class="logo" alt="FIXZY"><div><h1>Karyawan & Reseller</h1><small>FIXZY • Kelola Akun Usaha</small></div></div>
<div class="head-actions"><button class="refresh" onclick="location.reload()">↻ Refresh</button><button class="close" onclick="tutupHalaman()">✕ Tutup</button></div>
</div></header>
<main>
<section class="card">
<div class="title">Kelola Karyawan & Reseller</div>
<div class="toolbar">
<div class="field"><label>FILTER ROLE</label><select id="roleFilter"><option value="">Semua</option><option value="employee">Karyawan</option><option value="reseller">Reseller</option></select></div>
<div class="field"><label>PENCARIAN</label><input id="cari" placeholder="Cari nama atau email..."></div>
<div class="actions"><button class="action primary" onclick="bukaTambah()">＋ Tambah Akun</button><button class="action secondary" onclick="resetFilter()">Reset</button></div>
</div>
<div id="status" class="info">Memuat Firebase...</div>
</section>
<section class="summary">
<div class="sum"><small>TOTAL AKUN</small><b id="total">0</b></div>
<div class="sum green"><small>AKTIF</small><b id="aktif">0</b></div>
<div class="sum blue"><small>KARYAWAN</small><b id="jmlKaryawan">0</b></div>
<div class="sum"><small>RESELLER</small><b id="jmlReseller">0</b></div>
</section>
<section class="card"><div class="table-wrap"><table>
<thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Jabatan</th><th>Upah/Hari</th><th>Status</th><th>Hak Akses</th><th>Aksi</th></tr></thead>
<tbody id="tbody"><tr><td colspan="8" class="empty">Memuat data...</td></tr></tbody>
</table></div></section>
</main>

<div class="popup" id="popup"><div class="popup-box">
<h3 id="popupTitle">Tambah Akun</h3>
<div class="grid">
<div><label>NAMA</label><input id="fNama"></div>
<div><label>ROLE</label><select id="fRole"><option value="employee">Karyawan</option><option value="reseller">Reseller</option></select></div>
<div><label>EMAIL LOGIN</label><input id="fEmail" type="email"></div>
<div id="passWrap"><label>PASSWORD AWAL</label><input id="fPassword" type="password" placeholder="Minimal 6 karakter"></div>
<div><label>JABATAN / POSISI</label><input id="fJabatan" placeholder="Teknisi / Kasir / Reseller"></div>
<div><label>UPAH HARIAN</label><input id="fUpah" type="number" min="0" step="1000"></div>
<div class="full"><label>STATUS</label><select id="fStatus"><option value="aktif">Aktif</option><option value="nonaktif">Nonaktif</option></select></div>
<div class="full"><label>IZIN HTML / MENU (DITENTUKAN OWNER)</label><div class="checks">
<label class="check"><input type="checkbox" value="penjualan" class="izin"> Input Penjualan</label>
<label class="check"><input type="checkbox" value="servis" class="izin"> Input Servis</label>
<label class="check"><input type="checkbox" value="stock" class="izin"> Stock</label>
<label class="check"><input type="checkbox" value="dataPenjualan" class="izin"> Data Penjualan</label>
<label class="check"><input type="checkbox" value="dataServis" class="izin"> Data Servis</label>
<label class="check"><input type="checkbox" value="garansi" class="izin"> Cek Garansi</label>
</div></div>
</div>
<div id="editInfo" class="info"></div>
<div class="popup-actions"><button class="action secondary" onclick="tutupPopup()">Batal</button><button class="action primary" onclick="simpanAkun()">Simpan</button></div>
</div></div>

<div class="popup" id="notice"><div class="popup-box"><h3 id="noticeTitle">FIXZY</h3><div id="noticeText" class="info"></div><div class="popup-actions"><button class="action primary" onclick="tutupNotice()">OK</button></div></div></div>

<script>
function tutupHalaman(){if(window.history.length>1)history.back();else location.href="index.html"}
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,updateProfile}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,collection,query,where,getDocs,doc,getDoc,setDoc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import { deleteDoc as deleteDocFn } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",authDomain:"fixzy-f056f.firebaseapp.com",projectId:"fixzy-f056f",storageBucket:"fixzy-f056f.firebasestorage.app",messagingSenderId:"838081521031",appId:"1:838081521031:web:50fdee909b56460b055f22"};
// NOTE: Kalau pakai Firebase baru, ganti cfg di atas
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const rupiah=n=>"Rp "+(Number(n)||0).toLocaleString("id-ID"),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let uid="",ownerUid="",profile={},accounts=[],editId=null;

function norm(v){return String(v??"").trim().toLowerCase()}
function nama(a){return a.nama||a.namaKaryawan||a.namaPemilik||a.name||"-"}
function roleLabel(r){return r==="employee"?"Karyawan":r==="reseller"?"Reseller":r}
function izinLabel(v){
  return ({
    penjualan:"Input Penjualan",
    servis:"Input Servis",
    stock:"Stock",
    dataPenjualan:"Data Penjualan",
    dataServis:"Data Servis",
    garansi:"Cek Garansi"
  })[v]||v;
}
function renderIzin(a){
  const izin=Array.isArray(a.izin)?a.izin:(Array.isArray(a.permissions)?a.permissions:[]);
  if(!izin.length) return '<span style="color:#9ca3af">Tidak ada akses</span>';
  return izin.map(v=>`<span class="badge" style="background:#eef2ff;color:#3730a3;margin:2px">${esc(izinLabel(v))}</span>`).join(" ");
}

function izinValues(){return [...document.querySelectorAll(".izin:checked")].map(x=>x.value)}
function setIzin(v){const a=Array.isArray(v)?v:[];document.querySelectorAll(".izin").forEach(x=>x.checked=a.includes(x.value))}
function tampilNotice(t,x){$("noticeTitle").textContent=t;$("noticeText").innerHTML=x;$("notice").classList.add("show")}
window.tutupNotice=()=>$("notice").classList.remove("show");

async function load(){
 try{
  const s=await getDocs(query(collection(db,"users"),where("ownerUid","==",ownerUid)));
  accounts=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>["employee","reseller"].includes(x.role));
  render();$("status").innerHTML=`<span class="ok">✓ ${accounts.length} akun karyawan/reseller ditemukan.</span>`;
 }catch(e){$("status").innerHTML=`<span class="err">Gagal memuat akun: ${esc(e.message)}</span>`}
}
function render(){
 const role=$("roleFilter").value,q=norm($("cari").value);
 const arr=accounts.filter(a=>(!role||a.role===role)&&(!q||norm(nama(a)).includes(q)||norm(a.email).includes(q)));
 $("total").textContent=arr.length;$("aktif").textContent=arr.filter(a=>a.status==="aktif").length;$("jmlKaryawan").textContent=arr.filter(a=>a.role==="employee").length;$("jmlReseller").textContent=arr.filter(a=>a.role==="reseller").length;
 $("tbody").innerHTML=arr.length?arr.map(a=>`<tr>
<td><b>${esc(nama(a))}</b></td><td>${esc(a.email||"-")}</td><td><span class="badge ${a.role}">${roleLabel(a.role)}</span></td>
<td>${esc(a.jabatan||a.posisi||"-")}</td><td>${a.role==="employee"?rupiah(a.upahHarian??a.upah??a.gajiHarian??0):"-"}</td>
<td><span class="badge ${a.status==="aktif"?"active":"off"}">${esc(a.status||"-")}</span></td>
<td>${renderIzin(a)}</td>
<td><button class="action secondary" style="padding:7px 9px;font-size:11px" onclick="editAkun('${a.id}')">Edit</button></td>
</tr>`).join(""):'<tr><td colspan="8" class="empty">Belum ada akun karyawan/reseller.</td></tr>';
}
function aturHakAksesRole(){
  // Hak akses TIDAK ditentukan otomatis berdasarkan role.
  // Owner sendiri yang memilih HTML/menu yang boleh diakses.
  setIzin([]);
}

window.bukaTambah=()=>{
  editId=null;
  $("popupTitle").textContent="＋ Tambah Akun";
  $("fNama").value="";
  $("fRole").value="employee";$("fRole").disabled=false;
  $("fEmail").value="";
  $("fPassword").value="";
  $("fJabatan").value="";
  $("fUpah").value="";
  $("fStatus").value="aktif";
  aturHakAksesRole();
  $("passWrap").style.display="block";
  $("editInfo").textContent="Akun login dibuat di Firebase Authentication dan terhubung ke Owner ini. Hak akses HTML/menu dipilih sendiri oleh Owner.";
  $("popup").classList.add("show");
}
window.tutupPopup=()=>{$("popup").classList.remove("show");$("fRole").disabled=false;};
window.editAkun=id=>{
 const a=accounts.find(x=>x.id===id);if(!a)return;editId=id;$("popupTitle").textContent="✏️ Edit Akun";$("fNama").value=nama(a);$("fRole").value=a.role;$("fEmail").value=a.email||"";$("fPassword").value="";$("fJabatan").value=a.jabatan||a.posisi||"";$("fUpah").value=a.upahHarian??a.upah??a.gajiHarian??0;$("fStatus").value=a.status||"aktif";setIzin(a.izin||a.permissions||[]);$("fRole").disabled=true;$("passWrap").style.display="none";$("editInfo").textContent="Role dan email/password tidak diubah saat edit. Owner dapat mengubah data dan hak akses HTML.";$("popup").classList.add("show")
}
window.simpanAkun=async()=>{
 const n=$("fNama").value.trim(),r=editId?(accounts.find(x=>x.id===editId)?.role||""):$("fRole").value,email=$("fEmail").value.trim(),pass=$("fPassword").value,j=$("fJabatan").value.trim(),upah=Number($("fUpah").value)||0,status=$("fStatus").value,izin=izinValues();
 if(!n||!email){tampilNotice("⚠️ Data Belum Lengkap","Nama dan email wajib diisi.");return}
 if(!["employee","reseller"].includes(r)){tampilNotice("⚠️ Role","Role akun tidak valid.");return}
 try{
  if(editId){
   // UPDATE: hanya owner bisa update karyawan miliknya - sesuai rules baru
   await updateDoc(doc(db,"users",editId),{nama:n,namaKaryawan:n,namaPemilik:n,role:r,jabatan:j,posisi:j,upahHarian:upah,upah:upah,status,izin,permissions:izin,ownerUid,updatedAt:serverTimestamp()});
   $("popup").classList.remove("show");tampilNotice("✅ Berhasil","Data akun berhasil diperbarui.<br><br><b>Note:</b> Karyawan ini TIDAK BISA hapus/batal data, hanya owner.");
   await load();return;
  }
  if(pass.length<6){tampilNotice("⚠️ Password","Password awal minimal 6 karakter.");return}
  // Secondary app - biar owner tidak ke-logout
  const { getApps, getApp } = await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js");
  const appName = "createUser-"+Date.now();
  const secondary = initializeApp(cfg, appName);
  const secondaryAuth=getAuth(secondary);
  const cred=await createUserWithEmailAndPassword(secondaryAuth,email,pass);
  try{await updateProfile(cred.user,{displayName:n})}catch{}
  // Dokumen user karyawan - sesuai rules: request.auth.uid == uid (secondary auth)
  await setDoc(doc(db,"users",cred.user.uid),{
   uid:cred.user.uid,
   ownerUid: ownerUid,
   role:r,
   status: status,
   nama:n,
   namaKaryawan:n,
   namaPemilik:n,
   email:email,
   jabatan:j,
   posisi:j,
   upahHarian:upah,
   upah:upah,
   izin:izin,
   permissions:izin,
   // data tambahan agar kompatibel dengan index.html
   tanggalBerakhir: profile.tanggalBerakhir || null,
   tanggalDaftar:new Date().toISOString(),
   createdAt:serverTimestamp(),
   updatedAt:serverTimestamp()
  });
  try{ await secondaryAuth.signOut(); }catch{}
  try{ const { deleteApp } = await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js"); await deleteApp(secondary); }catch{}
  $("popup").classList.remove("show");
  tampilNotice("✅ Akun Berhasil Dibuat",`Akun <b>${esc(n)}</b> sudah dibuat sebagai <b>${roleLabel(r)}</b> dan terhubung ke Owner ini.<br><br>✅ Karyawan ini <b>TIDAK BISA</b> hapus/batal (sudah diblokir di Rules).`);
  await load();
 }catch(e){
   console.error(e);
   if(e.code === 'permission-denied'){
     tampilNotice("🔒 Ditolak Rules",`Gagal simpan karena Rules baru.<br><br>Pastikan kamu login sebagai <b>owner</b> dan file Rules sudah di-publish yang versi <b>jangan izinkan batal & hapus</b>.<br><br>Error: ${esc(e.message)}`);
   }else{
     tampilNotice("❌ Gagal",esc(e.message||e))
   }
 }
}
$("roleFilter").addEventListener("change",render);
$("cari").addEventListener("input",render);

// Role hanya menentukan jenis akun.
 // Hak akses selalu ditentukan manual oleh Owner.
 $("fRole").addEventListener("change",()=>{
   if(!editId) setIzin([]);
 });

window.resetFilter=()=>{
  $("roleFilter").value="";
  $("cari").value="";
  render();
};

onAuthStateChanged(auth,async u=>{
 if(!u){location.replace("login.html");return}uid=u.uid;
 try{
  const s=await getDoc(doc(db,"users",uid));if(!s.exists())throw new Error("Profil akun tidak ditemukan.");
  profile=s.data()||{};
  if(profile.role!=="owner")throw new Error("Halaman ini khusus Owner.");
  ownerUid=uid;await load();
 }catch(e){$("status").innerHTML=`<span class="err">${esc(e.message)}</span>`}
});

window.hapusAkun = async (id) => {
  const a = accounts.find(x=>x.id===id);
  if(!a) return;
  if(!confirm(`Hapus akun ${nama(a)}? Hanya Owner yang bisa hapus.`)) return;
  try{
    // Di rules baru: allow delete: if isOwner()
    const { deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js");
    // import dynamic already loaded, but use existing
    await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js").then(async m=>{
      // use doc from closure
    });
    const { doc: doc2, deleteDoc: del } = await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js");
    // Actually use global doc
    await (await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js")).deleteDoc(doc(db,"users",id));
    tampilNotice("✅ Dihapus","Akun berhasil dihapus.");
    await load();
  }catch(e){
    if(e.code==='permission-denied'){
      tampilNotice("🔒 Hanya Owner","Hanya Owner yang bisa menghapus akun karyawan. Karyawan tidak bisa hapus/batal data apapun.");
    }else{
      tampilNotice("❌ Gagal", e.message);
    }
  }
}

</script>
</body>
</html>
