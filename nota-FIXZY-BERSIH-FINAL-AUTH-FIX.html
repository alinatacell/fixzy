<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFC107">
<title>FIXZY | Nota</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e7eb;box-shadow:0 2px 12px #0001}
.topin{max-width:1050px;margin:auto;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-weight:900;font-size:18px}.brand span{color:#f59e0b}
.topbtn{border:0;border-radius:10px;padding:9px 11px;background:#e5e7eb;font-weight:800}
.wrap{max-width:1050px;margin:auto;padding:12px 10px 80px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:15px;margin-bottom:10px;overflow:hidden;box-shadow:0 5px 18px #17203308}
.head{padding:13px 15px;border-bottom:1px solid #e2e8f0;font-weight:900}.body{padding:13px 15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px}label{font-size:11px;font-weight:900;color:#475569}
input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:9px 10px;outline:0}
input,select{height:42px}textarea{min-height:78px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#f59e0b;box-shadow:0 0 0 3px #f59e0b18}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}.mode button{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:10px;font-weight:900}.mode button.active{background:#ffc107;border-color:#ffc107}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900}.yellow{background:#ffc107}.dark{background:#111827;color:#fff}.light{background:#e5e7eb}.red{background:#fee2e2;color:#b91c1c}
.status{font-size:11px;color:#64748b}.error{color:#b91c1c}
.kelengkapan{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.check{border:1px solid #e2e8f0;border-radius:9px;padding:9px;background:#f8fafc;font-size:10px;font-weight:800}.check input{width:auto;height:auto;margin-right:4px}
.pattern{border:1px solid #cbd5e1;border-radius:12px;background:#f8fafc;padding:9px;width:max-content;max-width:100%}.dots{display:grid;grid-template-columns:repeat(3,44px);gap:9px}.dot{width:44px;height:44px;border-radius:50%;border:2px solid #cbd5e1;background:#fff;color:#64748b;font-weight:900;padding:0;touch-action:manipulation}.dot.active{background:#111827;color:#ffc107;border-color:#ffc107;box-shadow:0 0 0 4px #ffc10722}.patternfoot{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:8px;font-size:9px;color:#64748b}.smallbtn{border:0;border-radius:7px;padding:6px 8px;background:#e2e8f0;font-size:9px;font-weight:800}
.product-row{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:7px;align-items:end;margin-bottom:8px}
.items{border:1px solid #e2e8f0;border-radius:11px;overflow:auto;margin-top:10px}.item{min-width:600px;display:grid;grid-template-columns:1fr 60px 110px 110px 45px;gap:7px;padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:10px;align-items:center}.item:last-child{border-bottom:0}.item b{font-size:11px}
.total{margin-top:12px;border-top:1px dashed #cbd5e1;padding-top:10px}.sum{display:flex;justify-content:space-between;padding:4px 0;font-size:11px}.grand{font-size:14px;font-weight:900}.sisa{font-weight:900;color:#b45309}
.notice{padding:9px 11px;border-radius:10px;background:#fffbeb;color:#92400e;font-size:10px;margin-bottom:10px}
.modal{display:none;position:fixed;inset:0;background:#0f172a99;z-index:100;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{width:min(500px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:16px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.close{border:0;background:#e5e7eb;border-radius:8px;width:34px;height:34px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 13px;border-radius:10px;font-size:11px;font-weight:800;z-index:200;display:none}.toast.show{display:block}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.kelengkapan{grid-template-columns:1fr 1fr}.product-row{grid-template-columns:1fr 80px}.product-row .addprod{grid-column:1/-1}.topin{padding:8px}.brand{font-size:15px}}
</style>
</head>
<body>
<header class="top">
 <div class="topin">
  <div class="brand">FIXZY <span>NOTA</span></div>
  <div style="display:flex;gap:6px">
   <button class="topbtn" id="refreshBtn" type="button">↻ Refresh</button>
   <button class="topbtn" id="closeBtn" type="button">✕ Tutup</button>
  </div>
 </div>
</header>

<main class="wrap">
<section class="card"><div class="body">
 <div id="firebaseStatus" class="status">Menghubungkan ke Firebase Auth...</div>
 <div id="firebaseError" class="status error" style="display:none;margin-top:6px"></div>
 <div id="akunNota" style="display:none;margin-top:7px;padding:9px 11px;border-radius:10px;background:#fff8db;border:1px solid #fde68a;font-size:11px">
  👤 Akun: <b id="namaAkun">-</b>
 </div>
</div></section>

<section class="card">
 <div class="head">Identitas Nota</div>
 <div class="body">
  <div class="grid">
   <div class="field"><label>Jenis Nota</label><select id="jenis"><option value="servis">Nota Servis</option><option value="penjualan">Nota Penjualan</option></select></div>
   <div class="field"><label>Nomor Nota</label><input id="nomorNota" readonly></div>
   <div class="field"><label>Tanggal</label><input id="tanggal" type="date"></div>
   <div class="field"><label>Teknisi / Petugas</label><select id="teknisi"><option value="">Memuat data karyawan...</option></select></div>
   <div class="field"><label>Nama Pelanggan</label><input id="pelanggan" placeholder="Nama pelanggan"></div>
   <div class="field"><label>No. WhatsApp</label><input id="wa" inputmode="tel"></div>
   <div class="field full"><label>Alamat</label><textarea id="alamat"></textarea></div>
  </div>
 </div>
</section>

<section class="card" id="servisCard">
 <div class="head">Data HP</div><div class="body">
  <div class="grid">
   <div class="field full"><label>Merk / Tipe / Model HP</label><input id="merkTipe" placeholder="Contoh: Samsung Galaxy A15"></div>
   <div class="field"><label>IMEI</label><input id="imei" inputmode="numeric"></div>
   <div class="field full"><label>Keluhan</label><textarea id="keluhan"></textarea></div>
   <div class="field full"><label>Kelengkapan</label><div class="kelengkapan" id="kelengkapan"></div></div>
   <div class="field"><label>Sandi / PIN</label><input id="sandi" autocomplete="off"></div>
   <div class="field"><label>Pola Sandi HP</label>
    <div class="pattern">
     <div class="dots">
      <button class="dot" type="button" data-dot="1">1</button><button class="dot" type="button" data-dot="2">2</button><button class="dot" type="button" data-dot="3">3</button>
      <button class="dot" type="button" data-dot="4">4</button><button class="dot" type="button" data-dot="5">5</button><button class="dot" type="button" data-dot="6">6</button>
      <button class="dot" type="button" data-dot="7">7</button><button class="dot" type="button" data-dot="8">8</button><button class="dot" type="button" data-dot="9">9</button>
     </div>
     <div class="patternfoot"><span id="polaText">Belum ada pola</span><button class="smallbtn" id="clearPattern" type="button">Hapus</button></div>
    </div>
    <input id="pola" type="hidden">
   </div>
  </div>
 </div>
</section>

<section class="card" id="servisBiayaCard">
 <div class="head">Biaya & Status Servis</div><div class="body">
  <div class="grid">
   <div class="field"><label>Biaya Servis / Estimasi</label><input id="biayaServis" type="number" min="0" inputmode="numeric"></div>
   <div class="field"><label>DP</label><input id="dp" type="number" min="0" inputmode="numeric"></div>
   <div class="field"><label>Status</label><select id="statusServis"><option>Menunggu</option><option>Dikerjakan</option><option>Selesai</option><option>Diambil</option><option>Batal</option></select></div>
   <div class="field full"><label>Catatan</label><textarea id="catatanServis"></textarea></div>
  </div>
  <div class="total"><div class="sum"><span>Biaya Servis</span><b id="servisTotal">Rp0</b></div><div class="sum"><span>DP</span><b id="servisDP">Rp0</b></div><div class="sum sisa"><span>SISA</span><b id="servisSisa">Rp0</b></div></div>
 </div>
</section>

<section class="card" id="penjualanCard" style="display:none">
 <div class="head">Produk Penjualan</div><div class="body">
  <div class="notice">Produk dapat dipilih dari Firebase <b>stok</b> atau ditambahkan manual.</div>
  <div class="product-row">
   <div class="field"><label>Produk dari Firebase</label><select id="produkSelect"><option value="">-- Pilih Produk --</option></select></div>
   <div class="field"><label>Qty</label><input id="produkQty" type="number" min="1" inputmode="numeric"></div>
   <button class="btn yellow addprod" id="addProduk" type="button">+ Tambah</button>
  </div>
  <div class="actions"><button class="btn light" id="manualBtn" type="button">✍ Tambah Produk Manual</button></div>
  <div id="itemsJual" class="items"></div>
  <div class="grid" style="margin-top:10px">
   <div class="field"><label>Diskon</label><input id="diskon" type="number" min="0" inputmode="numeric"></div>
   <div class="field"><label>Dibayar</label><input id="dibayar" type="number" min="0" inputmode="numeric"></div>
   <div class="field"><label>Metode</label><select id="metode"><option>Cash</option><option>Transfer</option><option>QRIS</option><option>DP</option></select></div>
   <div class="field"><label>Status</label><select id="statusJual"><option>Lunas</option><option>Belum Lunas</option><option>Batal</option></select></div>
   <div class="field full"><label>Catatan</label><textarea id="catatanJual"></textarea></div>
  </div>
  <div class="total"><div class="sum"><span>Subtotal</span><b id="jualSubtotal">Rp0</b></div><div class="sum"><span>Diskon</span><b id="jualDiskon">Rp0</b></div><div class="sum grand"><span>TOTAL</span><b id="jualTotal">Rp0</b></div><div class="sum"><span>Dibayar</span><b id="jualDibayar">Rp0</b></div><div class="sum sisa"><span>SISA</span><b id="jualSisa">Rp0</b></div></div>
 </div>
</section>

<section class="card"><div class="body">
 <div class="actions">
  <button class="btn light" id="batalBtn" type="button">Batal</button>
  <button class="btn yellow" id="simpanBtn" type="button">💾 Simpan</button>
  <button class="btn dark" id="simpanCetakBtn" type="button">💾 Simpan & Cetak</button>
 </div>
</div></section>
</main>

<div class="modal" id="manualModal">
 <div class="modalbox">
  <div class="modalhead"><h3>Produk Manual</h3><button class="close" id="manualClose" type="button">×</button></div>
  <div class="grid" style="margin-top:12px">
   <div class="field full"><label>Nama Produk</label><input id="manualNama"></div>
   <div class="field"><label>Qty</label><input id="manualQty" type="number" min="1" inputmode="numeric"></div>
   <div class="field"><label>Harga Jual</label><input id="manualHarga" type="number" min="0" inputmode="numeric"></div>
  </div>
  <div class="actions"><button class="btn light" id="manualCancel" type="button">Batal</button><button class="btn yellow" id="manualAdd" type="button">Tambah</button></div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,collection,query,where,getDocs,getDoc,doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyCwMbJsuORHIq4QCmp4c1r6OsjAUlfxU5Y",authDomain:"fixzy-f056f.firebaseapp.com",projectId:"fixzy-f056f",storageBucket:"fixzy-f056f.firebasestorage.app",messagingSenderId:"838081521031",appId:"1:838081521031:web:50fdee909b56460b055f22"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const num=v=>Number(v)||0;
const rupiah=v=>"Rp"+Math.round(num(v)).toLocaleString("id-ID");
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
let uid=null,produk=[],karyawan=[],itemsJual=[],pola=[];

const checks=["SIM Card","Memory Card","Case","Charger"];
$("kelengkapan").innerHTML=checks.map((x,i)=>`<label class="check"><input type="checkbox" id="ck${i}"> ${x}</label>`).join("");

function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2500)}
function nomorNota(j){
 const d=new Date(),stamp=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
 return (j==="servis"?"SRV-":"JUAL-")+stamp+"-"+Math.floor(100+Math.random()*900);
}
function resetNota(){
 $("nomorNota").value=nomorNota($("jenis").value);$("tanggal").value=today();
 ["pelanggan","wa","alamat","merkTipe","imei","keluhan","sandi","catatanServis","catatanJual","biayaServis","dp","diskon","dibayar"].forEach(id=>$(id).value="");
 $("teknisi").value="";$("statusServis").value="Menunggu";$("statusJual").value="Lunas";$("metode").value="Cash";
 document.querySelectorAll("#kelengkapan input").forEach(x=>x.checked=false);
 pola=[];renderPola();itemsJual=[];renderItems();hitung();updateMode();
}
function renderPola(){
 $("pola").value=pola.join("-");
 $("polaText").textContent=pola.length?"Pola: "+pola.join(" → "):"Belum ada pola";
 document.querySelectorAll(".dot").forEach(b=>b.classList.toggle("active",pola.includes(Number(b.dataset.dot))));
}
function updateMode(){
 const jual=$("jenis").value==="penjualan";
 $("servisCard").style.display=jual?"none":"block";
 $("servisBiayaCard").style.display=jual?"none":"block";
 $("penjualanCard").style.display=jual?"block":"none";
}
function ambilTeknisi(){
 const id=$("teknisi").value,x=karyawan.find(k=>k.id===id);
 return x?{id:x.id,nama:x.nama||"",jabatan:x.jabatan||""}:{id:"",nama:"",jabatan:""};
}
function renderItems(){
 if(!itemsJual.length){$("itemsJual").innerHTML='<div style="padding:14px;text-align:center;color:#64748b;font-size:10px">Belum ada produk.</div>';return}
 $("itemsJual").innerHTML=itemsJual.map((x,i)=>`<div class="item"><div><b>${esc(x.nama)}</b><br><span>${rupiah(x.hargaJual)}</span></div><div>${x.qty}</div><div>${rupiah(x.hargaJual*x.qty)}</div><div>${x.sumber==="manual"?"Manual":"Stok"}</div><button class="smallbtn" data-del="${i}" type="button">×</button></div>`).join("");
}
function hitung(){
 const biaya=num($("biayaServis").value),dp=num($("dp").value);
 $("servisTotal").textContent=rupiah(biaya);$("servisDP").textContent=rupiah(dp);$("servisSisa").textContent=rupiah(Math.max(0,biaya-dp));
 const sub=itemsJual.reduce((a,x)=>a+num(x.hargaJual)*num(x.qty),0),disk=num($("diskon").value),total=Math.max(0,sub-disk),bayar=num($("dibayar").value);
 $("jualSubtotal").textContent=rupiah(sub);$("jualDiskon").textContent=rupiah(disk);$("jualTotal").textContent=rupiah(total);$("jualDibayar").textContent=rupiah(bayar);$("jualSisa").textContent=rupiah(Math.max(0,total-bayar));
}
async function muatKaryawan(){
 const snap=await getDocs(query(collection(db,"karyawan"),where("uid","==",uid)));
 karyawan=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>(x.status||"Aktif")==="Aktif").sort((a,b)=>String(a.nama||"").localeCompare(String(b.nama||""),"id"));
 $("teknisi").innerHTML='<option value="">-- Pilih Teknisi --</option>'+karyawan.map(x=>`<option value="${esc(x.id)}">${esc(x.nama||"Tanpa Nama")} • ${esc(x.jabatan||"Teknisi")}</option>`).join("");
 if(!karyawan.length)$("teknisi").innerHTML='<option value="">Belum ada karyawan aktif</option>';
}
async function muatProduk(){
 const snap=await getDocs(query(collection(db,"stok"),where("uid","==",uid)));
 produk=snap.docs.map(d=>({id:d.id,...d.data()}));
 $("produkSelect").innerHTML='<option value="">-- Pilih Produk --</option>'+produk.map(x=>{
  const nama=x.nama||x.name||x.produk||x.productName||"Produk";
  const harga=num(x.hargaJual??x.harga??x.price??x.jual);
  const stok=num(x.stok??x.stock??x.qty??x.jumlah);
  return `<option value="${esc(x.id)}">${esc(nama)} • ${rupiah(harga)} • Stok ${stok}</option>`;
 }).join("");
}
function produkData(id){
 const x=produk.find(p=>p.id===id);if(!x)return null;
 return {id:x.id,nama:x.nama||x.name||x.produk||x.productName||"Produk",hargaJual:num(x.hargaJual??x.harga??x.price??x.jual),stok:num(x.stok??x.stock??x.qty??x.jumlah),sumber:"stok"};
}
function validasi(d){
 if(!d.tanggal)return"Tanggal belum diisi.";
 if(!d.pelanggan.nama)return"Nama pelanggan belum diisi.";
 if(!d.teknisi.id)return"Teknisi belum dipilih dari Data Karyawan.";
 if(d.jenis==="servis"&&!d.hp.merkTipe)return"Merk / Tipe / Model HP belum diisi.";
 if(d.jenis==="penjualan"&&!d.items.length)return"Belum ada produk penjualan.";
 return null;
}
function kumpulkan(){
 const teknisi=ambilTeknisi(),base={uid,jenis:$("jenis").value,nomorNota:$("nomorNota").value,tanggal:$("tanggal").value,teknisi,pelanggan:{nama:$("pelanggan").value.trim(),wa:$("wa").value.trim(),alamat:$("alamat").value.trim()}};
 if(base.jenis==="servis"){
  const biaya=num($("biayaServis").value),dp=num($("dp").value);
  return {...base,hp:{merkTipe:$("merkTipe").value.trim(),imei:$("imei").value.trim()},keluhan:$("keluhan").value.trim(),kelengkapan:checks.filter((_,i)=>$("ck"+i).checked),sandi:$("sandi").value,pola:$("pola").value,biayaServis:biaya,total:biaya,dp,sisa:Math.max(0,biaya-dp),status:$("statusServis").value,catatan:$("catatanServis").value.trim(),sparepart:[],createdAt:serverTimestamp(),updatedAt:serverTimestamp()};
 }
 const subtotal=itemsJual.reduce((a,x)=>a+num(x.hargaJual)*num(x.qty),0),diskon=num($("diskon").value),total=Math.max(0,subtotal-diskon),dibayar=num($("dibayar").value);
 return {...base,items:itemsJual,subtotal,diskon,total,dibayar,sisa:Math.max(0,total-dibayar),metode:$("metode").value,status:$("statusJual").value,catatan:$("catatanJual").value.trim(),createdAt:serverTimestamp(),updatedAt:serverTimestamp()};
}
async function simpan(cetak=false){
 if(!uid)return alert("Akun Firebase belum terdeteksi. Tunggu sampai nama akun tampil di Nota.");
 const d=kumpulkan(),err=validasi(d);if(err)return alert(err);
 const col=d.jenis==="servis"?"servis":"penjualan";
 try{
  await setDoc(doc(db,col,d.nomorNota),d,{merge:false});
  toast("Nota tersimpan di Firebase.");
  if(cetak)setTimeout(()=>cetakNota(d),300);
  resetNota();
 }catch(e){console.error(e);alert("Gagal menyimpan ke Firebase: "+e.message)}
}
function cetakNota(d){
 const qr="cek.html?koleksi="+encodeURIComponent(d.jenis==="servis"?"servis":"penjualan")+"&nota="+encodeURIComponent(d.nomorNota);
 const rows=d.jenis==="servis"
  ?`<tr><td>1</td><td>Jasa / Estimasi Servis</td><td>1</td><td>${rupiah(d.biayaServis)}</td><td>${rupiah(d.biayaServis)}</td></tr>`
  :(d.items||[]).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.nama)}</td><td>${x.qty}</td><td>${rupiah(x.hargaJual)}</td><td>${rupiah(x.qty*x.hargaJual)}</td></tr>`).join("");
 const w=window.open("","_blank","width=440,height=760");if(!w)return alert("Popup cetak diblokir browser.");
 w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(d.nomorNota)}</title><style>body{font:12px Arial;margin:18px;color:#111}h2{margin:0 0 5px}.meta{font-size:11px;line-height:1.6}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border-bottom:1px solid #ddd;padding:6px;text-align:left;font-size:10px}.qr{text-align:center;margin-top:14px}#qrcode{display:inline-block}</style></head><body>
 <h2>FIXZY</h2><div class="meta"><b>${esc(d.nomorNota)}</b><br>Tanggal: ${esc(d.tanggal)}<br>Teknisi: ${esc(d.teknisi.nama)}<br>Pelanggan: ${esc(d.pelanggan.nama)}<br>${esc(d.pelanggan.wa)}</div>

function tutup(){
 try{if(window.frameElement&&window.frameElement.parentNode){window.frameElement.parentNode.removeChild(window.frameElement);return}}catch(e){}
 try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:"FIXZY_CLOSE_NOTA"},"*");return}}catch(e){}
 try{window.close()}catch(e){}
}
function refresh(){window.location.reload()}

$("refreshBtn").onclick=refresh;$("closeBtn").onclick=tutup;
$("jenis").onchange=()=>{resetNota()};
$("clearPattern").onclick=()=>{pola=[];renderPola()};
document.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{const n=Number(b.dataset.dot);if(!pola.includes(n))pola.push(n);renderPola()});
document.querySelectorAll('input[type="number"]').forEach(i=>i.addEventListener("input",hitung));
["biayaServis","dp","diskon","dibayar"].forEach(id=>$(id).addEventListener("input",hitung));
$("addProduk").onclick=()=>{const x=produkData($("produkSelect").value),qty=Math.max(1,num($("produkQty").value));if(!x)return alert("Pilih produk dari Firebase.");if(x.stok>0&&qty>x.stok)return alert("Stok tidak cukup.");itemsJual.push({...x,qty});$("produkSelect").value="";$("produkQty").value="";renderItems();hitung()};

$("manualClose").onclick=$("manualCancel").onclick=()=>{$("manualModal").classList.remove("show")};
$("manualAdd").onclick=()=>{const nama=$("manualNama").value.trim(),qty=Math.max(1,num($("manualQty").value)),harga=num($("manualHarga").value);if(!nama)return alert("Nama produk wajib diisi.");if(!harga)return alert("Harga jual wajib diisi.");itemsJual.push({id:"manual-"+Date.now(),nama,qty,hargaJual:harga,stok:null,sumber:"manual"});["manualNama","manualQty","manualHarga"].forEach(id=>$(id).value="");$("manualModal").classList.remove("show");renderItems();hitung()};
$("simpanBtn").onclick=()=>simpan(false);$("simpanCetakBtn").onclick=()=>simpan(true);$("batalBtn").onclick=resetNota;


async function tampilkanAkun(user){
  const box=$("akunNota");
  if(!user){
    box.style.display="none";
    return;
  }
  let nama=user.displayName||"";
  try{
    const snap=await getDoc(doc(db,"users",user.uid));
    if(snap.exists()){
      const d=snap.data()||{};
      nama=d.nama||d.namaToko||d.name||d.namaAkun||nama;
    }
  }catch(e){
    console.warn("Data nama akun users tidak terbaca:",e);
  }
  nama=nama||user.email||("UID "+user.uid.slice(0,8));
  $("namaAkun").textContent=nama;
  box.style.display="block";
}

let authSelesai=false;

async function mulaiFirebaseAuth(){
  try{
    await setPersistence(auth,browserLocalPersistence);
  }catch(e){
    console.warn("Persistence Firebase tidak dapat disetel:",e);
  }

  onAuthStateChanged(auth,async user=>{
    authSelesai=true;
    if(!user){
      uid=null;
      $("firebaseStatus").textContent="Belum login Firebase. Silakan buka halaman Login FIXZY terlebih dahulu.";
      $("akunNota").style.display="none";
      return;
    }

    uid=user.uid;
    $("firebaseStatus").textContent="Login Firebase terdeteksi. Memuat akun...";
    try{
      await tampilkanAkun(user);
      await Promise.all([muatKaryawan(),muatProduk()]);
      $("firebaseStatus").textContent="Firebase aktif • Akun, karyawan, dan stok berhasil dimuat.";
      resetNota();
    }catch(e){
      console.error(e);
      $("firebaseStatus").textContent="Login Firebase berhasil.";
      $("firebaseError").style.display="block";
      $("firebaseError").textContent="Data Firebase gagal dimuat: "+e.message;
    }
  },error=>{
    console.error("Firebase Auth error:",error);
    authSelesai=true;
    $("firebaseStatus").textContent="Firebase Auth mengalami error.";
    $("firebaseError").style.display="block";
    $("firebaseError").textContent=error?.message||String(error);
  });

  setTimeout(()=>{
    if(!authSelesai){
      $("firebaseStatus").textContent="Firebase Auth belum merespons.";
      $("firebaseError").style.display="block";
      $("firebaseError").textContent="Pastikan halaman Login dan Nota menggunakan project Firebase FIXZY yang sama.";
    }
  },8000);
}

mulaiFirebaseAuth();
</script>
