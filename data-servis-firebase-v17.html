<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,getDoc,updateDoc,doc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={
 apiKey:"AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",
 authDomain:"fixzy-f056f.firebaseapp.com",
 projectId:"fixzy-f056f",
 storageBucket:"fixzy-f056f.firebasestorage.app",
 messagingSenderId:"838081521031",
 appId:"1:838081521031:web:50fdee909b56460b055f22"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let uid="",rows=[],accountName="",storeName="";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=v=>"Rp "+Number(v||0).toLocaleString("id-ID");
function readSavedProfile(){
 try{
  const keys=["fixzy_user_profile","fixzy_register_profile","fixzy_profile"];
  for(const key of keys){
   const raw=localStorage.getItem(key);
   if(!raw)continue;
   const p=JSON.parse(raw);
   if(p&&typeof p==="object"&&Object.keys(p).length)return p;
  }
 }catch(e){}
 return {};
}

async function loadAccountProfile(user){
 const cached=readSavedProfile();
 let firebase={};
 try{
  const snap=await getDoc(doc(db,"users",user.uid));
  if(snap.exists()) firebase=snap.data()||{};
 }catch(e){
  console.warn("Profil Firebase tidak terbaca:",e);
 }

 // SUMBER NAMA TOKO RESMI: data Register -> users/{uid}.namaKonter
 // Jangan gunakan email sebagai nama toko.
 storeName=String(firebase.namaKonter||cached.namaKonter||"").trim();
 accountName=String(
  firebase.namaPemilik||
  cached.namaPemilik||
  user?.displayName||
  "Pengguna"
 ).trim();

 // Jika namaKonter benar-benar kosong di Firebase, gunakan identitas FIXZY,
 // bukan email dan bukan teks "Nama Toko".
 if(!storeName) storeName="FIXZY";
 if(!accountName) accountName="Pengguna";

 try{
  localStorage.setItem("fixzy_user_profile",JSON.stringify({
   ...cached,
   uid:user.uid,
   namaKonter:storeName,
   namaToko:storeName,
   namaUsaha:storeName,
   toko:storeName,
   namaPemilik:accountName
  }));
 }catch(e){}
}



function waNumber(v){
 const raw=String(v||"").replace(/[^\d]/g,"");
 if(!raw)return "";
 if(raw.startsWith("0"))return "62"+raw.slice(1);
 if(raw.startsWith("62"))return raw;
 return raw;
}
let waPending=null;
function waStatus(status,item){
 // Pesan WA selalu memakai nama toko terdaftar, bukan email akun.
 const n=waNumber(item.pelanggan?.wa||item.noHp);
 const label={
  masuk:"HP sudah diterima","nunggu-sparepart":"Sedang menunggu sparepart",
  proses:"HP sedang diproses",selesai:"HP sudah selesai dan siap diambil",
  diambil:"HP sudah diambil",batal:"Servis dibatalkan"
 }[status]||("Status servis: "+status);
 const nomor=item.nomorNota||item.idServis||item.id||"-";
 const nama=item.pelanggan?.nama||item.namaPelanggan||"Pelanggan";
 const tipe=item.tipe||item.tipeHp||"HP";
 const pengirim=storeName||"FIXZY";
 const text=`Halo ${nama},

📍 *${pengirim}*

Kami menginformasikan status servis HP Anda:

📱 HP: ${tipe}
🧾 No. Nota: ${nomor}
📌 Status: *${label}*

Jika ada yang ingin ditanyakan, silakan hubungi kami.

Terima kasih 🙏`;

 waPending=n?{number:n,text}:null;
 $("waPreview").textContent=text;
 $("waQuestion").textContent=n
  ? `Status servis berhasil diubah menjadi "${label}". Kirim konfirmasi WhatsApp kepada ${nama}?`
  : `Status servis berhasil diubah menjadi "${label}", tetapi nomor WhatsApp ${nama} belum tersedia.`;

 const yes=$("waYes"),no=$("waNo");
 if(yes){yes.style.display=n?"block":"none";yes.textContent="📲 Kirim WhatsApp"}
 if(no)no.textContent=n?"Tidak":"Tutup";

 const modal=$("waModal");
 modal.classList.add("show");
 modal.style.display="flex";
 modal.setAttribute("aria-hidden","false");
}
window.batalKirimWA=()=>{
 waPending=null;const m=$("waModal");m.classList.remove("show");m.style.display="none";m.setAttribute("aria-hidden","true");
};
window.lanjutKirimWA=()=>{
 if(!waPending){batalKirimWA();return}
 const {number,text}=waPending,encoded=encodeURIComponent(text);
 const isDesktop=!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
 const url=isDesktop?"https://web.whatsapp.com/send?phone="+number+"&text="+encoded:"https://wa.me/"+number+"?text="+encoded;
 batalKirimWA();window.open(url,"_blank");waPending=null;
};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("waModal")?.classList.contains("show"))batalKirimWA()});
window.edit=id=>{
 const x=rows.find(a=>a.id===id); if(!x)return;
 $("editId").value=id;
 $("eNama").value=x.pelanggan?.nama||x.namaPelanggan||"";
 $("eWa").value=x.pelanggan?.wa||x.noHp||"";
 $("eTipe").value=x.tipe||x.tipeHp||"";
 $("eImei").value=x.imei||"";
 $("eTeknisi").value=x.namaTeknisi||x.teknisi||"";
 $("eKeluhan").value=x.keluhan||x.kerusakan||"";
 $("eBiaya").value=x.biaya??x.total??0;
 $("eDp").value=x.dp||0;
 $("eStatus").value=x.status||"masuk";
 $("eCatatan").value=x.catatan||"";
 $("modal").classList.add("show");
};
window.closeEdit=()=>$("modal").classList.remove("show");
window.saveEdit=async()=>{
 const id=$("editId").value,x=rows.find(a=>a.id===id);if(!id||!x)return;
 const oldStatus=x.status||"masuk",newStatus=$("eStatus").value;
 const payload={
  namaPelanggan:$("eNama").value.trim(),noHp:$("eWa").value.trim(),
  tipeHp:$("eTipe").value.trim(),imei:$("eImei").value.trim(),
  teknisi:$("eTeknisi").value.trim(),kerusakan:$("eKeluhan").value.trim(),
  biaya:Number(String($("eBiaya").value).replace(/[^\d]/g,""))||0,
  dp:Number(String($("eDp").value).replace(/[^\d]/g,""))||0,
  status:newStatus,catatan:$("eCatatan").value.trim(),
  updatedAt:serverTimestamp()
 };
 payload.total=payload.biaya;payload.sisa=Math.max(0,payload.total-payload.dp);
 try{
  await updateDoc(doc(db,"servis",id),payload);
  $("modal").classList.remove("show");
  await load();
  if(newStatus!==oldStatus)waStatus(newStatus,{...x,...payload});
 }catch(e){alert("Gagal menyimpan perubahan:\\n"+e.message)}
};
const STATUS=[["masuk","Masuk"],["nunggu-sparepart","Nunggu Sparepart"],["proses","Proses"],["selesai","Selesai"],["diambil","Diambil"],["batal","Batal"]];
function statusClass(v){return "status-"+String(v||"masuk").toLowerCase().replace(/[^a-z0-9]+/g,"-")}
function statusOptions(current){return STATUS.map(([v,l])=>`<option value="${v}" ${v===current?"selected":""}>${l}</option>`).join("")}

function statusInfo(v){
 const k=String(v||"masuk");
 const found=STATUS.find(a=>a[0]===k);
 return {key:k,label:found?found[1]:k};
}
function statusDropdown(x){
 const cur=statusInfo(x.status||"masuk");
 const opts=STATUS.map(([v,l])=>`
  <button type="button" class="statusOption ${v===cur.key?"active":""}"
    onclick="ubahStatusMenu('${x.id}','${v}')">
    <span class="statusDot dot-${v}"></span>${l}
  </button>`).join("");
 return `<div class="statusWrap" id="sw-${x.id}">
   <button type="button" class="statusCurrent status-${cur.key}"
     onclick="toggleStatusMenu('${x.id}')">
     <span class="statusLeft"><span class="statusDot dot-${cur.key}"></span>${cur.label}</span>
     <span class="chev">⌄</span>
   </button>
   <div class="statusMenu">${opts}</div>
 </div>`;
}
window.toggleStatusMenu=id=>{
 const el=$("sw-"+id); if(!el)return;
 document.querySelectorAll(".statusWrap.open").forEach(x=>{if(x!==el)x.classList.remove("open")});
 el.classList.toggle("open");
};
window.ubahStatusMenu=async(id,s)=>{
 const el=$("sw-"+id);if(el)el.classList.remove("open");
 await window.ubahStatus(id,s);
};
document.addEventListener("click",e=>{
 if(!e.target.closest(".statusWrap"))
   document.querySelectorAll(".statusWrap.open").forEach(x=>x.classList.remove("open"));
});
function render(){
 const q=$("search").value.toLowerCase(), f=$("filter").value;
 const a=rows.filter(x=> (f==="semua" || String(x.status||"masuk")===f) && (!q || JSON.stringify(x).toLowerCase().includes(q)));
 $("total").textContent=a.length;
 $("list").innerHTML=a.length?a.map(x=>`<article class="card">
  <div class="top"><div><div class="name">${esc(x.pelanggan?.nama||x.namaPelanggan||"Pelanggan")}</div>
  <div class="small">${esc(x.nomorNota||x.idServis||"-")} • ${esc(x.tanggal||"")}</div></div>
  ${statusDropdown(x)} </div>
  <div class="info">📱 ${esc(x.tipe||x.tipeHp||"-")}<br>📞 ${esc(x.pelanggan?.wa||x.noHp||"-")}<br>🔧 Teknisi: ${esc(x.namaTeknisi||x.teknisi||"-")}<br>📝 ${esc(x.keluhan||x.kerusakan||"-")}<br>💰 Biaya: <b>${money(x.total??x.biaya)}</b> • DP: ${money(x.dp)}</div>
  <div class="actions">
   <button title="Edit data" onclick="edit('${x.id}')">✏️ Edit</button>
   <button title="Hapus data" onclick="hapus('${x.id}')">🗑️ Hapus</button>
  </div></article>`).join(""):`<div class="empty">Tidak ada data servis.</div>`;
}
async function load(){
 if(!uid)return;$("list").innerHTML='<div class="empty">Membaca Firebase...</div>';
 try{const snap=await getDocs(query(collection(db,"servis"),where("uid","==",uid)));rows=snap.docs.map(d=>({id:d.id,...d.data()}));rows.sort((a,b)=>String(b.tanggal||"").localeCompare(String(a.tanggal||"")));render();}
 catch(e){$("list").innerHTML=`<div class="empty err">Gagal membaca Firebase:\n${e.message}</div>`}
}
window.load=load;
window.ubahStatus=async(id,s)=>{
 const x=rows.find(a=>a.id===id);if(!x)return;
 const old=x.status||"masuk";if(old===s)return;
 if(!confirm(`Ubah status menjadi "${STATUS.find(a=>a[0]===s)?.[1]||s}"?`)){await load();return}
 try{await updateDoc(doc(db,"servis",id),{status:s,updatedAt:serverTimestamp()});await load();waStatus(s,{...x,status:s})}
 catch(e){alert("Gagal mengubah status:\n"+e.message);await load()}
};
window.status=async(id,s)=>{
 const x=rows.find(a=>a.id===id);if(!x)return;
 if(!confirm(`Ubah status menjadi "${s}"?`))return;
 try{
  await updateDoc(doc(db,"servis",id),{status:s,updatedAt:serverTimestamp()});
  await load();
  waStatus(s,{...x,status:s});
 }catch(e){alert(e.message)}
};
window.hapus=async id=>{if(!confirm("Hapus data servis ini?"))return;try{await deleteDoc(doc(db,"servis",id));await load()}catch(e){alert(e.message)}};
$("search").oninput=render;$("filter").onchange=render;
onAuthStateChanged(auth,async u=>{
 if(!u){location.href="login.html";return}
 uid=u.uid;
 await loadAccountProfile(u);
 $("akun").textContent=storeName+" • "+(u.email||"Login");
 await load();
});
</script></body></html>
