<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#FFC107">
<title>Fixzy | Nota</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#1f2937}
body{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;font-size:20px}.brand span{color:#f59e0b}
.back{border:0;background:#111827;color:#fff;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}
.wrap{max-width:820px;margin:16px auto;padding:0 10px 100px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tab{border:0;border-radius:12px;padding:13px;background:#e5e7eb;color:#374151;font-weight:900;cursor:pointer}
.tab.active{background:#f59e0b;color:#111827}
.note{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08);overflow:hidden}
.note-head{padding:22px;border-bottom:1px dashed #cbd5e1;display:flex;justify-content:space-between;gap:20px}
.store-name{font-size:24px;font-weight:900}.store-sub{font-size:13px;color:#64748b;margin-top:5px;line-height:1.5}
.note-title{text-align:right}.note-title h1{margin:0;font-size:21px}.note-no{margin-top:6px;font-size:13px;color:#64748b}
.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px 22px}
.info-box{background:#f8fafc;border-radius:10px;padding:12px}.label{font-size:11px;text-transform:uppercase;color:#64748b;font-weight:700;margin-bottom:5px}.value{font-weight:700;min-height:18px;white-space:pre-wrap}
.section{padding:0 22px 18px}.section-title{font-weight:900;margin:0 0 10px}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{padding:10px 8px;border-bottom:1px solid #e5e7eb;font-size:13px}th{background:#f8fafc;text-align:left}.num{text-align:right}
.summary{margin-left:auto;max-width:360px;border-top:2px solid #111827;padding-top:8px}.sum-row{display:flex;justify-content:space-between;gap:20px;padding:5px 0}.sum-row.total{font-size:17px;font-weight:900;border-top:1px solid #cbd5e1;margin-top:5px;padding-top:10px}.sum-row.sisa{font-weight:900;color:#b45309}
.notes{margin:4px 22px 22px;padding:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;font-size:13px}
.empty{padding:60px 20px;text-align:center;color:#64748b}.empty strong{display:block;color:#111827;font-size:18px;margin-bottom:7px}
.actions{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid #e5e7eb;padding:12px 16px;display:flex;justify-content:center;gap:10px}
.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:800;cursor:pointer;font-size:14px}.btn-print{background:#f59e0b;color:#111827}.btn-save{background:#111827;color:#fff}.btn-light{background:#e5e7eb;color:#111827}
.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.58);padding:20px;align-items:center;justify-content:center}.modal.show{display:flex}
.modal-card{width:min(420px,100%);background:#fff;border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal-card h2{margin:0 0 8px}.modal-card p{margin:0 0 18px;color:#64748b;font-size:14px}.modal-actions{display:grid;gap:9px}.modal-actions .btn{width:100%}
.status{position:fixed;top:70px;right:14px;z-index:120;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700;display:none}.status.show{display:block}
@media(max-width:600px){
.topbar{padding:10px 12px}.brand{font-size:18px}.wrap{margin:10px auto;padding:0 7px 100px}.note-head{padding:18px 15px 14px}.store-name{font-size:20px}.note-title h1{font-size:18px}.info{grid-template-columns:1fr;padding:14px 15px}.section{padding:0 15px 15px}.notes{margin:4px 15px 18px}.actions{padding:10px}.btn{padding:11px 10px;flex:1}.tab{padding:12px 8px}
}
@media print{
body{background:#fff}.topbar,.tabs,.actions,.modal,.status{display:none!important}.wrap{max-width:none;margin:0;padding:0}.note{box-shadow:none;border-radius:0}.note-head{padding-top:0}@page{size:A4;margin:12mm}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">FIX<span>ZY</span></div>
  <button class="back" type="button" onclick="kembali()">← Kembali</button>
</header>

<main class="wrap">
  <div class="tabs">
    <button id="tabServis" class="tab active" type="button" onclick="gantiTab('servis')">🔧 Nota Servis</button>
    <button id="tabPenjualan" class="tab" type="button" onclick="gantiTab('penjualan')">🛒 Nota Penjualan</button>
  </div>

  <section class="note" id="notaArea">
    <div class="note-head">
      <div>
        <div class="store-name" id="namaToko">FIXZY</div>
        <div class="store-sub" id="alamatToko">Service HP & Sparepart</div>
      </div>
      <div class="note-title">
        <h1 id="judulNota">NOTA SERVIS</h1>
        <div class="note-no" id="nomorNota">-</div>
      </div>
    </div>
    <div id="isiNota"></div>
  </section>
</main>

<div class="actions">
  <button class="btn btn-light" type="button" onclick="kembali()">Kembali</button>
  <button class="btn btn-save" type="button" onclick="bukaPopup()">Simpan</button>
  <button class="btn btn-print" type="button" onclick="bukaPopup()">Cetak & Simpan</button>
</div>

<div class="modal" id="modalSimpan">
  <div class="modal-card">
    <h2 id="popupTitle">Simpan Nota</h2>
    <p>Pilih tindakan untuk nota yang sedang aktif.</p>
    <div class="modal-actions">
      <button class="btn btn-print" type="button" onclick="simpanDanCetak()">Cetak & Simpan</button>
      <button class="btn btn-save" type="button" onclick="simpanNota(false)">Simpan</button>
      <button class="btn btn-light" type="button" onclick="tutupPopup()">Batal</button>
    </div>
  </div>
</div>

<div class="status" id="statusBox"></div>

<script>
(function(){
"use strict";

const KEYS={
  servisDraft:"fixzy_nota_servis_draft",
  penjualanDraft:"fixzy_nota_penjualan_draft",
  servisSaved:"fixzy_nota_servis_saved",
  penjualanSaved:"fixzy_nota_penjualan_saved"
};

let tabAktif="servis";
let dataAktif=null;

function rupiah(n){
  return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
}
function esc(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function nomorOtomatis(jenis){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  const kode=jenis==="penjualan"?"J":"S";
  return kode+"-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}
function keyDraft(){return tabAktif==="servis"?KEYS.servisDraft:KEYS.penjualanDraft}
function keySaved(){return tabAktif==="servis"?KEYS.servisSaved:KEYS.penjualanSaved}

function defaultData(jenis){
  const sekarang=new Date().toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"});
  if(jenis==="penjualan"){
    return {
      jenis:"penjualan",nomorNota:nomorOtomatis("penjualan"),tanggal:sekarang,
      pelanggan:{nama:"",wa:""},items:[],subtotal:0,diskon:0,total:0,dibayar:0,sisa:0,
      metodePembayaran:"Tunai",status:"Selesai",catatan:""
    };
  }
  return {
    jenis:"servis",nomorNota:nomorOtomatis("servis"),tanggal:sekarang,
    pelanggan:{nama:"",wa:""},hp:{merk:"",tipe:"",imei:""},keluhan:"",
    sparepart:[],jasa:[],totalSparepart:0,totalJasa:0,total:0,dp:0,sisa:0,
    status:"Menunggu",catatan:""
  };
}

function bacaDraft(){
  try{
    const raw=localStorage.getItem(keyDraft());
    if(raw)return JSON.parse(raw);
  }catch(e){console.error(e)}
  return defaultData(tabAktif);
}

function normalisasi(d){
  d=d||defaultData(tabAktif);
  if(!d.jenis)d.jenis=tabAktif;
  if(!d.nomorNota)d.nomorNota=nomorOtomatis(tabAktif);
  if(!d.tanggal)d.tanggal=new Date().toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"});
  d.pelanggan=d.pelanggan||{nama:"",wa:""};

  if(tabAktif==="servis"){
    d.hp=d.hp||{};d.sparepart=Array.isArray(d.sparepart)?d.sparepart:[];d.jasa=Array.isArray(d.jasa)?d.jasa:[];
    d.totalSparepart=Number(d.totalSparepart)||d.sparepart.reduce((a,x)=>a+(Number(x.hargaJual??x.harga)||0)*(Number(x.qty)||1),0);
    d.totalJasa=Number(d.totalJasa)||d.jasa.reduce((a,x)=>a+(Number(x.harga??x.hargaJual)||0),0);
    d.total=Number(d.total)||d.totalSparepart+d.totalJasa;
    d.dp=Number(d.dp)||0;d.sisa=Math.max(0,d.total-d.dp);
  }else{
    d.items=Array.isArray(d.items)?d.items:[];
    d.subtotal=Number(d.subtotal)||d.items.reduce((a,x)=>a+(Number(x.hargaJual??x.harga)||0)*(Number(x.qty)||1),0);
    d.diskon=Number(d.diskon)||0;
    d.total=Number(d.total)||Math.max(0,d.subtotal-d.diskon);
    d.dibayar=Number(d.dibayar??d.dp)||0;
    d.sisa=Math.max(0,d.total-d.dibayar);
  }
  return d;
}


function ambilProfilAkun(){
  /*
    Struktur yang disiapkan:
    localStorage:
      fixzy_user_profile = {
        namaToko, namaPemilik, alamat, whatsapp, logo
      }

    Nanti sumber utama bisa diganti Firebase berdasarkan auth.currentUser.uid.
  */
  const defaults = {
    namaToko:"Nama Toko",
    namaPemilik:"",
    alamat:"Service HP & Sparepart",
    whatsapp:"",
    logo:""
  };

  const keys = [
    "fixzy_user_profile",
    "userProfile",
    "profilAkun",
    "akun"
  ];

  for(const key of keys){
    try{
      const raw=localStorage.getItem(key);
      if(!raw) continue;
      const obj=JSON.parse(raw);
      if(obj && typeof obj==="object"){
        return {...defaults,...obj};
      }
    }catch(e){}
  }

  return defaults;
}

function tampilkanProfilAkun(){
  const profil=ambilProfilAkun();

  const nama=(profil.namaToko||profil.namaUsaha||profil.toko||profil.namaPemilik||"Nama Toko").trim();
  const alamat=(profil.alamat||"Service HP & Sparepart").trim();
  const wa=(profil.whatsapp||profil.noWa||profil.telepon||"").trim();

  document.getElementById("namaToko").textContent=nama;
  document.getElementById("alamatToko").textContent=alamat;

  const kontak=document.getElementById("kontakToko");
  kontak.textContent=wa ? "WA: "+wa : "";

  // Logo akun jika tersedia.
  let logo=document.getElementById("logoToko");
  if(profil.logo){
    if(!logo){
      logo=document.createElement("img");
      logo.id="logoToko";
      logo.alt="Logo toko";
      logo.style.cssText="width:52px;height:52px;object-fit:contain;border-radius:10px;margin-bottom:7px;display:block";
      const headerLeft=document.querySelector(".note-head > div:first-child");
      headerLeft.insertBefore(logo,headerLeft.firstChild);
    }
    logo.src=profil.logo;
  }else if(logo){
    logo.remove();
  }
}

function gantiTab(jenis){
  tabAktif=jenis;
  document.getElementById("tabServis").classList.toggle("active",jenis==="servis");
  document.getElementById("tabPenjualan").classList.toggle("active",jenis==="penjualan");
  document.getElementById("judulNota").textContent=jenis==="servis"?"NOTA SERVIS":"NOTA PENJUALAN";
  dataAktif=normalisasi(bacaDraft());
  render();
}

function render(){
  dataAktif=normalisasi(dataAktif);
  document.getElementById("nomorNota").textContent=dataAktif.nomorNota+" • "+dataAktif.tanggal;
  document.getElementById("popupTitle").textContent=tabAktif==="servis"?"Simpan Nota Servis":"Simpan Nota Penjualan";

  if(tabAktif==="servis")renderServis();else renderPenjualan();
}

function renderServis(){
  const d=dataAktif,p=d.pelanggan||{},h=d.hp||{};
  let rows="";
  d.sparepart.forEach((x,i)=>{
    const q=Number(x.qty)||1,hrg=Number(x.hargaJual??x.harga)||0;
    rows+=`<tr><td>${i+1}</td><td><strong>${esc(x.nama||x.name||"Sparepart")}</strong>${x.sumber==="manual"?'<div style="font-size:11px;color:#b45309">Manual</div>':""}</td><td class="num">${q}</td><td class="num">${rupiah(hrg)}</td><td class="num">${rupiah(q*hrg)}</td></tr>`;
  });
  d.jasa.forEach((x,i)=>{
    const hrg=Number(x.harga??x.hargaJual)||0;
    rows+=`<tr><td>${d.sparepart.length+i+1}</td><td><strong>${esc(x.nama||x.name||"Jasa Servis")}</strong></td><td class="num">1</td><td class="num">${rupiah(hrg)}</td><td class="num">${rupiah(hrg)}</td></tr>`;
  });
  if(!rows)rows='<tr><td colspan="5" style="text-align:center;color:#64748b">Belum ada sparepart atau jasa.</td></tr>';

  document.getElementById("isiNota").innerHTML=`
  <div class="info">
    <div class="info-box"><div class="label">Pelanggan</div><div class="value">${esc(p.nama||"-")}</div></div>
    <div class="info-box"><div class="label">WhatsApp</div><div class="value">${esc(p.wa||p.noWa||"-")}</div></div>
    <div class="info-box"><div class="label">Perangkat</div><div class="value">${esc(h.merk||"")} ${esc(h.tipe||h.model||"-")}</div></div>
    <div class="info-box"><div class="label">IMEI / Identitas</div><div class="value">${esc(h.imei||"-")}</div></div>
  </div>
  <div class="section">
    <div class="section-title">Detail Servis</div>
    <div class="info-box" style="margin-bottom:14px"><div class="label">Keluhan</div><div class="value">${esc(d.keluhan||"-")}</div></div>
    <div class="table-wrap"><table><thead><tr><th style="width:35px">No</th><th>Item</th><th class="num">Qty</th><th class="num">Harga</th><th class="num">Total</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>
  <div class="section"><div class="summary">
    <div class="sum-row"><span>Sparepart</span><strong>${rupiah(d.totalSparepart)}</strong></div>
    <div class="sum-row"><span>Jasa</span><strong>${rupiah(d.totalJasa)}</strong></div>
    <div class="sum-row total"><span>TOTAL</span><strong>${rupiah(d.total)}</strong></div>
    <div class="sum-row"><span>DP</span><strong>${rupiah(d.dp)}</strong></div>
    <div class="sum-row sisa"><span>SISA</span><strong>${rupiah(d.sisa)}</strong></div>
  </div></div>
  <div class="notes"><strong>Status:</strong> ${esc(d.status||"Menunggu")}${d.catatan?"<br><strong>Catatan:</strong> "+esc(d.catatan):""}</div>`;
}

function renderPenjualan(){
  const d=dataAktif,p=d.pelanggan||{};
  let rows="";
  d.items.forEach((x,i)=>{
    const q=Number(x.qty)||1,hrg=Number(x.hargaJual??x.harga)||0;
    rows+=`<tr><td>${i+1}</td><td><strong>${esc(x.nama||x.name||"Produk")}</strong></td><td class="num">${q}</td><td class="num">${rupiah(hrg)}</td><td class="num">${rupiah(q*hrg)}</td></tr>`;
  });
  if(!rows)rows='<tr><td colspan="5" style="text-align:center;color:#64748b">Belum ada produk.</td></tr>';

  document.getElementById("isiNota").innerHTML=`
  <div class="info">
    <div class="info-box"><div class="label">Pelanggan</div><div class="value">${esc(p.nama||"Umum")}</div></div>
    <div class="info-box"><div class="label">WhatsApp</div><div class="value">${esc(p.wa||p.noWa||"-")}</div></div>
    <div class="info-box"><div class="label">Jenis Transaksi</div><div class="value">Penjualan Produk</div></div>
    <div class="info-box"><div class="label">Pembayaran</div><div class="value">${esc(d.metodePembayaran||"Tunai")}</div></div>
  </div>
  <div class="section">
    <div class="section-title">Daftar Produk</div>
    <div class="table-wrap"><table><thead><tr><th style="width:35px">No</th><th>Produk</th><th class="num">Qty</th><th class="num">Harga</th><th class="num">Total</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>
  <div class="section"><div class="summary">
    <div class="sum-row"><span>Subtotal</span><strong>${rupiah(d.subtotal)}</strong></div>
    <div class="sum-row"><span>Diskon</span><strong>${rupiah(d.diskon)}</strong></div>
    <div class="sum-row total"><span>TOTAL</span><strong>${rupiah(d.total)}</strong></div>
    <div class="sum-row"><span>Dibayar</span><strong>${rupiah(d.dibayar)}</strong></div>
    <div class="sum-row sisa"><span>SISA</span><strong>${rupiah(d.sisa)}</strong></div>
  </div></div>
  <div class="notes"><strong>Status:</strong> ${esc(d.status||"Selesai")}${d.catatan?"<br><strong>Catatan:</strong> "+esc(d.catatan):""}</div>`;
}

function bukaPopup(){document.getElementById("modalSimpan").classList.add("show")}
function tutupPopup(){document.getElementById("modalSimpan").classList.remove("show")}
function showStatus(t){
  const b=document.getElementById("statusBox");b.textContent=t;b.classList.add("show");
  setTimeout(()=>b.classList.remove("show"),2200);
}
function simpanNota(cetak){
  dataAktif=normalisasi(dataAktif);
  const data={...dataAktif,disimpanPada:new Date().toISOString(),sumber:"nota.html"};
  try{
    const list=JSON.parse(localStorage.getItem(keySaved())||"[]");
    const idx=list.findIndex(x=>x.nomorNota===data.nomorNota);
    if(idx>=0)list[idx]=data;else list.push(data);
    localStorage.setItem(keySaved(),JSON.stringify(list));
    localStorage.setItem(keyDraft(),JSON.stringify(data));
    tutupPopup();showStatus(tabAktif==="servis"?"Nota servis tersimpan":"Nota penjualan tersimpan");
    if(cetak)setTimeout(()=>window.print(),250);
  }catch(e){alert("Gagal menyimpan nota: "+e.message)}
}
function simpanDanCetak(){simpanNota(true)}
function kembali(){if(document.referrer)history.back();else window.location.href="input.html"}

window.gantiTab=gantiTab;window.bukaPopup=bukaPopup;window.tutupPopup=tutupPopup;
window.simpanNota=simpanNota;window.simpanDanCetak=simpanDanCetak;window.kembali=kembali;

window.addEventListener("DOMContentLoaded",()=>{
  tampilkanProfilAkun();
  const params=new URLSearchParams(location.search);
  const jenis=params.get("jenis");
  if(jenis==="penjualan"||jenis==="servis")tabAktif=jenis;
  dataAktif=normalisasi(bacaDraft());
  gantiTab(tabAktif);
});
})();
</script>
</body>
</html>
