<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFC107">
<title>FIXZY | Data Karyawan</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f5f7fb;--card:#fff;--line:#e2e8f0;--text:#172033;--muted:#64748b;--yellow:#ffc107;--orange:#f59e0b;--green:#16a34a;--red:#dc2626;--navy:#081326}
body{margin:0;background:linear-gradient(180deg,#fff,#f5f7fb 260px);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:20;background:var(--navy);border-bottom:1px solid #17233a;box-shadow:0 3px 14px #0004}
.header-in{max-width:1050px;margin:auto;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
.brandbox{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:48px;height:48px;object-fit:contain;border-radius:10px;flex:none;background:#fff}
.brand{font-size:17px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.owner{font-size:11px;color:#cbd5e1;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:7px;flex:none}
.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900}.light{background:#fff;color:#111827}.yellow{background:var(--yellow);color:#111827}.dark{background:#111827;color:#fff}.red{background:#fee2e2;color:#b91c1c}.green{background:#dcfce7;color:#166534}
.wrap{max-width:1050px;margin:auto;padding:15px 10px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 5px 20px #17203308}
.head{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}.body{padding:14px 16px}
.status{font-size:11px;color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px}label{font-size:11px;font-weight:900;color:#475569}
input,select{width:100%;height:42px;border:1px solid #cbd5e1;border-radius:10px;padding:0 11px;background:#fff;outline:none}
input:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f59e0b18}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;min-width:720px;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid var(--line);font-size:11px;text-align:left}
th{background:#f8fafc;color:#475569;font-size:10px}
.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:9px;font-weight:900}
.active{background:#dcfce7;color:#166534}.inactive{background:#fee2e2;color:#b91c1c}
.acts{display:flex;gap:5px}.mini{border:0;border-radius:8px;padding:7px 9px;font-size:9px;font-weight:900}.edit{background:#fef3c7;color:#92400e}.del{background:#fee2e2;color:#b91c1c}
@media(max-width:600px){.header-in{padding:8px 9px;min-height:64px}.logo{width:43px;height:43px}.brand{font-size:14px}.owner{font-size:10px}.actions .btn{padding:9px 10px;font-size:11px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.body,.head{padding:12px}}
</style>
</head>
<body>
<header class="header">
  <div class="header-in">
    <div class="brandbox">
      <img class="logo" src="logo.png" alt="FIXZY">
      <div>
        <div class="brand">FIXZY - DATA KARYAWAN</div>
        <div id="ownerName" class="owner">Memuat nama pemilik...</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn yellow" type="button" onclick="muatKaryawan()">↻ Refresh</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="body">
      <div id="status" class="status">Memeriksa data Firebase...</div>
    </div>
  </section>

  <section class="card">
    <div class="head">
      <span>💰 Data & Upah Karyawan</span>
      <span id="count">0 karyawan</span>
    </div>
    <div class="body">
      <div class="field">
        <label>Cari Karyawan</label>
        <input id="cari" placeholder="Cari nama, jabatan, nomor..." oninput="render()">
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nama Karyawan</th><th>Jabatan</th><th>No. HP</th><th>Upah</th><th>Status</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="5">Memuat Firebase...</td></tr></tbody>
      </table>
    </div>
  </section>

</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {getFirestore,collection,getDocs} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",
 authDomain:"fixzy-f056f.firebaseapp.com",
 projectId:"fixzy-f056f",
 storageBucket:"fixzy-f056f.firebasestorage.app",
 messagingSenderId:"838081521031",
 appId:"1:838081521031:web:50fdee909b56460b055f22"
};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
let rows=[];

const $=id=>document.getElementById(id);
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2400)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function tutupHalaman(){
 try{if(window.frameElement){window.frameElement.remove();return}}catch(e){}
 try{if(window.parent!==window){window.parent.postMessage({type:"FIXZY_CLOSE_KARYAWAN"},"*");return}}catch(e){}
 try{window.close()}catch(e){}
}
window.tutupHalaman=tutupHalaman;
window.tutupModal=()=>{$("modal").classList.remove("show")};

async function muatNamaPemilik(){
  const el=$("ownerName");
  el.textContent="Data Karyawan";
}

async function muatKaryawan(){
 $("status").textContent="Mengambil data karyawan dari Firebase...";
 try{
  const snap=await getDocs(collection(db,"karyawan"));
  rows=snap.docs.map(d=>({id:d.id,...d.data()}));
  render();
  $("status").textContent=`Firebase aktif • ${rows.length} karyawan dimuat.`;
 }catch(e){
  console.error(e);
  $("status").textContent="Gagal membaca Firebase: "+e.message;
  $("tbody").innerHTML=`<tr><td colspan="5">${esc(e.message)}</td></tr>`;
 }
}
window.muatKaryawan=muatKaryawan;
muatNamaPemilik();
muatKaryawan();

function render(){
  const q=$("cari").value.toLowerCase().trim();
  const data=rows.filter(r=>[r.nama,r.jabatan,r.hp,r.upah,r.status].join(" ").toLowerCase().includes(q));
  $("count").textContent=`${data.length} karyawan`;
  if(!data.length){
    $("tbody").innerHTML='<tr><td colspan="5" style="padding:22px;text-align:center;color:#64748b">Belum ada data karyawan.</td></tr>';
    return;
  }
  $("tbody").innerHTML=data.map(r=>`<tr>
    <td><b>${esc(r.nama||"-")}</b></td>
    <td>${esc(r.jabatan||"-")}</td>
    <td>${esc(r.hp||"-")}</td>
    <td><b>Rp ${Number(r.upah||0).toLocaleString("id-ID")}</b></td>
    <td><span class="badge ${r.status==="Aktif"?"active":"inactive"}">${esc(r.status||"Nonaktif")}</span></td>
  </tr>`).join("");
}
window.render=render;

window.render=render;
</script>
</body>
</html>
