<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#FFC107">
<title>Data Servis</title>
<style>
*{box-sizing:border-box}html,body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#1f2937}
button,input,select{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900;font-size:20px}.brand span{color:#f59e0b}
.brand{font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .top-actions{gap:5px}
 .refresh,.back{padding:8px 9px;font-size:12px}
}
.wrap{max-width:1100px;margin:14px auto;padding:0 10px 30px}
.head{background:#fff;border-radius:15px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.06);margin-bottom:12px}
h1{margin:0;font-size:22px}.sub{color:#64748b;font-size:13px;margin-top:5px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-top:14px}
input,select{border:1px solid #cbd5e1;border-radius:10px;padding:10px;background:#fff}
.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800}.reset{background:#e5e7eb}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:12px;box-shadow:0 5px 20px rgba(0,0,0,.05)}
.stat small{display:block;color:#64748b;font-size:11px}.stat b{font-size:19px;display:block;margin-top:3px}
.table-card{background:#fff;border-radius:15px;box-shadow:0 6px 24px rgba(0,0,0,.06);overflow:hidden}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px 9px;border-bottom:1px solid #e5e7eb;font-size:12px;text-align:left}th{background:#f8fafc}
.num{text-align:right}.badge{display:inline-block;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900}.ok{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}.cancel{background:#fee2e2;color:#991b1b}
.empty{padding:45px;text-align:center;color:#64748b}
.mobile{display:none}
@media(max-width:700px){
 .filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.filters button{grid-column:1/-1}
 .stats{grid-template-columns:1fr 1fr}.table-card{display:none}.mobile{display:grid;gap:8px}
 .item{background:#fff;border-radius:13px;padding:13px;box-shadow:0 5px 18px rgba(0,0,0,.06)}
 .item-top{display:flex;justify-content:space-between;gap:8px}.item h3{margin:0;font-size:14px}.line{display:flex;justify-content:space-between;gap:10px;padding-top:7px;font-size:12px}.line span:first-child{color:#64748b}
}

/* Header dan tombol disamakan dengan Dashboard Admin */
.top{
  width:100%;
  display:flex !important;
  align-items:center;
  justify-content:space-between !important;
  gap:10px;
}

.top .brand{
  order:1 !important;
  margin-right:auto !important;
  text-align:left !important;
  flex:1 1 auto !important;
  min-width:0;
  font-weight:900;
  font-size:20px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.top .top-actions{
  order:2 !important;
  margin-left:auto !important;
  display:flex !important;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex:0 0 auto;
}

#btnRefreshPage,
#btnKembaliIndex{
  border:0;
  background:#0f172a;
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

#btnRefreshPage:active,
#btnKembaliIndex:active{
  transform:scale(.97);
}

@media(max-width:600px){
  .top{
    gap:7px;
  }

  .top .top-actions{
    gap:5px;
  }

  #btnRefreshPage,
  #btnKembaliIndex{
    padding:8px 9px;
    font-size:12px;
  }
}

</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand">Nama Toko</div>

  <div class="top-actions">
    <button id="btnRefreshPage" type="button" onclick="refreshHalaman()" aria-label="Refresh halaman">
      ↻ Refresh
    </button>

    <button id="btnKembaliIndex" type="button" onclick="kembaliKeIndex()" aria-label="Kembali ke Index">
      ← Kembali
    </button>
  </div>
</header>
<main class="wrap">
<section class="head">
<h1>🔧 Data Servis</h1><div class="sub">Semua transaksi servis yang disimpan dari nota servis.</div>
<div class="filters">
<input id="q" placeholder="Cari nomor, pelanggan, HP, IMEI..." oninput="render()">
<select id="status" onchange="render()"><option value="">Semua status</option><option>Menunggu</option><option>Dikerjakan</option><option>Selesai</option><option>Diambil</option><option>Batal</option></select>
<input id="tanggal" type="date" onchange="render()">
<button class="btn reset" onclick="resetFilter()">Reset</button>
</div>
</section>
<section class="stats">
<div class="stat"><small>Jumlah Nota</small><b id="jumlah">0</b></div>
<div class="stat"><small>Omzet Aktif</small><b id="omzet">Rp0</b></div>
<div class="stat"><small>Modal Sparepart</small><b id="modal">Rp0</b></div>
<div class="stat"><small>Laba Kotor</small><b id="laba">Rp0</b></div>
</section>
<section class="table-card"><div class="table-wrap"><table><thead><tr>
<th>Nota</th><th>Tanggal</th><th>Pelanggan</th><th>HP</th><th>Sparepart</th><th>Status</th><th class="num">Total</th><th class="num">DP</th><th class="num">Sisa</th>
</tr></thead><tbody id="tbody"></tbody></table></div></section>
<section id="mobile" class="mobile"></section>
</main>

<script>
function kembaliKeIndex(){
  window.location.href = "index.html";
}

function refreshHalaman(){
  window.location.reload();
}
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",
  authDomain:"fixzy-f056f.firebaseapp.com",
  projectId:"fixzy-f056f",
  storageBucket:"fixzy-f056f.firebasestorage.app",
  messagingSenderId:"838081521031",
  appId:"1:838081521031:web:50fdee909b56460b055f22"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


const KEY="fixzy_transaksi_servis_saved";
let rows=[];
function rupiah(n){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function profile(){try{return JSON.parse(localStorage.getItem("fixzy_user_profile")||"{}")}catch(e){return {}}}
async function load(){
  try{
    rows=JSON.parse(localStorage.getItem(KEY)||"[]");
  }catch(e){
    rows=[];
  }

  const p=profile();
  document.getElementById("brand").textContent=
    p.namaKonter||p.namaToko||p.namaUsaha||p.toko||"Nama Toko";

  render();

  /* Nama toko resmi diambil langsung dari Firebase users/{uid}. */
  try{
    const user=auth.currentUser;

    if(user){
      const snap=await getDoc(doc(db,"users",user.uid));

      if(snap.exists()){
        const data=snap.data()||{};
        const namaKonter=data.namaKonter||"Nama Toko";

        document.getElementById("brand").textContent=namaKonter;

        const old=profile();
        localStorage.setItem("fixzy_user_profile",JSON.stringify({
          ...old,
          uid:user.uid,
          namaKonter:namaKonter,
          namaToko:namaKonter,
          namaUsaha:namaKonter,
          toko:namaKonter,
          namaPemilik:data.namaPemilik||old.namaPemilik||"",
          email:data.email||user.email||old.email||"",
          tanggalBerakhir:data.tanggalBerakhir||old.tanggalBerakhir||"",
          exp:data.tanggalBerakhir||old.exp||""
        }));
      }
    }
  }catch(err){
    console.warn("Gagal mengambil nama toko dari Firebase:",err);
  }
}
function active(r){return r.status!=="Batal"}
function modalRow(r){return (r.sparepart||[]).reduce((a,x)=>a+(Number(x.hargaModal)||0)*(Number(x.qty)||1),0)}
function match(r){
 const q=document.getElementById("q").value.toLowerCase().trim(),s=document.getElementById("status").value,d=document.getElementById("tanggal").value;
 const text=[r.nomorNota,r.pelanggan?.nama,r.pelanggan?.wa,r.hp?.merk,r.hp?.tipe,r.hp?.imei,r.keluhan].join(" ").toLowerCase();
 if(q&&!text.includes(q))return false;if(s&&r.status!==s)return false;
 if(d && String(r.tanggal||"").slice(0,10)!==d && !String(r.tanggal||"").includes(d))return false;return true
}
function badge(s){let c=s==="Batal"?"cancel":(s==="Selesai"||s==="Diambil"?"ok":"wait");return `<span class="badge ${c}">${esc(s||"-")}</span>`}
function render(){
 const arr=rows.filter(match);
 let omzet=0,modal=0;
 rows.forEach(r=>{if(active(r)){omzet+=Number(r.total)||0;modal+=modalRow(r)}});
 document.getElementById("jumlah").textContent=arr.length;
 document.getElementById("omzet").textContent=rupiah(omzet);
 document.getElementById("modal").textContent=rupiah(modal);
 document.getElementById("laba").textContent=rupiah(omzet-modal);
 document.getElementById("tbody").innerHTML=arr.map(r=>{
   const hp=[r.hp?.merk,r.hp?.tipe].filter(Boolean).join(" ");
   const sp=(r.sparepart||[]).map(x=>`${esc(x.nama)} ×${x.qty||1}`).join("<br>")||"-";
   return `<tr><td><b>${esc(r.nomorNota)}</b></td><td>${esc(r.tanggal)}</td><td>${esc(r.pelanggan?.nama||"Umum")}</td><td>${esc(hp||"-")}<br><small>${esc(r.hp?.imei||"")}</small></td><td>${sp}</td><td>${badge(r.status)}</td><td class="num">${rupiah(r.total)}</td><td class="num">${rupiah(r.dp)}</td><td class="num">${rupiah(r.sisa)}</td></tr>`
 }).join("")||'<tr><td colspan="9" class="empty">Belum ada data servis.</td></tr>';
 document.getElementById("mobile").innerHTML=arr.map(r=>{
   const hp=[r.hp?.merk,r.hp?.tipe].filter(Boolean).join(" ");
   return `<article class="item"><div class="item-top"><h3>${esc(r.nomorNota)}</h3>${badge(r.status)}</div>
   <div class="line"><span>Tanggal</span><b>${esc(r.tanggal)}</b></div>
   <div class="line"><span>Pelanggan</span><b>${esc(r.pelanggan?.nama||"Umum")}</b></div>
   <div class="line"><span>HP</span><b>${esc(hp||"-")}</b></div>
   <div class="line"><span>Total</span><b>${rupiah(r.total)}</b></div>
   <div class="line"><span>DP / Sisa</span><b>${rupiah(r.dp)} / ${rupiah(r.sisa)}</b></div></article>`
 }).join("")||'<div class="empty">Belum ada data servis.</div>';
}
function resetFilter(){q.value="";status.value="";tanggal.value="";render()}
function refreshHalaman(){
  window.location.reload();
}

onAuthStateChanged(auth,async user=>{
  await load();
});

window.addEventListener("message",function(e){
  if(e.data && e.data.type==="FIXZY_BACK_TO_INDEX"){
    try{
      window.top.location.href="index.html";
    }catch(err){
      window.location.href="index.html";
    }
  }
});

</script>
</body>
</html>
