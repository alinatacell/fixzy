<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY | Data Servis</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:Arial,sans-serif}
header{background:#111827;color:#fff;padding:13px 15px;display:flex;align-items:center;gap:10px}h1{font-size:17px;margin:0}.grow{flex:1}
button{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.refresh{background:#ffc107}.back{background:#fff}
main{max-width:1050px;margin:auto;padding:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{padding:10px 11px;border:1px solid #d1d5db;border-radius:9px;background:#fff}.search{flex:1;min-width:180px}
.stats{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:11px;margin-bottom:12px;font-size:12px}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:13px}
.top{display:flex;justify-content:space-between;gap:8px}.name{font-weight:900;font-size:14px}.small{font-size:11px;color:#6b7280;margin-top:3px}
.badge{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#fef3c7;color:#92400e;height:max-content}
.info{font-size:12px;line-height:1.6;margin-top:10px}.actions{display:flex;gap:7px;margin-top:11px}.actions button{flex:1;background:#111827;color:#fff}
.empty{background:#fff;border-radius:12px;padding:30px;text-align:center;color:#6b7280}
.err{color:#b91c1c;white-space:pre-wrap}
</style></head><body>
<header><h1>🔧 Data Servis</h1><div class="grow"></div><button class="refresh" onclick="load()">↻ Refresh</button></header>
<main>
<div class="bar"><input id="search" class="search" placeholder="Cari pelanggan, HP, nota, teknisi..."><select id="filter"><option value="semua">Semua Status</option><option>masuk</option><option>proses</option><option>selesai</option><option>diambil</option><option>batal</option></select></div>
<div class="stats">Firebase `/servis` • Total: <b id="total">0</b> • <span id="akun">memeriksa akun...</span></div>
<div id="list" class="list"><div class="empty">Memuat Firebase...</div></div>
</main><div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;padding:15px;overflow:auto"><div style="max-width:520px;margin:30px auto;background:#fff;border-radius:15px;padding:16px"><h2 style="margin:0 0 12px">Edit Data Servis</h2><input id="eId" type="hidden"><div style="display:grid;gap:9px"><input id="eNama" placeholder="Nama pelanggan"><input id="eHp" placeholder="No WhatsApp"><input id="eTipe" placeholder="Merk / tipe HP"><input id="eTeknisi" placeholder="Teknisi"><input id="eKeluhan" placeholder="Kerusakan / keluhan"><input id="eBiaya" type="number" placeholder="Biaya"><input id="eDp" type="number" placeholder="DP"><select id="eStatus"><option value="masuk">Masuk</option><option value="proses">Proses</option><option value="selesai">Selesai</option><option value="diambil">Diambil</option><option value="batal">Batal</option></select><textarea id="eCatatan" placeholder="Catatan" style="min-height:80px;padding:10px;border:1px solid #d1d5db;border-radius:9px"></textarea><div style="display:flex;gap:8px"><button onclick="closeEdit()" style="flex:1;background:#e5e7eb">Batal</button><button onclick="saveEdit()" style="flex:1;background:#ffc107">Simpan</button></div></div></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,updateDoc,doc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={
 apiKey:"AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",
 authDomain:"fixzy-f056f.firebaseapp.com",
 projectId:"fixzy-f056f",
 storageBucket:"fixzy-f056f.firebasestorage.app",
 messagingSenderId:"838081521031",
 appId:"1:838081521031:web:50fdee909b56460b055f22"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let uid="",rows=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=v=>"Rp "+Number(v||0).toLocaleString("id-ID");
function render(){
 const q=$("search").value.toLowerCase(), f=$("filter").value;
 const a=rows.filter(x=> (f==="semua" || String(x.status||"masuk")===f) && (!q || JSON.stringify(x).toLowerCase().includes(q)));
 $("total").textContent=a.length;
 $("list").innerHTML=a.length?a.map(x=>`<article class="card">
  <div class="top"><div><div class="name">${esc(x.pelanggan?.nama||x.namaPelanggan||"Pelanggan")}</div>
  <div class="small">${esc(x.nomorNota||x.idServis||"-")} • ${esc(x.tanggal||"")}</div></div>
  <span class="badge">${esc(x.status||"masuk")}</span></div>
  <div class="info">📱 ${esc(x.tipe||x.tipeHp||"-")}<br>📞 ${esc(x.pelanggan?.wa||x.noHp||"-")}<br>🔧 Teknisi: ${esc(x.namaTeknisi||x.teknisi||"-")}<br>📝 ${esc(x.keluhan||x.kerusakan||"-")}<br>💰 Biaya: <b>${money(x.total??x.biaya)}</b> • DP: ${money(x.dp)}</div>
  <div class="actions">
   <button onclick="editData('${x.id}')">Edit</button>
   <button onclick="status('${x.id}','proses')">Proses</button>
   <button onclick="status('${x.id}','selesai')">Selesai</button>
   <button onclick="hapus('${x.id}')">Hapus</button>
  </div></article>`).join(""):`<div class="empty">Tidak ada data servis.</div>`;
}
async function load(){
 if(!uid)return;$("list").innerHTML='<div class="empty">Membaca Firebase...</div>';
 try{const snap=await getDocs(query(collection(db,"servis"),where("uid","==",uid)));rows=snap.docs.map(d=>({id:d.id,...d.data()}));rows.sort((a,b)=>String(b.tanggal||"").localeCompare(String(a.tanggal||"")));render();}
 catch(e){$("list").innerHTML=`<div class="empty err">Gagal membaca Firebase:\n${e.message}</div>`}
}
window.load=load;
window.status=async(id,s)=>{
 const x=rows.find(r=>r.id===id); if(!x)return;
 if(!confirm(`Ubah status menjadi ${s.toUpperCase()}?`))return;
 try{
  const update={status:s,updatedAt:serverTimestamp()};
  if(s==='selesai'||s==='diambil')update.tanggalSelesai=serverTimestamp();
  if(s==='batal')update.tanggalBatal=serverTimestamp();
  await updateDoc(doc(db,'servis',id),update);
  await load();
  const raw=String(x.pelanggan?.wa||x.noHp||'').replace(/\D/g,'');
  const wa=raw?(raw.startsWith('0')?'62'+raw.slice(1):raw):'';
  if(wa){
   const nama=x.pelanggan?.nama||x.namaPelanggan||'Pelanggan';
   const nota=x.nomorNota||x.idServis||'';
   const msg=`Halo ${nama}, informasi servis HP Anda.\nNota: ${nota}\nStatus servis sekarang: ${s.toUpperCase()}.\nTerima kasih. - FIXZY`;
   window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`,'_blank');
  }else alert('Status berhasil diubah. Nomor WhatsApp pelanggan belum tersedia.');
 }catch(e){alert(e.message)}
};
window.editData=id=>{
 const x=rows.find(r=>r.id===id);if(!x)return;
 $('eId').value=id;$('eNama').value=x.pelanggan?.nama||x.namaPelanggan||'';$('eHp').value=x.pelanggan?.wa||x.noHp||'';$('eTipe').value=x.tipe||x.tipeHp||'';$('eTeknisi').value=x.namaTeknisi||x.teknisi||'';$('eKeluhan').value=x.keluhan||x.kerusakan||'';$('eBiaya').value=x.total??x.biaya??0;$('eDp').value=x.dp??0;$('eStatus').value=x.status||'masuk';$('eCatatan').value=x.catatan||'';$('editModal').style.display='block';
};
window.closeEdit=()=>{$('editModal').style.display='none'};
window.saveEdit=async()=>{
 const id=$('eId').value;try{
  await updateDoc(doc(db,'servis',id),{namaPelanggan:$('eNama').value.trim(),noHp:$('eHp').value.trim(),tipeHp:$('eTipe').value.trim(),teknisi:$('eTeknisi').value.trim(),kerusakan:$('eKeluhan').value.trim(),biaya:Number($('eBiaya').value)||0,dp:Number($('eDp').value)||0,status:$('eStatus').value,catatan:$('eCatatan').value.trim(),updatedAt:serverTimestamp()});
  closeEdit();await load();alert('Data servis berhasil diperbarui');
 }catch(e){alert(e.message)}
};
window.hapus=async id=>{if(!confirm("Hapus data servis ini?"))return;try{await deleteDoc(doc(db,"servis",id));await load()}catch(e){alert(e.message)}};
$("search").oninput=render;$("filter").onchange=render;
onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html";return}uid=u.uid;$("akun").textContent=u.email||"Login";await load()});
</script></body></html>
