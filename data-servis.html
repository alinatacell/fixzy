<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY | Data Servis - FIX WA JALAN</title>
<style>
*{box-sizing:border-box}:root{--black:#111827;--yellow:#facc15;--bg:#eef2f6;--green:#047857}
body{margin:0;background:var(--bg);color:#111827;font-family:Arial}
header{background:#111827;color:#fff;padding:10px 14px;position:sticky;top:0;z-index:90;display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;background:#000;border-radius:14px;display:flex;align-items:center;justify-content:center;border:2px solid #facc15}
.brand b{font-size:18px}.brand small{color:#9ca3af;font-size:11px}
.btn{padding:9px 14px;border-radius:12px;font-weight:800;font-size:12px;border:2px solid #111827;cursor:pointer}
.btn-refresh{background:#1e293b;color:#fff}.btn-moon{background:#1e293b;color:#fff;width:44px;height:44px}
main{max-width:1280px;margin:auto;padding:14px}
.card{background:#fff;border:2px solid #111827;border-radius:14px;box-shadow:4px 4px 0 #111827;margin-bottom:14px;padding:12px 14px}
.table-wrap{overflow:auto;border:3px solid #111827;border-radius:12px;box-shadow:5px 5px 0 #111827;background:#fff}
table{width:100%;border-collapse:collapse;min-width:1180px;font-size:11.5px}
th,td{padding:9px 8px;border-bottom:1px solid #d1d5db;text-align:left}
th{background:#111827;color:#fff;font-size:10px;position:sticky;top:0}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-weight:900;font-size:9px;border:2px solid #111827}
.status-masuk{background:#dbeafe;color:#1d4ed8}.status-selesai{background:#dcfce7;color:#15803d}.status-diambil{background:#d1fae5;color:#047857}.status-batal{background:#fee2e2;color:#dc2626}
.mini{border:2px solid #111827;border-radius:9px;padding:6px 9px;font-weight:900;cursor:pointer;box-shadow:2px 2px 0 #111827;font-size:11px;background:#fff}
.cards{display:none;gap:10px}.servis-card{background:#fff;border:2px solid #111827;border-radius:14px;box-shadow:4px 4px 0 #111827;padding:12px}
.popup{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:1000;padding:12px}.popup.show{display:flex}
.popup-box{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border:3px solid #111827;border-radius:16px;box-shadow:8px 8px 0 #111827;padding:17px}
.wa-box{margin-top:10px;padding:11px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;white-space:pre-wrap;font-size:11px;max-height:220px;overflow:auto}
@media(max-width:700px){.table-wrap{display:none}.cards{display:grid}}
</style>
</head>
<body>
<header><div class="logo"><img src="logo.png" alt="logo"></div><div class="brand"><b>FIXZY - DATA SERVIS</b><small id="konterInfo">Memuat...</small></div><div style="margin-left:auto;display:flex;gap:8px"><button class="btn btn-refresh" onclick="location.reload()">↻ Refresh</button><button class="btn btn-moon" onclick="document.body.classList.toggle('dark')">🌙</button></div></header>
<main>
<div class="card" id="dataStats">Memuat data servis...</div>
<div class="card">
<div style="display:grid;grid-template-columns:1.4fr .9fr .7fr;gap:10px"><div><label>CARI</label><input id="q" placeholder="Nota, nama, WA..."></div><div><label>STATUS</label><select id="fStatus"><option value="">Semua</option><option value="masuk">Masuk</option><option value="proses">Proses</option><option value="selesai">Selesai</option><option value="diambil">Diambil</option><option value="batal">Batal</option></select></div><div><label>TANGGAL</label><input id="fTanggal" type="date"></div></div>
<div id="statusMsg" style="font-size:11px;color:#64748b;margin-top:8px">Menunggu login...</div>
</div>
<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Nota</th><th>Pelanggan & WA</th><th>Servisan</th><th>Produk</th><th>Total</th><th>Pendapatan</th><th>Status & Aksi</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="cards" id="cards"></div>
</main>

<div class="popup" id="editPopup"><div class="popup-box"><h3 id="editTitle">Edit Status</h3><div id="editBody"></div><label>UBAH STATUS</label><select id="newStatus"><option value="masuk">Masuk</option><option value="nunggu_sparepart">Nunggu Sparepart</option><option value="proses">Proses</option><option value="selesai">Selesai</option><option value="diambil">Diambil</option><option value="batal">Batal</option></select><div style="display:flex;gap:7px;margin-top:12px"><button class="mini" onclick="document.getElementById('editPopup').classList.remove('show')">Batal</button><button class="mini" style="background:#111827;color:#fff" onclick="simpanStatus()">💾 Simpan & Kirim WA</button></div></div></div>

<div class="popup" id="waPopup"><div class="popup-box"><h3>📲 Konfirmasi WA Pelanggan</h3><div id="waInfo" style="font-size:12px"></div><div class="wa-box" id="waText"></div><div style="display:flex;gap:7px;margin-top:12px"><a id="waLinkBtn" href="#" target="_blank" style="flex:1;text-align:center;padding:11px;background:#25D366;color:#fff;border-radius:10px;text-decoration:none;font-weight:900;border:2px solid #111827">📲 Buka WhatsApp</a><button class="mini" onclick="salinWA()">📋 Salin</button><button class="mini" onclick="document.getElementById('waPopup').classList.remove('show')">Tutup</button></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocsFromServer, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(cfg);const auth=getAuth(app);const db=getFirestore(app);
let uid="",ownerUid="",profile={},allRows=[],editId=null,pendingWA=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>"Rp "+(Number(n)||0).toLocaleString("id-ID");
const getStatus=r=>String(r.status||"masuk").toLowerCase();
const getNota=r=>r.nomorNota||r.nota||"-";
const getNama=r=>r.pelanggan?.nama||r.nama||"-";
const getWa=r=>r.pelanggan?.wa||r.noHp||r.wa||"";
const getProduk=r=>r.produkDigunakan||r.produk||"-";
const getTotal=r=>Number(r.total||0);
const getDiskon=r=>Number(r.diskon||0);
const getDP=r=>Number(r.dp||0);
function getPendapatan(r){ return getStatus(r)!=="diambil"?0:getTotal(r)-getDiskon(r); }
function nomorWA(v){ let s=String(v||"").replace(/[^0-9]/g,""); if(!s) return ""; if(s.startsWith("0")) s="62"+s.slice(1); else if(s.startsWith("8")) s="62"+s; else if(!s.startsWith("62")) s="62"+s; return s; }
function konterName(){ return profile.namaKonter||"FIXZY"; }
function buildPesanWA(r,st){
  const nama=getNama(r),nota=getNota(r),konter=konterName(),produk=getProduk(r),total=getTotal(r);
  if(st==="selesai") return `Halo Kak ${nama} 🎉\n\nServis Nota ${nota} di ${konter} sudah SELESAI ✅\nProduk: ${produk}\nTotal: ${money(total)}\nSilakan ambil di konter 🙏\n${konter}`;
  if(st==="diambil") return `Halo Kak ${nama} 🙏\nTerima kasih sudah ambil Nota ${nota} di ${konter}.\nTotal: ${money(total)}\n${konter}`;
  return `Halo Kak ${nama},\nStatus Nota ${nota} di ${konter} menjadi ${st.toUpperCase()}\nProduk: ${produk}\n${konter}`;
}
async function loadProfile(user){ const snap=await getDoc(doc(db,"users",user.uid)); profile=snap.data()||{}; ownerUid=(profile.role==="owner"||profile.isOwner)?user.uid:(profile.ownerUid||user.uid); uid=user.uid; $("konterInfo").textContent=profile.namaKonter||"FIXZY"; }
async function getOwned(){ const map=new Map(); async function ambil(f,v){ try{ const q=query(collection(db,"servis"),where(f,"==",v)); const s=await getDocsFromServer(q); s.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()})); }catch(e){} } await ambil("ownerUid",ownerUid); return [...map.values()]; }
async function muatSemua(){ const rows=await getOwned(); allRows=rows; render(); $("dataStats").innerHTML=`<b>${rows.length}</b> data servis • Konter: ${konterName()}`; $("statusMsg").textContent=`✅ ${rows.length} servis`; }
function render(){
  const q=($("q").value||"").toLowerCase(); const f=($("fStatus").value||"").toLowerCase();
  const filtered=allRows.filter(r=>{ const hay=[getNota(r),getNama(r),getProduk(r)].join(" ").toLowerCase(); if(q&&!hay.includes(q)) return false; if(f&&getStatus(r)!==f) return false; return true; });
  $("tbody").innerHTML=filtered.map(r=>`<tr><td>${r.tanggal||""}</td><td><b>${getNota(r)}</b></td><td>${getNama(r)}<br><small>${getWa(r)}</small></td><td>${r.tipeHp||"-"}</td><td>${getProduk(r)}</td><td>${money(getTotal(r))}</td><td style="color:#047857;font-weight:900">${money(getPendapatan(r))}</td><td><span class="badge status-${getStatus(r)}">${getStatus(r)}</span><br><button class="mini" onclick="bukaEdit('${r.id}')">Edit</button> <button class="mini" style="background:#25D366;color:#fff" onclick="kirimWALangsung('${r.id}')">WA</button></td></tr>`).join("");
  $("cards").innerHTML=filtered.map(r=>`<div class="servis-card"><div style="display:flex;justify-content:space-between"><b>${getNota(r)}</b><span class="badge status-${getStatus(r)}">${getStatus(r)}</span></div><div style="font-size:11px;margin-top:6px">Pelanggan: ${getNama(r)}<br>Produk: ${getProduk(r)}<br>Total: ${money(getTotal(r))}</div><div style="margin-top:8px;display:flex;gap:6px"><button class="mini" onclick="bukaEdit('${r.id}')">Edit</button><button class="mini" style="background:#25D366;color:#fff" onclick="kirimWALangsung('${r.id}')">WA</button></div></div>`).join("");
}
window.bukaEdit=id=>{ const r=allRows.find(x=>x.id===id); editId=id; $("editTitle").textContent="Edit - "+getNota(r); $("editBody").innerHTML=`Nota: ${getNota(r)}<br>Pelanggan: ${getNama(r)}<br>Produk: ${getProduk(r)}<br>Total: ${money(getTotal(r))}`; $("newStatus").value=getStatus(r); $("editPopup").classList.add("show"); };
window.simpanStatus=async()=>{
  if(!editId) return; const r=allRows.find(x=>x.id===editId); const newSt=$("newStatus").value;
  try{
    await updateDoc(doc(db,"servis",editId),{status:newSt,statusTerakhir:newSt,updatedAt:serverTimestamp(), ...(newSt==="diambil"?{pendapatan:getPendapatan({...r,status:'diambil'})}:{})});
    document.getElementById('editPopup').classList.remove('show'); await muatSemua();
    const pesan=buildPesanWA(r,newSt); const waNomor=nomorWA(getWa(r));
    if(!waNomor){ alert("No WA kosong, status disimpan: "+newSt); return; }
    pendingWA={phone:waNomor,message:pesan};
    $("waInfo").innerHTML=`Status <b>${esc(newSt)}</b> disimpan ✅<br>WA ke <b>${esc(getNama(r))}</b> (${esc(waNomor)})`;
    $("waText").textContent=pesan;
    const link="https://wa.me/"+waNomor+"?text="+encodeURIComponent(pesan);
    $("waLinkBtn").href=link;
    $("waLinkBtn").onclick=(e)=>{ e.preventDefault(); window.open(link,'_blank'); };
    $("waPopup").classList.add("show");
  }catch(e){ alert("Gagal: "+e.message); }
};
window.kirimWALangsung=id=>{
  const r=allRows.find(x=>x.id===id); if(!r) return; const st=getStatus(r); const pesan=buildPesanWA(r,st); const waNomor=nomorWA(getWa(r));
  if(!waNomor){ alert("No WA kosong"); return; }
  pendingWA={phone:waNomor,message:pesan};
  $("waInfo").innerHTML=`Kirim WA manual - Nota <b>${esc(getNota(r))}</b> Status <b>${esc(st)}</b>`;
  $("waText").textContent=pesan;
  const link="https://wa.me/"+waNomor+"?text="+encodeURIComponent(pesan);
  $("waLinkBtn").href=link;
  $("waLinkBtn").onclick=(e)=>{ e.preventDefault(); window.open(link,'_blank'); };
  $("waPopup").classList.add("show");
};
window.salinWA=async()=>{ if(!pendingWA) return; try{ await navigator.clipboard.writeText(pendingWA.message); alert("Disalin ✅"); }catch{ document.getSelection().selectAllChildren($("waText")); document.execCommand("copy"); alert("Disalin ✅"); } };
$("q").addEventListener("input",render); $("fStatus").addEventListener("change",render); $("fTanggal").addEventListener("change",render);
onAuthStateChanged(auth,async user=>{ if(!user){ location.replace("login.html"); return; } await loadProfile(user); await muatSemua(); });
</script>
</body>
</html>
