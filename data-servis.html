<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" rel="stylesheet">
<title>FIXZY | Data Servis - FIXED ISOLASI</title>
<style>
*{box-sizing:border-box}
:root{--black:#111827;--yellow:#facc15;--bg:#eef2f6}
body{margin:0;background:var(--bg);color:#111827;font-family:Arial,Helvetica,sans-serif}
header{background:#111827;color:#fff;padding:10px 14px;position:sticky;top:0;z-index:50}
.penjualan-style-header{margin:0;padding:10px 14px;background:#111827;color:#fff;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;border-bottom:1px solid #1e293b}
.logo{width:52px;height:52px;background:#000;border-radius:14px;display:flex;align-items:center;justify-content:center;border:2px solid #facc15;overflow:hidden;flex:0 0 52px}
.logo img{width:100%;height:100%;object-fit:contain;padding:4px;background:#000;border-radius:10px}
.brand{line-height:1.2;min-width:0}
.brand b{color:#fff;font-weight:900;font-size:18px;letter-spacing:.5px}
.brand small{display:block;margin-top:2px;color:#9ca3af;font-size:11px;font-weight:700}
.header-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{padding:9px 14px;border-radius:12px;font-weight:800;font-size:12px;border:2px solid #111827;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-refresh{background:#1e293b;color:#fff;border-color:#334155}.btn-refresh:hover,.btn-moon:hover{background:#facc15;color:#000}
.btn-moon{background:#1e293b;color:#fff;border-color:#334155;width:44px;height:44px;padding:0;font-size:18px}
main{max-width:1180px;margin:auto;padding:14px}
.card,.dataStats,.status-filter-card{background:#fff;border:2px solid var(--black);border-radius:14px;box-shadow:4px 4px 0 var(--black);margin-bottom:14px}
.dataStats{padding:12px 14px;font-size:13px}.dataStats b{font-weight:900}.incomeText{color:#047857!important}
.status-filter-card{padding:15px}
.search-panel-title{font-size:16px;font-weight:900;margin-bottom:12px;padding-bottom:9px;border-bottom:2px solid #111827}
.search-panel-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(150px,.8fr) minmax(170px,.9fr);gap:10px;align-items:end}
.searchLabel,.status-box>label{display:block;font-size:11px;font-weight:900;margin-bottom:5px}
input,select,textarea{width:100%;padding:11px;border:2px solid var(--black);border-radius:10px;background:#fff;font:inherit;box-shadow:2px 2px 0 var(--black)}
select{height:46px;font-weight:800}
button.action,.mini{border:2px solid var(--black);border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer;box-shadow:2px 2px 0 var(--black)}
button.action:active,.mini:active,.btn:active{transform:translate(2px,2px);box-shadow:none}
.primary{background:var(--black);color:#fff}.secondary{background:#fff;color:#111827}.danger{background:#fee2e2;color:#991b1b;border-color:#991b1b!important}
.table-wrap{overflow:auto;border:3px solid var(--black);border-radius:12px;box-shadow:5px 5px 0 var(--black)}
table{width:100%;border-collapse:collapse;min-width:1260px;font-size:12px}
th,td{padding:9px;border-bottom:1px solid #d1d5db;text-align:left;vertical-align:middle}
th{background:var(--black);color:#fff;font-size:11px;position:sticky;top:0;z-index:1}
tr:hover td{background:#fffbeb}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-weight:900;font-size:10px;border:2px solid var(--black);white-space:nowrap}
.status-masuk{background:#dbeafe;color:#1d4ed8}.status-nunggu{background:#ffedd5;color:#c2410c}.status-proses{background:#ede9fe;color:#7c3aed}.status-selesai{background:#dcfce7;color:#15803d}.status-diambil{background:#d1fae5;color:#047857}.status-batal{background:#fee2e2;color:#dc2626}
.muted,.info{color:#667085}.actions{display:flex;gap:5px;flex-wrap:wrap}.mini{padding:6px 8px;font-size:11px;white-space:nowrap}
.empty{text-align:center;color:#667085;padding:25px}
.popup{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:1000;padding:12px}
.popup.show{display:flex}
.popup-box{width:min(620px,calc(100% - 10px));max-height:92vh;overflow:auto;background:#fff;border:3px solid var(--black);border-radius:16px;box-shadow:8px 8px 0 var(--black);padding:17px}
.popup-box h3{background:var(--black);color:#fff;margin:-17px -17px 14px;padding:13px 15px;border-radius:12px 12px 0 0}
.status-msg{font-size:11px;color:#64748b;margin:8px 0}
</style>
</head>
<body>
<header class="penjualan-style-header">
<div class="logo"><img src="logo.png" alt="logo"></div>
<div class="brand"><b>FIXZY - DATA SERVIS</b><small id="konterInfo">Memuat...</small></div>
<div class="header-right">
<button class="btn btn-refresh" onclick="refreshData()">↻ Refresh</button>
<button class="btn btn-moon" onclick="toggleDark()">🌙</button>
</div>
</header>
<main>
<div class="dataStats" id="dataStats">Memuat data servis...</div>
<div class="status-filter-card">
<div class="search-panel-title">Filter Data Servis (hanya konter ini)</div>
<div class="search-panel-grid">
<div class="search-name-box"><label class="searchLabel">CARI NAMA / NOTA / HP</label><input id="q" placeholder="Ketik nama, nota, no HP..."></div>
<div><label>CARI STATUS</label><select id="fStatus"><option value="">Semua Status</option><option value="masuk">Masuk</option><option value="nunggu_sparepart">Nunggu Sparepart</option><option value="proses">Proses</option><option value="selesai">Selesai</option><option value="diambil">Diambil</option><option value="batal">Batal</option></select></div>
<div><label>TANGGAL</label><input id="fTanggal" type="date"></div>
</div>
<div class="status-msg" id="statusMsg">Menunggu login...</div>
</div>
<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Nota</th><th>Pelanggan</th><th>HP / Kerusakan</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tbody"><tr><td colspan="7" class="empty">Memuat Firebase...</td></tr></tbody></table></div>
</main>

<div class="popup" id="detailPopup"><div class="popup-box"><h3 id="detailTitle">Detail Servis</h3><div id="detailBody"></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn secondary" onclick="closeDetail()">Tutup</button></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, getDocsFromServer, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

let uid="", ownerUid="", profile={}, allRows=[];
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(n){return "Rp "+(Number(n)||0).toLocaleString("id-ID");}
function dateVal(r){return String(r.tanggal||r.createdAt||"").slice(0,10);}
function getStatus(r){return String(r.status||"masuk").toLowerCase();}
function getNota(r){return r.nomorNota||r.id||"-";}
function getNama(r){return r.pelanggan?.nama||r.namaPelanggan||"-";}
function getHp(r){return r.servisan?.brandTipe||r.brandTipe||"-";}

async function loadProfile(user){
  const snap=await getDoc(doc(db,"users",user.uid));
  if(!snap.exists()) throw new Error("Profil tidak ditemukan");
  profile=snap.data()||{};
  const role=String(profile.role||"").toLowerCase();
  ownerUid = (role==="owner" || profile.isOwner===true) ? user.uid : (profile.ownerUid||profile.ownerId||user.uid);
  uid=user.uid;
  $("konterInfo").textContent=(profile.namaKonter||"FIXZY")+" • "+ownerUid.slice(0,6);
}

async function getOwnedServis(){
  const map=new Map();
  async function ambil(field,value){
    if(!value) return;
    try{
      const q=query(collection(db,"servis"), where(field,"==",value));
      const snap=await getDocsFromServer(q);
      snap.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));
    }catch(e){console.warn("servis",field,e.message);}
  }
  await ambil("ownerUid", ownerUid);
  await ambil("ownerId", ownerUid);
  await ambil("uid", ownerUid);
  if(ownerUid!==uid){
    await ambil("ownerUid", uid);
    await ambil("uid", uid);
  }
  return [...map.values()].sort((a,b)=>String(b.tanggal||"").localeCompare(String(a.tanggal||"")));
}

async function muatSemua(){
  if(!uid) return;
  $("statusMsg").textContent="⏳ Membaca data servis milik konter ini...";
  try{
    const rows=await getOwnedServis();
    allRows=rows;
    render();
    const total=rows.reduce((s,r)=>s+(Number(r.total||r.estimasi?.total||0)),0);
    $("dataStats").innerHTML=`<b>${rows.length}</b> data servis • Total nilai <span class="incomeText">${money(total)}</span> • Hanya milik konter ini (ownerUid: ${esc(ownerUid.slice(0,8))}...)`;
    $("statusMsg").textContent=`✅ ${rows.length} servis - isolasi ownerUid aktif. Karyawan dengan ownerUid sama bisa lihat bareng.`;
  }catch(e){
    console.error(e);
    $("statusMsg").textContent="❌ "+e.message;
    $("tbody").innerHTML=`<tr><td colspan="7" style="color:#ef4444;padding:20px">${esc(e.message)}</td></tr>`;
  }
}

function render(){
  const q=($("q").value||"").toLowerCase().trim();
  const st=($("fStatus").value||"").toLowerCase().trim();
  const tg=$("fTanggal").value||"";
  const filtered=allRows.filter(r=>{
    if(q){
      const hay=[getNota(r),getNama(r),r.pelanggan?.wa||"",getHp(r),r.servisan?.imei||""].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(st && getStatus(r)!==st) return false;
    if(tg && !String(dateVal(r)).startsWith(tg)) return false;
    return true;
  });
  if(!filtered.length){
    $("tbody").innerHTML='<tr><td colspan="7" class="empty">Belum ada servis untuk konter ini.</td></tr>';return;
  }
  $("tbody").innerHTML=filtered.map(r=>{
    const s=getStatus(r);
    return `<tr>
      <td>${esc(dateVal(r))}</td>
      <td><b>${esc(getNota(r))}</b></td>
      <td>${esc(getNama(r))}<br><small style="color:#94a3b8">${esc(r.pelanggan?.wa||"")}</small></td>
      <td>${esc(getHp(r))}<br><small>${esc(r.servisan?.jenisKerusakan||"")}</small></td>
      <td>${money(r.total||r.estimasi?.total||0)}</td>
      <td><span class="badge status-${s}">${esc(s)}</span></td>
      <td><button class="mini" onclick="lihat('${r.id}')">Lihat</button></td>
    </tr>`;
  }).join("");
}

window.lihat=id=>{
  const r=allRows.find(x=>x.id===id);
  if(!r) return;
  $("detailTitle").textContent=getNota(r)+" - "+getNama(r);
  $("detailBody").innerHTML=`
    <div style="font-size:12px;line-height:1.6">
      <b>Pelanggan:</b> ${esc(getNama(r))} (${esc(r.pelanggan?.wa||"")})<br>
      <b>HP:</b> ${esc(getHp(r))}<br>
      <b>Kerusakan:</b> ${esc(r.servisan?.jenisKerusakan||"-")}<br>
      <b>Status:</b> ${esc(getStatus(r))}<br>
      <b>Total:</b> ${money(r.total||0)}<br>
      <b>ownerUid:</b> ${esc(r.ownerUid||r.ownerId||"")}<br>
    </div>
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="mini" onclick="setStatus('${r.id}','proses')">Proses</button>
      <button class="mini" style="background:#dcfce7" onclick="setStatus('${r.id}','selesai')">Selesai</button>
      <button class="mini" style="background:#d1fae5" onclick="setStatus('${r.id}','diambil')">Diambil</button>
    </div>
  `;
  $("detailPopup").classList.add("show");
};
window.closeDetail=()=>$("detailPopup").classList.remove("show");
window.setStatus=async(id,st)=>{
  try{
    await updateDoc(doc(db,"servis",id),{status:st,statusTerakhir:st,updatedAt:serverTimestamp()});
    await muatSemua();
    closeDetail();
  }catch(e){alert("Gagal: "+e.message);}
};
window.refreshData=()=>location.reload();
window.toggleDark=()=>document.body.classList.toggle("dark");
$("q").addEventListener("input",render);
$("fStatus").addEventListener("change",render);
$("fTanggal").addEventListener("change",render);

onAuthStateChanged(auth, async user=>{
  if(!user){ location.replace("login.html"); return; }
  try{ await loadProfile(user); await muatSemua(); }
  catch(e){ $("statusMsg").textContent="❌ "+e.message; }
});
</script>
</body>
</html>
