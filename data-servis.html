<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY | Data Servis</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#172033;font-family:Inter,Arial,sans-serif}
header{background:linear-gradient(135deg,#0b1220,#172238);color:#fff;padding:15px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 14px rgba(15,23,42,.18)}
h1{font-size:20px;margin:0;font-weight:900;letter-spacing:-.3px}h1::first-letter{font-size:22px}.grow{flex:1}
button{border:0;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer;transition:.16s;box-shadow:0 2px 5px rgba(15,23,42,.08)}
button:active{transform:scale(.97)}button:hover{filter:brightness(.98);box-shadow:0 4px 10px rgba(15,23,42,.13)}
.refresh{background:#ffc107;color:#151515;padding:11px 17px;font-size:14px}.back{background:#fff;color:#111827}
main{max-width:1100px;margin:auto;padding:16px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:13px}
input,select{padding:12px 13px;border:1px solid #d7dce5;border-radius:12px;background:#fff;outline:none;font-size:14px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
input:focus,select:focus{border-color:#ffc107;box-shadow:0 0 0 3px rgba(255,193,7,.16)}
.search{flex:1;min-width:220px}
.stats{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:13px 15px;margin-bottom:13px;font-size:12px;color:#64748b;box-shadow:0 2px 8px rgba(15,23,42,.04)}
.stats b{color:#111827;font-size:14px}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px}
.card{background:#fff;border:1px solid #e4e8ef;border-radius:16px;padding:15px;box-shadow:0 3px 12px rgba(15,23,42,.05)}
.top{display:flex;justify-content:space-between;gap:10px}.name{font-weight:900;font-size:15px}.small{font-size:11px;color:#64748b;margin-top:4px}
.badge{padding:6px 10px;border-radius:999px;font-size:10px;font-weight:900;background:#fff4c2;color:#8a5a00;height:max-content;border:1px solid #ffe58a}
.info{font-size:12px;line-height:1.75;margin-top:11px;color:#334155}.info b{color:#111827}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.actions button{min-width:0!important;border-radius:12px!important;padding:12px 7px!important;font-size:12px!important;font-weight:900!important;color:#fff!important;border:0!important;box-shadow:0 3px 0 rgba(0,0,0,.12)!important;transition:.15s!important}
.actions button:active{transform:translateY(2px)!important;box-shadow:none!important}
.actions .btn-edit{background:#64748b!important}
.actions .btn-process{background:#2563eb!important}
.actions .btn-done{background:#16a34a!important}
.actions .btn-delete{background:#dc2626!important}
.empty{background:#fff;border-radius:14px;padding:32px;text-align:center;color:#64748b;border:1px solid #e4e8ef}
.err{color:#b91c1c;white-space:pre-wrap}

.modal{position:fixed;inset:0;background:rgba(8,15,29,.68);display:none;align-items:flex-start;justify-content:center;padding:14px;z-index:100;backdrop-filter:blur(3px)}
.modal.show{display:flex}.modalbox{width:min(620px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:19px;padding:18px;box-shadow:0 25px 70px rgba(0,0,0,.25)}
.modalhead{display:flex;align-items:center;gap:8px;margin-bottom:14px}.modalhead h2{margin:0;font-size:18px}.x{margin-left:auto;background:#eef1f5;color:#172033;width:38px;height:38px;padding:0}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field.full{grid-column:1/-1}
.field label{display:block;font-size:10px;font-weight:900;color:#475569;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d7dce5;border-radius:11px;background:#fff}
.field textarea{min-height:78px}.modalactions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}
.modalactions button{background:#172033;color:#fff}.modalactions .save{background:#ffc107;color:#111}
.statusbuttons{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.statusbuttons button{background:#172033;color:#fff}
@media(max-width:650px){
 header{padding:13px 12px}h1{font-size:17px}.refresh{padding:10px 13px}
 main{padding:12px}.search{min-width:150px}.list{grid-template-columns:1fr}
 .actions{grid-template-columns:1fr 1fr}.actions button{font-size:12px;padding:11px 6px}
 .formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}
 .modal{padding:8px}.modalbox{padding:14px;border-radius:16px}
}
</style></head><body>
<header><h1>🔧 Data Servis</h1><div class="grow"></div><button class="refresh" onclick="load()">↻ Refresh</button></header>
<main>
<div class="bar"><input id="search" class="search" placeholder="Cari pelanggan, HP, nota, teknisi..."><select id="filter"><option value="semua">Semua Status</option><option>masuk</option><option>proses</option><option>selesai</option><option>diambil</option><option>batal</option></select></div>
<div class="stats">☁️ Firebase `/servis` • Total: <b id="total">0</b> • <span id="akun">memeriksa akun...</span></div>
<div id="list" class="list"><div class="empty">Memuat Firebase...</div></div>
</main>

<div id="modal" class="modal">
 <div class="modalbox">
  <div class="modalhead"><h2>Edit Data Servis</h2><button class="x" onclick="closeEdit()">✕</button></div>
  <input type="hidden" id="editId">
  <div class="formgrid">
   <div class="field"><label>NAMA PELANGGAN</label><input id="eNama"></div>
   <div class="field"><label>NO. WHATSAPP</label><input id="eWa" inputmode="tel"></div>
   <div class="field full"><label>MERK / TIPE / MODEL</label><input id="eTipe"></div>
   <div class="field"><label>IMEI</label><input id="eImei"></div>
   <div class="field"><label>TEKNISI</label><input id="eTeknisi"></div>
   <div class="field full"><label>KELUHAN / KERUSAKAN</label><textarea id="eKeluhan"></textarea></div>
   <div class="field"><label>BIAYA</label><input id="eBiaya" inputmode="numeric"></div>
   <div class="field"><label>DP</label><input id="eDp" inputmode="numeric"></div>
   <div class="field"><label>STATUS</label><select id="eStatus">
    <option value="masuk">Masuk</option><option value="proses">Proses</option><option value="selesai">Selesai</option><option value="diambil">Diambil</option><option value="batal">Batal</option>
   </select></div>
   <div class="field full"><label>CATATAN</label><textarea id="eCatatan"></textarea></div>
  </div>
  <div class="modalactions">
   <button onclick="closeEdit()">Batal</button>
   <button class="save" onclick="saveEdit()">Simpan Perubahan</button>
  </div>
 </div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,getDoc,updateDoc,doc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={
 apiKey:"AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",
 authDomain:"fixzy-f056f.firebaseapp.com",
 projectId:"fixzy-f056f",
 storageBucket:"fixzy-f056f.firebasestorage.app",
 messagingSenderId:"838081521031",
 appId:"1:838081521031:web:50fdee909b56460b055f22"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let uid="",rows=[],accountName="";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=v=>"Rp "+Number(v||0).toLocaleString("id-ID");

function waNumber(v){
 const raw=String(v||"").replace(/[^\d]/g,"");
 if(!raw)return "";
 if(raw.startsWith("0"))return "62"+raw.slice(1);
 if(raw.startsWith("62"))return raw;
 return raw;
}
function waStatus(status,item){
 const n=waNumber(item.pelanggan?.wa||item.noHp);
 if(!n){alert("Nomor WhatsApp pelanggan belum ada.");return;}

 const label={
  masuk:"HP sudah diterima",
  proses:"HP sedang diproses",
  selesai:"HP sudah selesai dan siap diambil",
  diambil:"HP sudah diambil",
  batal:"Servis dibatalkan"
 }[status]||("Status servis: "+status);

 const nomor=item.nomorNota||item.idServis||item.id||"-";
 const nama=item.pelanggan?.nama||item.namaPelanggan||"Pelanggan";
 const tipe=item.tipe||item.tipeHp||"HP";
 const pengirim=(accountName||"Pengguna").trim();

 const text=
`Halo ${nama},

📍 *${pengirim}*

Kami menginformasikan status servis HP Anda:

📱 HP: ${tipe}
🧾 No. Nota: ${nomor}
📌 Status: *${label}*

Jika ada yang ingin ditanyakan, silakan hubungi kami.

Terima kasih 🙏`;

 const encoded=encodeURIComponent(text);
 const isDesktop=!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
 const url=isDesktop
   ? "https://web.whatsapp.com/send?phone="+n+"&text="+encoded
   : "https://wa.me/"+n+"?text="+encoded;
 window.open(url,"_blank");
}

async function loadAccountProfile(user){
 accountName=(user?.displayName||"").trim();
 try{
  const snap=await getDoc(doc(db,"users",user.uid));
  if(snap.exists()){
   const d=snap.data()||{};
   accountName=String(
    d.namaUsaha||d.namaToko||d.nama||d.namaAkun||d.displayName||accountName||user.email||"Toko"
   ).trim();
  }
 }catch(e){
  console.warn("Profil pengguna tidak dapat dibaca:",e);
 }
 if(!accountName)accountName=user.email||"Toko";
}
window.edit=id=>{
 const x=rows.find(a=>a.id===id); if(!x)return;
 $("editId").value=id;
 $("eNama").value=x.pelanggan?.nama||x.namaPelanggan||"";
 $("eWa").value=x.pelanggan?.wa||x.noHp||"";
 $("eTipe").value=x.tipe||x.tipeHp||"";
 $("eImei").value=x.imei||"";
 $("eTeknisi").value=x.namaTeknisi||x.teknisi||"";
 $("eKeluhan").value=x.keluhan||x.kerusakan||"";
 $("eBiaya").value=x.biaya??x.total??0;
 $("eDp").value=x.dp||0;
 $("eStatus").value=x.status||"masuk";
 $("eCatatan").value=x.catatan||"";
 $("modal").classList.add("show");
};
window.closeEdit=()=>$("modal").classList.remove("show");
window.saveEdit=async()=>{
 const id=$("editId").value,x=rows.find(a=>a.id===id);if(!id||!x)return;
 const oldStatus=x.status||"masuk",newStatus=$("eStatus").value;
 const payload={
  namaPelanggan:$("eNama").value.trim(),noHp:$("eWa").value.trim(),
  tipeHp:$("eTipe").value.trim(),imei:$("eImei").value.trim(),
  teknisi:$("eTeknisi").value.trim(),kerusakan:$("eKeluhan").value.trim(),
  biaya:Number(String($("eBiaya").value).replace(/[^\d]/g,""))||0,
  dp:Number(String($("eDp").value).replace(/[^\d]/g,""))||0,
  status:newStatus,catatan:$("eCatatan").value.trim(),
  updatedAt:serverTimestamp()
 };
 payload.total=payload.biaya;payload.sisa=Math.max(0,payload.total-payload.dp);
 try{
  await updateDoc(doc(db,"servis",id),payload);
  $("modal").classList.remove("show");
  await load();
  if(newStatus!==oldStatus)waStatus(newStatus,{...x,...payload});
 }catch(e){alert("Gagal menyimpan perubahan:\\n"+e.message)}
};
function render(){
 const q=$("search").value.toLowerCase(), f=$("filter").value;
 const a=rows.filter(x=> (f==="semua" || String(x.status||"masuk")===f) && (!q || JSON.stringify(x).toLowerCase().includes(q)));
 $("total").textContent=a.length;
 $("list").innerHTML=a.length?a.map(x=>`<article class="card">
  <div class="top"><div><div class="name">${esc(x.pelanggan?.nama||x.namaPelanggan||"Pelanggan")}</div>
  <div class="small">${esc(x.nomorNota||x.idServis||"-")} • ${esc(x.tanggal||"")}</div></div>
  <span class="badge">${esc(x.status||"masuk")}</span></div>
  <div class="info">📱 ${esc(x.tipe||x.tipeHp||"-")}<br>📞 ${esc(x.pelanggan?.wa||x.noHp||"-")}<br>🔧 Teknisi: ${esc(x.namaTeknisi||x.teknisi||"-")}<br>📝 ${esc(x.keluhan||x.kerusakan||"-")}<br>💰 Biaya: <b>${money(x.total??x.biaya)}</b> • DP: ${money(x.dp)}</div>
  <div class="actions">
   <button title="Edit data" onclick="edit('${x.id}')">✏️ Edit</button>
   <button title="Ubah ke proses" onclick="status('${x.id}','proses')">🔧 Proses</button>
   <button title="Ubah ke selesai" onclick="status('${x.id}','selesai')">✅ Selesai</button>
   <button title="Hapus data" onclick="hapus('${x.id}')">🗑️ Hapus</button>
  </div></article>`).join(""):`<div class="empty">Tidak ada data servis.</div>`;
}
async function load(){
 if(!uid)return;$("list").innerHTML='<div class="empty">Membaca Firebase...</div>';
 try{const snap=await getDocs(query(collection(db,"servis"),where("uid","==",uid)));rows=snap.docs.map(d=>({id:d.id,...d.data()}));rows.sort((a,b)=>String(b.tanggal||"").localeCompare(String(a.tanggal||"")));render();}
 catch(e){$("list").innerHTML=`<div class="empty err">Gagal membaca Firebase:\n${e.message}</div>`}
}
window.load=load;
window.status=async(id,s)=>{
 const x=rows.find(a=>a.id===id);if(!x)return;
 if(!confirm(`Ubah status menjadi "${s}"?`))return;
 try{
  await updateDoc(doc(db,"servis",id),{status:s,updatedAt:serverTimestamp()});
  await load();
  waStatus(s,{...x,status:s});
 }catch(e){alert(e.message)}
};
window.hapus=async id=>{if(!confirm("Hapus data servis ini?"))return;try{await deleteDoc(doc(db,"servis",id));await load()}catch(e){alert(e.message)}};
$("search").oninput=render;$("filter").onchange=render;
onAuthStateChanged(auth,async u=>{
 if(!u){location.href="login.html";return}
 uid=u.uid;
 $("akun").textContent=u.email||"Login";
 await loadAccountProfile(u);
 await load();
});
</script></body></html>
