<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY | Data Penjualan - RINGKASAN DI ATAS</title>
<style>
:root{--black:#0b0f14;--black2:#111827;--yellow:#ffc107;--bg:#eef2f6;--card:#fff;--text:#111827;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;background:var(--bg)!important;background-image:none!important;font-family:Arial}
header{position:sticky;top:0;z-index:9999;background:var(--black)!important;color:#fff;border-bottom:3px solid var(--yellow)}
.head{max-width:1180px;margin:auto;min-height:72px;padding:9px 12px;display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;flex:0 0 52px;border-radius:13px;background:#000;border:1px solid #334155;padding:4px;object-fit:contain}.brand b{display:block;font-size:17px}.brand small{display:block;margin-top:3px;font-size:10px;color:#cbd5e1;max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.spacer{flex:1}.head-btn{height:44px;border:1px solid #ffffff30;border-radius:9px;padding:0 12px;font-weight:900;cursor:pointer}.refresh{background:transparent;color:#fff}.back{background:#1f2937;color:#fff}
main{max-width:1180px;margin:auto;padding:14px;position:relative;z-index:1}
.card{background:#fff;border:2px solid #111827;border-radius:14px;padding:15px;margin-bottom:15px;box-shadow:4px 4px 0 #111827}.card-title{font-size:16px;font-weight:900;padding-bottom:9px;margin-bottom:12px;border-bottom:2px solid #111827}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:9px}label{display:block;font-size:10px;font-weight:900;color:#4b5563;margin:0 0 5px}input,select{width:100%;min-height:43px;padding:9px 10px;border:2px solid #111827;border-radius:9px;background:#fff;font:inherit}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 #111827}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #111827}.primary{background:#ffc107;color:#111}.dark{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.wa{background:#22c55e;color:#052e16}
.summary{background:#111827;color:#fff;border:2px solid #111827;border-radius:14px;padding:14px;margin-bottom:15px;box-shadow:4px 4px 0 #111827;font-size:13px;line-height:1.6;position:sticky;top:74px;z-index:10}
.summary b{color:#ffc107}.summary .green{color:#4ade80}.summary .yellow{color:#fde68a}
.sales{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.sale{background:#fff;border:2px solid #111827;border-radius:15px;padding:14px;box-shadow:4px 4px 0 #111827}
.sale-head{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #dbe1e8;padding-bottom:9px;margin-bottom:5px}.nota{font-size:18px;font-weight:900}.date{font-size:11px;color:#64748b}.barcode{display:inline-block;background:#111827;color:#fff;border-radius:5px;padding:3px 6px;font-size:9px;margin-top:5px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;border:1px solid #111827;font-size:10px;font-weight:900}.masuk{background:#dbeafe;color:#1d4ed8}.tagihan{background:#fef3c7;color:#92400e}.tunai{background:#dcfce7;color:#15803d}.batal{background:#fee2e2;color:#b91c1c}
.row{display:grid;grid-template-columns:115px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed #d9dee5;font-size:12px}.k{color:#4b5563}.v{text-align:right;font-weight:800}.products{line-height:1.5}.money{font-size:13px}.income{font-size:14px}.green-text{color:#15803d}.muted-text{color:#94a3b8}
.sale-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:14px;z-index:2000}.modal.show{display:flex}.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border:2px solid #111827;border-radius:14px;box-shadow:6px 6px 0 #000}.modal-head{background:#111827;color:#fff;padding:13px 15px;font-weight:900}.modal-body{padding:15px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 15px 15px}.detail{background:#f8fafc;border:1px solid #dbe1e8;border-radius:10px;padding:11px;font-size:12px;line-height:1.6}.preview{white-space:pre-wrap;background:#f8fafc;border:1px solid #dbe1e8;border-radius:10px;padding:12px;font-size:12px;max-height:280px;overflow:auto;margin-top:10px}
.prod-chip{display:inline-block;background:#fef9c3;border:1px solid #ffc107;padding:3px 6px;border-radius:6px;margin:2px;font-size:10px;font-weight:700}
@media(max-width:850px){.grid4{grid-template-columns:1fr 1fr}.sales{grid-template-columns:1fr}.summary{position:static}}
</style>
</head>
<body>
<header><div class="head"><img class="logo" src="logo.png" alt="FIXZY"><div class="brand"><b>🛒 Data Penjualan</b><small id="accountLine">Memuat akun...</small></div><div class="spacer"></div><button class="head-btn refresh" onclick="loadAll()">↻ Refresh</button><button class="head-btn back" onclick="history.back()">‹ Kembali</button></div></header>
<main>
<div id="loading" class="card">Memuat data penjualan FIXZY...</div>
<div id="page" style="display:none">
<!-- RINGKASAN PINDAH KE PALING ATAS -->
<div id="summary" class="summary">Memuat ringkasan...</div>

<section class="card"><div class="card-title">Pencarian Data Penjualan</div><div class="grid4">
<div><label>CARI NOTA / NAMA / HP / BARCODE</label><input id="search" placeholder="Ketik nota, nama, no HP, barcode, produk..."></div>
<div><label>STATUS</label><select id="status"><option value="">Semua Status</option><option value="masuk">Masuk</option><option value="tagihan">Tagihan</option><option value="tunai">Tunai</option><option value="batal">Batal</option></select></div>
<div><label>DARI TANGGAL</label><input id="from" type="date"></div><div><label>SAMPAI TANGGAL</label><input id="to" type="date"></div>
</div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="render()">Terapkan Filter</button><button class="btn secondary" onclick="resetFilter()">Reset</button><button class="btn dark" onclick="location.href='input-penjualan.html'">＋ Input Penjualan</button></div><div id="accessInfo" style="font-size:11px;color:#64748b;margin-top:9px"></div></section>

<section class="card"><div class="card-title">Data Penjualan <span id="countLabel" style="font-size:10px;color:#64748b"></span></div><div id="sales" class="sales"></div></section>
</div></main>
<div class="modal" id="modal"><div class="modal-box"><div class="modal-head" id="modalTitle">FIXZY</div><div class="modal-body" id="modalBody"></div><div class="modal-actions" id="modalActions"></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,collection,query,where,getDocs,doc,getDoc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const $=id=>document.getElementById(id);const rupiah=n=>"Rp "+(Number(n)||0).toLocaleString("id-ID");const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));let user=null,profile={},ownerUid="",all=[],filtered=[];
const pname=d=>d.pelanggan?.nama||d.namaPelanggan||d.nama||"-";const phone=d=>d.noHp||d.noWhatsapp||d.whatsapp||d.pelanggan?.wa||d.hp||"-";
const total=d=>Number(d.total??0)||0;const diskon=d=>Number(d.diskon??0)||0;const dp=d=>Number(d.dp??0)||0;const sisa=d=>Number(d.sisa??Math.max(0,total(d)-diskon(d)-dp(d)))||0;
const date=d=>typeof d.tanggal==="string"?d.tanggal.slice(0,10):(d.createdAt?.toDate?d.createdAt.toDate().toISOString().slice(0,10):"");const fmt=s=>{if(!s)return"-";let p=String(s).slice(0,10).split("-");return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:s};const st=d=>String(d.status||"masuk").toLowerCase();
function parseProduk(d){const c=[d.items,d.produkList,d.produkYangDigunakan];let found=null;for(let x of c){if(x&&(Array.isArray(x)?x.length>0:String(x).trim()!=="")){found=x;break}}if(!found){if(d.namaProduk) found=d.namaProduk; if(d.produk) found=d.produk;}if(!found) return {text:"-",chips:'<span style="color:#94a3b8">-</span>'};if(typeof found==="string") return {text:found,chips:`<span class="prod-chip">${esc(found)}</span>`};if(Array.isArray(found)){const list=found.map(i=>typeof i==="string"?i:(i.nama||i.produk||"-")).filter(Boolean);return {text:list.join(", "),chips:list.map(n=>`<span class="prod-chip">${esc(n)}</span>`).join("")};}return {text:"-",chips:'<span style="color:#94a3b8">-</span>'}}
function productText(d){return parseProduk(d).text}function productChips(d){return parseProduk(d).chips}
function income(d){return st(d)==="tunai"?(d.pendapatan!==undefined?Number(d.pendapatan)||0:Math.max(0,total(d)-diskon(d))):0}
function statusLabel(x){x=String(x||"masuk").toLowerCase();return x==="tunai"?"Tunai":x==="tagihan"?"Tagihan":x==="batal"?"Batal":"Masuk"}
function normalizePhone(v){let n=String(v||"").replace(/\D/g,"");if(!n)return"";if(n.startsWith("0"))n="62"+n.slice(1);else if(n.startsWith("8"))n="62"+n;return n}
function modalUI(title,html,buttons){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modalActions").innerHTML=buttons.map((b,i)=>`<button class="btn ${b.cls||"secondary"}" data-i="${i}">${esc(b.label)}</button>`).join("");$("modal").classList.add("show");document.querySelectorAll("#modalActions button").forEach(x=>x.onclick=()=>buttons[+x.dataset.i].fn?.())}function closeModal(){$("modal").classList.remove("show")}
async function loadSales(){let rows=[];for(const f of ["ownerUid","ownerId","uid"]){try{let s=await getDocs(query(collection(db,"penjualan"),where(f,"==",ownerUid)));s.forEach(d=>rows.push({id:d.id,...d.data()}))}catch{}}let m=new Map();rows.forEach(x=>m.has(x.id)||m.set(x.id,x));all=[...m.values()].sort((a,b)=>date(b).localeCompare(date(a)))}
function apply(){let f=$("from").value,t=$("to").value,q=$("search").value.trim().toLowerCase(),s=$("status").value;filtered=all.filter(d=>{let dt=date(d),txt=[d.nomorNota,d.nota,d.barcode,pname(d),phone(d),productText(d)].join(" ").toLowerCase();return(!f||dt>=f)&&(!t||dt<=t)&&(!s||st(d)===s)&&(!q||txt.includes(q))})}
function render(){apply();let valid=filtered.filter(d=>st(d)!=="batal"),nilai=valid.reduce((a,d)=>a+total(d),0),inc=filtered.reduce((a,d)=>a+income(d),0),tag=filtered.filter(d=>st(d)==="tagihan").reduce((a,d)=>a+sisa(d),0),tunai=filtered.filter(d=>st(d)==="tunai").length;$("summary").innerHTML=`💰 <b>${filtered.length} data penjualan</b> • Total nilai <b>${rupiah(nilai)}</b> • Pendapatan <b class="green">${rupiah(inc)}</b> • Tunai <b>${tunai}</b> • Sisa tagihan <b class="yellow">${rupiah(tag)}</b><br><small style="color:#cbd5e1">Owner: ${ownerUid.slice(0,8)} • Produk kosong: ${filtered.filter(d=>!parseProduk(d).text||parseProduk(d).text==="-").length}</small>`;$("countLabel").textContent=`• ${filtered.length} data`;if(!filtered.length){$("sales").innerHTML='<div style="padding:20px;text-align:center;color:#64748b">Tidak ada data penjualan.</div>';return}$("sales").innerHTML=filtered.map(d=>{let x=st(d);return `<article class="sale"><div class="sale-head"><div><div class="nota">${esc(d.nomorNota||d.nota||"-")}</div><div class="date">📅 ${esc(fmt(date(d)))}</div><div class="barcode">BARCODE: ${esc(d.barcode||"-")}</div></div><span class="badge ${x}">${esc(statusLabel(x).toLowerCase())}</span></div><div class="row"><div class="k">👤 Pelanggan</div><div class="v">${esc(pname(d))}<br><small style="color:#64748b">${esc(phone(d))}</small></div></div><div class="row"><div class="k">📦 Produk</div><div class="v products">${productChips(d)}</div></div><div class="row"><div class="k">💰 Total</div><div class="v money">${rupiah(total(d))}</div></div><div class="row"><div class="k">🎁 Diskon</div><div class="v">${rupiah(diskon(d))}</div></div><div class="row"><div class="k">💵 DP</div><div class="v">${rupiah(dp(d))}</div></div><div class="row"><div class="k">🧾 Sisa</div><div class="v">${rupiah(sisa(d))}</div></div><div class="row"><div class="k">📈 Pendapatan</div><div class="v income ${x==="tunai"?"green-text":"muted-text"}">${rupiah(income(d))}</div></div><div class="sale-actions"><button class="btn dark" onclick="editStatus('${esc(d.id)}')">✏️ Edit Status</button><button class="btn wa" onclick="openWA('${esc(d.id)}')">📲 WA</button></div></article>`}).join("")}
function statusOptions(cur){return ["masuk","tagihan","tunai","batal"].map(x=>`<option value="${x}" ${x===cur?"selected":""}>${statusLabel(x)}</option>`).join("")}
function editStatus(id){let d=all.find(x=>x.id===id);if(!d)return;let cur=st(d);modalUI("Edit Status - "+(d.nomorNota||"-"),`<div class="detail">Nota: <b>${esc(d.nomorNota||"-")}</b><br>Pelanggan: <b>${esc(pname(d))}</b> - ${esc(phone(d))}<br>Produk: ${productChips(d)}<br>Total: ${rupiah(total(d))}</div><label style="margin-top:12px">UBAH STATUS</label><select id="editStatus">${statusOptions(cur)}</select>`,[{label:"Batal",fn:closeModal},{label:"💾 Simpan & WA",cls:"dark",fn:async()=>{let ns=$("editStatus").value;try{await updateDoc(doc(db,"penjualan",id),{status:ns,pendapatan:ns==="tunai"?Math.max(0,total(d)-diskon(d)):0,updatedAt:serverTimestamp()});closeModal();await loadSales();render();setTimeout(()=>openWA(id,ns),100)}catch(e){modalUI("❌ Gagal",esc(e.message),[{label:"Tutup",fn:closeModal}])}}}])}
function waText(d,newStatus){let x=newStatus||st(d),s=statusLabel(x);return `Halo Kak ${pname(d)} 👋\nTransaksi penjualan *${d.nomorNota||"-"}* di *A Yudi Thea* menjadi *${s.toUpperCase()}* ✅\nProduk: ${productText(d)}\nTotal: ${rupiah(total(d))}\nSisa: ${rupiah(sisa(d))}\nTerima kasih 🙏`}
function openWA(id,newStatus){let d=all.find(x=>x.id===id);if(!d)return;let n=normalizePhone(phone(d));if(!n){modalUI("⚠️ WA kosong",`<div class="detail">No WA kosong untuk nota <b>${esc(d.nomorNota||"-")}</b></div>`,[{label:"Tutup",fn:closeModal}]);return}let msg=waText(d,newStatus);const waUrl="https://wa.me/"+n+"?text="+encodeURIComponent(msg);try{const w=window.open(waUrl,"_blank");if(!w){window.location.href=waUrl;}}catch(e){window.location.href=waUrl;}}
window.editStatus=editStatus;window.openWA=openWA;window.loadAll=async()=>{await loadSales();render();};window.render=render;window.resetFilter=()=>{$("from").value="";$("to").value="";$("status").value="";$("search").value="";render()};
["search","status","from","to"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",render));
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
onAuthStateChanged(auth,async u=>{if(!u){location.replace("login.html");return}try{let s=await getDoc(doc(db,"users",u.uid));if(!s.exists())throw Error("Profil tidak ditemukan");profile=s.data()||{};ownerUid=String(profile.role).toLowerCase()==="owner"?u.uid:(profile.ownerUid||profile.ownerId||u.uid);$("accountLine").textContent=`${u.email} • ${profile.role} • Owner: ${ownerUid.slice(0,6)}`;await loadSales();$("loading").style.display="none";$("page").style.display="block";render()}catch(e){$("loading").innerHTML=`<span style="color:#b42318">Gagal: ${esc(e.message)}</span>`}});
</script>
</body>
</html>
