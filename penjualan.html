<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Fixzy - Data Penjualan - FIX TAMPILAN & WA</title>
<link rel="icon" href="logo.png">
<link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#111827;font-family:Inter,system-ui,Arial,sans-serif}
header{background:#111827;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;border-bottom:2px solid #facc15;min-height:68px}
.logo{width:52px;height:52px;background:#000;border-radius:14px;display:flex;align-items:center;justify-content:center;border:2px solid #facc15;overflow:hidden;flex:0 0 52px}
main{max-width:1400px;margin:auto;padding:12px}
.sales-summary{width:100%;min-height:72px;display:flex;align-items:center;gap:10px;padding:14px 18px;margin:0 0 14px;background:#fff;border:2px solid #111827;border-radius:16px;box-shadow:5px 5px 0 #111827;color:#64748b;font-size:13px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:260px;background:#fff;border:2px solid #111827;padding:11px 14px;border-radius:12px;box-shadow:2px 2px 0 #111827}
select.filter{background:#fff;border:2px solid #111827;padding:11px 14px;border-radius:12px;font-weight:700;min-width:150px;box-shadow:2px 2px 0 #111827}
.excel-wrap{background:#fff;border:2px solid #111827;border-radius:16px;overflow:auto;box-shadow:4px 4px 0 #111827;max-height:75vh}
table{width:100%;border-collapse:collapse;min-width:1100px}
th{background:#111827;color:#fff;font-size:10px;font-weight:900;text-transform:uppercase;padding:12px 10px;position:sticky;top:0;text-align:left}
td{padding:10px;border-bottom:1px solid #e5e7eb;font-size:11.5px;vertical-align:top}
.badge{padding:3px 8px;border-radius:999px;font-size:9px;font-weight:900;border:1px solid #111827;display:inline-block}
.badge.masuk{background:#fff}.badge.tagihan{background:#fef3c7}.badge.tunai{background:#facc15}.badge.batal{background:#111827;color:#fff}.badge.lunas{background:#dcfce7}
.btn-lihat{background:#facc15;color:#000;border:2px solid #111827;padding:6px 12px;border-radius:8px;font-weight:900;font-size:11px;cursor:pointer}
.btn-sm{padding:6px 9px;border-radius:9px;font-size:10px;font-weight:900;border:1px solid #111827;cursor:pointer;margin:2px}
.prod-chip{display:inline-block;background:#fef9c3;border:1px solid #facc15;padding:3px 6px;border-radius:6px;margin:2px;font-size:10px;font-weight:700}
.modal,.wa-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:200;align-items:center;justify-content:center;padding:12px}
.modal.show,.wa-modal.show{display:flex}
.modal-box{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border:3px solid #111827;border-radius:18px;box-shadow:8px 8px 0 #111827}
</style>
</head>
<body>
<header>
<div class="logo"><img src="logo.png"></div>
<div><b>FIXZY - DATA PENJUALAN</b><br><small id="konterInfo" style="color:#94a3b8">Memuat...</small></div>
<div style="margin-left:auto"><button onclick="location.reload()" style="background:#1e293b;color:#fff;padding:9px 14px;border-radius:12px">↻ Refresh</button></div>
</header>
<main>
<div class="sales-summary" id="salesSummary">Memuat...</div>
<div class="toolbar">
<input id="q" class="search" placeholder="Cari nota, nama, WA, produk (ref Data Servis)...">
<select id="f" class="filter"><option value="">Semua Status</option><option value="masuk">Masuk</option><option value="tagihan">Tagihan</option><option value="tunai">Tunai</option><option value="batal">Batal</option></select>
<input id="fTanggal" type="date" class="filter">
</div>
<div id="statusMsg" style="font-size:11px;color:#64748b;margin-bottom:8px">Produk pakai referensi Data Servis</div>
<div class="excel-wrap"><table><thead><tr><th>Tanggal</th><th>Nota & Barcode</th><th>Pelanggan</th><th>Produk (Ref Servis)</th><th>Total</th><th>Pendapatan</th><th>Aksi</th></tr></thead><tbody id="tbody"></tbody></table></div>
</main>
<div class="modal" id="detailModal"><div class="modal-box"><div style="background:#111827;color:#fff;padding:14px;display:flex;justify-content:space-between"><b id="detailNota">Nota</b><button onclick="document.getElementById('detailModal').classList.remove('show')" style="background:#facc15">×</button></div><div id="detailBody" style="padding:16px"></div></div></div>
<div class="wa-modal" id="waModal"><div style="background:#fff;border:3px solid #111827;border-radius:16px;padding:16px;width:min(560px,100%)"><div id="waInfo"></div><div id="waText" style="white-space:pre-wrap;background:#f8fafc;padding:10px;border-radius:10px;margin-top:10px"></div><div style="display:flex;gap:8px;margin-top:12px"><a id="waLinkBtn" href="#" target="_blank" style="flex:1;text-align:center;padding:11px;background:#25D366;color:#fff;border-radius:10px;text-decoration:none;font-weight:900">📲 Buka WhatsApp</a><button onclick="document.getElementById('waModal').classList.remove('show')">Tutup</button></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocsFromServer, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(cfg);const auth=getAuth(app);const db=getFirestore(app);
let uid="",ownerUid="",profile={},allRows=[],pendingWA=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>"Rp "+(Number(n)||0).toLocaleString("id-ID");
const num=v=>{const n=Number(v);return isFinite(n)?n:0;}
// ===== REF DATA SERVIS UNTUK PRODUK =====
function parseProduk(r){
  const candidates=[r.penggunaanProduk,r.produkDigunakan,r.produk,r.items,r.produkList,r.sparepartList,r.namaProduk];
  let found=null;
  for(let c of candidates){if(c && (Array.isArray(c)?c.length>0:String(c).trim()!==""&&String(c)!=="-")){found=c;break;}}
  if(!found) return {text:"-",list:[],has:false};
  if(typeof found==="string") return {text:found,list:[{nama:found,qty:1}],has:true};
  if(Array.isArray(found)){
    const list=found.map(it=>typeof it==="string"?{nama:it,qty:1}:{nama:it.nama||it.namaProduk||"-",qty:Number(it.qty||1),subtotal:Number(it.subtotal||0)}).filter(x=>x.nama!=="-");
    return {text:list.map(x=>`${x.nama}${x.qty>1?` x${x.qty}`:""}`).join(", "),list,has:true};
  }
  return {text:"-",list:[],has:false};
}
function getProdukText(r){return parseProduk(r).text;}
function getProdukChips(r){const p=parseProduk(r);if(!p.has) return '-';return p.list.map(x=>`<span style="display:inline-block;background:#fef9c3;border:1px solid #facc15;padding:2px 6px;border-radius:6px;margin:2px;font-size:10px">${x.nama}</span>`).join("");}
function getNamaPel(r){return r.pelanggan?.nama||r.nama||"-";}
function getWa(r){return r.pelanggan?.wa||r.noHp||"";}
function getNota(r){return r.nomorNota||"-";}
function getStatus(r){return String(r.status||"masuk").toLowerCase();}
function getTotal(r){return num(r.total||0);}
function nomorWA(v){let s=String(v||"").replace(/[^0-9]/g,"");if(!s) return "";if(s.startsWith("0")) s="62"+s.slice(1);else if(s.startsWith("8")) s="62"+s;return s;}
async function loadProfile(user){const snap=await getDoc(doc(db,"users",user.uid));profile=snap.data()||{};ownerUid=(profile.role==="owner"||profile.isOwner)?user.uid:(profile.ownerUid||user.uid);uid=user.uid;document.getElementById('konterInfo').textContent=profile.namaKonter||"FIXZY";}
async function getOwnedPenjualan(){const map=new Map();async function ambil(f,val){try{const q=query(collection(db,"penjualan"),where(f,"==",val));const s=await getDocsFromServer(q);s.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));}catch(e){} }await ambil("ownerUid",ownerUid);return [...map.values()];}
async function muatSemua(){const rows=await getOwnedPenjualan();allRows=rows;render();}
function render(){
  const q=(document.getElementById('q').value||"").toLowerCase();
  const f=(document.getElementById('f').value||"").toLowerCase();
  const filtered=allRows.filter(r=>{const prod=getProdukText(r).toLowerCase();const hay=[getNota(r),getNamaPel(r),prod].join(" ").toLowerCase();if(q&&!hay.includes(q)) return false;if(f&&getStatus(r)!==f) return false;return true;});
  document.getElementById('tbody').innerHTML=filtered.map(r=>`<tr><td>${r.tanggal||""}</td><td><b>${getNota(r)}</b></td><td>${getNamaPel(r)}<br><small>${getWa(r)}</small></td><td>${getProdukChips(r)}</td><td>${money(getTotal(r))}</td><td>${money(getTotal(r))}</td><td><button onclick="lihat('${r.id}')" style="background:#facc15;padding:6px 10px;border-radius:8px">Lihat</button></td></tr>`).join("");
}
window.lihat=id=>{const r=allRows.find(x=>x.id===id);document.getElementById('detailNota').textContent=getNota(r);document.getElementById('detailBody').innerHTML=`Produk: ${getProdukChips(r)}<br>Total: ${money(getTotal(r))}<br><br><button onclick="setStatus('${r.id}','tunai')" style="background:#facc15;padding:8px;border-radius:8px">Tunai</button> <button onclick="kirimWA('${r.id}')">WA</button>`;document.getElementById('detailModal').classList.add('show');}
window.setStatus=async(id,st)=>{const r=allRows.find(x=>x.id===id);await updateDoc(doc(db,"penjualan",id),{status:st});const pesan=`Halo Kak ${getNamaPel(r)} Produk: ${getProdukText(r)} Status: ${st} - ${r.nomorNota}`;const wa=nomorWA(getWa(r));document.getElementById('waInfo').textContent=`Kirim ke ${wa}`;document.getElementById('waText').textContent=pesan;document.getElementById('waLinkBtn').href="https://wa.me/"+wa+"?text="+encodeURIComponent(pesan);document.getElementById('waModal').classList.add('show');}
window.kirimWA=id=>{const r=allRows.find(x=>x.id===id);const pesan=`Halo Kak ${getNamaPel(r)} Nota ${getNota(r)} Produk ${getProdukText(r)}`;const wa=nomorWA(getWa(r));document.getElementById('waText').textContent=pesan;document.getElementById('waLinkBtn').href="https://wa.me/"+wa+"?text="+encodeURIComponent(pesan);document.getElementById('waModal').classList.add('show');}
onAuthStateChanged(auth,async u=>{if(!u){location.replace("login.html");return;}await loadProfile(u);await muatSemua();});
document.getElementById('q').addEventListener('input',render);
document.getElementById('f').addEventListener('change',render);
</script>
</body>
</html>
