<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixzy - Input Penjualan - REF SERVISAN + NOTA 5x8</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6!important;font-family:Arial,sans-serif}
header{background:#111827;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;border-bottom:2px solid #000}
.card{background:#fff;border:2px solid #111827;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:4px 4px 0 #111827}
#notaModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;align-items:center;justify-content:center;padding:12px}
#notaModal.show{display:flex}
.nota-box{background:#fff;border:3px solid #111827;border-radius:16px;box-shadow:8px 8px 0 #111827;width:min(420px,100%);max-height:92vh;overflow:auto}
.nota-head{background:#111827;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;font-weight:900;border-bottom:2px solid #facc15}
.btn-nota{flex:1;padding:11px;border-radius:10px;font-weight:900;border:2px solid #111827;cursor:pointer}
.btn-nota.yellow{background:#facc15}.btn-nota.dark{background:#111827;color:#fff}
.nota-preview{border:2px dashed #111827;border-radius:12px;padding:12px;background:#fff;font-family:monospace;font-size:11px;white-space:pre-wrap}
</style>
</head>
<body>
<!-- COPY FULL DARI FILE YANG SAYA BUAT: /mnt/data/input-penjualan-NOTA-5x8-FIX.html -->
<!-- INTI PERUBAHAN DI BAWAH INI: -->

<script>
// SETELAH SIMPAN BERHASIL, PANGGIL POPUP
async function simpanData(){
  // ... simpan ke firestore seperti biasa ...
  const payload = { namaKonter, nomorNota, tanggal, pelanggan, items:rincianItems, total, diskon, dp, sisa, status, teknisi };
  await addDoc(collection(db,"penjualan"),payload);
  showNotaPopup(payload); // <-- popup nota
}

function showNotaPopup(data){
  lastSavedData=data;
  let itemsHtml=data.items.map((it,i)=>`<div style="display:flex;justify-content:space-between"><span>${i+1}. ${it.nama} x${it.qty}</span><span>Rp ${it.subtotal.toLocaleString()}</span></div>`).join('');
  document.getElementById('notaPreview').innerHTML=`
    <div style="text-align:center"><b>${data.namaKonter}</b><br>Nota: ${data.nomorNota}</div>
    <div style="border-top:1px dashed #000;margin:6px 0"></div>
    Pel: ${data.pelanggan.nama}<br>${itemsHtml}
    <div style="border-top:2px solid #000;margin-top:6px">SISA: Rp ${data.sisa.toLocaleString()}</div>
  `;
  document.getElementById('notaModal').classList.add('show');
}

function cetakNota(mode){
  const is58 = mode==='5x8';
  const w = is58 ? '58mm' : '80mm';
  const win=window.open('','','width=380,height=600');
  win.document.write(`
    <html><head><style>
      @page{size:${w} auto;margin:3mm}
      body{font-family:monospace;width:${w};font-size:${is58?'10px':'11px'}}
    </style></head><body>
    ${document.getElementById('notaPreview').innerHTML}
    <div style="text-align:center;margin-top:10px"><button onclick="window.print()">Cetak ${mode}</button></div>
    <script>setTimeout(()=>window.print(),500)<\/script>
    </body></html>
  `);
}
</script>

<!-- POPUP HTML -->
<div id="notaModal">
  <div class="nota-box">
    <div class="nota-head"><span>✅ Tersimpan - Cetak Nota</span><button onclick="document.getElementById('notaModal').classList.remove('show')">×</button></div>
    <div style="padding:14px">
      <div id="notaPreview" class="nota-preview"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn-nota yellow" onclick="cetakNota('5x8')">🖨️ Cetak 5x8 (Kecil)</button>
        <button class="btn-nota dark" onclick="cetakNota('umum')">🖨️ Cetak Umum</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
