<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081326">
<title>FIXZY | Pengaturan Nota</title>
<style>
*{box-sizing:border-box}
:root{--navy:#081326;--navy2:#101d33;--yellow:#ffc107;--bg:#f2f5f9;--card:#fff;--line:#dbe3ed;--text:#172033;--muted:#64748b;--green:#16a34a;--blue:#2563eb}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,textarea,select{font:inherit}
.header{position:sticky;top:0;z-index:20;min-height:74px;background:var(--navy);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px #0004}
.logo{width:52px;height:52px;object-fit:contain;border-radius:10px}
.brand{flex:1;min-width:0}.brand h1{margin:0;font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand p{margin:3px 0 0;font-size:11px;color:#cbd5e1}
.owner{text-align:right;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.owner b{display:block;font-size:12px}.owner span{font-size:10px;color:#cbd5e1}
.refresh{width:44px;height:44px;border:0;border-radius:12px;background:var(--yellow);font-size:20px;font-weight:900;cursor:pointer}
.wrap{max-width:1200px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 16px #0000000a}
.title{font-size:17px;font-weight:900;margin:0 0 11px}
.status{font-size:12px;color:var(--muted);line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.field label{font-size:11px;font-weight:900;color:#475569}
input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:11px;background:#fff;padding:10px 12px;outline:0}
input,select{height:44px}textarea{min-height:100px;resize:vertical}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}
.tab{border:0;border-radius:11px;padding:10px 14px;background:#e2e8f0;font-weight:900;white-space:nowrap;cursor:pointer}
.tab.active{background:var(--navy);color:#fff}
.template-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.template{border:2px solid #e2e8f0;border-radius:14px;padding:8px;background:#fff;cursor:pointer;transition:.15s}
.template.active{border-color:var(--yellow);box-shadow:0 0 0 3px #ffc10733}
.template b{font-size:12px;display:block;margin:2px 0 7px}
.mini{height:190px;background:#fff;border:1px solid #d5dbe3;padding:9px;font-size:6px;color:#172033;overflow:hidden}
.mini .mhead{text-align:center;border-bottom:1px solid #222;padding-bottom:5px;margin-bottom:6px}
.mini .mline{height:4px;background:#cbd5e1;margin:4px 0}
.mini .mrow{display:flex;justify-content:space-between;margin:4px 0}
.mini .mbox{border:1px dashed #94a3b8;padding:5px;margin:5px 0}
.mini .total{text-align:right;font-weight:900;border-top:1px solid #222;padding-top:5px}
.mini.t2{border-radius:10px}.mini.t3{border-left:4px solid #111}.mini.t4{font-family:monospace}.mini.t5{border:2px solid #111}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:11px;height:44px;padding:0 16px;font-weight:900;cursor:pointer}
.primary{background:var(--yellow);color:#111}.dark{background:var(--navy);color:#fff}.light{background:#e2e8f0;color:#111}
.preview-wrap{display:flex;justify-content:center;background:#e9edf3;border-radius:14px;padding:18px;overflow:auto}
.receipt{background:#fff;color:#111;width:380px;min-height:520px;padding:22px;box-shadow:0 5px 20px #0002;font-size:12px}
.receipt h2{text-align:center;margin:0;font-size:19px}.receipt .center{text-align:center}.receipt hr{border:0;border-top:1px dashed #555;margin:12px 0}
.receipt table{width:100%;border-collapse:collapse}.receipt td{padding:4px 0;vertical-align:top}.right{text-align:right}.policy{font-size:10px;line-height:1.45;white-space:pre-line}
.note-box{border:1px dashed #777;padding:8px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 17px;border-radius:12px;display:none;z-index:100;font-size:12px;font-weight:800}
.toast.show{display:block}
@media(max-width:950px){.template-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.header{padding:8px 10px}.logo{width:48px;height:48px}.brand h1{font-size:16px}.owner{display:none}.wrap{padding:9px}.grid2{grid-template-columns:1fr}.template-grid{grid-template-columns:repeat(2,1fr)}.receipt{width:320px;padding:17px}}
</style>
</head>
<body>

<header class="header">
  <img src="logo.png" class="logo" alt="FIXZY">
  <div class="brand">
    <h1>FIXZY | PENGATURAN NOTA</h1>
    <p>Atur template nota servis dan penjualan</p>
  </div>
  <div class="owner"><b id="ownerName">Memuat...</b><span id="ownerEmail">Firebase</span></div>
  <button class="refresh" onclick="muatPengaturan()" title="Refresh">↻</button>
</header>

<main class="wrap">
  <section class="card">
    <div id="status" class="status">Memeriksa sesi Firebase...</div>
  </section>

  <section class="card">
    <h2 class="title">🧾 Pilih Jenis Nota</h2>
    <div class="tabs">
      <button class="tab active" id="tabServis" onclick="pilihJenis('servis')">🔧 Nota Servis</button>
      <button class="tab" id="tabPenjualan" onclick="pilihJenis('penjualan')">🛒 Nota Penjualan</button>
    </div>
    <h2 class="title">🎨 Pilih Template</h2>
    <div class="template-grid" id="templateGrid"></div>
  </section>

  <section class="card">
    <h2 class="title">⚙️ Isi Nota</h2>
    <div class="grid2">
      <div>
        <div class="field"><label>NAMA KONTER</label><input id="namaKonter" placeholder="Nama konter"></div>
        <div class="field"><label>NO. WA KONTER</label><input id="waKonter" placeholder="08xxxxxxxxxx"></div>
        <div class="field"><label>JUDUL / KETERANGAN</label><input id="judulNota" placeholder="Contoh: NOTA SERVIS"></div>
      </div>
      <div>
        <div class="field"><label>TANGGAL NOTA</label><input id="tanggalNota" type="date"></div>
        <div class="field"><label>KEBIJAKAN PERUSAHAAN</label><textarea id="kebijakan" placeholder="Tulis kebijakan perusahaan..."></textarea></div>
        <div class="field"><label>UCAPAN TERIMA KASIH</label><textarea id="terimakasih" placeholder="Contoh: Terima kasih telah mempercayakan kebutuhan Anda kepada kami."></textarea></div>
      </div>
    </div>
    <div class="btns">
      <button class="btn primary" onclick="simpanPengaturan()">💾 Simpan Pengaturan</button>
      <button class="btn dark" onclick="cetakPreview()">🖨️ Cetak / Print</button>
      <button class="btn light" onclick="isiContoh()">Contoh Data</button>
    </div>
  </section>

  <section class="card">
    <h2 class="title">👁️ Preview Nota</h2>
    <div class="preview-wrap"><div id="preview" class="receipt"></div></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp,getApps,getApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",
  authDomain:"fixzy-update.firebaseapp.com",
  projectId:"fixzy-update",
  storageBucket:"fixzy-update.appspot.com",
  messagingSenderId:"431404655232",
  appId:"1:431404655232:web:5f7d9c9a1b2c3d4e5f6a7"
};

const app=getApps().length?getApp():initializeApp(firebaseConfig);
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);

let uid="",jenis="servis",templateServis=1,templatePenjualan=1,profile={};

const templates=[
  {id:1,nama:"Template 1",cls:""},
  {id:2,nama:"Template 2",cls:"t2"},
  {id:3,nama:"Template 3",cls:"t3"},
  {id:4,nama:"Template 4",cls:"t4"},
  {id:5,nama:"Template 5",cls:"t5"}
];

function today(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2200)}
function namaKonter(){
  return profile.namaKonter||profile.konterName||profile.namaToko||profile.namaUsaha||profile.toko||"FIXZY";
}
function wa(){
  return profile.noWa||profile.noWA||profile.wa||profile.whatsapp||profile.noHp||"";
}

function renderTemplates(){
  const selected=jenis==="servis"?templateServis:templatePenjualan;
  $("templateGrid").innerHTML=templates.map(t=>`
    <div class="template ${selected===t.id?"active":""}" onclick="pilihTemplate(${t.id})">
      <b>${t.nama}</b>
      <div class="mini ${t.cls}">
        <div class="mhead"><b>${jenis==="servis"?"NOTA SERVIS":"NOTA PENJUALAN"}</b><br>FIXZY</div>
        <div>Tanggal: 16/08/2026</div>
        <div class="mline"></div>
        <div class="mrow"><span>Pelanggan</span><span>Umum</span></div>
        <div class="mbox">Detail transaksi / produk / HP</div>
        <div class="mrow"><span>Total</span><b>Rp 250.000</b></div>
        <div class="total">TERIMA KASIH</div>
      </div>
    </div>
  `).join("");
}
window.pilihTemplate=id=>{
  if(jenis==="servis")templateServis=id;else templatePenjualan=id;
  renderTemplates();renderPreview();
};

window.pilihJenis=x=>{
  jenis=x;
  $("tabServis").classList.toggle("active",x==="servis");
  $("tabPenjualan").classList.toggle("active",x==="penjualan");
  $("judulNota").value=x==="servis"?"NOTA SERVIS":"NOTA PENJUALAN";
  renderTemplates();renderPreview();
};

function renderPreview(){
  const selected=jenis==="servis"?templateServis:templatePenjualan;
  const cls="t"+selected;
  const konter=$("namaKonter").value||"NAMA KONTER";
  const waKonter=$("waKonter").value||"-";
  const tanggal=$("tanggalNota").value||today();
  const kebijakan=$("kebijakan").value||"Kebijakan perusahaan belum diisi.";
  const thanks=$("terimakasih").value||"Terima kasih telah berbelanja / menggunakan jasa kami.";
  const judul=$("judulNota").value||(jenis==="servis"?"NOTA SERVIS":"NOTA PENJUALAN");

  $("preview").className="receipt "+cls;
  $("preview").innerHTML=`
    <div class="center">
      <h2>${esc(konter)}</h2>
      <div>${esc(waKonter)}</div>
      <div style="margin-top:5px;font-weight:900">${esc(judul)}</div>
    </div>
    <hr>
    <table>
      <tr><td>Tanggal</td><td class="right">${esc(tanggal)}</td></tr>
      <tr><td>No. Nota</td><td class="right">CONTOH-001</td></tr>
      <tr><td>Pelanggan</td><td class="right">Nama Pelanggan</td></tr>
    </table>
    <div class="note-box">
      <b>${jenis==="servis"?"DATA SERVIS":"DATA PENJUALAN"}</b><br>
      ${jenis==="servis"?"HP / IMEI / Keluhan / Tindakan servis":"Produk / Qty / Harga / Total"}
    </div>
    <table style="margin-top:8px">
      <tr><td>Subtotal</td><td class="right">Rp 250.000</td></tr>
      <tr><td>Diskon</td><td class="right">Rp 0</td></tr>
      <tr><td><b>TOTAL</b></td><td class="right"><b>Rp 250.000</b></td></tr>
    </table>
    <hr>
    <div class="policy"><b>KEBIJAKAN PERUSAHAAN</b>
${esc(kebijakan)}</div>
    <hr>
    <div class="center"><b>${esc(thanks)}</b><br><br>FIXZY</div>
  `;
}
["namaKonter","waKonter","judulNota","tanggalNota","kebijakan","terimakasih"].forEach(id=>{
  $(id).addEventListener("input",renderPreview);
});

async function ambilProfile(){
  if(!uid)return;
  try{
    const s=await getDoc(doc(db,"users",uid));
    if(s.exists())profile=s.data()||{};
  }catch(e){console.warn(e)}
  $("ownerName").textContent=profile.nama||profile.namaPemilik||profile.namaLengkap||auth.currentUser?.displayName||"Akun FIXZY";
  $("ownerEmail").textContent=auth.currentUser?.email||"Firebase";
  if(!$("namaKonter").value)$("namaKonter").value=namaKonter();
  if(!$("waKonter").value)$("waKonter").value=wa();
}

async function muatPengaturan(){
  if(!uid){$("status").textContent="Menunggu sesi Firebase...";return}
  $("status").textContent="Memuat pengaturan nota...";
  try{
    await ambilProfile();
    const s=await getDoc(doc(db,"pengaturan",uid));
    if(s.exists()){
      const d=s.data()||{};
      templateServis=Number(d.templateServis)||1;
      templatePenjualan=Number(d.templatePenjualan)||1;
      if(d.nota){
        $("namaKonter").value=d.nota.namaKonter||namaKonter();
        $("waKonter").value=d.nota.waKonter||wa();
        $("kebijakan").value=d.nota.kebijakan||"";
        $("terimakasih").value=d.nota.terimakasih||"";
      }
    }
    $("tanggalNota").value=today();
    pilihJenis(jenis);
    $("status").textContent="✓ Pengaturan nota siap digunakan.";
  }catch(e){
    $("status").textContent="Gagal membaca pengaturan: "+e.message;
  }
}
window.muatPengaturan=muatPengaturan;

async function simpanPengaturan(){
  if(!uid){toast("Sesi Firebase belum tersedia");return}
  try{
    await setDoc(doc(db,"pengaturan",uid),{
      uid,
      templateServis,
      templatePenjualan,
      nota:{
        namaKonter:$("namaKonter").value.trim(),
        waKonter:$("waKonter").value.trim(),
        kebijakan:$("kebijakan").value.trim(),
        terimakasih:$("terimakasih").value.trim()
      },
      updatedAt:new Date().toISOString()
    },{merge:true});
    toast("Pengaturan nota berhasil disimpan");
    $("status").textContent="✓ Pengaturan tersimpan di Firebase.";
  }catch(e){toast("Gagal menyimpan: "+e.message)}
}
window.simpanPengaturan=simpanPengaturan;

window.isiContoh=()=>{
  $("namaKonter").value=namaKonter()||"A YUDI THEA";
  $("waKonter").value=wa()||"08xxxxxxxxxx";
  $("kebijakan").value="Barang yang sudah dibeli tidak dapat dikembalikan kecuali sesuai ketentuan toko.\nNota harap disimpan sebagai bukti transaksi.\nKetentuan garansi mengikuti kebijakan perusahaan.";
  $("terimakasih").value="Terima kasih telah mempercayakan kebutuhan Anda kepada kami.";
  renderPreview();
};

window.cetakPreview=()=>{
  renderPreview();
  const isi=$("preview").outerHTML;
  const css=[...document.querySelectorAll("style")].map(x=>x.textContent).join("\n");
  const w=window.open("","_blank");
  if(!w){toast("Popup cetak diblokir browser");return}
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Nota FIXZY</title><style>${css}body{background:#fff}.receipt{box-shadow:none;margin:auto}</style></head><body>${isi}</body></html>`);
  w.document.close();
  setTimeout(()=>w.print(),350);
};

$("tanggalNota").value=today();
renderTemplates();renderPreview();

onAuthStateChanged(auth,async user=>{
  if(!user){
    uid="";
    $("status").textContent="Sesi FIXZY belum tersedia. Buka halaman dari aplikasi yang sudah login.";
    $("ownerName").textContent="Menunggu sesi";
    $("ownerEmail").textContent="";
    return;
  }
  uid=user.uid;
  await muatPengaturan();
});
</script>
</body>
</html>
