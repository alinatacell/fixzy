<style>
*{box-sizing:border-box; transition:background-color .2s, color .15s, border-color .2s}
body{margin:0;background:#f4f5f7;color:#111827;font-family:Inter,Arial,sans-serif}
body.dark{background:#070e1f;color:#e5e7eb}
header{background:#111827;color:#fff;padding:11px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px #0003;border-bottom:1px solid #ffffff10}
.headerLogo{width:42px;height:42px;background:#000;border-radius:10px;padding:4px;flex:0 0 42px;border:1px solid #ffffff15;display:flex;align-items:center;justify-content:center}
.grow{flex:1}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}
.refresh{background:#0f172a;color:#fff;border:1px solid #ffffff20}
.refresh:hover{background:#1e293b}
.dark .refresh{background:#000;color:#fff;border:1px solid #ffffff20}
main{max-width:1350px;margin:auto;padding:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{padding:11px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:#111827;font-size:13px}
.dark input,.dark select,.dark textarea{background:#0f1d33;border-color:#ffffff15;color:#e5e7eb}
.search{flex:1;min-width:220px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:900px){ .stats{grid-template-columns:repeat(5,1fr)} }
.statCard{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:13px}
.dark .statCard{background:#162544;border-color:#ffffff10}
.statCard.total{background:#111827;color:#fff;border-color:#111827}
.dark .statCard.total{background:#000;border-color:#ffffff15}
.statLabel{font-size:10px;font-weight:900;color:#64748b;text-transform:uppercase}
.statCard.total .statLabel{color:#9ca3af}
.statValue{font-size:16px;font-weight:900;margin-top:5px;white-space:nowrap}
.tableWrap{background:#fff;border:1px solid #e4e8ef;border-radius:16px;box-shadow:0 3px 12px rgba(15,23,42,.05);overflow-x:auto;overflow-y:visible;position:relative}
.dark .tableWrap{background:#162544;border-color:#ffffff10}
.salesTable{width:100%;border-collapse:collapse;min-width:1200px}
.salesTable th{background:#f8fafc;color:#475569;font-size:10px;font-weight:900;text-align:left;padding:11px 8px;border-bottom:1px solid #e5e7eb;white-space:nowrap;text-transform:uppercase;position:sticky;top:0;z-index:1}
.dark .salesTable th{background:#0f172a;color:#94a3b8;border-color:#ffffff10}
.salesTable td{padding:10px 8px;border-bottom:1px solid #eef1f5;font-size:12px;color:#334155;vertical-align:middle;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dark .salesTable td{border-color:#ffffff08;color:#cbd5e1}
.salesTable td.wrap{white-space:normal;word-break:break-word;line-height:1.4}
.salesTable tbody tr:hover{background:#f8fafc}
.dark .salesTable tbody tr:hover{background:#ffffff05}
.badge{padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900;display:inline-flex;white-space:nowrap}
.status-tunai{background:#dcfce7;color:#15803d}.status-dibayar{background:#dcfce7;color:#15803d}.status-lunas{background:#dcfce7;color:#15803d}.status-tagihan{background:#fef3c7;color:#b45309}.status-belum{background:#fef3c7;color:#b45309}.status-batal{background:#fee2e2;color:#dc2626}.status-masuk{background:#e2e8f0;color:#0f172a}
.dark .status-tunai,.dark .status-dibayar,.dark .status-lunas{background:#052e16;color:#86efac}.dark .status-tagihan,.dark .status-belum{background:#451a03;color:#fcd34d}.dark .status-batal{background:#450a0a;color:#fca5a5}.dark .status-masuk{background:#1e293b;color:#cbd5e1}
.actionCell{position:relative;min-width:110px;text-align:right}
.actionWrap{position:relative;display:inline-block}
.actionMain{background:#111827;color:#fff;padding:8px 12px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;border:1px solid #111827}
.actionMain:hover{background:#1e293b}
.dark .actionMain{background:#fff;color:#000;border-color:#fff}
.actionMenu{display:none;position:fixed;left:0;top:0;width:230px;max-height:400px;overflow-y:auto;z-index:9999;background:#fff;border:1px solid #dbe1e8;border-radius:12px;padding:6px;box-shadow:0 14px 30px rgba(15,23,42,.22)}
.dark .actionMenu{background:#0f1d33;border-color:#ffffff15}
.actionWrap.open .actionMenu{display:block}
.actionMenu button{display:block;width:100%;text-align:left;background:#fff;color:#111827;margin:2px 0;padding:10px 12px;border-radius:8px;font-size:12px;font-weight:700}
.dark .actionMenu button{background:#0f1d33;color:#e5e7eb}
.actionMenu button:hover{background:#f1f5f9}
.dark .actionMenu button:hover{background:#ffffff10}
.actionMenu .danger{color:#dc2626}
.actionMenu .danger:hover{background:#fef2f2}
.dark .actionMenu .danger:hover{background:#450a0a}
.mobileSales{display:none}
@media(max-width:1100px){ .tableWrap{display:none} .mobileSales{display:grid;gap:10px} }
.mobileCard{background:#fff;border:1px solid #dbe1e8;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.dark .mobileCard{background:#162544;border-color:#ffffff10}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modalBox{width:min(640px,100%);background:#fff;border-radius:18px;padding:18px;max-height:90vh;overflow-y:auto}
.dark .modalBox{background:#0f1d33}
.errBox{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px 12px;border-radius:12px;font-size:12px;margin-bottom:12px;white-space:pre-wrap;display:none}
.dark .errBox{background:#450a0a;border-color:#7f1d1d;color:#fca5a5}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, doc, deleteDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",
  authDomain: "fixzy-update.firebaseapp.com",
  projectId: "fixzy-update",
  storageBucket: "fixzy-update.appspot.com",
  messagingSenderId: "431404655232",
  appId: "1:431404655232:web:5f7d9c9a1b2c3d4e5f6a7"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser=null, ownerUid=null, isOwner=false, allRows=[], filteredRows=[];

onAuthStateChanged(auth, async u=>{
  if(!u){ location.href="login.html"; return; }
  currentUser=u;
  document.getElementById('akunSide').textContent=u.email||'-';
  document.getElementById('akun').textContent=u.email||'-';
  try{
    const snap=await getDocs(query(collection(db,"users"), where("__name__","==", u.uid)));
    let p=null;
    if(!snap.empty) p=snap.docs[0].data();
    else{ const d=await getDoc(doc(db,"users",u.uid)); if(d.exists()) p=d.data(); }
    if(!p){
      ownerUid=u.uid; isOwner=true;
      document.getElementById('roleBadge').textContent='OWNER';
      document.getElementById('roleBadgeSide').textContent='OWNER';
    }else{
      ownerUid=p.role==='owner'?u.uid:(p.ownerUid||p.ownerId||u.uid);
      isOwner=p.role==='owner';
      document.getElementById('roleBadge').textContent=isOwner?'OWNER':(p.role||'').toUpperCase();
      document.getElementById('roleBadgeSide').textContent=isOwner?'OWNER':(p.role||'').toUpperCase();
      document.getElementById('namaKonter').textContent=p.namaKonter||p.namaToko||'';
    }
    await load();
  }catch(e){
    ownerUid=u.uid; isOwner=true;
    await load();
  }
});

function getNama(d){ return d.pelanggan?.nama || d.nama || '' || '-'; }
function getAlamat(d){ return d.pelanggan?.alamat || d.alamat || '-' ; }
function getNoHp(d){ return d.pelanggan?.wa || d.noHp || '-' ; }
function getProduk(d){
  if(Array.isArray(d.items) && d.items.length>0){
    const names=d.items.map(it=>it.nama||'').filter(Boolean);
    if(names.length>0) return names.join(', ');
  }
  return d.produk || '-' ;
}
function getImei(d){
  if(Array.isArray(d.items) && d.items.length>0){ return d.items[0].barcode || d.items[0].imei || '-' ; }
  return d.imei || '-' ;
}
function getBeli(d){
  if(Array.isArray(d.items) && d.items.length>0){
    const m=d.items.reduce((s,it)=>s+Number(it.modal||0),0);
    if(m>0) return m;
  }
  return Number(d.modal||d.hargaBeli||0);
}
function getJual(d){ return Number(d.total||d.jumlahTotal||d.gross||d.hargaJual||0); }
function getLaba(d){
  if(d.pendapatan!==undefined && d.pendapatan!=='' ) return Number(d.pendapatan);
  if(d.laba!==''&&d.laba!=null) return Number(d.laba);
  const j=getJual(d), b=getBeli(d); return b===0?j:j-b;
}
function getStatus(d){
  let s=(d.status||'').toString().trim();
  if(!s || s==='..'){ 
    if(d.pembayaran) s=d.pembayaran;
    else if(d.sisa>0||d.piutang>0) s='tagihan';
    else s='lunas';
  }
  return s.toLowerCase();
}
function getTeknisi(d){ return d.teknisi || d.createdBy || '-' ; }
function getTanggal(d){
  if(d.tanggal && d.tanggal.length>3) return d.tanggal.slice(0,16);
  if(d.createdAt?.toDate) return d.createdAt.toDate().toISOString().slice(0,16).replace('T',' ');
  if(d.createdAt?.seconds) return new Date(d.createdAt.seconds*1000).toISOString().slice(0,16).replace('T',' ');
  return '';
}

function renderStats(){
  let total=0, labaTotal=0, masuk=0, tagihan=0, tunai=0, lunas=0, batal=0;
  let pMasuk=0, pTagihan=0, pTunai=0, pLunas=0;
  filteredRows.forEach(d=>{
    const j=getJual(d); const l=getLaba(d); const s=getStatus(d);
    if(!s.includes('batal')){ total+=j; labaTotal+=l; }
    if(s.includes('tagih')||s.includes('belum')||s.includes('piutang')){ tagihan++; pTagihan+=j; }
    else if(s.includes('tunai')){ tunai++; pTunai+=j; }
    else if(s.includes('lunas')||s.includes('bayar')){ lunas++; pLunas+=j; }
    else if(s.includes('batal')){ batal++; }
    else { masuk++; pMasuk+=j; }
  });
  document.getElementById('statMasuk').innerHTML=`<div style="font-size:10px;font-weight:900;color:#64748b">MASUK / LUNAS</div><div style="font-size:15px;font-weight:900;margin-top:4px">${masuk+lunas} trx</div><div style="font-size:11px;color:#64748b;margin-top:2px">Rp ${(pMasuk+pLunas).toLocaleString('id-ID')}</div>`;
  document.getElementById('statTagihan').innerHTML=`<div style="font-size:10px;font-weight:900;color:#64748b">TAGIHAN</div><div style="font-size:15px;font-weight:900;margin-top:4px">${tagihan} trx</div><div style="font-size:11px;color:#64748b;margin-top:2px">Rp ${pTagihan.toLocaleString('id-ID')}</div>`;
  document.getElementById('statTunai').innerHTML=`<div style="font-size:10px;font-weight:900;color:#64748b">TUNAI</div><div style="font-size:15px;font-weight:900;margin-top:4px">${tunai} trx</div><div style="font-size:11px;color:#64748b;margin-top:2px">Rp ${pTunai.toLocaleString('id-ID')}</div>`;
  document.getElementById('statLaba').innerHTML=`<div style="font-size:10px;font-weight:900;color:#64748b">LABA</div><div style="font-size:15px;font-weight:900;margin-top:4px;color:#15803d">Rp ${labaTotal.toLocaleString('id-ID')}</div><div style="font-size:11px;color:#64748b;margin-top:2px">Batal: ${batal}</div>`;
  document.getElementById('statTotal').innerHTML=`<div style="font-size:10px;font-weight:900;color:#9ca3af">TOTAL JUAL</div><div style="font-size:17px;font-weight:900;margin-top:4px;color:#fff">Rp ${total.toLocaleString('id-ID')}</div><div style="font-size:11px;color:#9ca3af;margin-top:2px">${filteredRows.length} pelanggan</div>`;
  document.getElementById('countInfo').textContent=`${filteredRows.length} baris = ${filteredRows.length} data pelanggan (1 baris 1 pelanggan)`;
}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=(document.getElementById('filter').value||'').toLowerCase();
  filteredRows=allRows.filter(d=>{
    const s=getStatus(d);
    if(f && f!=='semua' && !s.includes(f)) return false;
    if(q){
      const hay=[getNama(d), getAlamat(d), getNoHp(d), getProduk(d), getTeknisi(d), d.nomorNota||''].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  renderStats();
  const tbody=document.getElementById('tbody');
  const mobile=document.getElementById('mobileSales');
  tbody.innerHTML=''; mobile.innerHTML='';
  if(filteredRows.length===0){
    tbody.innerHTML=`<tr><td colspan="12" style="padding:30px;text-align:center;color:#64748b">Belum ada data pelanggan</td></tr>`;
    mobile.innerHTML=`<div class="mobileCard" style="text-align:center;color:#64748b">Belum ada data</div>`;
    return;
  }
  // 1 BARIS = 1 DATA PELANGGAN
  filteredRows.forEach((d, idx)=>{
    const nama=getNama(d);
    const alamat=getAlamat(d);
    const nohp=getNoHp(d);
    const produk=getProduk(d);
    const imei=getImei(d);
    const beli=getBeli(d);
    const jual=getJual(d);
    const laba=getLaba(d);
    const status=getStatus(d);
    const teknisi=getTeknisi(d);
    const tgl=getTanggal(d);
    const badgeClass=status.includes('tunai')?'status-tunai':status.includes('lunas')||status.includes('bayar')?'status-lunas':status.includes('tagih')||status.includes('belum')?'status-tagihan':status.includes('batal')?'status-batal':'status-masuk';
    const badge=`<span class="badge ${badgeClass}">${status.toUpperCase()}</span>`;

    // DESKTOP: 1 TR = 1 PELANGGAN
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><div style="font-weight:600;font-size:11px">${tgl}</div><div style="font-size:10px;color:#94a3b8">${d.nomorNota||d.id.slice(0,8)}</div></td>
      <td class="wrap" style="font-weight:800">${nama}</td>
      <td class="wrap">${alamat}</td>
      <td>${nohp}</td>
      <td class="wrap">${produk}</td>
      <td>${imei}</td>
      <td style="text-align:right">Rp ${beli.toLocaleString('id-ID')}</td>
      <td style="text-align:right;font-weight:900">Rp ${jual.toLocaleString('id-ID')}</td>
      <td style="text-align:right;color:#15803d;font-weight:800">Rp ${laba.toLocaleString('id-ID')}</td>
      <td>${badge}</td>
      <td>${teknisi}</td>
      <td class="actionCell">
        <div class="actionWrap" id="wrap-${d.id}">
          <button class="actionMain" onclick="toggleAction('${d.id}', this)">Aksi ▾</button>
          <div class="actionMenu" id="menu-${d.id}">
            <button onclick="editData('${d.id}')">✏️ Edit Data</button>
            <button onclick="detailData('${d.id}')">👁️ Detail</button>
            <div style="height:1px;background:#e5e7eb;margin:6px 0"></div>
            <div style="font-size:10px;font-weight:900;color:#94a3b8;padding:4px 8px">UBAH STATUS</div>
            <button onclick="updateStatus('${d.id}','lunas')">✅ Lunas / Dibayar</button>
            <button onclick="updateStatus('${d.id}','tunai')">💵 Tunai</button>
            <button onclick="updateStatus('${d.id}','tagihan')">🧾 Tagihan</button>
            <button class="danger ${isOwner?'':'ownerOnly'}" onclick="updateStatus('${d.id}','batal')">❌ Batal</button>
            <div style="height:1px;background:#e5e7eb;margin:6px 0"></div>
            <button class="danger ${isOwner?'':'ownerOnly'}" onclick="hapusData('${d.id}')">🗑️ Hapus Pelanggan</button>
          </div>
        </div>
      </td>
    `;
    tbody.appendChild(tr);

    // MOBILE: 1 CARD = 1 PELANGGAN
    const card=document.createElement('div');
    card.className='mobileCard';
    card.innerHTML=`
      <div style="display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #e5e7eb;padding-bottom:8px;margin-bottom:8px">
        <div style="min-width:0;flex:1"><div style="font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nama}</div><div style="font-size:11px;color:#64748b">${nohp} • ${tgl}</div><div style="font-size:11px;color:#94a3b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${alamat}</div></div>
        <div style="flex-shrink:0">${badge}</div>
      </div>
      <div style="font-size:12px;margin-bottom:8px"><div style="font-size:10px;color:#94a3b8;font-weight:800">PRODUK</div><div style="font-weight:700">${produk}</div><div style="font-size:10px;color:#94a3b8">${imei}</div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-bottom:10px">
        <div><div style="font-size:10px;color:#94a3b8">JUAL</div><div style="font-weight:900">Rp ${jual.toLocaleString('id-ID')}</div></div>
        <div><div style="font-size:10px;color:#94a3b8">LABA</div><div style="font-weight:800;color:#15803d">Rp ${laba.toLocaleString('id-ID')}</div><div style="font-size:10px;color:#64748b">Teknisi: ${teknisi}</div></div>
      </div>
      <div class="actionWrap" style="width:100%" id="mwrap-${d.id}">
        <button class="actionMain" style="width:100%" onclick="toggleAction('m${d.id}', this)">Aksi Pelanggan ▾</button>
        <div class="actionMenu" id="menu-m${d.id}">
          <button onclick="editData('${d.id}')">✏️ Edit</button>
          <button onclick="detailData('${d.id}')">👁️ Detail</button>
          <button onclick="updateStatus('${d.id}','lunas')">✅ Lunas</button>
          <button onclick="updateStatus('${d.id}','tunai')">💵 Tunai</button>
          <button onclick="updateStatus('${d.id}','tagihan')">🧾 Tagihan</button>
          <button class="danger" onclick="updateStatus('${d.id}','batal')">❌ Batal</button>
          <button class="danger" onclick="hapusData('${d.id}')">🗑️ Hapus</button>
        </div>
      </div>
    `;
    mobile.appendChild(card);
  });

  // hide ownerOnly for karyawan
  if(!isOwner){
    document.querySelectorAll('.ownerOnly').forEach(el=>el.style.display='none');
  }
}

async function load(){
  document.getElementById('errBox').style.display='none';
  document.getElementById('tbody').innerHTML=`<tr><td colspan="12" style="padding:20px;text-align:center;color:#64748b">Memuat data Firebase...</td></tr>`;
  try{
    let rows=[];
    const ownerIdToQuery = ownerUid || currentUser.uid;
    // PRIORITAS: uid == owner (untuk admin & karyawan)
    try{
      let snap=await getDocs(query(collection(db,"penjualan"), where("uid","==", ownerIdToQuery)));
      if(!snap.empty) rows=snap.docs.map(d=>({id:d.id, ...d.data()}));
    }catch{}
    if(rows.length===0){
      try{
        let snap=await getDocs(query(collection(db,"penjualan"), where("ownerId","==", ownerIdToQuery)));
        if(!snap.empty) rows=snap.docs.map(d=>({id:d.id, ...d.data()}));
      }catch{}
    }
    if(rows.length===0){
      try{
        let snap=await getDocs(query(collection(db,"penjualan"), where("ownerUid","==", ownerIdToQuery)));
        if(!snap.empty) rows=snap.docs.map(d=>({id:d.id, ...d.data()}));
      }catch{}
    }
    if(rows.length===0){
      try{
        let snapAll=await getDocs(collection(db,"penjualan"));
        let all=snapAll.docs.map(d=>({id:d.id, ...d.data()}));
        rows=all.filter(doc=>{
          const oUid=doc.uid||''; const oId=doc.ownerId||''; const oUid2=doc.ownerUid||''; const cBy=doc.createdBy||'';
          return oUid===ownerIdToQuery || oId===ownerIdToQuery || oUid2===ownerIdToQuery || oUid===currentUser.uid || cBy===currentUser.email;
        });
        if(rows.length===0 && all.length>0) rows=all;
      }catch{}
    }
    rows.sort((a,b)=>{
      const ta=a.createdAt?.seconds||0, tb=b.createdAt?.seconds||0;
      return tb-ta;
    });
    allRows=rows;
    render();
  }catch(e){
    document.getElementById('errBox').style.display='block';
    document.getElementById('errBox').textContent='Error: '+e.message;
  }
}
window.load=load;

// AKSI FUNGSIONAL - 1 BARIS 1 PELANGGAN
window.toggleAction=(id, btn)=>{
  const wrap=document.getElementById('wrap-'+id) || document.getElementById('mwrap-'+id);
  const menu=document.getElementById('menu-'+id);
  if(!wrap || !menu) return;
  const isOpen=wrap.classList.contains('open');
  closeAll();
  if(!isOpen){
    wrap.classList.add('open');
    const rect=btn.getBoundingClientRect();
    let left=rect.left - menu.offsetWidth + rect.width;
    let top=rect.bottom + 8;
    if(left<10) left=10;
    if(left+menu.offsetWidth>window.innerWidth-10) left=window.innerWidth-menu.offsetWidth-10;
    if(top+menu.offsetHeight>window.innerHeight-10){
      top=rect.top - menu.offsetHeight - 8;
    }
    menu.style.left=left+'px';
    menu.style.top=top+'px';
  }
}
window.closeAll=()=>{ document.querySelectorAll('.actionWrap.open').forEach(el=>el.classList.remove('open')); }
document.addEventListener('click', e=>{ if(!e.target.closest('.actionWrap')) closeAll(); });
window.addEventListener('scroll', closeAll, true);

window.updateStatus=async(id,status)=>{
  if((status==='batal') && !isOwner){ alert("Hanya owner bisa batal"); return; }
  if(!confirm(`Ubah status pelanggan ini jadi ${status.toUpperCase()}?`)) return;
  try{
    await updateDoc(doc(db,"penjualan",id), {status:status, updatedAt:new Date().toISOString()});
    closeAll(); await load();
  }catch(err){ alert("Gagal update: "+err.message); }
}
window.hapusData=async(id)=>{
  if(!isOwner){ alert("Hanya owner bisa hapus"); return; }
  if(!confirm("Hapus data 1 pelanggan ini dari Firebase? Tidak bisa dibatalkan.")) return;
  try{
    await deleteDoc(doc(db,"penjualan",id));
    closeAll(); await load();
  }catch(err){ alert("Gagal hapus: "+err.message); }
}
window.detailData=(id)=>{
  const d=allRows.find(x=>x.id===id);
  if(!d) return;
  alert(`DETAIL PELANGGAN\n\nNama: ${getNama(d)}\nAlamat: ${getAlamat(d)}\nWA: ${getNoHp(d)}\nProduk: ${getProduk(d)}\nTotal: Rp ${getJual(d).toLocaleString('id-ID')}\nLaba: Rp ${getLaba(d).toLocaleString('id-ID')}\nStatus: ${getStatus(d)}\nTeknisi: ${getTeknisi(d)}\nNota: ${d.nomorNota||d.id}\nTanggal: ${getTanggal(d)}`);
}
window.editData=(id)=>{
  const d=allRows.find(x=>x.id===id);
  if(!d) return;
  document.getElementById('editId').value=d.id;
  document.getElementById('editNama').value=d.pelanggan?.nama||d.nama||'';
  document.getElementById('editAlamat').value=d.pelanggan?.alamat||d.alamat||'';
  document.getElementById('editNoHp').value=d.pelanggan?.wa||d.noHp||'';
  document.getElementById('editProduk').value=Array.isArray(d.items)?d.items.map(i=>i.nama).join(', '):(d.produk||'');
  document.getElementById('editJual').value=getJual(d);
  document.getElementById('editTeknisi').value=d.teknisi||'';
  document.getElementById('editStatus').value=getStatus(d);
  document.getElementById('editModal').classList.add('show');
}
window.closeEdit=()=>{ document.getElementById('editModal').classList.remove('show'); }
document.getElementById('search').addEventListener('input', render);
document.getElementById('filter').addEventListener('change', render);
document.getElementById('editForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const id=document.getElementById('editId').value;
  try{
    await updateDoc(doc(db,"penjualan",id), {
      'pelanggan.nama':document.getElementById('editNama').value,
      'pelanggan.alamat':document.getElementById('editAlamat').value,
      'pelanggan.wa':document.getElementById('editNoHp').value,
      total:Number(document.getElementById('editJual').value||0),
      teknisi:document.getElementById('editTeknisi').value,
      status:document.getElementById('editStatus').value,
      updatedAt:new Date().toISOString()
    });
    closeEdit(); await load();
  }catch(err){ alert("Gagal simpan: "+err.message); }
});
</script>

      <div style="display:none;width:100%;height:100%;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff">F</div>
    </div>

    <div style="margin-top:2px"><span id="roleBadge" style="background:#2563eb;color:#fff;padding:2px 6px;border-radius:6px;font-size:9px"></span></div>

</header>

<main>
  <div id="errBox" class="errBox"></div>
  <div class="bar">
    <input id="search" class="search" placeholder="Cari nama / alamat / teknisi / produk / nota... (1 baris 1 pelanggan)">
    <select id="filter"><option value="semua">Semua Status</option><option value="lunas">Lunas</option><option value="tunai">Tunai</option><option value="tagihan">Tagihan</option><option value="belum">Belum Bayar</option><option value="batal">Batal</option><option value="masuk">Masuk</option></select>
  </div>

  <div class="stats">
    <div class="statCard" id="statMasuk"></div>
    <div class="statCard" id="statTagihan"></div>
    <div class="statCard" id="statTunai"></div>
    <div class="statCard" id="statLaba"></div>
    <div class="statCard total" id="statTotal"></div>
  </div>
  <div style="font-size:11px;color:#64748b;margin-bottom:8px" id="countInfo"></div>

  <div class="tableWrap">
    <table class="salesTable">
      <thead><tr><th>Tanggal</th><th>Nama Pelanggan</th><th>Alamat</th><th>WA / HP</th><th>Produk</th><th>Barcode / IMEI</th><th>Modal</th><th>Total Jual</th><th>Laba</th><th>Status</th><th>Teknisi</th><th>Aksi (1 Baris 1 Pelanggan)</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="mobileSales" id="mobileSales"></div>
  <div style="margin-top:14px;font-size:11px;color:#64748b;text-align:center">✅ 1 Baris = 1 Data Pelanggan • Aksi Fungsional: Edit, Detail, Lunas, Tunai, Tagihan, Batal, Hapus • Firebase asli</div>
</main>

<div class="modal" id="editModal">
  <div class="modalBox">
    <h2 style="font-weight:900;margin:0 0 12px">Edit 1 Data Pelanggan</h2>
    <form id="editForm" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <input type="hidden" id="editId">
      <div><label style="font-size:11px;font-weight:800">Nama Pelanggan</label><input id="editNama" required style="width:100%;margin-top:4px"></div>
      <div><label style="font-size:11px;font-weight:800">WA / HP</label><input id="editNoHp" style="width:100%;margin-top:4px"></div>
      <div style="grid-column:1/-1"><label style="font-size:11px;font-weight:800">Alamat Pelanggan</label><textarea id="editAlamat" style="width:100%;margin-top:4px;min-height:60px"></textarea></div>
      <div style="grid-column:1/-1"><label style="font-size:11px;font-weight:800">Produk</label><input id="editProduk" style="width:100%;margin-top:4px" readonly></div>
      <div><label style="font-size:11px;font-weight:800">Total Jual</label><input id="editJual" type="number" style="width:100%;margin-top:4px"></div>
      <div><label style="font-size:11px;font-weight:800">Teknisi</label><input id="editTeknisi" style="width:100%;margin-top:4px"></div>
      <div style="grid-column:1/-1"><label style="font-size:11px;font-weight:800">Status</label><select id="editStatus" style="width:100%;margin-top:4px"><option value="lunas">Lunas</option><option value="tunai">Tunai</option><option value="tagihan">Tagihan</option><option value="belum">Belum Bayar</option><option value="masuk">Masuk</option><option value="batal">Batal</option></select></div>
      <div style="grid-column:1/-1;display:flex;gap:8px;margin-top:10px"><button type="submit" style="flex:1;background:#111827;color:#fff">Simpan ke Firebase</button><button type="button" onclick="closeEdit()" style="background:#e5e7eb;color:#111827">Batal</button></div>
    </form>
  </div>
</div>

<script>
  const html=document.documentElement;
  const btn=document.getElementById('darkToggle');
  const saved=localStorage.getItem('fixzy-dark');
  if(saved==='1' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)){ html.classList.add('dark'); document.body.classList.add('dark'); btn.textContent='☀️'; }
  btn.addEventListener('click', ()=>{ html.classList.toggle('dark'); document.body.classList.toggle('dark'); const isDark=html.classList.contains('dark'); localStorage.setItem('fixzy-dark', isDark?'1':'0'); btn.textContent=isDark?'☀️':'🌙'; });
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
