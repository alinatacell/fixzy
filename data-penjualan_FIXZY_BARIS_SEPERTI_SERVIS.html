<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY | Data Penjualan</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;color:#111827;font-family:Arial,sans-serif}
header{background:#111827;color:#fff;padding:13px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
h1{font-size:17px;margin:0}.grow{flex:1}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}
.refresh{background:#ffc107;color:#111827}
.close{background:#fff;color:#111827}
main{max-width:1050px;margin:auto;padding:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#111827}
.search{flex:1;min-width:180px}
.stats{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:11px;margin-bottom:12px;font-size:12px;color:#475569}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
.card{background:#fff;border:1px solid #dbe1e8;border-radius:15px;padding:14px;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-weight:900;font-size:16px;color:#0f172a}
.small{font-size:12px;color:#475569;margin-top:4px}
.badge{padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#e2e8f0;color:#0f172a;height:max-content}
.info{font-size:13px;line-height:1.7;margin-top:11px;color:#334155}
.actions{display:flex;gap:8px;margin-top:12px}
.actionWrap{position:relative;flex:1}
.actionMain{width:100%;background:#111827;color:#fff;display:flex;justify-content:space-between;align-items:center}
.actionMenu{display:none;position:absolute;right:0;left:0;top:calc(100% + 6px);z-index:50;background:#fff;border:1px solid #dbe1e8;border-radius:12px;padding:6px;box-shadow:0 14px 30px rgba(15,23,42,.22)}
.actionWrap.open .actionMenu{display:block}
.actionMenu button{display:block;width:100%;text-align:left;background:#fff;color:#111827;margin:2px 0}
.actionMenu button:hover{background:#f1f5f9}
.actionMenu .edit{color:#1d4ed8}.actionMenu .delete{color:#dc2626}
.actionMenu .bill{color:#b45309}.actionMenu .cash{color:#15803d}
.empty{background:#fff;border-radius:12px;padding:30px;text-align:center;color:#64748b}
.err{color:#b91c1c;white-space:pre-wrap}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modalBox{width:min(520px,100%);background:#fff;border-radius:18px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modalBox h2{margin:0 0 14px;font-size:20px}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formGrid label{font-size:12px;font-weight:800;color:#475569}
.formGrid input{width:100%;margin-top:5px}
.full{grid-column:1/-1}
.modalActions{display:flex;gap:8px;margin-top:15px}
.modalActions button{flex:1}
.save{background:#111827;color:#fff}.cancel{background:#e5e7eb;color:#111827}
@media(max-width:600px){
 header{padding:11px 12px}h1{font-size:16px}
 main{padding:10px}.card{padding:13px}
 .formGrid{grid-template-columns:1fr}
 .full{grid-column:auto}
}

/* ===== DATA PENJUALAN MODE BARIS / TABLE — SAMA DENGAN DATA SERVIS ===== */
.list{display:block!important}
.tableWrap{
  background:#fff;border:1px solid #e4e8ef;border-radius:16px;
  box-shadow:0 3px 12px rgba(15,23,42,.05);overflow:auto;
}
.serviceTable{width:100%;border-collapse:collapse;min-width:930px}
.serviceTable th{
  background:#f8fafc;color:#475569;font-size:11px;font-weight:900;
  text-align:left;padding:12px 10px;border-bottom:1px solid #e5e7eb;
  white-space:nowrap;
}
.serviceTable td{
  padding:12px 10px;border-bottom:1px solid #eef1f5;
  font-size:12px;color:#334155;vertical-align:middle;
}
.serviceTable tbody tr:hover{background:#fafafa}
.serviceTable tbody tr:last-child td{border-bottom:0}
.serviceTable .customer{font-weight:900;color:#111827}
.serviceTable .nota{font-weight:800;color:#334155;white-space:nowrap}
.serviceTable .phone{white-space:nowrap}
.serviceTable .money{font-weight:900;color:#111827;white-space:nowrap}
.serviceTable .actionCell{width:175px;text-align:right}
.saleRowAction{position:relative;display:inline-block;min-width:165px}
.saleActionMain{
  min-width:155px!important;background:#111827!important;color:#fff!important;
  border:0!important;border-radius:10px!important;padding:9px 11px!important;
  font-size:11px!important;font-weight:900!important;
  display:flex!important;align-items:center!important;justify-content:space-between!important;
  gap:8px!important;box-shadow:0 3px 8px rgba(15,23,42,.16)!important;
}
.saleActionMenu{
  position:absolute;right:0;top:calc(100% + 6px);width:190px;
  background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:6px;
  box-shadow:0 14px 35px rgba(15,23,42,.20);display:none;z-index:200;
}
.saleRowAction.open{z-index:300}.saleRowAction.open .saleActionMenu{display:block}
.saleActionItem{
  width:100%!important;border:0!important;background:#fff!important;
  color:#1f2937!important;border-radius:10px!important;padding:10px 9px!important;
  text-align:left!important;font-size:12px!important;font-weight:800!important;
  box-shadow:none!important;display:block!important;
}
.saleActionItem:hover{background:#f3f4f6!important}
.saleActionItem.edit{color:#1d4ed8!important}
.saleActionItem.delete{color:#dc2626!important}
.saleActionItem.bill{color:#b45309!important}
.saleActionItem.cash{color:#15803d!important}
.statusPill{
  display:inline-flex;align-items:center;gap:6px;padding:6px 9px;
  border-radius:999px;font-size:10px;font-weight:900;white-space:nowrap;
}
.statusPill.masuk{background:#e2e8f0;color:#1e293b}
.statusPill.tagihan,.statusPill.piutang{background:#fff0e1;color:#9a4300}
.statusPill.tunai,.statusPill.dibayar{background:#dcfce9;color:#126b3a}
.statusPill.batal{background:#ffe4e4;color:#a40000}
@media(max-width:700px){.serviceTable{min-width:930px}.tableWrap{margin:0 -1px}}
</style></head><body>

<header>
  <h1>🛒 Data Penjualan</h1>
  <div class="grow"></div>
  <button class="refresh" onclick="load()">↻ Refresh</button>
  <button class="close" onclick="tutupHalaman()">✕ Tutup</button>
</header>

<main>
  <div class="bar">
    <input id="search" class="search" placeholder="Cari pelanggan, produk, nota...">
    <select id="filter">
      <option value="semua">Semua Status</option>
      <option value="masuk">Masuk</option>
      <option value="tagihan">Masuk Tagihan</option>
      <option value="tunai">Tunai</option>
      <option value="dibayar">Dibayar</option>
      <option value="piutang">Piutang</option>
      <option value="batal">Batal</option>
    </select>
  </div>

  <div class="stats">☁️ Firebase <b>/penjualan</b> • Total: <b id="total">0</b> • <span id="akun">memeriksa akun...</span></div>
  <div id="list" class="list"><div class="empty">Memuat Firebase...</div></div>
</main>

<div id="editModal" class="modal">
  <div class="modalBox">
    <h2>✏️ Edit Penjualan</h2>
    <div class="formGrid">
      <label>Pelanggan<input id="eNama"></label>
      <label>No. WhatsApp<input id="eHp"></label>
      <label>Produk<input id="eProduk"></label>
      <label>Qty<input id="eQty" type="number" min="1"></label>
      <label>Harga<input id="eHarga" type="number" min="0"></label>
      <label>Total<input id="eTotal" type="number" min="0"></label>
      <label class="full">Catatan<input id="eCatatan"></label>
    </div>
    <div class="modalActions">
      <button class="cancel" onclick="closeEdit()">Batal</button>
      <button class="save" onclick="saveEdit()">💾 Simpan</button>
    </div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,collection,query,where,getDocs,updateDoc,doc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",
 authDomain:"fixzy-f056f.firebaseapp.com",
 projectId:"fixzy-f056f",
 storageBucket:"fixzy-f056f.firebasestorage.app",
 messagingSenderId:"838081521031",
 appId:"1:838081521031:web:50fdee909b56460b055f22"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let uid="",rows=[],editId="";

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=v=>"Rp "+Number(v||0).toLocaleString("id-ID");

function statusLabel(x){
  const s=String(x.status||"").toLowerCase();
  const p=String(x.pembayaran||"").toLowerCase();
  if(s==="batal")return "Batal";
  if(p==="tagihan"||s==="piutang"||s==="tempo")return "Masuk Tagihan";
  if(p==="tunai"||s==="dibayar"||s==="selesai")return "Tunai";
  return "Masuk";
}

function normalizeSaleStatus(x){
  const s=String(x.status||"").toLowerCase().trim();
  const p=String(x.pembayaran||"").toLowerCase().trim();
  if(s==="batal") return "batal";
  if(p==="tagihan"||s==="piutang"||s==="tempo") return "tagihan";
  if(p==="tunai"||s==="dibayar"||s==="selesai") return "tunai";
  return "masuk";
}
function saleStatusLabel(x){
  return ({masuk:"Masuk",tagihan:"Masuk Tagihan",tunai:"Tunai",batal:"Batal"})[normalizeSaleStatus(x)]||"Masuk";
}
function saleStatusClass(x){return "statusPill "+normalizeSaleStatus(x)}
function saleActionDropdown(x){
  const id=String(x.id||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
  return `<div class="saleRowAction" id="sact-${esc(x.id)}">
    <button type="button" class="saleActionMain" onclick="toggleSaleAction('${id}')">
      <span>⚙️ ${esc(saleStatusLabel(x))}</span><span>⌄</span>
    </button>
    <div class="saleActionMenu">
      <button type="button" class="saleActionItem edit" onclick="editPenjualan('${id}')">✏️ Edit</button>
      <button type="button" class="saleActionItem delete" onclick="hapus('${id}')">🗑️ Hapus</button>
      <div style="height:1px;background:#e5e7eb;margin:5px 3px"></div>
      <button type="button" class="saleActionItem bill" onclick="ubahPembayaran('${id}','tagihan')">🧾 Masuk Tagihan</button>
      <button type="button" class="saleActionItem cash" onclick="ubahPembayaran('${id}','tunai')">💵 Tunai</button>
    </div>
  </div>`;
}

function render(){
  const q=$("search").value.toLowerCase().trim(),f=$("filter").value;
  const a=rows.filter(x=>{
    const st=normalizeSaleStatus(x);
    return (f==="semua"||st===f) && (!q||JSON.stringify(x).toLowerCase().includes(q));
  });
  $("total").textContent=a.length;
  if(!a.length){$("list").innerHTML='<div class="empty">Tidak ada data penjualan.</div>';return;}
  $("list").innerHTML=`<div class="tableWrap"><table class="serviceTable">
    <thead><tr>
      <th>Pelanggan</th><th>No. Nota</th><th>Tanggal</th><th>Produk</th>
      <th>Teknisi</th><th>Status</th><th>Total</th><th>Dibayar</th><th>Sisa</th><th>Aksi</th>
    </tr></thead>
    <tbody>${a.map(x=>{
      const st=normalizeSaleStatus(x);
      const produk=x.produk||x.items?.[0]?.nama||"Penjualan";
      const teknisi=x.namaTeknisi||x.teknisi||"-";
      const qty=Number(x.qty||x.items?.[0]?.qty||1);
      return `<tr>
        <td><div class="customer">${esc(x.pelanggan?.nama||x.namaPelanggan||"Pelanggan umum")}</div>
            <div class="small">${esc(x.noHp||x.pelanggan?.wa||"-")}</div></td>
        <td class="nota">${esc(x.nomorNota||x.idPenjualan||"-")}</td>
        <td>${esc(x.tanggal||"-")}</td>
        <td><b>${esc(produk)}</b><div class="small">Qty: ${qty}</div></td>
        <td>${esc(teknisi)}</td>
        <td><span class="${saleStatusClass(x)}">${esc(saleStatusLabel(x))}</span></td>
        <td class="money">${money(x.total)}</td>
        <td class="money">${money(x.dibayar)}</td>
        <td class="money">${money(x.sisa)}</td>
        <td class="actionCell">${saleActionDropdown(x)}</td>
      </tr>`;
    }).join("")}</tbody>
  </table></div>`;
}





window.ubahPembayaran=async(id,mode)=>{
  document.querySelectorAll(".actionWrap.open").forEach(x=>x.classList.remove("open"));
  const item=rows.find(x=>x.id===id);if(!item)return;
  try{
    if(mode==="tagihan"){
      await updateDoc(doc(db,"penjualan",id),{
        pembayaran:"Tagihan",
        status:"piutang",
        dibayar:0,
        sisa:Number(item.total)||0,
        updatedAt:serverTimestamp()
      });
    }else{
      await updateDoc(doc(db,"penjualan",id),{
        pembayaran:"Tunai",
        status:"dibayar",
        dibayar:Number(item.total)||0,
        sisa:0,
        updatedAt:serverTimestamp()
      });
    }
    await load();
  }catch(e){alert("Gagal mengubah pembayaran: "+e.message)}
};

window.editPenjualan=id=>{
  document.querySelectorAll(".actionWrap.open").forEach(x=>x.classList.remove("open"));
  const x=rows.find(r=>r.id===id);if(!x)return;
  editId=id;
  $("eNama").value=x.namaPelanggan||x.pelanggan?.nama||"";
  $("eHp").value=x.noHp||x.pelanggan?.wa||"";
  $("eProduk").value=x.produk||x.items?.[0]?.nama||"";
  $("eQty").value=Number(x.qty||x.items?.[0]?.qty||1);
  $("eHarga").value=Number(x.harga||x.items?.[0]?.harga||0);
  $("eTotal").value=Number(x.total||0);
  $("eCatatan").value=x.catatan||"";
  $("editModal").classList.add("show");
};

window.closeEdit=()=>{$("editModal").classList.remove("show");editId="";};

window.saveEdit=async()=>{
  if(!editId)return;
  const total=Number($("eTotal").value)||0;
  try{
    await updateDoc(doc(db,"penjualan",editId),{
      namaPelanggan:$("eNama").value.trim(),
      noHp:$("eHp").value.trim(),
      produk:$("eProduk").value.trim(),
      qty:Number($("eQty").value)||1,
      harga:Number($("eHarga").value)||0,
      total,
      catatan:$("eCatatan").value.trim(),
      updatedAt:serverTimestamp()
    });
    closeEdit();await load();
  }catch(e){alert("Gagal menyimpan perubahan: "+e.message)}
};

window.hapus=async id=>{
  if(!confirm("Hapus transaksi penjualan ini dari Firebase?"))return;
  try{await deleteDoc(doc(db,"penjualan",id));await load();}
  catch(e){alert("Gagal hapus penjualan: "+e.message)}
};

async function load(){
  if(!uid)return;
  $("list").innerHTML='<div class="empty">Membaca Firebase...</div>';
  try{
    const snap=await getDocs(query(collection(db,"penjualan"),where("uid","==",uid)));
    rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    rows.sort((a,b)=>String(b.tanggal||"").localeCompare(String(a.tanggal||"")));
    render();
  }catch(e){
    $("list").innerHTML=`<div class="empty err">Gagal membaca Firebase:\n${e.message}</div>`;
  }
}
window.load=load;

window.tutupHalaman=()=>{
  try{window.close();}catch(e){}
  setTimeout(()=>{
    if(history.length>1)history.back();
    else location.href="index.html";
  },120);
};

$("search").oninput=render;
$("filter").onchange=render;

onAuthStateChanged(auth,async u=>{
  if(!u){location.href="login.html";return;}
  uid=u.uid;
  $("akun").textContent=u.email||"Akun login";
  await load();
});
</script></body></html>
