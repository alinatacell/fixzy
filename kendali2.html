<style>body{margin:0;font-family:Arial;background:#f3f4f6} .top{background:#111827;color:#fff;padding:12px} .wrap{max-width:900px;margin:auto;padding:12px} .card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px} table{width:100%;border-collapse:collapse} th{background:#111827;color:#fff;padding:8px;font-size:11px} td{padding:8px;border-bottom:1px solid #eee;font-size:11px} .btn{border:0;border-radius:8px;padding:8px 12px;font-weight:900;background:#ffc107}</style></head><body>
<div class="top"><h1 style="margin:0">FIXZY ADMIN - OPEN (Tanpa PIN)</h1><small>Gak pakai PIN biar pasti masuk dulu</small> <button class="btn" onclick="loadAll()">Refresh</button></div>

<div class="card" style="background:#fffbeb;border:2px solid #ffc107"><h3>Buat Token</h3><div style="display:flex;gap:6px"><select id="paket"><option value="7">7 Hari</option><option value="30" selected>30 Hari</option><option value="90">90 Hari</option><option value="365">1 Tahun</option></select><input id="jml" type="number" value="1"><input id="harga" value="25000"><button class="btn" onclick="buatToken()">Buat</button></div><div id="msg"></div><table><thead><tr><th>Token</th><th>Paket</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tokenBody"></tbody></table></div>

<script type="module">

const app=initializeApp(cfg); const auth=getAuth(app); const db=getFirestore(app);
function parseExp(o){ let cands=[o.exp,o.expAt,o.expiredAt,o.aktifSampai]; for(let k in o){ if(k.toLowerCase().includes('exp')) cands.push(o[k]); } for(let c of cands){ if(!c) continue; try{ if(c.toDate) return c.toDate(); if(c.seconds) return new Date(c.seconds*1000); let d=new Date(c); if(!isNaN(d)) return d; }catch(e){} } return null; }
async function init(){ try{ await signInAnonymously(auth); }catch(e){ console.log(e); } loadAll(); }
window.loadAll=async function(){
  try{ const snap=await getDocs(collection(db,"users")); let users=[]; snap.forEach(d=>users.push({id:d.id,...d.data()})); users=users.filter(u=>{ const r=(u.role||"").toLowerCase(); return r!=="employee"; }); let html=""; users.forEach(u=>{ const e=parseExp(u); const tgl=e?e.toLocaleDateString('id-ID'):'-'; html+=`<tr><td>${u.namaKonter||u.nama||'-'}</td><td>${u.email||'-'}</td><td>${tgl}</td><td><button class="btn" onclick="tambahHari('${u.id}',30)">+30h</button> <button onclick="hapusUser('${u.id}')">Hapus</button></td></tr>`; }); document.getElementById('userBody').innerHTML=html||'<tr><td colspan=4>Tidak ada</td></tr>'; }catch(e){ document.getElementById('userBody').innerHTML='<tr><td colspan=4 style="color:red">'+e.message+'</td></tr>'; }
  try{ const snap=await getDocs(query(collection(db,"tokens"),orderBy("createdAt","desc"))); let html=""; snap.forEach(d=>{ const t=d.data(); html+=`<tr><td>${t.token}</td><td>${t.paket}</td><td>${t.used?'Terpakai':'Tersedia'}</td><td><button onclick="hapusToken('${d.id}')">Hapus</button> <button onclick="navigator.clipboard.writeText('${t.token}')">Copy</button></td></tr>`; }); document.getElementById('tokenBody').innerHTML=html||'<tr><td colspan=4>Belum ada</td></tr>'; }catch(e){ document.getElementById('tokenBody').innerHTML='<tr><td colspan=4 style="color:red">'+e.message+'</td></tr>'; }
}
window.buatToken=async function(){ const paket=document.getElementById('paket').value; const jml=parseInt(document.getElementById('jml').value||"1"); const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; for(let i=0;i<jml;i++){ let t=""; for(let k=0;k<12;k++) t+=chars[Math.floor(Math.random()*chars.length)]; t=t.match(/.{1,4}/g).join("-"); await addDoc(collection(db,"tokens"),{token:t,paket:paket,paketHari:parseInt(paket)||30,used:false,createdAt:new Date()}); } alert(jml+" token dibuat"); loadAll(); }
window.hapusToken=async function(id){ await deleteDoc(doc(db,"tokens",id)); loadAll(); }
window.hapusUser=async function(id){ if(!confirm("Hapus?")) return; await deleteDoc(doc(db,"users",id)); loadAll(); }
window.tambahHari=async function(id,h){ const ref=doc(db,"users",id); const s=await getDocs(collection(db,"users")); let u=null; s.forEach(d=>{ if(d.id===id) u=d.data(); }); let base=new Date(); const e=parseExp(u||{}); if(e&&e>new Date()) base=e; const ne=new Date(base); ne.setDate(ne.getDate()+h); await updateDoc(ref,{exp:ne,expAt:ne}); alert("Ditambah"); loadAll(); }
init();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArt
