<style>
*{box-sizing:border-box; transition: background-color .2s, color .15s, border-color .2s}
body{margin:0;background:#f4f5f7;color:#111827;font-family:Inter,Arial,sans-serif}

.headerBrand{display:flex;align-items:center;gap:10px;min-width:0}
.headerLogo{width:42px;height:42px;object-fit:contain;background:#000;border-radius:10px;padding:4px;flex:0 0 42px;border:1px solid #ffffff15}
.headerBrandText h1{font-size:16px;margin:0;font-weight:900;letter-spacing:0.2px}

button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}

.statusFilterBox{display:flex;align-items:center;gap:7px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:768px){ .stats{grid-template-columns:repeat(4,1fr)} }
.statCard{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px}
.dark .statCard{background:#162544;border-color:#ffffff10}
.statLabel{font-size:10px;font-weight:900;color:#64748b;text-transform:uppercase;letter-spacing:0.5px}
.dark .statLabel{color:#94a3b8}
.statValue{font-size:18px;font-weight:900;margin-top:4px;color:#0f172a}
.dark .statValue{color:#fff}
.statSmall{font-size:11px;color:#64748b;margin-top:2px}
.tableWrap{background:#fff;border:1px solid #e4e8ef;border-radius:16px;box-shadow:0 3px 12px rgba(15,23,42,.05);overflow-x:auto;overflow-y:visible;position:relative}

.dark .salesTable th{background:#00000030;color:#94a3b8;border-color:#ffffff10}
.salesTable td{padding:12px 10px;border-bottom:1px solid #eef1f5;font-size:13px;color:#334155;vertical-align:middle}
.dark .salesTable td{border-color:#ffffff08;color:#cbd5e1}
.salesTable tbody tr:hover{background:#fafafa}
.dark .salesTable tbody tr:hover{background:#ffffff05}
.salesTable .customer{font-weight:900;color:#111827}
.dark .salesTable .customer{color:#fff}
.salesTable .teknisi{font-size:12px;color:#475569}
.dark .salesTable .teknisi{color:#94a3b8}
.salesTable .money{font-weight:900;color:#111827;white-space:nowrap}
.dark .salesTable .money{color:#fff}
.salesTable .actionCell{min-width:140px;text-align:right}
.badge{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;display:inline-flex}
.status-tunai{background:#dcfce7;color:#15803d}.status-dibayar{background:#dcfce7;color:#15803d}.status-tagihan{background:#fef3c7;color:#b45309}.status-batal{background:#fee2e2;color:#dc2626}.status-masuk{background:#e2e8f0;color:#0f172a}
.dark .status-tunai,.dark .status-dibayar{background:#052e16;color:#86efac}.dark .status-tagihan{background:#451a03;color:#fcd34d}.dark .status-batal{background:#450a0a;color:#fca5a5}.dark .status-masuk{background:#1e293b;color:#cbd5e1}
.actionWrap{position:relative;display:inline-block}
.actionMain{width:100%;background:#111827;color:#fff;display:flex;justify-content:space-between;align-items:center;white-space:nowrap;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer}
.dark .actionMain{background:#fff;color:#000}
.actionMenu{display:none;position:fixed;left:0;top:0;width:210px;max-width:calc(100vw - 20px);max-height:min(380px,calc(100vh - 20px));overflow-y:auto;z-index:9999;background:#fff;border:1px solid #dbe1e8;border-radius:12px;padding:6px;box-shadow:0 14px 30px rgba(15,23,42,.22)}
.dark .actionMenu{background:#0f1d33;border-color:#ffffff15}
.actionWrap.open .actionMenu{display:block}
.actionMenu button{display:block;width:100%;text-align:left;background:#fff;color:#111827;margin:2px 0;padding:10px 12px;border-radius:8px;font-size:12px}
.dark .actionMenu button{background:#0f1d33;color:#e5e7eb}
.actionMenu button:hover{background:#f1f5f9}
.dark .actionMenu button:hover{background:#ffffff10}
.mobileSales{display:none}
@media(max-width:768px){
 .tableWrap{display:none}
 .mobileSales{display:grid;gap:10px}
}
.mobileSaleCard{background:#fff;border:1px solid #dbe1e8;border-radius:14px;padding:13px;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.dark .mobileSaleCard{background:#162544;border-color:#ffffff10}
.mobileSaleTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid #edf0f4;padding-bottom:10px}
.dark .mobileSaleTop{border-color:#ffffff10}
.mobileSaleName{font-size:15px;font-weight:900;color:#111827}
.dark .mobileSaleName{color:#fff}
.mobileSalePhone{font-size:12px;color:#64748b;margin-top:2px}
.mobileSaleGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.mobileSaleField{background:#f8fafc;border-radius:10px;padding:9px;min-width:0}
.dark .mobileSaleField{background:#00000025}
.mobileSaleLabel{font-size:9px;color:#64748b;font-weight:900;text-transform:uppercase;margin-bottom:3px;letter-spacing:0.4px}
.dark .mobileSaleLabel{color:#94a3b8}
.mobileSaleValue{font-size:13px;font-weight:800;color:#111827}
.dark .mobileSaleValue{color:#e5e7eb}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, doc, deleteDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",
  authDomain: "fixzy-update.firebaseapp.com",
  projectId: "fixzy-update",
  storageBucket: "fixzy-update.appspot.com",
  messagingSenderId: "431404655232",
  appId: "1:431404655232:web:5f7d9c9a1b2c3d4e5f6a7"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser=null, ownerUid=null, isOwner=false, currentRole='';
let allRows=[], filteredRows=[];

onAuthStateChanged(auth, async u=>{
  if(!u){ location.href="login.html"; return; }
  currentUser=u;
  document.getElementById('akun').textContent=u.email;
  try{
    const snap=await getDocs(query(collection(db,"users"), where("__name__","==", u.uid)));
    let profile=null;
    if(!snap.empty) profile=snap.docs[0].data();
    else{
      const d=await getDoc(doc(db,"users",u.uid));
      if(d.exists()) profile=d.data();
    }
    if(!profile) throw new Error("Profil tidak ditemukan");
    currentRole=profile.role||'';
    ownerUid=currentRole==='owner'?u.uid:(profile.ownerUid||profile.ownerId||u.uid);
    if(!ownerUid) ownerUid=u.uid;
    isOwner=currentRole==='owner';
    document.getElementById('roleBadge').textContent=isOwner?'OWNER':currentRole.toUpperCase();
    await load();
  }catch(e){
    document.getElementById('list').innerHTML=`<div style="background:#fff;padding:20px;border-radius:12px;color:#b91c1c">Error: ${e.message}</div>`;
  }
});

function isContoh(d){
  const nama=(d.nama||d.namaPelanggan||'').trim();
  return ["Andi Wijaya","Siti Aminah","Budi Santoso"].includes(nama) || (d.idTransaksi||'').startsWith('JUAL-17866');
}
function getNama(d){ return d.nama||d.namaPelanggan||d.pelanggan||d.customer||d.pembeli||''; }
function getProduk(d){
  let p=d.produk||d.namaProduk||d.barang||d.product||'';
  if(Array.isArray(p)) return p.map(x=>x.nama||x.produk||'').join(', ');
  if(typeof p==='object'&&p) return p.nama||'';
  return p||'';
}
function getTeknisi(d){ return d.teknisi||d.karyawanEmail||d.namaTeknisi||d.namaKaryawan||'-'; }
function getJual(d){ return Number(d.hargaJual||d.total||d.harga||d.nominal||0); }
function getBeli(d){ return Number(d.hargaBeli||d.modal||0); }
function getLaba(d){
  if(d.laba!==''&&d.laba!=null) return Number(d.laba);
  const j=getJual(d), b=getBeli(d);
  return b===0?j:j-b;
}
function getStatus(d){ return (d.status||d.metodeBayar||'masuk').toString().toLowerCase(); }

function renderStats(){
  let masuk=0, tagihan=0, tunai=0, dibayar=0, batal=0, total=0;
  let pendapatanMasuk=0, pendapatanTagihan=0, pendapatanTunai=0, pendapatanDibayar=0;
  filteredRows.forEach(d=>{
    const j=getJual(d); const s=getStatus(d);
    total+=j;
    if(s==='masuk'){ masuk++; pendapatanMasuk+=j; }
    else if(s==='tagihan'){ tagihan++; pendapatanTagihan+=j; }
    else if(s==='tunai'){ tunai++; pendapatanTunai+=j; }
    else if(s==='dibayar'){ dibayar++; pendapatanDibayar+=j; }
    else if(s==='batal'){ batal++; }
  });
  document.getElementById('statMasuk').innerHTML=`<div class="statLabel">Masuk</div><div class="statValue">${masuk} trx</div><div class="statSmall">Rp ${pendapatanMasuk.toLocaleString('id-ID')}</div>`;
  document.getElementById('statTagihan').innerHTML=`<div class="statLabel">Tagihan</div><div class="statValue">${tagihan} trx</div><div class="statSmall">Rp ${pendapatanTagihan.toLocaleString('id-ID')}</div>`;
  document.getElementById('statTunai').innerHTML=`<div class="statLabel">Tunai / Dibayar</div><div class="statValue">${tunai+dibayar} trx</div><div class="statSmall">Rp ${(pendapatanTunai+pendapatanDibayar).toLocaleString('id-ID')}</div>`;
  document.getElementById('statTotal').innerHTML=`<div class="statLabel">Total Pendapatan</div><div class="statValue">Rp ${total.toLocaleString('id-ID')}</div><div class="statSmall">${filteredRows.length} transaksi • Batal ${batal}</div>`;
  document.getElementById('countInfo').textContent=`${filteredRows.length} data asli - sesuai status`;
}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=(document.getElementById('filter').value||'').toLowerCase();
  filteredRows=allRows.filter(d=>{
    if(isContoh(d)) return false;
    const nama=getNama(d).toLowerCase();
    const produk=getProduk(d).toLowerCase();
    const teknisi=getTeknisi(d).toLowerCase();
    const status=getStatus(d);
    if(f && f!=='semua' && status!==f) return false;
    if(q && !nama.includes(q) && !produk.includes(q) && !teknisi.includes(q) && !String(d.idTransaksi||'').toLowerCase().includes(q)) return false;
    return true;
  });

  renderStats();

  const tbody=document.getElementById('tbody');
  const mobile=document.getElementById('mobileSales');
  tbody.innerHTML='';
  mobile.innerHTML='';

  if(filteredRows.length===0){
    tbody.innerHTML=`<tr><td colspan="8" style="padding:30px;text-align:center;color:#64748b">Tidak ada data sesuai filter</td></tr>`;
    mobile.innerHTML=`<div class="mobileSaleCard" style="text-align:center;color:#64748b">Tidak ada data</div>`;
    return;
  }

  filteredRows.forEach(d=>{
    const nama=getNama(d)||'-';
    const produk=getProduk(d)||'-';
    const teknisi=getTeknisi(d);
    const jual=getJual(d);
    const laba=getLaba(d);
    const status=getStatus(d);
    const badgeClass=`status-${status}`;

    // DESKTOP ROW
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><div class="customer">${nama}</div><div style="font-size:11px;color:#64748b">${d.noHp||''}</div><div style="font-size:10px;color:#94a3b8;margin-top:2px">${d.idTransaksi||d.id.slice(0,8)} • ${(d.tanggal||'').slice(0,16)}</div></td>
      <td><div class="teknisi"><span style="font-weight:800">${teknisi}</span></div><div style="font-size:11px;color:#64748b">${d.karyawanEmail||''}</div></td>
      <td><div style="font-weight:700">${produk}</div><div style="font-size:11px;color:#64748b">${d.imei||''}</div></td>
      <td class="money">Rp ${jual.toLocaleString('id-ID')}</td>
      <td class="money" style="color:#15803d">Rp ${laba.toLocaleString('id-ID')}</td>
      <td><span class="badge ${badgeClass}">${status.toUpperCase()}</span></td>
      <td class="actionCell">
        <div class="actionWrap" id="wrap-${d.id}">
          <button class="actionMain" onclick="toggleAction('${d.id}')">Aksi ▾</button>
          <div class="actionMenu" id="menu-${d.id}">
            <button onclick="editData('${d.id}')">✏️ Edit</button>
            <button class="delete ownerOnly" onclick="hapusData('${d.id}')">🗑 Hapus</button>
            <button class="bill" onclick="updateStatus('${d.id}','tagihan')">🧾 Masuk Tagihan</button>
            <button class="cash" onclick="updateStatus('${d.id}','tunai')">💵 Tunai</button>
            <button class="cash" onclick="updateStatus('${d.id}','dibayar')">✅ Dibayar</button>
            <button onclick="updateStatus('${d.id}','masuk')">📥 Masuk</button>
            <button style="color:#dc2626" class="ownerOnly" onclick="updateStatus('${d.id}','batal')">❌ Batal</button>
          </div>
        </div>
      </td>
    `;
    tbody.appendChild(tr);

    // MOBILE CARD
    const card=document.createElement('div');
    card.className='mobileSaleCard';
    card.innerHTML=`
      <div class="mobileSaleTop">
        <div><div class="mobileSaleName">${nama}</div><div class="mobileSalePhone">${d.noHp||''} • Teknisi: ${teknisi}</div><div style="font-size:11px;color:#64748b;margin-top:3px">${d.idTransaksi||d.id.slice(0,8)}</div></div>
        <span class="badge ${badgeClass}">${status.toUpperCase()}</span>
      </div>
      <div class="mobileSaleGrid">
        <div class="mobileSaleField"><span class="mobileSaleLabel">Produk</span><span class="mobileSaleValue">${produk}</span></div>
        <div class="mobileSaleField"><span class="mobileSaleLabel">Pendapatan</span><span class="mobileSaleValue">Rp ${jual.toLocaleString('id-ID')}</span></div>
        <div class="mobileSaleField"><span class="mobileSaleLabel">Laba</span><span class="mobileSaleValue" style="color:#15803d">Rp ${laba.toLocaleString('id-ID')}</span></div>
        <div class="mobileSaleField"><span class="mobileSaleLabel">Teknisi</span><span class="mobileSaleValue">${teknisi}</span></div>
      </div>
      <div style="margin-top:10px">
        <div class="actionWrap" style="width:100%" id="mwrap-${d.id}">
          <button class="actionMain" style="width:100%" onclick="toggleAction('m${d.id}')">Aksi ▾</button>
          <div class="actionMenu" id="menu-m${d.id}">
            <button onclick="editData('${d.id}')">✏️ Edit</button>
            <button class="delete" onclick="hapusData('${d.id}')">🗑 Hapus</button>
            <button onclick="updateStatus('${d.id}','tagihan')">🧾 Tagihan</button>
            <button onclick="updateStatus('${d.id}','tunai')">💵 Tunai</button>
            <button onclick="updateStatus('${d.id}','dibayar')">✅ Dibayar</button>
            <button onclick="updateStatus('${d.id}','masuk')">📥 Masuk</button>
            <button style="color:#dc2626" onclick="updateStatus('${d.id}','batal')">❌ Batal</button>
          </div>
        </div>
      </div>
    `;
    mobile.appendChild(card);
  });

  if(!isOwner) document.querySelectorAll('.ownerOnly').forEach(el=>el.style.display='none');
}

async function load(){
  const list=document.getElementById('list');
  try{
    const ownerIdToQuery=isOwner?currentUser.uid:ownerUid;
    let snap=await getDocs(query(collection(db,"servis"), where("ownerId","==", ownerIdToQuery)));
    if(snap.empty){
      let s2=await getDocs(query(collection(db,"servis"), where("ownerUid","==", ownerIdToQuery)));
      if(!s2.empty) snap=s2;
    }
    if(snap.empty){
      allRows=[];
      render();
      return;
    }
    allRows=snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }catch(e){
    document.getElementById('list').innerHTML=`<div style="background:#fff;padding:20px;border-radius:12px;color:#b91c1c">Error: ${e.message}</div>`;
  }
}
window.load=load;

window.toggleAction=(id)=>{
  const wrap=document.getElementById('wrap-'+id) || document.getElementById('mwrap-'+id);
  const menu=document.getElementById('menu-'+id);
  const isOpen=wrap.classList.contains('open');
  closeAll();
  if(!isOpen){
    wrap.classList.add('open');
    const rect=wrap.getBoundingClientRect();
    menu.style.left=(rect.left+window.scrollX- (menu.offsetWidth - rect.width))+'px';
    menu.style.top=(rect.bottom+window.scrollY+6)+'px';
    if(rect.bottom+menu.offsetHeight>window.innerHeight){
      menu.style.top=(rect.top+window.scrollY - menu.offsetHeight -6)+'px';
    }
  }
}
window.closeAll=()=>{
  document.querySelectorAll('.actionWrap.open').forEach(el=>el.classList.remove('open'));
}
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.actionWrap')){
    closeAll();
  }
});

window.updateStatus=async(id,status)=>{
  if(status==='batal' && !isOwner){ alert("Hanya owner bisa batal"); return; }
  try{
    await updateDoc(doc(db,"servis",id), {status:status, updatedAt:new Date().toISOString()});
    closeAll();
    await load();
  }catch(err){ alert(err.message); }
}
window.hapusData=async(id)=>{
  if(!isOwner){ alert("Hanya owner"); return; }
  if(!confirm("Hapus data ini?")) return;
  await deleteDoc(doc(db,"servis",id));
  closeAll();
  await load();
}
window.editData=(id)=>{
  const d=allRows.find(x=>x.id===id);
  if(!d) return;
  document.getElementById('editId').value=d.id;
  document.getElementById('editNama').value=getNama(d);
  document.getElementById('editTeknisi').value=getTeknisi(d);
  document.getElementById('editProduk').value=getProduk(d);
  document.getElementById('editJual').value=getJual(d);
  document.getElementById('editModal').classList.add('show');
}
window.closeEdit=()=>{ document.getElementById('editModal').classList.remove('show'); }

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter').addEventListener('change', render);
document.getElementById('editForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const id=document.getElementById('editId').value;
  try{
    await updateDoc(doc(db,"servis",id), {
      nama:document.getElementById('editNama').value,
      teknisi:document.getElementById('editTeknisi').value,
      produk:document.getElementById('editProduk').value,
      hargaJual:Number(document.getElementById('editJual').value||0),
      laba:Number(document.getElementById('editJual').value||0)-Number(document.getElementById('editBeli').value||0),
      updatedAt:new Date().toISOString()
    });
    closeEdit();
    await load();
  }catch(err){ alert(err.message); }
});

</script>
</head>
<body class="">
<header>
  <div class="headerBrand">
    <div class="headerLogo" style="background:#000;display:flex;align-items:center;justify-content:center;border:1px solid #ffffff20">
      <img src="logo.png" alt="logo" style="width:32px;height:32px;object-fit:contain;background:#000" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
      <div style="display:none;width:100%;height:100%;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff">F</div>
    </div>
    <div class="headerBrandText">
      <h1>limudahkan</h1>
      <div class="headerSub">Fixzy System - Data Asli</div>
    </div>
  </div>
  <div class="grow"></div>
  <button class="refresh" onclick="load()">🔄 Refresh</button>
  <button class="refresh" id="darkToggle" style="margin-left:6px">🌙</button>
  <div style="text-align:right;margin-left:10px;line-height:1.2" class="hidden md:block">

<script>
  const html=document.documentElement;
  const btn=document.getElementById('darkToggle');
  const saved=localStorage.getItem('fixzy-dark');
  if(saved==='1' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)){ html.classList.add('dark'); document.body.classList.add('dark'); btn.textContent='☀️'; }
  btn.addEventListener('click', ()=>{
    html.classList.toggle('dark');
    document.body.classList.toggle('dark');
    const isDark=html.classList.contains('dark');
    localStorage.setItem('fixzy-dark', isDark?'1':'0');
    btn.textContent=isDark?'☀️':'🌙';
  });
</script>
